<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruvan / deploys</title>
  <link rel="icon" id="favicon">
  <link rel="stylesheet" href="/common.css">
  <style>
    :root {
      --success: #16a34a;
      --success-soft: #dcfce7;
      --failure: #dc2626;
      --failure-soft: #fee2e2;
      --pending: #d97706;
      --pending-soft: #fef3c7;
      --median: #7c3aed;
      --grid: #e5e7eb;
      --muted: #6b7280;
      --fg: #111827;
      --bg: #ffffff;
      --card: #f9fafb;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      padding: 40px 24px 80px;
      max-width: 880px;
      margin: 0 auto;
      color: var(--fg);
    }
    body.dark {
      --success: #4ade80;
      --success-soft: #14532d;
      --failure: #f87171;
      --failure-soft: #7f1d1d;
      --pending: #fbbf24;
      --pending-soft: #78350f;
      --median: #a78bfa;
      --grid: #2a2a2a;
      --muted: #9ca3af;
      --fg: #f5f5f5;
      --bg: #111111;
      --card: #1a1a1a;
    }
    @media (prefers-color-scheme: dark) {
      body:not(.light) {
        --success: #4ade80;
        --success-soft: #14532d;
        --failure: #f87171;
        --failure-soft: #7f1d1d;
        --pending: #fbbf24;
        --pending-soft: #78350f;
        --median: #a78bfa;
        --grid: #2a2a2a;
        --muted: #9ca3af;
        --fg: #f5f5f5;
        --bg: #111111;
        --card: #1a1a1a;
      }
    }

    header {
      margin-bottom: 28px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }
    header a { color: inherit; text-decoration: none; }
    header a:hover { text-decoration: underline; }
    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    h1 .crumb { color: var(--muted); font-weight: 400; }
    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 28px;
    }
    .stat {
      background: var(--card);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .stat-value {
      font-size: 22px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }
    .stat.median .stat-value { color: var(--median); }
    .stat.success .stat-value { color: var(--success); }
    .stat.p90 .stat-value { color: var(--pending); }

    .chart-card {
      background: var(--card);
      border-radius: 12px;
      padding: 20px 20px 14px;
      margin-bottom: 32px;
    }
    .chart-card[hidden] { display: none; }
    .chart-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 14px;
      gap: 12px;
    }
    .chart-title {
      font-size: 15px;
      font-weight: 600;
    }
    .chart-meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      background: var(--success);
    }
    .legend-swatch.failure { background: var(--failure); }
    .legend-swatch.median {
      background: transparent;
      border-top: 2px dashed var(--median);
      border-radius: 0;
      height: 0;
      width: 14px;
    }
    .chart-svg {
      width: 100%;
      height: 220px;
      display: block;
      overflow: visible;
    }
    .chart-svg .bar { cursor: pointer; transition: opacity 0.15s; }
    .chart-svg .bar:hover { opacity: 0.7; }
    .chart-svg .grid-line { stroke: var(--grid); stroke-width: 1; }
    .chart-svg .axis-label { fill: var(--muted); font-size: 10px; }
    .chart-svg .median-line {
      stroke: var(--median);
      stroke-width: 1.5;
      stroke-dasharray: 5 4;
      fill: none;
    }
    .chart-svg .median-label {
      fill: var(--median);
      font-size: 11px;
      font-weight: 600;
    }
    .chart-axis-x {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      margin-top: 6px;
    }

    .log {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .day-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 6px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--grid);
    }
    .day-date {
      font-size: 13px;
      font-weight: 600;
      color: var(--fg);
    }
    .day-count {
      color: var(--muted);
      font-size: 12px;
    }
    .deploys {
      display: flex;
      flex-direction: column;
    }
    .deploy {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      column-gap: 12px;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid var(--grid);
    }
    .deploy:last-child { border-bottom: none; }
    .deploy .time {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .deploy a {
      color: var(--fg);
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }
    .deploy a:hover { text-decoration: underline; }
    .deploy .duration {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--success-soft);
      color: var(--success);
      font-weight: 600;
    }
    .deploy.failure .duration {
      background: var(--failure-soft);
      color: var(--failure);
    }
    .deploy.in_progress .duration,
    .deploy.cancelled .duration {
      background: var(--pending-soft);
      color: var(--pending);
    }
    .deploy .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .deploy .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      flex-shrink: 0;
    }
    .deploy.failure .dot { background: var(--failure); }
    .deploy.in_progress .dot { background: var(--pending); }
    .deploy.cancelled .dot { background: var(--muted); }

    #status {
      color: var(--muted);
      padding: 16px 0;
      font-size: 13px;
    }
    #gh-auth {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
      color: var(--muted);
      transition: color 0.15s;
    }
    #gh-auth:hover { color: var(--fg); }
    #gh-auth.authed { color: var(--success); }
    #gh-auth svg { width: 100%; height: 100%; display: block; fill: currentColor; }

    @media (max-width: 640px) {
      body { padding: 24px 16px 60px; }
      h1 { font-size: 22px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .stat-value { font-size: 18px; }
      .chart-svg { height: 180px; }
      .deploy { grid-template-columns: 52px 1fr auto; }
    }
  </style>
  <script src="/common.js"></script>
</head>
<body>
  <header>
    <div>
      <h1><a href="/">Ruvan</a> <span class="crumb">/ deploys</span></h1>
      <p class="subtitle" id="range">GitHub Actions deploy durations</p>
    </div>
    <button id="gh-auth" type="button" aria-label="Log in with GitHub" title="Log in with GitHub">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
    </button>
  </header>

  <section class="stats" id="stats" hidden>
    <div class="stat">
      <span class="stat-label">runs</span>
      <span class="stat-value" id="stat-count">—</span>
    </div>
    <div class="stat median">
      <span class="stat-label">median</span>
      <span class="stat-value" id="stat-median">—</span>
    </div>
    <div class="stat p90">
      <span class="stat-label">p90</span>
      <span class="stat-value" id="stat-p90">—</span>
    </div>
    <div class="stat success">
      <span class="stat-label">success</span>
      <span class="stat-value" id="stat-success">—</span>
    </div>
  </section>

  <section class="chart-card" id="chart-wrap" hidden>
    <div class="chart-head">
      <span class="chart-title">Deploy duration</span>
      <span class="chart-meta">
        <span class="legend-item"><span class="legend-swatch"></span>success</span>
        <span class="legend-item"><span class="legend-swatch failure"></span>failure</span>
        <span class="legend-item"><span class="legend-swatch median"></span>median</span>
      </span>
    </div>
    <svg class="chart-svg" id="chart" preserveAspectRatio="none"></svg>
    <div class="chart-axis-x">
      <span id="chart-start"></span>
      <span id="chart-end"></span>
    </div>
  </section>

  <div class="log" id="log"></div>
  <p id="status">loading…</p>
  <div id="sentinel"></div>

  <script>
    (function() {
      const path = 'M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z';
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><style>path{fill:#7c3aed}</style><path fill-rule="evenodd" d="' + path + '"/></svg>';
      Common.setFaviconHref('data:image/svg+xml,' + encodeURIComponent(svg));
    })();

    Common.initDarkMode();
    Common.initSitemapShortcut();

    const REPO = 'rjayasin/rjayasin.github.io';
    const TOKEN_KEY = 'gh_token';
    const PER_PAGE = 50;
    const MAX_PAGES = 10;
    const SVG_NS = 'http://www.w3.org/2000/svg';

    const log = document.getElementById('log');
    const status = document.getElementById('status');
    const range = document.getElementById('range');
    const sentinel = document.getElementById('sentinel');
    const authBtn = document.getElementById('gh-auth');
    const statsEl = document.getElementById('stats');
    const statCount = document.getElementById('stat-count');
    const statMedian = document.getElementById('stat-median');
    const statP90 = document.getElementById('stat-p90');
    const statSuccess = document.getElementById('stat-success');
    const chartWrap = document.getElementById('chart-wrap');
    const chart = document.getElementById('chart');
    const chartStart = document.getElementById('chart-start');
    const chartEnd = document.getElementById('chart-end');

    function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }

    function refreshAuthBtn() {
      if (getToken()) {
        authBtn.classList.add('authed');
        authBtn.title = 'Logged in to GitHub (click to log out)';
      } else {
        authBtn.classList.remove('authed');
        authBtn.title = 'Log in with GitHub for higher rate limits';
      }
    }

    authBtn.addEventListener('click', () => {
      if (getToken()) {
        if (confirm('Log out of GitHub?')) {
          localStorage.removeItem(TOKEN_KEY);
          location.reload();
        }
        return;
      }
      const msg =
        'Paste a GitHub personal access token for higher rate limits.\n\n' +
        'Create one at https://github.com/settings/tokens\n' +
        '  • Classic token: scope "public_repo" is enough\n' +
        '  • Fine-grained: read access to "Actions" + "Metadata"\n\n' +
        'The token is stored only in this browser (localStorage).';
      const token = prompt(msg, '');
      if (token && token.trim()) {
        localStorage.setItem(TOKEN_KEY, token.trim());
        location.reload();
      }
    });

    refreshAuthBtn();

    const CURRENT_YEAR = new Date().getFullYear();

    function fmtDay(iso) {
      const d = new Date(iso);
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const yyyy = d.getFullYear();
      return yyyy === CURRENT_YEAR ? `${mm}-${dd}` : `${yyyy}-${mm}-${dd}`;
    }

    function fmtDayLong(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function fmtTime(iso) {
      const d = new Date(iso);
      let h = d.getHours();
      const ampm = h >= 12 ? 'pm' : 'am';
      h = h % 12 || 12;
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${h}:${min}${ampm}`;
    }

    function fmtDuration(sec) {
      if (sec == null || !isFinite(sec) || sec < 0) return '—';
      if (sec < 60) return `${sec.toFixed(0)}s`;
      const m = Math.floor(sec / 60);
      const s = Math.round(sec - m * 60);
      return s === 0 ? `${m}m` : `${m}m${String(s).padStart(2, '0')}s`;
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function percentile(sorted, p) {
      if (!sorted.length) return null;
      const idx = Math.min(sorted.length - 1, Math.floor(p * (sorted.length - 1)));
      return sorted[idx];
    }

    function median(sorted) {
      if (!sorted.length) return null;
      const m = Math.floor(sorted.length / 2);
      return sorted.length % 2 ? sorted[m] : (sorted[m - 1] + sorted[m]) / 2;
    }

    let nextPage = 1;
    let loading = false;
    let exhausted = false;
    const allDeploys = [];
    const seen = new Set();

    async function fetchRuns(page) {
      const headers = { Accept: 'application/vnd.github+json' };
      const token = getToken();
      if (token) headers.Authorization = `Bearer ${token}`;
      const url =
        `https://api.github.com/repos/${REPO}/actions/runs` +
        `?per_page=${PER_PAGE}&page=${page}`;
      const r = await fetch(url, { headers });
      if (r.status === 401) {
        localStorage.removeItem(TOKEN_KEY);
        refreshAuthBtn();
        throw new Error('GitHub token rejected; logged out');
      }
      if (!r.ok) throw new Error(`GitHub API ${r.status}`);
      return r.json();
    }

    function isDeployRun(run) {
      const name = (run.name || '').toLowerCase();
      const wname = (run.workflow_name || '').toLowerCase();
      return name.includes('pages') || wname.includes('pages') || run.event === 'dynamic';
    }

    function runDurationSec(run) {
      const start = run.run_started_at || run.created_at;
      const end = run.updated_at;
      if (!start || !end) return null;
      const ms = new Date(end).getTime() - new Date(start).getTime();
      if (!isFinite(ms) || ms < 0) return null;
      return ms / 1000;
    }

    function shortSha(sha) {
      return (sha || '').slice(0, 7);
    }

    function statusClass(d) {
      const c = (d.conclusion || d.status || '').toLowerCase();
      if (c === 'success') return 'success';
      if (c === 'failure' || c === 'timed_out' || c === 'startup_failure') return 'failure';
      if (c === 'cancelled') return 'cancelled';
      return 'in_progress';
    }

    function renderLog() {
      log.innerHTML = '';
      let currentDay = null;
      let dayEl = null;
      let deploysEl = null;
      let dayCount = 0;
      let dayCountEl = null;

      for (const d of allDeploys) {
        const day = new Date(d.start).toDateString();
        if (currentDay !== day) {
          if (dayCountEl) dayCountEl.textContent = `${dayCount} deploy${dayCount === 1 ? '' : 's'}`;
          currentDay = day;
          dayCount = 0;
          dayEl = document.createElement('div');
          dayEl.className = 'day';
          dayEl.innerHTML = `
            <div class="day-header">
              <span class="day-date">${fmtDayLong(d.start)}</span>
              <span class="day-count"></span>
            </div>
            <div class="deploys"></div>`;
          log.appendChild(dayEl);
          dayCountEl = dayEl.querySelector('.day-count');
          deploysEl = dayEl.querySelector('.deploys');
        }
        dayCount++;

        const cls = statusClass(d);
        const row = document.createElement('div');
        row.className = `deploy ${cls}`;
        row.innerHTML = `
          <span class="time">${fmtTime(d.start)}</span>
          <a href="${d.url}" target="_blank" rel="noopener" title="${escHtml(d.title)}" class="badge">
            <span class="dot"></span><span>${escHtml(d.label)}</span>
          </a>
          <span class="duration">${fmtDuration(d.durationSec)}</span>`;
        deploysEl.appendChild(row);
      }
      if (dayCountEl) dayCountEl.textContent = `${dayCount} deploy${dayCount === 1 ? '' : 's'}`;
    }

    function renderStats() {
      if (!allDeploys.length) return;
      statsEl.hidden = false;
      const durations = allDeploys
        .map(d => d.durationSec)
        .filter(s => s != null && s >= 0)
        .sort((a, b) => a - b);
      const successes = allDeploys.filter(d => d.conclusion === 'success').length;
      statCount.textContent = String(allDeploys.length);
      statMedian.textContent = fmtDuration(median(durations));
      statP90.textContent = fmtDuration(percentile(durations, 0.9));
      const pct = allDeploys.length ? Math.round(100 * successes / allDeploys.length) : 0;
      statSuccess.textContent = `${pct}%`;
    }

    function renderChart() {
      if (!allDeploys.length) return;
      chartWrap.hidden = false;

      // oldest → newest
      const ordered = [...allDeploys].reverse();
      const durations = ordered.map(d => d.durationSec || 0);
      const max = Math.max(1, ...durations);

      const sorted = durations.slice().filter(s => s > 0).sort((a, b) => a - b);
      const med = median(sorted) || 0;

      const W = 1000;
      const H = 220;
      const PAD_L = 36;
      const PAD_R = 12;
      const PAD_T = 14;
      const PAD_B = 8;
      const innerW = W - PAD_L - PAD_R;
      const innerH = H - PAD_T - PAD_B;

      chart.setAttribute('viewBox', `0 0 ${W} ${H}`);
      while (chart.firstChild) chart.removeChild(chart.firstChild);

      // Y-axis grid lines at 0/25/50/75/100% of max.
      const ticks = 4;
      for (let i = 0; i <= ticks; i++) {
        const t = i / ticks;
        const y = PAD_T + innerH * (1 - t);
        const line = document.createElementNS(SVG_NS, 'line');
        line.setAttribute('class', 'grid-line');
        line.setAttribute('x1', PAD_L);
        line.setAttribute('x2', W - PAD_R);
        line.setAttribute('y1', y);
        line.setAttribute('y2', y);
        chart.appendChild(line);

        const label = document.createElementNS(SVG_NS, 'text');
        label.setAttribute('class', 'axis-label');
        label.setAttribute('x', PAD_L - 6);
        label.setAttribute('y', y + 3);
        label.setAttribute('text-anchor', 'end');
        label.textContent = fmtDuration(max * t);
        chart.appendChild(label);
      }

      // Bars.
      const n = ordered.length;
      const gap = n > 60 ? 1 : 2;
      const barW = Math.max(2, (innerW - gap * (n - 1)) / n);
      ordered.forEach((d, i) => {
        const sec = d.durationSec || 0;
        const h = Math.max(1.5, (sec / max) * innerH);
        const x = PAD_L + i * (barW + gap);
        const y = PAD_T + innerH - h;
        const rect = document.createElementNS(SVG_NS, 'rect');
        rect.setAttribute('class', 'bar');
        rect.setAttribute('x', x);
        rect.setAttribute('y', y);
        rect.setAttribute('width', barW);
        rect.setAttribute('height', h);
        rect.setAttribute('rx', Math.min(1.5, barW / 3));
        const cls = statusClass(d);
        const color = cls === 'success'
          ? 'var(--success)'
          : cls === 'failure'
            ? 'var(--failure)'
            : 'var(--pending)';
        rect.setAttribute('fill', color);
        const title = document.createElementNS(SVG_NS, 'title');
        title.textContent = `${fmtDay(d.start)} ${fmtTime(d.start)} · ${fmtDuration(sec)} · ${d.conclusion || d.status}`;
        rect.appendChild(title);
        rect.addEventListener('click', () => window.open(d.url, '_blank', 'noopener'));
        chart.appendChild(rect);
      });

      // Median line.
      if (med > 0) {
        const medY = PAD_T + innerH * (1 - med / max);
        const line = document.createElementNS(SVG_NS, 'line');
        line.setAttribute('class', 'median-line');
        line.setAttribute('x1', PAD_L);
        line.setAttribute('x2', W - PAD_R);
        line.setAttribute('y1', medY);
        line.setAttribute('y2', medY);
        chart.appendChild(line);

        const label = document.createElementNS(SVG_NS, 'text');
        label.setAttribute('class', 'median-label');
        label.setAttribute('x', W - PAD_R - 4);
        const above = medY > PAD_T + 14;
        label.setAttribute('y', above ? medY - 4 : medY + 12);
        label.setAttribute('text-anchor', 'end');
        label.textContent = `median ${fmtDuration(med)}`;
        chart.appendChild(label);
      }

      chartStart.textContent = fmtDay(ordered[0].start);
      chartEnd.textContent = fmtDay(ordered[ordered.length - 1].start);
    }

    function ingest(runs) {
      let added = 0;
      for (const run of runs) {
        if (!isDeployRun(run)) continue;
        if (seen.has(run.id)) continue;
        seen.add(run.id);
        const start = run.run_started_at || run.created_at;
        const sha = run.head_sha;
        const msg = (run.head_commit && run.head_commit.message ? run.head_commit.message : '').split('\n')[0];
        allDeploys.push({
          id: run.id,
          start,
          end: run.updated_at,
          durationSec: runDurationSec(run),
          conclusion: run.conclusion,
          status: run.status,
          url: run.html_url,
          label: msg ? `${shortSha(sha)} ${msg}` : `${shortSha(sha)} · ${run.workflow_name || run.name || 'deploy'}`,
          title: `run #${run.run_number} · ${run.workflow_name || run.name}`,
        });
        added++;
      }
      allDeploys.sort((a, b) => new Date(b.start) - new Date(a.start));
      return added;
    }

    async function loadMore() {
      if (loading || exhausted) return;
      loading = true;
      status.textContent = 'loading…';

      let data;
      try {
        data = await fetchRuns(nextPage);
      } catch (e) {
        status.textContent = e.message;
        loading = false;
        exhausted = true;
        return;
      }

      const runs = data.workflow_runs || [];
      if (!runs.length && !allDeploys.length) {
        status.textContent = 'no deployments';
        exhausted = true;
        loading = false;
        return;
      }

      ingest(runs);
      renderStats();
      renderChart();
      renderLog();

      range.textContent = `${allDeploys.length} deploy${allDeploys.length === 1 ? '' : 's'} · GitHub Actions`;
      nextPage++;
      if (runs.length < PER_PAGE || nextPage > MAX_PAGES) {
        exhausted = true;
        status.textContent = '';
      } else {
        status.textContent = '';
      }
      loading = false;
    }

    const io = new IntersectionObserver(entries => {
      if (entries.some(e => e.isIntersecting)) loadMore();
    }, { rootMargin: '400px' });
    io.observe(sentinel);
  </script>
</body>
</html>
