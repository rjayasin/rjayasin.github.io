<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruvan / border</title>
    <link rel="icon" id="favicon" />
    <link rel="stylesheet" href="/common.css" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        cursor: pointer;
        user-select: none;
        position: relative;
      }
      #border-svg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: block;
      }
      #border-svg text {
        fill: currentColor;
        dominant-baseline: alphabetic;
        /* Firefox snaps textPath glyphs to the pixel grid by default, which
         turns the smooth sub-pixel startOffset updates into visible jitter.
         geometricPrecision keeps glyph positions on the float values we set. */
        text-rendering: geometricPrecision;
      }
      #hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 12px;
        text-align: center;
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 12px;
        color: #888;
        opacity: 1;
        transition: opacity 0.4s ease;
        user-select: none;
        z-index: 3;
      }
      #hint-inner {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 6px;
        background: #ffffff;
      }
      body.dark #hint-inner {
        background: #111111;
      }
      #hint.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #hint .hint-btn {
        cursor: pointer;
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 2px;
      }
      #hint .hint-btn:hover {
        color: #333;
      }
      body.dark #hint .hint-btn:hover {
        color: #ccc;
      }
      #hint-zone {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 60px;
        z-index: 2;
      }
      #hb-text-label {
        display: inline-block;
        max-width: 220px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        vertical-align: bottom;
      }
      #hb-text .hint-input {
        max-width: 50vw;
      }
    </style>
    <script src="/common.js"></script>
  </head>
  <body>
    <svg id="border-svg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <path id="border-path" fill="none"></path>
      </defs>
      <text>
        <textPath id="border-text" href="#border-path" startOffset="0"></textPath>
      </text>
    </svg>
    <div id="hint">
      <span id="hint-inner"
        ><span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-fi">+</span>/<span class="hint-btn" id="hb-fd">−</span>
          font size</span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-font">click font</span></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-goog">g google fonts</span></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-dark"
            >1 <span class="hb-dark-label">dark</span></span
          ></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-sitemap">s sitemap</span></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-text"><span id="hb-text-label"></span></span> text</span
        ></span
      >
    </div>
    <div id="hint-zone"></div>
    <script>
      Common.paintFaviconR();
      Common.initDarkMode();
      Common.initCursorHide();

      const FALLBACK =
        "Curious cats chase shimmering shadows past silent rooftops while drowsy moths drift toward the lantern, dreaming of yesterday's almanac and tomorrow's tide; somewhere a clock forgets the hour, the wind learns a new vowel, and the river writes its memoirs in the margins of moss.";
      const SEP = ' ';
      const SPEED = 60;

      let fontSize = window.innerWidth < 640 ? 18 : 28;
      let currentFont = null;
      let fallbackItems = [FALLBACK];

      const pathEl = document.getElementById('border-path');
      const textEl = document.querySelector('#border-svg text');
      const textPathEl = document.getElementById('border-text');

      let pathLen = 0;
      let unitLen = 0;
      let offset = 0;

      function unitText() {
        const items = Common.parseQueryItems().length ? Common.parseQueryItems() : fallbackItems;
        if (!items.length) return '';
        return items.join('/') + SEP;
      }

      function applyFont() {
        textEl.style.fontSize = fontSize + 'px';
        textEl.style.fontFamily = currentFont ? `'${currentFont}', serif` : '';
      }

      function rebuild() {
        const text = unitText();
        const W = window.innerWidth;
        const H = window.innerHeight;

        applyFont();

        const probe = document.createElement('span');
        probe.style.cssText =
          'position:absolute;visibility:hidden;white-space:nowrap;line-height:1;';
        probe.style.fontSize = fontSize + 'px';
        probe.style.fontFamily = currentFont ? `'${currentFont}', serif` : '';
        probe.textContent = 'Mqgy';
        document.body.appendChild(probe);
        const textHeight = probe.offsetHeight;
        document.body.removeChild(probe);

        // Inset the path so the text (which sits on the outer side of a CW path,
        // with ascenders pointing outward) fits between the path and the edge.
        const inset = Math.ceil(textHeight * 0.95);

        // CW rectangle whose start/end seam sits at the MIDDLE of the bottom
        // edge rather than on a corner. A textPath does not wrap around: glyphs
        // before offset 0 or past pathLen are clipped, so the start point is
        // always a seam where the text can't continue across. Keeping that seam
        // mid-edge (not on a corner) lets the text round all four corners
        // smoothly; making the perimeter an exact whole number of text copies
        // (below) then closes the loop onto itself so the seam vanishes too.
        //
        // Winding stays clockwise so the text keeps sitting on the outer side:
        // bottom-middle -> bottom-left -> top-left -> top-right -> bottom-right
        // -> (close) back to bottom-middle. `scale` resizes the rectangle about
        // its centre so the perimeter can be fine-tuned by a sub-pixel amount.
        const buildPath = (scale) => {
          const rw = (W - 2 * inset) * scale;
          const rh = (H - 2 * inset) * scale;
          const x0 = (W - rw) / 2;
          const x1 = (W + rw) / 2;
          const y0 = (H - rh) / 2;
          const y1 = (H + rh) / 2;
          const d = `M ${W / 2} ${y1} L ${x0} ${y1} L ${x0} ${y0} L ${x1} ${y0} L ${x1} ${y1} Z`;
          pathEl.setAttribute('d', d);
          return pathEl.getTotalLength();
        };

        const basePerimeter = buildPath(1);
        pathLen = basePerimeter;

        if (!text) {
          textPathEl.textContent = '';
          unitLen = 0;
          return;
        }

        // The text is `unitText()`: the items followed by a single trailing
        // space, so one copy joined to the next reads as a continuous string
        // with a single space as the only gap. The plan: figure out how many
        // whole copies wrap around the perimeter, size them so that exact
        // number spans the perimeter precisely, then scroll that one fixed loop
        // around the four edges. With the loop's length an exact divisor of the
        // perimeter there is no seam — it is one continuous, repeating string of
        // characters circling the screen.

        // Helper: marginal width one extra copy adds (the true repeat period,
        // including the kerning where one copy meets the next). Measured from
        // short strings that comfortably fit the path, so nothing is clipped.
        const measurePeriod = () => {
          textPathEl.textContent = text;
          const one = textPathEl.getComputedTextLength();
          textPathEl.textContent = text + text;
          const two = textPathEl.getComputedTextLength();
          return two - one;
        };

        textEl.style.letterSpacing = '0px';
        const natPeriod = measurePeriod();
        if (natPeriod <= 0) return;

        // How many whole copies wrap most snugly around the whole perimeter.
        const copies = Math.max(1, Math.round(pathLen / natPeriod));

        // We need the rendered period to equal perimeter / copies *exactly*, so
        // that `copies` whole copies span the perimeter and the loop closes onto
        // itself with no seam. letter-spacing adds a fixed amount per character,
        // making the period very nearly linear in the spacing — but glyph
        // rounding leaves a small residual, so refine with a few Newton steps
        // (slope taken from the zero-spacing point) until the period lands on
        // target to well under a pixel. A sub-pixel period error would otherwise
        // show up as a hairline gap or overlap where the loop meets itself.
        const targetPeriod = pathLen / copies;
        const charCount = text.length;
        let spacing = 0;
        if (charCount > 0) {
          spacing = (targetPeriod - natPeriod) / charCount; // first guess
          for (let i = 0; i < 6; i++) {
            textEl.style.letterSpacing = spacing + 'px';
            const period = measurePeriod();
            const err = period - targetPeriod;
            if (Math.abs(err) < 0.01) break;
            const slope = spacing !== 0 ? (period - natPeriod) / spacing : charCount;
            if (!isFinite(slope) || slope === 0) break;
            spacing -= err / slope;
          }
        }
        textEl.style.letterSpacing = spacing + 'px';
        const period = measurePeriod();

        // letter-spacing got the period within a fraction of a pixel of
        // perimeter/copies; close that last gap from the geometry side by
        // nudging the rectangle so the perimeter is EXACTLY `copies` periods.
        // The rescale is sub-pixel and invisible, but it guarantees the loop
        // closes onto itself with no residual gap or overlap at the seam,
        // independent of any glyph-rounding the font happens to do.
        pathLen = buildPath((copies * period) / basePerimeter);

        // Scroll the loop by exactly one period; since the period now divides
        // the perimeter exactly, every scroll position keeps the loop seamless.
        unitLen = period;

        // Render enough whole copies that the visible window (length pathLen) is
        // always covered as the loop scrolls by up to one period.
        const repeats = copies + 2;
        textPathEl.textContent = text.repeat(repeats);
      }

      let lastT = performance.now();
      function tick(now) {
        const dt = Math.min(0.1, (now - lastT) / 1000);
        lastT = now;
        if (unitLen > 0) {
          offset += SPEED * dt;
          const startOff = -(((offset % unitLen) + unitLen) % unitLen);
          textPathEl.setAttribute('startOffset', startOff);
        }
        requestAnimationFrame(tick);
      }

      rebuild();
      requestAnimationFrame(tick);
      window.addEventListener('resize', rebuild);

      const fontCycle = Common.initFontCycle({
        onChange: (font) => {
          currentFont = font;
          rebuild();
        },
      });

      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.key === '+' || e.key === '=' || e.key === '-' || e.key === '_') {
          e.preventDefault();
          const delta = e.key === '+' || e.key === '=' ? 4 : -4;
          fontSize = Math.max(8, Math.min(256, fontSize + delta));
          rebuild();
          showHint();
          return;
        }
      });

      const { show: showHint, setLocked: setHintLocked } = Common.initHintBar({
        hintEl: document.getElementById('hint'),
        hintZoneEl: document.getElementById('hint-zone'),
      });

      document.getElementById('hb-fi').addEventListener('click', () => {
        fontSize = Math.max(8, Math.min(256, fontSize + 4));
        rebuild();
        showHint();
      });
      document.getElementById('hb-fd').addEventListener('click', () => {
        fontSize = Math.max(8, Math.min(256, fontSize - 4));
        rebuild();
        showHint();
      });
      document.getElementById('hb-font').addEventListener('click', fontCycle.cycle);
      document.getElementById('hb-goog').addEventListener('click', () => {
        if (currentFont) Common.openFontSpecimen(currentFont);
      });
      document.getElementById('hb-dark').addEventListener('click', () => {
        Common.toggleDark();
        showHint();
      });
      document.getElementById('hb-sitemap').addEventListener('click', Common.openSitemap);
      Common.initSitemapShortcut();

      const textEditor = Common.initTextEditor({
        buttonEl: document.getElementById('hb-text'),
        labelEl: document.getElementById('hb-text-label'),
        getItems: () =>
          Common.parseQueryItems().length ? Common.parseQueryItems() : fallbackItems,
        onCommit: rebuild,
        onEditStart: () => setHintLocked(true),
        onEditEnd: () => setHintLocked(false),
      });
    </script>
  </body>
</html>
