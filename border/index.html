<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruvan / border</title>
  <link rel="icon" id="favicon">
  <link rel="stylesheet" href="/common.css">
  <style>
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      cursor: pointer;
      user-select: none;
      position: relative;
    }
    #border-frame {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    .marquee {
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
      transform-origin: 0 0;
    }
    .track {
      position: absolute;
      top: 0;
      left: 0;
      white-space: nowrap;
      line-height: 1;
      /* GPU-composite each track so per-frame transforms don't trigger
         text re-layout. SVG textPath couldn't do this — Firefox re-laid
         out every glyph on every startOffset update, which was fine at
         small sizes but stuttered at fullscreen where the perimeter
         held hundreds more glyphs per frame. */
      will-change: transform;
    }
    #hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 12px;
      text-align: center;
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
      font-size: 12px;
      color: #888;
      opacity: 1;
      transition: opacity 0.4s ease;
      user-select: none;
      z-index: 3;
    }
    #hint-inner {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 6px;
      background: #ffffff;
    }
    body.dark #hint-inner { background: #111111; }
    #hint.hidden { opacity: 0; pointer-events: none; }
    #hint .hint-btn {
      cursor: pointer;
      text-decoration: underline;
      text-decoration-style: dotted;
      text-underline-offset: 2px;
    }
    #hint .hint-btn:hover { color: #333; }
    body.dark #hint .hint-btn:hover { color: #ccc; }
    #hint-zone {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 60px;
      z-index: 2;
    }
    #hb-text-label {
      display: inline-block;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: bottom;
    }
    #hb-text .hint-input { max-width: 50vw; }
  </style>
  <script src="/common.js"></script>
</head>
<body>
  <div id="border-frame">
    <div class="marquee" data-side="top"><div class="track"></div></div>
    <div class="marquee" data-side="right"><div class="track"></div></div>
    <div class="marquee" data-side="bottom"><div class="track"></div></div>
    <div class="marquee" data-side="left"><div class="track"></div></div>
  </div>
  <div id="hint"><span id="hint-inner"><span style="white-space:nowrap"><span class="hint-btn" id="hb-fi">+</span>/<span class="hint-btn" id="hb-fd">−</span> font size</span> &nbsp;·&nbsp; <span style="white-space:nowrap"><span class="hint-btn" id="hb-font">click font</span></span> &nbsp;·&nbsp; <span style="white-space:nowrap"><span class="hint-btn" id="hb-goog">g google fonts</span></span> &nbsp;·&nbsp; <span style="white-space:nowrap"><span class="hint-btn" id="hb-dark">1 <span class="hb-dark-label">dark</span></span></span> &nbsp;·&nbsp; <span style="white-space:nowrap"><span class="hint-btn" id="hb-sitemap">s sitemap</span></span> &nbsp;·&nbsp; <span style="white-space:nowrap"><span class="hint-btn" id="hb-text"><span id="hb-text-label"></span></span> text</span></span></div>
  <div id="hint-zone"></div>
  <script>
    Common.paintFaviconR();
    Common.initDarkMode();
    Common.initCursorHide();

    const FALLBACK = "Curious cats chase shimmering shadows past silent rooftops while drowsy moths drift toward the lantern, dreaming of yesterday's almanac and tomorrow's tide; somewhere a clock forgets the hour, the wind learns a new vowel, and the river writes its memoirs in the margins of moss.";
    const SEP = ' ';
    const SPEED = 60;
    const SIDES = ['top', 'right', 'bottom', 'left'];

    let fontSize = window.innerWidth < 640 ? 18 : 28;
    let currentFont = null;
    let fallbackItems = [FALLBACK];

    const marquees = {};
    const tracks = {};
    for (const s of SIDES) {
      marquees[s] = document.querySelector(`.marquee[data-side="${s}"]`);
      tracks[s] = marquees[s].querySelector('.track');
    }

    // sideStarts give each side's offset along the CW perimeter so the
    // text stream stays continuous across corners: the glyph leaving the
    // top-right corner is the same one entering the right side.
    let unitLen = 0;
    let offset = 0;
    let sideStarts = { top: 0, right: 0, bottom: 0, left: 0 };

    function unitText() {
      const items = Common.parseQueryItems().length ? Common.parseQueryItems() : fallbackItems;
      if (!items.length) return '';
      return items.join('/') + SEP;
    }

    function applyFont() {
      for (const s of SIDES) {
        tracks[s].style.fontSize = fontSize + 'px';
        tracks[s].style.fontFamily = currentFont ? `'${currentFont}', serif` : '';
      }
    }

    function measure(text) {
      const probe = document.createElement('span');
      probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;line-height:1;left:-99999px;top:0;';
      probe.style.fontSize = fontSize + 'px';
      probe.style.fontFamily = currentFont ? `'${currentFont}', serif` : '';
      probe.textContent = text;
      document.body.appendChild(probe);
      const rect = probe.getBoundingClientRect();
      document.body.removeChild(probe);
      return { width: rect.width, height: rect.height };
    }

    function rebuild() {
      const text = unitText();
      const W = window.innerWidth;
      const H = window.innerHeight;

      applyFont();

      const m = measure('Mqgy');
      const textHeight = Math.ceil(m.height);

      // Position each marquee at its edge in screen space. The marquee's
      // local +x axis runs in the CW path direction along that side; +y
      // runs inward from the screen edge. Each side has length sideLen[s]
      // and depth textHeight. Transforms place the local origin at the
      // appropriate corner.
      const sideLen = { top: W, right: H, bottom: W, left: H };
      const transforms = {
        top:    `translate(0px, 0px)`,
        right:  `translate(${W}px, 0px) rotate(90deg)`,
        bottom: `translate(${W}px, ${H}px) rotate(180deg)`,
        left:   `translate(0px, ${H}px) rotate(-90deg)`,
      };
      for (const s of SIDES) {
        marquees[s].style.width = sideLen[s] + 'px';
        marquees[s].style.height = textHeight + 'px';
        marquees[s].style.transform = transforms[s];
      }

      sideStarts = {
        top: 0,
        right: W,
        bottom: W + H,
        left: 2 * W + H,
      };

      if (!text) {
        for (const s of SIDES) tracks[s].textContent = '';
        unitLen = 0;
        return;
      }

      // Measure marginal length of one extra repeat so the period
      // accounts for kerning at the seam — same trick as the SVG
      // version. Without it the wrap-around jumps every cycle.
      const single = measure(text).width;
      const double = measure(text.repeat(2)).width;
      unitLen = double - single;
      if (unitLen <= 0) unitLen = single;
      if (unitLen <= 0) return;

      const longest = Math.max(W, H);
      const repeats = Math.max(2, Math.ceil((longest + 2 * unitLen) / unitLen));
      const content = text.repeat(repeats);
      for (const s of SIDES) tracks[s].textContent = content;
    }

    let lastT = performance.now();
    function tick(now) {
      const dt = Math.min(0.1, (now - lastT) / 1000);
      lastT = now;
      if (unitLen > 0) {
        offset += SPEED * dt;
        for (const s of SIDES) {
          const raw = (offset + sideStarts[s]) % unitLen;
          const x = -((raw + unitLen) % unitLen);
          // translate3d keeps the track on its own compositor layer so
          // updates are pure paint-free transforms.
          tracks[s].style.transform = `translate3d(${x}px, 0, 0)`;
        }
      }
      requestAnimationFrame(tick);
    }

    rebuild();
    requestAnimationFrame(tick);
    window.addEventListener('resize', rebuild);

    const cooldown = Common.makeCooldown(500);
    async function pickFont() {
      if (!window.googleFonts) return;
      cooldown(async () => {
        const font = Common.pickRandomGoogleFont();
        await Common.loadGoogleFont(font);
        currentFont = font;
        rebuild();
      });
    }

    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      if ((e.key === 'g' || e.key === 'G') && !e.repeat && currentFont) {
        Common.openFontSpecimen(currentFont);
        return;
      }
      if (e.key === '+' || e.key === '=' || e.key === '-' || e.key === '_') {
        e.preventDefault();
        const delta = (e.key === '+' || e.key === '=') ? 4 : -4;
        fontSize = Math.max(8, Math.min(256, fontSize + delta));
        rebuild();
        showHint();
        return;
      }
    });

    const hintEl = document.getElementById('hint');
    const hintZone = document.getElementById('hint-zone');
    let hintTimer = null;
    let hintLocked = false;
    function showHint() {
      hintEl.classList.remove('hidden');
      clearTimeout(hintTimer);
      if (hintLocked) return;
      hintTimer = setTimeout(() => hintEl.classList.add('hidden'), 2500);
    }
    showHint();
    hintZone.addEventListener('mouseenter', showHint);
    hintZone.addEventListener('mousemove', showHint);
    hintZone.addEventListener('touchstart', showHint, { passive: true });
    hintZone.addEventListener('touchend', e => e.stopPropagation());
    hintEl.addEventListener('click', e => e.stopPropagation());
    hintEl.addEventListener('touchstart', () => clearTimeout(hintTimer), { passive: true });
    hintEl.addEventListener('touchend', e => { e.stopPropagation(); showHint(); });
    hintEl.addEventListener('mouseenter', () => { clearTimeout(hintTimer); hintEl.classList.remove('hidden'); });
    hintEl.addEventListener('mouseleave', showHint);

    document.getElementById('hb-fi').addEventListener('click', () => { fontSize = Math.max(8, Math.min(256, fontSize + 4)); rebuild(); showHint(); });
    document.getElementById('hb-fd').addEventListener('click', () => { fontSize = Math.max(8, Math.min(256, fontSize - 4)); rebuild(); showHint(); });
    document.getElementById('hb-font').addEventListener('click', pickFont);
    document.getElementById('hb-goog').addEventListener('click', () => { if (currentFont) Common.openFontSpecimen(currentFont); });
    document.getElementById('hb-dark').addEventListener('click', () => { Common.toggleDark(); showHint(); });
    document.getElementById('hb-sitemap').addEventListener('click', Common.openSitemap);
    Common.initSitemapShortcut();

    const textEditor = Common.initTextEditor({
      buttonEl: document.getElementById('hb-text'),
      labelEl: document.getElementById('hb-text-label'),
      getItems: () => Common.parseQueryItems().length ? Common.parseQueryItems() : fallbackItems,
      onCommit: rebuild,
      onEditStart: () => { hintLocked = true; clearTimeout(hintTimer); hintEl.classList.remove('hidden'); },
      onEditEnd: () => { hintLocked = false; showHint(); },
    });

    Common.onTap(pickFont);

    Common.loadScript('/fonts.js').then(pickFont);
  </script>
</body>
</html>
