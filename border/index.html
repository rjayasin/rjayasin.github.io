<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruvan / border</title>
    <link rel="icon" id="favicon" />
    <link rel="stylesheet" href="/common.css" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        cursor: pointer;
        user-select: none;
        position: relative;
      }
      #border-svg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: block;
      }
      #border-svg text {
        fill: currentColor;
        dominant-baseline: alphabetic;
        /* Firefox snaps textPath glyphs to the pixel grid by default, which
         turns the smooth sub-pixel startOffset updates into visible jitter.
         geometricPrecision keeps glyph positions on the float values we set. */
        text-rendering: geometricPrecision;
      }
      #hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 12px;
        text-align: center;
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 12px;
        color: #888;
        opacity: 1;
        transition: opacity 0.4s ease;
        user-select: none;
        z-index: 3;
      }
      #hint-inner {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 6px;
        background: #ffffff;
      }
      body.dark #hint-inner {
        background: #111111;
      }
      #hint.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #hint .hint-btn {
        cursor: pointer;
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 2px;
      }
      #hint .hint-btn:hover {
        color: #333;
      }
      body.dark #hint .hint-btn:hover {
        color: #ccc;
      }
      #hint-zone {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 60px;
        z-index: 2;
      }
      #hb-text-label {
        display: inline-block;
        max-width: 220px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        vertical-align: bottom;
      }
      #hb-text .hint-input {
        max-width: 50vw;
      }
    </style>
    <script src="/common.js"></script>
  </head>
  <body>
    <svg id="border-svg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <path id="border-path" fill="none"></path>
      </defs>
      <text>
        <textPath id="border-text" href="#border-path" startOffset="0"></textPath>
      </text>
    </svg>
    <div id="hint">
      <span id="hint-inner"
        ><span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-fi">+</span>/<span class="hint-btn" id="hb-fd">−</span>
          font size</span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-font">click font</span></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-goog">g google fonts</span></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-dark"
            >1 <span class="hb-dark-label">dark</span></span
          ></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-sitemap">s sitemap</span></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-text"><span id="hb-text-label"></span></span> text</span
        ></span
      >
    </div>
    <div id="hint-zone"></div>
    <script>
      Common.paintFaviconR();
      Common.initDarkMode();
      Common.initCursorHide();

      const FALLBACK =
        "Curious cats chase shimmering shadows past silent rooftops while drowsy moths drift toward the lantern, dreaming of yesterday's almanac and tomorrow's tide; somewhere a clock forgets the hour, the wind learns a new vowel, and the river writes its memoirs in the margins of moss.";
      const SEP = ' ';
      const SPEED = 60;

      let fontSize = window.innerWidth < 640 ? 18 : 28;
      let currentFont = null;
      let fallbackItems = [FALLBACK];

      const pathEl = document.getElementById('border-path');
      const textEl = document.querySelector('#border-svg text');
      const textPathEl = document.getElementById('border-text');

      let pathLen = 0;
      let unitLen = 0;
      let offset = 0;

      function unitText() {
        const items = Common.parseQueryItems().length ? Common.parseQueryItems() : fallbackItems;
        if (!items.length) return '';
        return items.join('/') + SEP;
      }

      // `renderSize` is the font size we actually paint at: the user's chosen
      // size is a target, but we nudge it so a whole number of text copies wraps
      // the border exactly (see rebuild). No letter-spacing is ever applied.
      let renderSize = fontSize;
      function applyFont(size) {
        textEl.style.letterSpacing = '0px';
        textEl.style.fontSize = size + 'px';
        textEl.style.fontFamily = currentFont ? `'${currentFont}', serif` : '';
      }

      // Height of 'Mqgy' (ascenders + descenders) at a given size, used to inset
      // the path so the glyphs sit between the path and the screen edge.
      function textHeightAt(size) {
        const probe = document.createElement('span');
        probe.style.cssText =
          'position:absolute;visibility:hidden;white-space:nowrap;line-height:1;';
        probe.style.fontSize = size + 'px';
        probe.style.fontFamily = currentFont ? `'${currentFont}', serif` : '';
        probe.textContent = 'Mqgy';
        document.body.appendChild(probe);
        const h = probe.offsetHeight;
        document.body.removeChild(probe);
        return h;
      }

      function rebuild() {
        const text = unitText();
        const W = window.innerWidth;
        const H = window.innerHeight;

        if (!text) {
          applyFont(fontSize);
          pathEl.removeAttribute('d');
          textPathEl.textContent = '';
          unitLen = 0;
          return;
        }

        // CW rectangle whose start/end seam sits at the MIDDLE of the bottom
        // edge rather than on a corner. A textPath does not wrap around: glyphs
        // before offset 0 or past pathLen are clipped, so the start point is
        // always a seam where the text can't continue across. Keeping that seam
        // mid-edge (not on a corner) lets the text round all four corners
        // smoothly; making the perimeter an exact whole number of text copies
        // (below) then closes the loop onto itself so the seam vanishes too.
        //
        // Winding stays clockwise so the text keeps sitting on the outer side:
        // bottom-middle -> bottom-left -> top-left -> top-right -> bottom-right
        // -> (close) back to bottom-middle. `inset` and `scale` are read fresh on
        // each call; `scale` resizes the rectangle about its centre so the
        // perimeter can be fine-tuned by a sub-pixel amount.
        let inset = 0;
        const buildPath = (scale) => {
          const rw = (W - 2 * inset) * scale;
          const rh = (H - 2 * inset) * scale;
          const x0 = (W - rw) / 2;
          const x1 = (W + rw) / 2;
          const y0 = (H - rh) / 2;
          const y1 = (H + rh) / 2;
          const d = `M ${W / 2} ${y1} L ${x0} ${y1} L ${x0} ${y0} L ${x1} ${y0} L ${x1} ${y1} Z`;
          pathEl.setAttribute('d', d);
          return pathEl.getTotalLength();
        };

        // Marginal width one extra copy adds at the current font: the true
        // repeat period, including the kerning where one copy meets the next.
        const measurePeriod = () => {
          textPathEl.textContent = text;
          const one = textPathEl.getComputedTextLength();
          textPathEl.textContent = text + text;
          const two = textPathEl.getComputedTextLength();
          return two - one;
        };

        // Fit the text by FONT SIZE, not by letter-spacing. A whole number of
        // copies must span the perimeter for the loop to close with no seam at
        // the bottom-centre. letter-spacing on a path is honoured inconsistently
        // across engines — iOS Safari, for instance, ignores it — so stretching
        // that way leaves the loop open there. Scaling the font changes the
        // glyphs themselves, which every engine measures and paints identically,
        // so what we compute is exactly what gets drawn, on every browser.
        //
        // The period grows ~linearly with size, so solve for the size whose
        // `copies` periods fill the perimeter, re-measuring a few times because
        // the inset (hence the perimeter) shifts slightly as the size changes.
        let size = fontSize;
        let copies = 1;
        let period = 0;
        for (let i = 0; i < 6; i++) {
          applyFont(size);
          inset = Math.ceil(textHeightAt(size) * 0.95);
          const perimeter = buildPath(1);
          period = measurePeriod();
          if (period <= 0) return;
          copies = Math.max(1, Math.round(perimeter / period));
          const next = size * (perimeter / copies / period);
          const settled = Math.abs(next - size) < 0.02;
          size = Math.max(4, next);
          if (settled) break;
        }
        renderSize = size;

        // Settle at the solved size and read the final geometry.
        applyFont(renderSize);
        inset = Math.ceil(textHeightAt(renderSize) * 0.95);
        const basePerimeter = buildPath(1);
        period = measurePeriod();
        if (period <= 0) return;
        copies = Math.max(1, Math.round(basePerimeter / period));

        // Close the last sub-pixel gap (font sizes are quantised) from the
        // geometry side: nudge the rectangle so the perimeter is EXACTLY
        // `copies` periods. This rescale is far below a pixel and invisible, and
        // it relies only on geometry and plain-text metrics — no path-specific
        // text features — so the loop closes identically on every engine.
        pathLen = buildPath((copies * period) / basePerimeter);

        // Scroll the loop by exactly one period; the perimeter is now an exact
        // whole number of copies, so every scroll position keeps it seamless.
        unitLen = period;

        // Render enough whole copies that the visible window is always covered
        // as the loop scrolls by up to one period.
        textPathEl.textContent = text.repeat(copies + 2);
      }

      let lastT = performance.now();
      function tick(now) {
        const dt = Math.min(0.1, (now - lastT) / 1000);
        lastT = now;
        if (unitLen > 0) {
          offset += SPEED * dt;
          const startOff = -(((offset % unitLen) + unitLen) % unitLen);
          textPathEl.setAttribute('startOffset', startOff);
        }
        requestAnimationFrame(tick);
      }

      rebuild();
      requestAnimationFrame(tick);
      window.addEventListener('resize', rebuild);
      // Re-measure once web fonts have settled: if a font swaps in after the
      // first layout, its metrics differ and the loop would no longer close.
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(rebuild);
      }

      const fontCycle = Common.initFontCycle({
        onChange: (font) => {
          currentFont = font;
          rebuild();
        },
      });

      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.key === '+' || e.key === '=' || e.key === '-' || e.key === '_') {
          e.preventDefault();
          const delta = e.key === '+' || e.key === '=' ? 4 : -4;
          fontSize = Math.max(8, Math.min(256, fontSize + delta));
          rebuild();
          showHint();
          return;
        }
      });

      const { show: showHint, setLocked: setHintLocked } = Common.initHintBar({
        hintEl: document.getElementById('hint'),
        hintZoneEl: document.getElementById('hint-zone'),
      });

      document.getElementById('hb-fi').addEventListener('click', () => {
        fontSize = Math.max(8, Math.min(256, fontSize + 4));
        rebuild();
        showHint();
      });
      document.getElementById('hb-fd').addEventListener('click', () => {
        fontSize = Math.max(8, Math.min(256, fontSize - 4));
        rebuild();
        showHint();
      });
      document.getElementById('hb-font').addEventListener('click', fontCycle.cycle);
      document.getElementById('hb-goog').addEventListener('click', () => {
        if (currentFont) Common.openFontSpecimen(currentFont);
      });
      document.getElementById('hb-dark').addEventListener('click', () => {
        Common.toggleDark();
        showHint();
      });
      document.getElementById('hb-sitemap').addEventListener('click', Common.openSitemap);
      Common.initSitemapShortcut();

      const textEditor = Common.initTextEditor({
        buttonEl: document.getElementById('hb-text'),
        labelEl: document.getElementById('hb-text-label'),
        getItems: () =>
          Common.parseQueryItems().length ? Common.parseQueryItems() : fallbackItems,
        onCommit: rebuild,
        onEditStart: () => setHintLocked(true),
        onEditEnd: () => setHintLocked(false),
      });
    </script>
  </body>
</html>
