<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruvan / border</title>
    <link rel="icon" id="favicon" />
    <link rel="stylesheet" href="/common.css" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        cursor: pointer;
        user-select: none;
        position: relative;
      }
      #border-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: block;
      }
      #hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 12px;
        text-align: center;
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 12px;
        color: #888;
        opacity: 1;
        transition: opacity 0.4s ease;
        user-select: none;
        z-index: 3;
      }
      #hint-inner {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 6px;
        background: #ffffff;
      }
      body.dark #hint-inner {
        background: #111111;
      }
      #hint.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #hint .hint-btn {
        cursor: pointer;
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 2px;
      }
      #hint .hint-btn:hover {
        color: #333;
      }
      body.dark #hint .hint-btn:hover {
        color: #ccc;
      }
      #hint-zone {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 60px;
        z-index: 2;
      }
      #hb-text-label {
        display: inline-block;
        max-width: 220px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        vertical-align: bottom;
      }
      #hb-text .hint-input {
        max-width: 50vw;
      }
    </style>
    <script src="/common.js"></script>
  </head>
  <body>
    <canvas id="border-canvas"></canvas>
    <div id="hint">
      <span id="hint-inner"
        ><span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-fi">+</span>/<span class="hint-btn" id="hb-fd">−</span>
          font size</span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-font">click font</span></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-goog">g google fonts</span></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-dark"
            >1 <span class="hb-dark-label">dark</span></span
          ></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-sitemap">s sitemap</span></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-text"><span id="hb-text-label"></span></span> text</span
        ></span
      >
    </div>
    <div id="hint-zone"></div>
    <script>
      Common.paintFaviconR();
      Common.initDarkMode();
      Common.initCursorHide();

      // Filler texts shown when no custom text is set in the query string.
      // Clicking to cycle the font also steps to the next one of these; the
      // first entry is always what a fresh page load shows.
      const FALLBACKS = [
        "Curious cats chase shimmering shadows past silent rooftops while drowsy moths drift toward the lantern, dreaming of yesterday's almanac and tomorrow's tide; somewhere a clock forgets the hour, the wind learns a new vowel, and the river writes its memoirs in the margins of moss.",
        'Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.',
        'Sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium, totam rem aperiam, eaque ipsa quae ab illo inventore veritatis et quasi architecto beatae vitae dicta sunt explicabo. Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit.',
        'But I must explain to you how all this mistaken idea of denouncing pleasure and praising pain was born, and I will give you a complete account of the system, and expound the actual teachings of the great explorer of the truth, the master-builder of human happiness.',
        'The ocean rehearses its oldest argument against the patient shore, salting every syllable; gulls annotate the wind, a lighthouse blinks its slow punctuation, and somewhere below the surface a whale hums the first draft of a lullaby no map has learned to spell.',
        'Beyond the last streetlight the galaxy unrolls its inventory of small fires; a comet signs its name in a long cold flourish, satellites gossip in binary, and the moon, patient bookkeeper of tides, files another quiet night under miscellaneous silver.',
        'Steam curls from the third cup of the morning while the bakery window fogs with cinnamon arithmetic; the kettle recites its one hot vowel, croissants practice their folded geometry, and the barista draws a fern in foam that lasts exactly one perfect minute.',
        "Under the fern's green patience the forest files its slow paperwork of leaves; a woodpecker audits the oldest oak, mushrooms convene their small umbrella parliament, and the creek, fluent in gravel, translates the mountain's silence one smooth stone at a time.",
        'The mountain keeps its appointments with weather and cancels them with fog; goats footnote the cliffs, a hawk proofreads the valley from a thermal margin, and snow arrives every winter to whiten the same sentence the glacier began ten thousand years ago.',
        'In the library after closing, the dictionaries argue quietly about the past tense of light; dust drifts like unhurried punctuation, a forgotten bookmark dreams of its abandoned chapter, and the card catalogue remembers every hand that ever asked it a question.',
        'Rain interviews the tin roof all night and prints no retractions; umbrellas bloom in doorways like sudden black tulips, gutters memorize the alphabet of dripping, and by morning the puddles publish upside-down editions of the entire sky.',
        "The night train stitches one sleeping town to the next with a long silver thread; timetables dream in departures, a conductor pockets the moon like a watch, and every window carries a passenger's reflection farther than the passenger ever meant to go.",
        'In the tea garden the kettle practices its patient scales; jasmine unfolds its slow telegram, porcelain cups hold their small warm lakes, and the afternoon steeps until even the shadows taste faintly of honey and unhurried conversation.',
        'Late in the basement club the saxophone bends a note until it apologizes; the double bass walks home the long way, brushes whisper rumors across the snare, and the singer holds one blue syllable so long the streetlights outside agree to flicker in time.',
        'The desert keeps a minimalist diary: one saguaro, two lizards, an abbreviated noon; dunes revise themselves whenever the wind edits, a tortoise carries its patient architecture toward no deadline, and at dusk the whole horizon signs off in apricot ink.',
        "North of every compass the ice writes its white memoranda; auroras rummage through the sky's green wardrobe, a fox in winter costume erases its own footnotes, and the long night stacks its silences neatly, like clean plates in a frozen cupboard.",
        'The night market strings its bulbs like commas between bargains; dumplings steam their round rumors, a radio two stalls down remembers a summer no one else attended, and lanterns dab the wet street with small warm errata of orange.',
        "Inside the clockmaker's window a hundred pendulums disagree politely about now; escapements gossip in ticks, a brass bird waits all week for its one cuckoo sentence, and time, flattered by so much attention, slows down just enough to be admired.",
        'The harbor sorts its boats by the colors of their patience; ropes rehearse their knots, fish scales confetti the dock at dawn, and the lighthouse keeper writes one bright sentence every few seconds, addressed to whom it may concern at sea.',
        'In the meadow the bees run their honey errands with bureaucratic joy; clover files a motion for more afternoon, a scarecrow practices nonchalance, and the grasshoppers publish their dry green telegraphs from the tall grass until the dew calls recess.',
        'October signs the maples in triplicate — amber, ember, umber; sweaters return from their cedar sabbaticals, chimneys clear their throats after a summer of silence, and every sidewalk becomes a crackling bibliography of leaves.',
        'The typewriter remembers every letter it ever struck and regrets only the apostrophes; ribbons dream in carbon, the margin bell rings for no one, and a half-finished sentence waits in the platen like a train paused between two stations of thought.',
        "At dawn the city yawns in delivery trucks and half-lit bakeries; pigeons convene their gray committees, a street sweeper conducts the gutters' quiet overture, and the first bus carries a cargo of unfinished dreams toward their day jobs.",
        'The orchard alphabetizes autumn one apple at a time; ladders lean their patient hypotenuses against the light, wasps audit the windfalls, and the cider press translates a whole summer of rain into something you can hold in a cup.',
        'Snow negotiates with the streetlamp and settles for amber; the last bus exhales at the corner, mittens hold hands inside their pockets, and the whole neighborhood is rewritten overnight in a soft font nobody can read without smiling.',
      ];
      const SEP = ' ';
      const SPEED = 60;

      let fontSize = window.innerWidth < 640 ? 18 : 28;
      let currentFont = null;
      let fallbackIndex = 0;
      let fallbackItems = [FALLBACKS[fallbackIndex]];

      const canvas = document.getElementById('border-canvas');
      const ctx = canvas.getContext('2d');

      // One closed loop around the viewport, drawn glyph by glyph. SVG textPath
      // can't wrap around a closed path — its start point is a hard seam whose
      // clipping behaviour differs between engines — so instead we compute each
      // character's position along the loop ourselves, modulo the perimeter.
      // Wrap-around is then just arithmetic: no seam can exist anywhere, in any
      // browser. The corners are quarter-circle arcs rather than sharp 90°
      // turns, so a glyph crossing a corner rotates gradually through it
      // instead of snapping from one edge's orientation to the other's.
      let segments = []; // ordered loop pieces, each with start/len/at(t)
      let perimeter = 0;
      let glyphs = []; // one copy of the text: { ch, mid } midpoints along the loop
      let period = 0; // loop-length of one copy; copies * period === perimeter
      let copies = 1;
      let offset = 0;

      function unitText() {
        const items = Common.parseQueryItems().length ? Common.parseQueryItems() : fallbackItems;
        if (!items.length) return '';
        return items.join('/') + SEP;
      }

      // `renderSize` is the font size we actually paint at: the user's chosen
      // size is a target, but we nudge it so a whole number of text copies wraps
      // the border exactly (see rebuild).
      let renderSize = fontSize;
      function fontString(size) {
        const family = currentFont
          ? `'${currentFont}', serif`
          : getComputedStyle(document.body).fontFamily;
        return `${size}px ${family}`;
      }

      // Per-character advances at a given size. Characters are painted one at a
      // time, so per-character measurement is exactly what gets drawn.
      function measureAdvances(chars, size) {
        ctx.font = fontString(size);
        const adv = [];
        let total = 0;
        for (const ch of chars) {
          const w = ctx.measureText(ch).width;
          adv.push(w);
          total += w;
        }
        return { adv, total };
      }

      // Height of ascenders + descenders at a given size, used to inset the
      // loop so the glyphs sit between the baseline and the screen edge.
      function textHeightAt(size) {
        ctx.font = fontString(size);
        const m = ctx.measureText('Mqgy');
        const asc = m.fontBoundingBoxAscent ?? m.actualBoundingBoxAscent ?? size * 0.8;
        const desc = m.fontBoundingBoxDescent ?? m.actualBoundingBoxDescent ?? size * 0.25;
        return asc + desc;
      }

      // Rounded rectangle, traversed from the middle of the bottom edge going
      // left, then up the left side, right across the top, and down the right
      // side — so glyphs sit upright on the top edge and their ascenders always
      // point at the nearest screen edge. Corner radius scales with the font so
      // a few characters span each arc.
      function buildLoop(W, H, inset, size) {
        const x0 = inset;
        const y0 = inset;
        const x1 = W - inset;
        const y1 = H - inset;
        const r = Math.max(0, Math.min(2.5 * size, (x1 - x0) / 2 - 1, (y1 - y0) / 2 - 1));
        const cx = W / 2;
        const HPI = Math.PI / 2;
        segments = [];
        const straight = (px, py, dx, dy, len) => {
          if (len <= 0) return;
          const a = Math.atan2(dy, dx);
          segments.push({ len, at: (t) => ({ x: px + dx * t, y: py + dy * t, a }) });
        };
        // Quarter arc from angle a0, always sweeping +90° (our traversal turns
        // the same way at every corner). Tangent leads the radius by 90°.
        const corner = (ax, ay, a0) => {
          if (r <= 0) return;
          segments.push({
            len: r * HPI,
            at: (t) => {
              const ang = a0 + t / r;
              return { x: ax + r * Math.cos(ang), y: ay + r * Math.sin(ang), a: ang + HPI };
            },
          });
        };
        straight(cx, y1, -1, 0, cx - (x0 + r)); // bottom: centre -> bottom-left
        corner(x0 + r, y1 - r, HPI); // bottom-left
        straight(x0, y1 - r, 0, -1, y1 - y0 - 2 * r); // left side, upward
        corner(x0 + r, y0 + r, Math.PI); // top-left
        straight(x0 + r, y0, 1, 0, x1 - x0 - 2 * r); // top, rightward
        corner(x1 - r, y0 + r, -HPI); // top-right
        straight(x1, y0 + r, 0, 1, y1 - y0 - 2 * r); // right side, downward
        corner(x1 - r, y1 - r, 0); // bottom-right
        straight(x1 - r, y1, -1, 0, x1 - r - cx); // bottom: bottom-right -> centre
        let acc = 0;
        for (const s of segments) {
          s.start = acc;
          acc += s.len;
        }
        perimeter = acc;
      }

      function pointAt(d) {
        let t = d % perimeter;
        if (t < 0) t += perimeter;
        let seg = segments[segments.length - 1];
        for (const s of segments) {
          if (t < s.start + s.len) {
            seg = s;
            break;
          }
        }
        return seg.at(Math.min(t - seg.start, seg.len));
      }

      function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(window.innerWidth * dpr);
        canvas.height = Math.round(window.innerHeight * dpr);
      }

      function rebuild() {
        const W = window.innerWidth;
        const H = window.innerHeight;
        resizeCanvas();
        const text = unitText();
        if (!text) {
          glyphs = [];
          period = 0;
          return;
        }
        const chars = [...text];

        // Fit the text by font size: solve for the size at which a whole number
        // of copies spans the perimeter. The total width grows ~linearly with
        // size, so a few iterations converge; re-measure each time because the
        // inset (hence the perimeter) shifts slightly as the size changes.
        let size = fontSize;
        let total = 0;
        for (let i = 0; i < 6; i++) {
          total = measureAdvances(chars, size).total;
          if (total <= 0) return;
          buildLoop(W, H, Math.ceil(textHeightAt(size) * 0.95), size);
          copies = Math.max(1, Math.round(perimeter / total));
          const next = size * (perimeter / copies / total);
          const settled = Math.abs(next - size) < 0.02;
          size = Math.max(4, next);
          if (settled) break;
        }
        renderSize = size;

        // Settle at the solved size, then absorb the last sub-pixel residue by
        // scaling every advance so `copies` copies tile the perimeter EXACTLY.
        // The stretch is a fraction of a percent — invisible — and it makes the
        // wrap-around join between the last copy and the first identical to
        // every other copy-to-copy join.
        const m = measureAdvances(chars, renderSize);
        if (m.total <= 0) return;
        buildLoop(W, H, Math.ceil(textHeightAt(renderSize) * 0.95), renderSize);
        copies = Math.max(1, Math.round(perimeter / m.total));
        const k = perimeter / (copies * m.total);
        glyphs = [];
        let cum = 0;
        for (let i = 0; i < chars.length; i++) {
          const w = m.adv[i] * k;
          glyphs.push({ ch: chars[i], mid: cum + w / 2 });
          cum += w;
        }
        period = cum;
      }

      function draw() {
        const dpr = window.devicePixelRatio || 1;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!glyphs.length || perimeter <= 0) return;
        ctx.font = fontString(renderSize);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = getComputedStyle(document.body).color;
        for (let c = 0; c < copies; c++) {
          const base = c * period - offset;
          for (const g of glyphs) {
            if (g.ch === ' ') continue;
            const p = pointAt(base + g.mid);
            const cos = Math.cos(p.a);
            const sin = Math.sin(p.a);
            ctx.setTransform(dpr * cos, dpr * sin, -dpr * sin, dpr * cos, dpr * p.x, dpr * p.y);
            ctx.fillText(g.ch, 0, 0);
          }
        }
      }

      let lastT = performance.now();
      function tick(now) {
        const dt = Math.min(0.1, (now - lastT) / 1000);
        lastT = now;
        if (perimeter > 0) offset = (offset + SPEED * dt) % perimeter;
        draw();
        requestAnimationFrame(tick);
      }

      rebuild();
      requestAnimationFrame(tick);
      window.addEventListener('resize', rebuild);
      // Re-measure once web fonts have settled: if a font swaps in after the
      // first layout, its metrics differ and the loop would no longer close.
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(rebuild);
      }

      // Assigned once the text editor exists (it's initialised further down,
      // after the hint bar); font changes land well after that, but the first
      // automatic one races page setup, so start with a no-op.
      let refreshTextLabel = () => {};

      let fontChanges = 0;
      const fontCycle = Common.initFontCycle({
        onChange: (font) => {
          currentFont = font;
          // Each font cycle also steps to the next filler text. The first
          // change is the automatic pick during page load — keep the default
          // text for it so a fresh load always opens with the same words.
          // Custom text in the query string always wins over the filler.
          if (fontChanges++ > 0) {
            fallbackIndex = (fallbackIndex + 1) % FALLBACKS.length;
            fallbackItems = [FALLBACKS[fallbackIndex]];
            refreshTextLabel();
          }
          rebuild();
        },
      });

      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.key === '+' || e.key === '=' || e.key === '-' || e.key === '_') {
          e.preventDefault();
          const delta = e.key === '+' || e.key === '=' ? 4 : -4;
          fontSize = Math.max(8, Math.min(256, fontSize + delta));
          rebuild();
          showHint();
          return;
        }
      });

      const { show: showHint, setLocked: setHintLocked } = Common.initHintBar({
        hintEl: document.getElementById('hint'),
        hintZoneEl: document.getElementById('hint-zone'),
      });

      document.getElementById('hb-fi').addEventListener('click', () => {
        fontSize = Math.max(8, Math.min(256, fontSize + 4));
        rebuild();
        showHint();
      });
      document.getElementById('hb-fd').addEventListener('click', () => {
        fontSize = Math.max(8, Math.min(256, fontSize - 4));
        rebuild();
        showHint();
      });
      document.getElementById('hb-font').addEventListener('click', fontCycle.cycle);
      document.getElementById('hb-goog').addEventListener('click', () => {
        if (currentFont) Common.openFontSpecimen(currentFont);
      });
      document.getElementById('hb-dark').addEventListener('click', () => {
        Common.toggleDark();
        showHint();
      });
      document.getElementById('hb-sitemap').addEventListener('click', Common.openSitemap);
      Common.initSitemapShortcut();

      const textEditor = Common.initTextEditor({
        buttonEl: document.getElementById('hb-text'),
        labelEl: document.getElementById('hb-text-label'),
        getItems: () =>
          Common.parseQueryItems().length ? Common.parseQueryItems() : fallbackItems,
        onCommit: rebuild,
        onEditStart: () => setHintLocked(true),
        onEditEnd: () => setHintLocked(false),
      });
      refreshTextLabel = textEditor.refresh;
    </script>
  </body>
</html>
