<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruvan / border</title>
  <link rel="icon" id="favicon">
  <link rel="stylesheet" href="/common.css">
  <style>
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      cursor: pointer;
      user-select: none;
      position: relative;
    }
    .strip {
      position: fixed;
      overflow: hidden;
      line-height: 1;
    }
    .strip .track {
      display: inline-block;
      white-space: nowrap;
      line-height: 1;
      will-change: transform;
    }
    .strip.horiz { left: 0; right: 0; }
    .strip.horiz.top { top: 0; }
    .strip.horiz.bot { bottom: 0; }
    .strip.vert { width: auto; }
    .strip.vert .track { writing-mode: vertical-rl; }
    #s-lft { left: 0; }
    #s-rgt { right: 0; }
    #hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 12px;
      text-align: center;
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
      font-size: 12px;
      color: #888;
      opacity: 1;
      transition: opacity 0.4s ease;
      user-select: none;
      z-index: 3;
    }
    #hint-inner {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 6px;
      background: #ffffff;
    }
    body.dark #hint-inner { background: #111111; }
    #hint.hidden { opacity: 0; pointer-events: none; }
    #hint .hint-btn {
      cursor: pointer;
      text-decoration: underline;
      text-decoration-style: dotted;
      text-underline-offset: 2px;
    }
    #hint .hint-btn:hover { color: #333; }
    body.dark #hint .hint-btn:hover { color: #ccc; }
    #hint-zone {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 60px;
      z-index: 2;
    }
    #hb-text-label {
      display: inline-block;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: bottom;
    }
    #hb-text .hint-input { max-width: 50vw; }
  </style>
  <script src="/common.js"></script>
</head>
<body>
  <div class="strip horiz top" id="s-top"><div class="track"></div></div>
  <div class="strip horiz bot" id="s-bot"><div class="track"></div></div>
  <div class="strip vert" id="s-lft"><div class="track"></div></div>
  <div class="strip vert" id="s-rgt"><div class="track"></div></div>
  <div id="hint"><span id="hint-inner"><span style="white-space:nowrap"><span class="hint-btn" id="hb-fi">+</span>/<span class="hint-btn" id="hb-fd">−</span> font size</span> &nbsp;·&nbsp; <span style="white-space:nowrap"><span class="hint-btn" id="hb-font">click font</span></span> &nbsp;·&nbsp; <span style="white-space:nowrap"><span class="hint-btn" id="hb-goog">g google fonts</span></span> &nbsp;·&nbsp; <span style="white-space:nowrap"><span class="hint-btn" id="hb-dark">1 dark</span></span> &nbsp;·&nbsp; <span style="white-space:nowrap"><span class="hint-btn" id="hb-sitemap">s sitemap</span></span> &nbsp;·&nbsp; <span style="white-space:nowrap"><span class="hint-btn" id="hb-text"><span id="hb-text-label"></span></span> text</span></span></div>
  <div id="hint-zone"></div>
  <script>
    Common.paintFaviconR();
    Common.initDarkMode();
    Common.initCursorHide();

    const FALLBACK = "Curious cats chase shimmering shadows past silent rooftops while drowsy moths drift toward the lantern, dreaming of yesterday's almanac and tomorrow's tide; somewhere a clock forgets the hour, the wind learns a new vowel, and the river writes its memoirs in the margins of moss.";
    const SEP = '   •   ';
    const SPEED = 60;

    let fontSize = window.innerWidth < 640 ? 18 : 28;
    let currentFont = null;
    let fallbackItems = [FALLBACK];

    const strips = [
      { side: 'top', el: document.getElementById('s-top'), horiz: true,  dir: -1, offset: 0, unit: 0 },
      { side: 'rgt', el: document.getElementById('s-rgt'), horiz: false, dir: -1, offset: 0, unit: 0 },
      { side: 'bot', el: document.getElementById('s-bot'), horiz: true,  dir: +1, offset: 0, unit: 0 },
      { side: 'lft', el: document.getElementById('s-lft'), horiz: false, dir: +1, offset: 0, unit: 0 },
    ];

    function unitText() {
      const items = Common.parseQueryItems().length ? Common.parseQueryItems() : fallbackItems;
      if (!items.length) return '';
      return items.join('/') + SEP;
    }

    function applyFontTo(el) {
      el.style.fontSize = fontSize + 'px';
      el.style.fontFamily = currentFont ? `'${currentFont}', serif` : '';
    }

    function rebuild() {
      const text = unitText();

      const probe = document.createElement('span');
      probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;line-height:1;';
      applyFontTo(probe);
      probe.textContent = 'Mqgy';
      document.body.appendChild(probe);
      const thickness = Math.ceil(probe.offsetHeight + fontSize * 0.6);
      document.body.removeChild(probe);

      for (const s of strips) {
        if (s.horiz) {
          s.el.style.height = thickness + 'px';
          s.el.style.width = '';
        } else {
          s.el.style.width = thickness + 'px';
          s.el.style.top = thickness + 'px';
          s.el.style.bottom = thickness + 'px';
        }
        const track = s.el.querySelector('.track');
        applyFontTo(track);
        track.textContent = text || '';
        if (!text) { s.unit = 0; track.style.transform = ''; continue; }
        const unit = s.horiz ? track.offsetWidth : track.offsetHeight;
        s.unit = unit;
        if (unit === 0) continue;
        const viewport = s.horiz ? window.innerWidth : window.innerHeight;
        const repeats = Math.ceil((viewport + unit) / unit) + 1;
        track.textContent = text.repeat(repeats);
      }
    }

    let lastT = performance.now();
    function tick(now) {
      const dt = Math.min(0.1, (now - lastT) / 1000);
      lastT = now;
      for (const s of strips) {
        if (!s.unit) continue;
        s.offset += SPEED * dt;
        const mod = ((s.offset % s.unit) + s.unit) % s.unit;
        const translate = s.dir === 1 ? mod - s.unit : -mod;
        const track = s.el.querySelector('.track');
        track.style.transform = s.horiz ? `translateX(${translate}px)` : `translateY(${translate}px)`;
      }
      requestAnimationFrame(tick);
    }

    rebuild();
    requestAnimationFrame(tick);
    window.addEventListener('resize', rebuild);

    const cooldown = Common.makeCooldown(500);
    async function pickFont() {
      if (!window.googleFonts) return;
      cooldown(async () => {
        const font = Common.pickRandomGoogleFont();
        await Common.loadGoogleFont(font);
        currentFont = font;
        rebuild();
      });
    }

    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      if ((e.key === 'g' || e.key === 'G') && !e.repeat && currentFont) {
        Common.openFontSpecimen(currentFont);
        return;
      }
      if (e.key === '+' || e.key === '=' || e.key === '-' || e.key === '_') {
        e.preventDefault();
        const delta = (e.key === '+' || e.key === '=') ? 4 : -4;
        fontSize = Math.max(8, Math.min(256, fontSize + delta));
        rebuild();
        showHint();
        return;
      }
    });

    const hintEl = document.getElementById('hint');
    const hintZone = document.getElementById('hint-zone');
    let hintTimer = null;
    let hintLocked = false;
    function showHint() {
      hintEl.classList.remove('hidden');
      clearTimeout(hintTimer);
      if (hintLocked) return;
      hintTimer = setTimeout(() => hintEl.classList.add('hidden'), 2500);
    }
    showHint();
    hintZone.addEventListener('mouseenter', showHint);
    hintZone.addEventListener('mousemove', showHint);
    hintZone.addEventListener('touchstart', showHint, { passive: true });
    hintZone.addEventListener('touchend', e => e.stopPropagation());
    hintEl.addEventListener('click', e => e.stopPropagation());
    hintEl.addEventListener('touchstart', () => clearTimeout(hintTimer), { passive: true });
    hintEl.addEventListener('touchend', e => { e.stopPropagation(); showHint(); });
    hintEl.addEventListener('mouseenter', () => { clearTimeout(hintTimer); hintEl.classList.remove('hidden'); });
    hintEl.addEventListener('mouseleave', showHint);

    document.getElementById('hb-fi').addEventListener('click', () => { fontSize = Math.max(8, Math.min(256, fontSize + 4)); rebuild(); showHint(); });
    document.getElementById('hb-fd').addEventListener('click', () => { fontSize = Math.max(8, Math.min(256, fontSize - 4)); rebuild(); showHint(); });
    document.getElementById('hb-font').addEventListener('click', pickFont);
    document.getElementById('hb-goog').addEventListener('click', () => { if (currentFont) Common.openFontSpecimen(currentFont); });
    document.getElementById('hb-dark').addEventListener('click', () => { Common.toggleDark(); showHint(); });
    document.getElementById('hb-sitemap').addEventListener('click', Common.openSitemap);
    Common.initSitemapShortcut();

    const textEditor = Common.initTextEditor({
      buttonEl: document.getElementById('hb-text'),
      labelEl: document.getElementById('hb-text-label'),
      getItems: () => Common.parseQueryItems().length ? Common.parseQueryItems() : fallbackItems,
      onCommit: rebuild,
      onEditStart: () => { hintLocked = true; clearTimeout(hintTimer); hintEl.classList.remove('hidden'); },
      onEditEnd: () => { hintLocked = false; showHint(); },
    });

    Common.onTap(pickFont);

    Common.loadScript('/fonts.js').then(pickFont);
  </script>
</body>
</html>
