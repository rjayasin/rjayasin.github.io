<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruvan / isometric</title>
  <link rel="icon" id="favicon">
  <link rel="stylesheet" href="/common.css">
  <style>
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      cursor: pointer;
      user-select: none;
      position: relative;
    }
    #iso {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      line-height: 1;
      white-space: nowrap;
    }
    #iso svg { display: block; user-select: none; }
    #hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 12px;
      text-align: center;
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
      font-size: 12px;
      color: #888;
      opacity: 1;
      transition: opacity 0.4s ease;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      z-index: 3;
    }
    #hint-inner {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 6px;
      background: #ffffff;
    }
    body.dark #hint-inner { background: #111111; }
    #hint.hidden { opacity: 0; pointer-events: none; }
    #hint .hint-btn {
      cursor: pointer;
      text-decoration: underline;
      text-decoration-style: dotted;
      text-underline-offset: 2px;
    }
    #hint .hint-btn:hover { color: #333; }
    body.dark #hint .hint-btn:hover { color: #ccc; }
    #hint-zone {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 60px;
      z-index: 2;
    }
  </style>
  <script src="/common.js"></script>
</head>
<body>
  <div id="iso"></div>
  <div id="hint"><span id="hint-inner"><span style="white-space:nowrap"><span class="hint-btn" id="hb-fi">+</span>/<span class="hint-btn" id="hb-fd">−</span> font size</span> &nbsp;·&nbsp; <span style="white-space:nowrap"><span class="hint-btn" id="hb-dd">←</span>/<span class="hint-btn" id="hb-di">→</span> angle</span> &nbsp;·&nbsp; <span style="white-space:nowrap"><span class="hint-btn" id="hb-au">↑</span>/<span class="hint-btn" id="hb-ad">↓</span> depth</span> &nbsp;·&nbsp; <span style="white-space:nowrap"><span class="hint-btn" id="hb-font">click font</span></span> &nbsp;·&nbsp; <span style="white-space:nowrap"><span class="hint-btn" id="hb-goog">g google fonts</span></span> &nbsp;·&nbsp; <span style="white-space:nowrap"><span class="hint-btn" id="hb-dark">1 <span class="hb-dark-label">dark</span></span></span> &nbsp;·&nbsp; <span style="white-space:nowrap"><span class="hint-btn" id="hb-sitemap">s sitemap</span></span> &nbsp;·&nbsp; <span style="white-space:nowrap"><span class="hint-btn" id="hb-text"><span id="hb-text-label"></span></span> text</span></span></div>
  <div id="hint-zone"></div>
  <script>
    Common.paintFaviconR();
    Common.initDarkMode();
    Common.initCursorHide();

    const isoEl = document.getElementById('iso');
    let fontSize = window.innerWidth < 640 ? 80 : 160;
    let depth = 40;
    let angle = 30;
    let currentFont = null;
    let fallbackItems = null;

    function isDarkMode() {
      if (document.body.classList.contains('dark')) return true;
      if (document.body.classList.contains('light')) return false;
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    }

    let contourCache = { key: null, contours: null };
    let renderToken = 0;
    let measureCanvas = null;

    const SUPERSAMPLE = 4;

    async function getContours(word, fontPx) {
      const family = currentFont ? `'${currentFont}', serif` : 'serif';
      const key = `${word}|${fontPx}|${family}`;
      if (contourCache.key === key) return contourCache.contours;
      try { await document.fonts.load(`${fontPx}px ${family}`); } catch (e) {}

      const ssPx = fontPx * SUPERSAMPLE;
      if (!measureCanvas) measureCanvas = document.createElement('canvas');
      const canvas = measureCanvas;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.font = `${ssPx}px ${family}`;
      const m = ctx.measureText(word);
      const pad = 2 * SUPERSAMPLE;
      const ascent = Math.ceil((m.actualBoundingBoxAscent || ssPx * 0.85) + pad);
      const descent = Math.ceil((m.actualBoundingBoxDescent || ssPx * 0.25) + pad);
      const textW = Math.max(1, Math.ceil(m.width + pad * 2));
      const textH = ascent + descent;
      canvas.width = textW;
      canvas.height = textH;
      ctx.font = `${ssPx}px ${family}`;
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#000';
      ctx.fillText(word, pad, ascent);

      const contours = rasterToContours(canvas, SUPERSAMPLE);
      contourCache = { key, contours };
      return contours;
    }

    function rasterToContours(canvas, scale) {
      scale = scale || 1;
      const w = canvas.width, h = canvas.height;
      const data = canvas.getContext('2d').getImageData(0, 0, w, h).data;
      function inAt(x, y) {
        if (x < 0 || y < 0 || x >= w || y >= h) return 0;
        return data[(y * w + x) * 4 + 3] > 128 ? 1 : 0;
      }
      const segs = [];
      const push = (a, b) => segs.push([a, b]);
      for (let y = -1; y < h; y++) {
        for (let x = -1; x < w; x++) {
          const tl = inAt(x, y), tr = inAt(x + 1, y);
          const br = inAt(x + 1, y + 1), bl = inAt(x, y + 1);
          const code = (tl << 3) | (tr << 2) | (br << 1) | bl;
          if (code === 0 || code === 15) continue;
          const T = [x + 0.5, y], R = [x + 1, y + 0.5];
          const B = [x + 0.5, y + 1], L = [x, y + 0.5];
          switch (code) {
            case 1:  push(L, B); break;
            case 2:  push(B, R); break;
            case 3:  push(L, R); break;
            case 4:  push(T, R); break;
            case 5:  push(L, T); push(B, R); break;
            case 6:  push(T, B); break;
            case 7:  push(L, T); break;
            case 8:  push(T, L); break;
            case 9:  push(T, B); break;
            case 10: push(T, R); push(L, B); break;
            case 11: push(R, T); break;
            case 12: push(R, L); break;
            case 13: push(R, B); break;
            case 14: push(B, L); break;
          }
        }
      }
      const k = p => p[0] + ',' + p[1];
      const adj = new Map();
      const pts = new Map();
      for (const [a, b] of segs) {
        const ka = k(a), kb = k(b);
        pts.set(ka, a); pts.set(kb, b);
        if (!adj.has(ka)) adj.set(ka, []);
        if (!adj.has(kb)) adj.set(kb, []);
        adj.get(ka).push(kb);
        adj.get(kb).push(ka);
      }
      const visited = new Set();
      const out = [];
      for (const start of adj.keys()) {
        if (visited.has(start)) continue;
        const loop = [];
        let prev = null, cur = start;
        while (cur && !visited.has(cur)) {
          visited.add(cur);
          loop.push(pts.get(cur));
          let next = null;
          for (const n of adj.get(cur)) if (n !== prev) { next = n; break; }
          prev = cur;
          cur = next;
        }
        if (loop.length >= 4) out.push(loop);
      }
      const inv = 1 / scale;
      return out.map(c => simplifyContour(c.map(p => [p[0] * inv, p[1] * inv]), 0.4));
    }

    function pointLineDist2(p, a, b) {
      const dx = b[0] - a[0], dy = b[1] - a[1];
      const len2 = dx * dx + dy * dy;
      if (len2 === 0) {
        const ex = p[0] - a[0], ey = p[1] - a[1];
        return ex * ex + ey * ey;
      }
      let t = ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / len2;
      if (t < 0) t = 0; else if (t > 1) t = 1;
      const ex = p[0] - (a[0] + t * dx);
      const ey = p[1] - (a[1] + t * dy);
      return ex * ex + ey * ey;
    }

    function dpOpen(pts, tol2) {
      const n = pts.length;
      if (n < 3) return pts.slice();
      const keep = new Uint8Array(n);
      keep[0] = 1; keep[n - 1] = 1;
      const stack = [[0, n - 1]];
      while (stack.length) {
        const [lo, hi] = stack.pop();
        if (hi - lo < 2) continue;
        let maxD = 0, maxI = -1;
        for (let i = lo + 1; i < hi; i++) {
          const d = pointLineDist2(pts[i], pts[lo], pts[hi]);
          if (d > maxD) { maxD = d; maxI = i; }
        }
        if (maxD > tol2 && maxI > 0) {
          keep[maxI] = 1;
          stack.push([lo, maxI]);
          stack.push([maxI, hi]);
        }
      }
      const out = [];
      for (let i = 0; i < n; i++) if (keep[i]) out.push(pts[i]);
      return out;
    }

    function simplifyContour(pts, tol) {
      const n = pts.length;
      if (n < 4) return pts.slice();
      const tol2 = tol * tol;
      let imin = 0, imax = 0;
      for (let i = 1; i < n; i++) {
        if (pts[i][0] < pts[imin][0] || (pts[i][0] === pts[imin][0] && pts[i][1] < pts[imin][1])) imin = i;
        if (pts[i][0] > pts[imax][0] || (pts[i][0] === pts[imax][0] && pts[i][1] > pts[imax][1])) imax = i;
      }
      if (imin === imax) return pts.slice();
      const arc1 = [], arc2 = [];
      for (let i = imin; ; i = (i + 1) % n) { arc1.push(pts[i]); if (i === imax) break; }
      for (let i = imax; ; i = (i + 1) % n) { arc2.push(pts[i]); if (i === imin) break; }
      const s1 = dpOpen(arc1, tol2);
      const s2 = dpOpen(arc2, tol2);
      const result = s1.slice();
      for (let i = 1; i < s2.length - 1; i++) result.push(s2[i]);
      return result;
    }

    function minkowskiBoundary(contour, vx, vy) {
      const n = contour.length;
      if (n < 3) return null;
      let area = 0;
      for (let i = 0; i < n; i++) {
        const a = contour[i], b = contour[(i + 1) % n];
        area += a[0] * b[1] - b[0] * a[1];
      }
      const flip = area >= 0 ? 1 : -1;
      const eps = 0.25;
      const signs = new Int8Array(n);
      for (let i = 0; i < n; i++) {
        const a = contour[i], b = contour[(i + 1) % n];
        const cross = ((b[0] - a[0]) * vy - (b[1] - a[1]) * vx) * flip;
        signs[i] = cross > eps ? 1 : cross < -eps ? -1 : 0;
      }
      const result = [];
      for (let i = 0; i < n; i++) {
        const s = signs[i];
        const prevS = signs[(i - 1 + n) % n];
        const a = contour[i];
        if (s !== 0 && prevS !== 0 && s !== prevS) {
          if (prevS > 0) result.push(a);
          else result.push([a[0] + vx, a[1] + vy]);
        }
        if (s > 0) result.push(a);
        else if (s < 0) result.push([a[0] + vx, a[1] + vy]);
      }
      return result;
    }

    async function render() {
      const items = Common.parseQueryItems().length ? Common.parseQueryItems() : fallbackItems;
      if (!items || items.length === 0) { isoEl.innerHTML = ''; return; }
      const word = items[0];

      const a = angle * Math.PI / 180;
      const dx = Math.cos(a);
      const dy = -Math.sin(a);
      const steps = Math.max(0, Math.min(500, depth));
      const ox = dx * steps;
      const oy = dy * steps;

      const dark = isDarkMode();
      const shadowColor = dark ? '#666666' : '#bbbbbb';
      const faceColor = dark ? '#ffffff' : '#000000';
      const edgeColor = faceColor;

      const myToken = ++renderToken;
      const contours = await getContours(word, fontSize);
      if (myToken !== renderToken) return;
      if (!contours.length) { isoEl.innerHTML = ''; return; }

      let frontD = '';
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const c of contours) {
        frontD += 'M' + c[0][0].toFixed(2) + ',' + c[0][1].toFixed(2);
        for (let i = 1; i < c.length; i++) frontD += 'L' + c[i][0].toFixed(2) + ',' + c[i][1].toFixed(2);
        frontD += 'Z';
        for (const p of c) {
          if (p[0] < minX) minX = p[0];
          if (p[1] < minY) minY = p[1];
          if (p[0] > maxX) maxX = p[0];
          if (p[1] > maxY) maxY = p[1];
        }
      }

      let bodyD = '';
      if (steps > 0) {
        for (const c of contours) {
          let area = 0;
          for (let i = 0; i < c.length; i++) {
            const a = c[i], b = c[(i + 1) % c.length];
            area += a[0] * b[1] - b[0] * a[1];
          }
          if (area <= 0) continue;
          const mb = minkowskiBoundary(c, ox, oy);
          if (!mb || mb.length < 3) continue;
          bodyD += 'M' + mb[0][0].toFixed(2) + ',' + mb[0][1].toFixed(2);
          for (let i = 1; i < mb.length; i++) bodyD += 'L' + mb[i][0].toFixed(2) + ',' + mb[i][1].toFixed(2);
          bodyD += 'Z';
        }
      }

      const bMinX = Math.min(minX, minX + ox);
      const bMinY = Math.min(minY, minY + oy);
      const bMaxX = Math.max(maxX, maxX + ox);
      const bMaxY = Math.max(maxY, maxY + oy);
      const pad = 2;
      const vbX = bMinX - pad, vbY = bMinY - pad;
      const vbW = (bMaxX - bMinX) + pad * 2;
      const vbH = (bMaxY - bMinY) + pad * 2;
      const sw = Math.max(0.6, fontSize / 200);

      let stack = '';
      if (steps > 0) {
        const lay = Math.min(steps, 80);
        for (let i = lay; i >= 1; i--) {
          const tx = (ox / lay) * i;
          const ty = (oy / lay) * i;
          stack += `<use href="#g" transform="translate(${tx.toFixed(2)} ${ty.toFixed(2)})"/>`;
        }
      }

      isoEl.innerHTML =
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vbX} ${vbY} ${vbW} ${vbH}" width="${vbW}" height="${vbH}">` +
        `<defs><path id="g" d="${frontD}" fill-rule="evenodd"/></defs>` +
        (stack ? `<g fill="${shadowColor}">${stack}</g>` : '') +
        (bodyD ? `<path d="${bodyD}" fill="none" stroke="${edgeColor}" stroke-width="${sw}" stroke-linejoin="round"/>` : '') +
        `<use href="#g" fill="${faceColor}" stroke="${edgeColor}" stroke-width="${sw}" stroke-linejoin="round"/>` +
        `</svg>`;
    }
    render();
    window.addEventListener('resize', render);
    window.addEventListener('darkmodechange', render);

    if (Common.parseQueryItems().length === 0) {
      fetch('/words.txt').then(r => r.text()).then(t => {
        const list = t.split(/\s+/).filter(w => w.length > 0);
        if (list.length) {
          const word = list[Math.floor(Math.random() * list.length)];
          fallbackItems = [word];
          history.replaceState(null, '', location.pathname + '?' + encodeURIComponent(word) + location.hash);
          render();
          refreshTextLabel();
        }
      }).catch(() => {});
    }

    const cooldown = Common.makeCooldown(500);
    async function pickFont() {
      if (!window.googleFonts) return;
      cooldown(async () => {
        const font = Common.pickRandomGoogleFont();
        await Common.loadGoogleFont(font);
        currentFont = font;
        isoEl.style.fontFamily = `'${font}', serif`;
        render();
      });
    }

    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      if ((e.key === 'g' || e.key === 'G') && !e.repeat && currentFont) {
        Common.openFontSpecimen(currentFont);
        return;
      }
      if (e.key === '+' || e.key === '=' || e.key === '-' || e.key === '_') {
        e.preventDefault();
        const delta = (e.key === '+' || e.key === '=') ? 8 : -8;
        fontSize = Math.max(8, Math.min(800, fontSize + delta));
        render();
        return;
      }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        angle = ((angle + (e.key === 'ArrowRight' ? -5 : 5)) % 360 + 360) % 360;
        render();
        return;
      }
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        depth = Math.max(0, Math.min(500, depth + (e.key === 'ArrowUp' ? 4 : -4)));
        render();
        return;
      }
    });

    const hintEl = document.getElementById('hint');
    const hintZone = document.getElementById('hint-zone');
    let hintTimer = null;
    let hintLocked = false;
    function showHint() {
      hintEl.classList.remove('hidden');
      clearTimeout(hintTimer);
      if (hintLocked) return;
      hintTimer = setTimeout(() => hintEl.classList.add('hidden'), 2500);
    }
    showHint();
    hintZone.addEventListener('mouseenter', showHint);
    hintZone.addEventListener('mousemove', showHint);
    hintZone.addEventListener('touchstart', showHint, { passive: true });
    hintZone.addEventListener('touchend', e => e.stopPropagation());
    hintEl.addEventListener('click', e => e.stopPropagation());
    hintEl.addEventListener('touchstart', () => clearTimeout(hintTimer), { passive: true });
    hintEl.addEventListener('touchend', e => { e.stopPropagation(); showHint(); });
    hintEl.addEventListener('mouseenter', () => { clearTimeout(hintTimer); hintEl.classList.remove('hidden'); });
    hintEl.addEventListener('mouseleave', showHint);

    document.getElementById('hb-fi').addEventListener('click', () => { fontSize = Math.max(8, Math.min(800, fontSize + 8)); render(); showHint(); });
    document.getElementById('hb-fd').addEventListener('click', () => { fontSize = Math.max(8, Math.min(800, fontSize - 8)); render(); showHint(); });
    function bindRepeat(id, step) {
      const el = document.getElementById(id);
      let initialTimer = null;
      let intervalTimer = null;
      const stop = () => {
        clearTimeout(initialTimer);
        clearInterval(intervalTimer);
        initialTimer = intervalTimer = null;
      };
      const start = e => {
        if (e.button !== undefined && e.button !== 0) return;
        e.preventDefault();
        step();
        initialTimer = setTimeout(() => {
          intervalTimer = setInterval(step, 30);
        }, 400);
      };
      el.addEventListener('mousedown', start);
      el.addEventListener('touchstart', start, { passive: false });
      ['mouseup', 'mouseleave', 'touchend', 'touchcancel', 'blur'].forEach(ev => el.addEventListener(ev, stop));
      window.addEventListener('mouseup', stop);
      el.addEventListener('click', e => e.preventDefault());
    }
    bindRepeat('hb-dd', () => { angle = ((angle + 5) % 360 + 360) % 360; render(); showHint(); });
    bindRepeat('hb-di', () => { angle = ((angle - 5) % 360 + 360) % 360; render(); showHint(); });
    bindRepeat('hb-au', () => { depth = Math.max(0, Math.min(500, depth + 4)); render(); showHint(); });
    bindRepeat('hb-ad', () => { depth = Math.max(0, Math.min(500, depth - 4)); render(); showHint(); });
    document.getElementById('hb-font').addEventListener('click', pickFont);
    document.getElementById('hb-goog').addEventListener('click', () => { if (currentFont) Common.openFontSpecimen(currentFont); });
    document.getElementById('hb-dark').addEventListener('click', () => { Common.toggleDark(); showHint(); });
    document.getElementById('hb-sitemap').addEventListener('click', Common.openSitemap);
    Common.initSitemapShortcut();

    const textEditor = Common.initTextEditor({
      buttonEl: document.getElementById('hb-text'),
      labelEl: document.getElementById('hb-text-label'),
      getItems: () => Common.parseQueryItems().length ? Common.parseQueryItems() : (fallbackItems || []),
      onCommit: render,
      onEditStart: () => { hintLocked = true; clearTimeout(hintTimer); hintEl.classList.remove('hidden'); },
      onEditEnd: () => { hintLocked = false; showHint(); },
    });
    const refreshTextLabel = textEditor.refresh;

    Common.onTap(pickFont);

    Common.loadScript('/fonts.js').then(pickFont);
  </script>
</body>
</html>
