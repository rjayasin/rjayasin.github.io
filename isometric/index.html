<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruvan / isometric</title>
  <link rel="icon" id="favicon">
  <link rel="stylesheet" href="/common.css">
  <style>
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      cursor: pointer;
      user-select: none;
      position: relative;
    }
    #iso {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      line-height: 1;
      white-space: nowrap;
    }
    #hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 12px;
      text-align: center;
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
      font-size: 12px;
      color: #888;
      opacity: 1;
      transition: opacity 0.4s ease;
      user-select: none;
      z-index: 3;
    }
    #hint-inner {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 6px;
      background: #ffffff;
    }
    body.dark #hint-inner { background: #111111; }
    #hint.hidden { opacity: 0; pointer-events: none; }
    #hint .hint-btn {
      cursor: pointer;
      text-decoration: underline;
      text-decoration-style: dotted;
      text-underline-offset: 2px;
    }
    #hint .hint-btn:hover { color: #333; }
    body.dark #hint .hint-btn:hover { color: #ccc; }
    #hint-zone {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 60px;
      z-index: 2;
    }
  </style>
  <script src="/common.js"></script>
</head>
<body>
  <div id="iso"></div>
  <div id="hint"><span id="hint-inner"><span style="white-space:nowrap"><span class="hint-btn" id="hb-fi">+</span>/<span class="hint-btn" id="hb-fd">−</span> font size</span> &nbsp;·&nbsp; <span style="white-space:nowrap"><span class="hint-btn" id="hb-dd">←</span>/<span class="hint-btn" id="hb-di">→</span> depth</span> &nbsp;·&nbsp; <span style="white-space:nowrap"><span class="hint-btn" id="hb-au">↑</span>/<span class="hint-btn" id="hb-ad">↓</span> angle</span> &nbsp;·&nbsp; <span style="white-space:nowrap"><span class="hint-btn" id="hb-font">click font</span></span> &nbsp;·&nbsp; <span style="white-space:nowrap"><span class="hint-btn" id="hb-goog">g google fonts</span></span> &nbsp;·&nbsp; <span style="white-space:nowrap"><span class="hint-btn" id="hb-dark">1 <span class="hb-dark-label">dark</span></span></span> &nbsp;·&nbsp; <span style="white-space:nowrap"><span class="hint-btn" id="hb-sitemap">s sitemap</span></span> &nbsp;·&nbsp; <span style="white-space:nowrap"><span class="hint-btn" id="hb-text"><span id="hb-text-label"></span></span> text</span></span></div>
  <div id="hint-zone"></div>
  <script>
    Common.paintFaviconR();
    Common.initDarkMode();
    Common.initCursorHide();

    const isoEl = document.getElementById('iso');
    let fontSize = window.innerWidth < 640 ? 80 : 160;
    let depth = 40;
    let angle = 30;
    let currentFont = null;
    let fallbackItems = null;

    function isDarkMode() {
      if (document.body.classList.contains('dark')) return true;
      if (document.body.classList.contains('light')) return false;
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    }

    function render() {
      const items = Common.parseQueryItems().length ? Common.parseQueryItems() : fallbackItems;
      if (!items || items.length === 0) { isoEl.textContent = ''; return; }
      const word = items[0];
      const a = angle * Math.PI / 180;
      const dx = Math.cos(a);
      const dy = -Math.sin(a);
      const sh = isDarkMode() ? '#666666' : '#bbbbbb';
      const steps = Math.max(0, Math.min(500, depth));
      const shadows = [];
      for (let i = 1; i <= steps; i++) {
        shadows.push(`${(dx * i).toFixed(2)}px ${(dy * i).toFixed(2)}px 0 ${sh}`);
      }
      isoEl.style.fontSize = fontSize + 'px';
      isoEl.style.textShadow = shadows.join(', ');
      isoEl.textContent = word;
    }
    render();
    window.addEventListener('resize', render);
    window.addEventListener('darkmodechange', render);

    if (Common.parseQueryItems().length === 0) {
      fetch('/words.txt').then(r => r.text()).then(t => {
        const list = t.split(/\s+/).filter(w => w.length > 0);
        if (list.length) {
          const word = list[Math.floor(Math.random() * list.length)];
          fallbackItems = [word];
          history.replaceState(null, '', location.pathname + '?' + encodeURIComponent(word) + location.hash);
          render();
          refreshTextLabel();
        }
      }).catch(() => {});
    }

    const cooldown = Common.makeCooldown(500);
    async function pickFont() {
      if (!window.googleFonts) return;
      cooldown(async () => {
        const font = Common.pickRandomGoogleFont();
        await Common.loadGoogleFont(font);
        currentFont = font;
        isoEl.style.fontFamily = `'${font}', serif`;
        render();
      });
    }

    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      if ((e.key === 'g' || e.key === 'G') && !e.repeat && currentFont) {
        Common.openFontSpecimen(currentFont);
        return;
      }
      if (e.key === '+' || e.key === '=' || e.key === '-' || e.key === '_') {
        e.preventDefault();
        const delta = (e.key === '+' || e.key === '=') ? 8 : -8;
        fontSize = Math.max(8, Math.min(800, fontSize + delta));
        render();
        return;
      }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        depth = Math.max(0, Math.min(500, depth + (e.key === 'ArrowRight' ? 4 : -4)));
        render();
        return;
      }
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        angle = ((angle + (e.key === 'ArrowUp' ? 5 : -5)) % 360 + 360) % 360;
        render();
        return;
      }
    });

    const hintEl = document.getElementById('hint');
    const hintZone = document.getElementById('hint-zone');
    let hintTimer = null;
    let hintLocked = false;
    function showHint() {
      hintEl.classList.remove('hidden');
      clearTimeout(hintTimer);
      if (hintLocked) return;
      hintTimer = setTimeout(() => hintEl.classList.add('hidden'), 2500);
    }
    showHint();
    hintZone.addEventListener('mouseenter', showHint);
    hintZone.addEventListener('mousemove', showHint);
    hintZone.addEventListener('touchstart', showHint, { passive: true });
    hintZone.addEventListener('touchend', e => e.stopPropagation());
    hintEl.addEventListener('click', e => e.stopPropagation());
    hintEl.addEventListener('touchstart', () => clearTimeout(hintTimer), { passive: true });
    hintEl.addEventListener('touchend', e => { e.stopPropagation(); showHint(); });
    hintEl.addEventListener('mouseenter', () => { clearTimeout(hintTimer); hintEl.classList.remove('hidden'); });
    hintEl.addEventListener('mouseleave', showHint);

    document.getElementById('hb-fi').addEventListener('click', () => { fontSize = Math.max(8, Math.min(800, fontSize + 8)); render(); showHint(); });
    document.getElementById('hb-fd').addEventListener('click', () => { fontSize = Math.max(8, Math.min(800, fontSize - 8)); render(); showHint(); });
    document.getElementById('hb-dd').addEventListener('click', () => { depth = Math.max(0, Math.min(500, depth - 4)); render(); showHint(); });
    document.getElementById('hb-di').addEventListener('click', () => { depth = Math.max(0, Math.min(500, depth + 4)); render(); showHint(); });
    document.getElementById('hb-au').addEventListener('click', () => { angle = ((angle + 5) % 360 + 360) % 360; render(); showHint(); });
    document.getElementById('hb-ad').addEventListener('click', () => { angle = ((angle - 5) % 360 + 360) % 360; render(); showHint(); });
    document.getElementById('hb-font').addEventListener('click', pickFont);
    document.getElementById('hb-goog').addEventListener('click', () => { if (currentFont) Common.openFontSpecimen(currentFont); });
    document.getElementById('hb-dark').addEventListener('click', () => { Common.toggleDark(); showHint(); });
    document.getElementById('hb-sitemap').addEventListener('click', Common.openSitemap);
    Common.initSitemapShortcut();

    const textEditor = Common.initTextEditor({
      buttonEl: document.getElementById('hb-text'),
      labelEl: document.getElementById('hb-text-label'),
      getItems: () => Common.parseQueryItems().length ? Common.parseQueryItems() : (fallbackItems || []),
      onCommit: render,
      onEditStart: () => { hintLocked = true; clearTimeout(hintTimer); hintEl.classList.remove('hidden'); },
      onEditEnd: () => { hintLocked = false; showHint(); },
    });
    const refreshTextLabel = textEditor.refresh;

    Common.onTap(pickFont);

    Common.loadScript('/fonts.js').then(pickFont);
  </script>
</body>
</html>
