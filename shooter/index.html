<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Ruvan / shooter</title>
    <link rel="icon" id="favicon" />
    <link rel="stylesheet" href="/common.css" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #game {
        position: fixed;
        inset: 0;
        display: block;
        touch-action: none;
        cursor: crosshair;
      }
      #hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 12px;
        text-align: center;
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 12px;
        color: #888;
        opacity: 1;
        transition: opacity 0.4s ease;
        user-select: none;
        z-index: 3;
        pointer-events: none;
      }
      #hint-inner {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 6px;
        background: #ffffff;
      }
      body.dark #hint-inner {
        background: #111111;
      }
      #hint.hidden {
        opacity: 0;
      }
      #hint.hidden .hint-btn {
        pointer-events: none;
      }
      #hint .hint-btn {
        cursor: pointer;
        pointer-events: auto;
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 2px;
      }
      #hint .hint-btn:hover {
        color: #333;
      }
      body.dark #hint .hint-btn:hover {
        color: #ccc;
      }
      #hint-zone {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 60px;
        z-index: 2;
        pointer-events: none;
      }
      #hint.hidden ~ #hint-zone {
        pointer-events: auto;
      }
    </style>
    <script src="/common.js"></script>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hint">
      <span id="hint-inner"
        ><span style="white-space: nowrap">drag &amp; release to fire</span> &nbsp;·&nbsp;
        <span style="white-space: nowrap"><span class="hint-btn" id="hb-reset">r reset</span></span>
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-dark"
            >1 <span class="hb-dark-label">dark</span></span
          ></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-smaller">−</span>/<span class="hint-btn" id="hb-bigger"
            >+</span
          >
          size</span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-shot-smaller">[</span>/<span
            class="hint-btn"
            id="hb-shot-bigger"
            >]</span
          >
          shot</span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-cols-smaller">←</span>/<span
            class="hint-btn"
            id="hb-cols-bigger"
            >→</span
          >
          cols</span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-rows-smaller">↓</span>/<span
            class="hint-btn"
            id="hb-rows-bigger"
            >↑</span
          >
          rows</span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"><span class="hint-btn" id="hb-emoji">emoji</span></span>
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-sitemap">s sitemap</span></span
        ></span
      >
    </div>
    <div id="hint-zone"></div>
    <script>
      Common.paintFaviconR();
      Common.initDarkMode();
      Common.initHintUpdated();

      const MONO =
        'ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace';
      // Fired glyphs are drawn from a spread of scripts (plus emoji), so each
      // shot can be a letter from almost any of the world's writing systems.
      // Ranges are inclusive code-point spans chosen to be densely assigned with
      // standalone, renderable base characters (combining-mark blocks avoided).
      const CHAR_RANGES = [
        [0x0041, 0x005a],
        [0x0061, 0x007a],
        [0x0030, 0x0039], // Latin + digits
        [0x00c0, 0x00ff],
        [0x0100, 0x017f], // accented Latin
        [0x0391, 0x03a9],
        [0x03b1, 0x03c9], // Greek
        [0x0410, 0x044f], // Cyrillic
        [0x0531, 0x0556],
        [0x0561, 0x0586], // Armenian
        [0x05d0, 0x05ea], // Hebrew
        [0x0621, 0x064a], // Arabic
        [0x0905, 0x0939], // Devanagari
        [0x0e01, 0x0e2e], // Thai
        [0x10d0, 0x10fa], // Georgian
        [0x3041, 0x3096],
        [0x30a1, 0x30fa], // Hiragana + Katakana
        [0x4e00, 0x9fa0], // CJK
        [0xac00, 0xd7a3], // Hangul
        [0x2190, 0x21ff],
        [0x2200, 0x22ff], // arrows + math symbols
      ];
      function pickFromRanges(ranges) {
        const [lo, hi] = ranges[Math.floor(Math.random() * ranges.length)];
        return String.fromCodePoint(lo + Math.floor(Math.random() * (hi - lo + 1)));
      }
      // Shown instantly and used whenever the Wikipedia fetch is unavailable.
      const FALLBACK_TEXTS = [
        'Letters are small machines for thought, each one a shape agreed upon ' +
          'long ago and carried forward by every hand that ever wrote a word. ' +
          'Set them in a tidy square and they sit still, patient and justified, ' +
          'waiting for a nudge. Throw one across the page and watch the rest ' +
          'scatter like startled birds, tumbling over the edge and out of sight.',
        'A square of text is a quiet thing until you disturb it. Aim, drag, ' +
          'and let go: a single character flies off and the orderly grid breaks ' +
          'apart, glyphs spilling past the margins one collision at a time.',
        'Type is everywhere and mostly invisible, doing its work without asking ' +
          'for attention. Here the letters get to misbehave for once, knocked ' +
          'loose from their lines and sent skidding toward the edge of the page.',
        'Every paragraph is a crowd of characters standing very still. Give one ' +
          'of them a push and the whole arrangement remembers that it was only ' +
          'ever a loose pile of shapes, ready to scatter at the slightest nudge.',
      ];

      const WIKI_URL =
        'https://en.wikipedia.org/w/api.php?format=json&origin=*' +
        '&action=query&generator=random&grnnamespace=0&grnlimit=1' +
        '&prop=extracts&explaintext=1&exchars=5000';

      let wordSource = [];
      function toWords(text) {
        return text.replace(/\s+/g, ' ').trim().split(' ').filter(Boolean);
      }
      function applyFallback() {
        wordSource = toWords(FALLBACK_TEXTS[Math.floor(Math.random() * FALLBACK_TEXTS.length)]);
      }

      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');

      let W = 0,
        H = 0,
        dpr = 1;
      let fontSize, charW, charH, radius;
      let userFontSize = null;
      const FONT_MIN = 8;
      const FONT_MAX = 60;
      const FONT_STEP = 2;
      const SHOT_MULT_STEP = 1.2;
      const SHOT_MULT_MIN = 0.25;
      const SHOT_MULT_MAX = 6;
      const DIM_MIN = 2;
      const DIM_MAX = 200;
      let shotSizeMult = 1;
      let userCols = null;
      let userRows = null;
      let currentCols = 0;
      let currentRows = 0;
      let bodies = [];
      const broadphaseGrid = new Map();
      let hasFired = false;

      function isDark() {
        if (document.body.classList.contains('dark')) return true;
        if (document.body.classList.contains('light')) return false;
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      }
      function inkColor() {
        return isDark() ? '#f0f0f0' : '#111111';
      }

      function buildLines(cols, rows) {
        // Pack words separated by single spaces and slice into fixed-width
        // lines. If a word doesn't fit the remainder of a line, break it
        // mid-character so every line is exactly cols wide.
        const lines = [];
        let line = '';
        let pending = '';
        let wi = 0;
        while (lines.length < rows) {
          if (line === '' && pending) pending = pending.replace(/^ +/, '');
          while (line.length < cols) {
            let next;
            if (pending) {
              next = pending;
              pending = '';
            } else {
              const w = wordSource[wi % wordSource.length];
              wi++;
              next = (line.length > 0 ? ' ' : '') + w;
            }
            const remaining = cols - line.length;
            if (next.length <= remaining) {
              line += next;
            } else {
              line += next.slice(0, remaining);
              pending = next.slice(remaining);
            }
          }
          lines.push(line);
          line = '';
        }
        return lines;
      }

      function makeBody(x, y, ch, vx, vy, size, shot) {
        size = size != null ? size : fontSize;
        return {
          x,
          y,
          vx: vx || 0,
          vy: vy || 0,
          angle: 0,
          av: 0,
          r: radius * (size / fontSize),
          ch,
          size,
          shot: !!shot,
        };
      }

      function buildBlock({ preserveShots = false } = {}) {
        const minDim = Math.min(W, H);
        const autoSize = Math.max(13, Math.min(30, Math.round(minDim / 22)));
        fontSize =
          userFontSize != null ? Math.max(FONT_MIN, Math.min(FONT_MAX, userFontSize)) : autoSize;
        ctx.font = fontSize + 'px ' + MONO;
        charW = ctx.measureText('M').width;
        charH = fontSize * 1.15;
        radius = charW * 0.46;

        const target = minDim * 0.46;
        const autoCols = Math.max(6, Math.round(target / charW));
        const autoRows = Math.max(4, Math.round(target / charH));
        const cols = Math.max(DIM_MIN, Math.min(DIM_MAX, userCols != null ? userCols : autoCols));
        const rows = Math.max(DIM_MIN, Math.min(DIM_MAX, userRows != null ? userRows : autoRows));
        currentCols = cols;
        currentRows = rows;

        const blockW = cols * charW;
        const blockH = rows * charH;
        const x0 = (W - blockW) / 2 + charW / 2;
        const y0 = (H - blockH) / 2 + charH / 2;

        const shots = preserveShots ? bodies.filter((b) => b.shot) : [];
        bodies = [];
        // No source text yet (initial load before wiki responds): leave the
        // grid empty rather than flashing the fallback text for a frame.
        const lines = wordSource.length ? buildLines(cols, rows) : [];
        for (let r = 0; r < lines.length; r++) {
          const line = lines[r];
          for (let c = 0; c < line.length; c++) {
            const ch = line[c];
            if (ch === ' ') continue;
            bodies.push(makeBody(x0 + c * charW, y0 + r * charH, ch));
          }
        }
        for (const b of shots) bodies.push(b);
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        buildBlock();
      }

      // --- physics ---
      const RESTITUTION = 0.25;
      const DAMPING = 0.982; // per substep velocity decay
      const SLEEP_SPEED = 1.5; // px/s below which we zero out velocity
      const MARGIN = 60; // off-screen distance before removal
      const ANG_DAMPING = 0.985; // per substep spin decay
      const ANG_SLEEP = 0.04; // rad/s below which we stop spinning
      const SPIN_FACTOR = 0.2; // how much glancing contact induces spin
      const MAX_AV = 10; // rad/s spin cap

      function step(dt) {
        // integrate
        for (const b of bodies) {
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.vx *= DAMPING;
          b.vy *= DAMPING;
          if (Math.abs(b.vx) < SLEEP_SPEED) b.vx = 0;
          if (Math.abs(b.vy) < SLEEP_SPEED) b.vy = 0;
          b.angle += b.av * dt;
          b.av *= ANG_DAMPING;
          if (Math.abs(b.av) < ANG_SLEEP) b.av = 0;
        }

        // broadphase: spatial hash grid. Map and per-cell arrays are reused
        // across substeps (cleared, not reallocated) to avoid GC pressure at
        // 120Hz. The j <= i filter below makes each pair land exactly once,
        // so no checked-set is needed.
        const cell = radius * 2.2;
        for (const arr of broadphaseGrid.values()) arr.length = 0;
        const key = (cx, cy) => cx + ',' + cy;
        for (let i = 0; i < bodies.length; i++) {
          const b = bodies[i];
          const cx = Math.floor(b.x / cell);
          const cy = Math.floor(b.y / cell);
          const k = key(cx, cy);
          let arr = broadphaseGrid.get(k);
          if (!arr) broadphaseGrid.set(k, (arr = []));
          arr.push(i);
        }

        for (let i = 0; i < bodies.length; i++) {
          const b = bodies[i];
          const cx = Math.floor(b.x / cell);
          const cy = Math.floor(b.y / cell);
          for (let ox = -1; ox <= 1; ox++) {
            for (let oy = -1; oy <= 1; oy++) {
              const arr = broadphaseGrid.get(key(cx + ox, cy + oy));
              if (!arr) continue;
              for (const j of arr) {
                if (j <= i) continue;
                resolve(b, bodies[j]);
              }
            }
          }
        }

        // cull bodies pushed off the page
        bodies = bodies.filter(
          (b) => b.x > -MARGIN && b.x < W + MARGIN && b.y > -MARGIN && b.y < H + MARGIN
        );
      }

      function resolve(a, b) {
        let dx = b.x - a.x,
          dy = b.y - a.y;
        const minDist = a.r + b.r;
        let d2 = dx * dx + dy * dy;
        if (d2 >= minDist * minDist) return;
        let dist = Math.sqrt(d2) || 0.0001;
        if (d2 === 0) {
          dx = 0.01;
          dy = 0;
          dist = 0.01;
        }
        const nx = dx / dist,
          ny = dy / dist;
        const overlap = minDist - dist;

        // positional correction (equal mass)
        const corr = overlap / 2;
        a.x -= nx * corr;
        a.y -= ny * corr;
        b.x += nx * corr;
        b.y += ny * corr;

        // velocity impulse along normal
        const rvx = b.vx - a.vx,
          rvy = b.vy - a.vy;
        const vn = rvx * nx + rvy * ny;
        if (vn > 0) return; // separating
        const jImp = (-(1 + RESTITUTION) * vn) / 2;
        const ix = jImp * nx,
          iy = jImp * ny;
        a.vx -= ix;
        a.vy -= iy;
        b.vx += ix;
        b.vy += iy;

        // glancing (tangential) contact spins the glyphs instead of leaving
        // them locked upright.
        const vt = rvx * -ny + rvy * nx;
        const spin = (vt / a.r) * SPIN_FACTOR;
        a.av = Math.max(-MAX_AV, Math.min(MAX_AV, a.av - spin));
        b.av = Math.max(-MAX_AV, Math.min(MAX_AV, b.av + spin));
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = inkColor();
        for (const b of bodies) {
          ctx.font = b.size + 'px ' + MONO;
          if (b.angle) {
            ctx.translate(b.x, b.y);
            ctx.rotate(b.angle);
            ctx.fillText(b.ch, 0, 0);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          } else {
            ctx.fillText(b.ch, b.x, b.y);
          }
        }

        if (drag.active) {
          ctx.save();
          ctx.strokeStyle = isDark() ? 'rgba(240,240,240,0.5)' : 'rgba(17,17,17,0.4)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(drag.sx, drag.sy);
          ctx.lineTo(drag.cx, drag.cy);
          ctx.stroke();
          ctx.fillStyle = inkColor();
          ctx.font = fontSize * shotSizeMult + 'px ' + MONO;
          ctx.globalAlpha = 0.7;
          ctx.fillText(drag.ch, drag.sx, drag.sy);
          ctx.restore();
        }
      }

      let lastT = performance.now();
      let acc = 0;
      const FIXED = 1 / 120; // seconds
      function frame(now) {
        let elapsed = (now - lastT) / 1000;
        lastT = now;
        if (elapsed > 0.05) elapsed = 0.05; // clamp after tab switch / hitch
        acc += elapsed;
        let iters = 0;
        while (acc >= FIXED && iters++ < 8) {
          step(FIXED);
          acc -= FIXED;
        }
        draw();
        requestAnimationFrame(frame);
      }

      // --- input ---
      const drag = { active: false, id: null, sx: 0, sy: 0, cx: 0, cy: 0, ch: '' };
      let emojiMode = false;
      function pickEmoji() {
        // window.EMOJIS is loaded async from /emojis.js; before it lands we
        // fall back to a letter so the first few shots aren't blank.
        if (!window.EMOJIS) return pickFromRanges(CHAR_RANGES);
        return window.EMOJIS[Math.floor(Math.random() * window.EMOJIS.length)];
      }
      function randChar() {
        // Roughly one shot in five is an emoji; the rest are letters from the
        // script ranges above. In emoji mode every shot is an emoji.
        if (emojiMode) return pickEmoji();
        return Math.random() < 0.2 ? pickEmoji() : pickFromRanges(CHAR_RANGES);
      }

      function localPoint(e) {
        const rect = canvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      }

      canvas.addEventListener('pointerdown', (e) => {
        if (drag.active) return;
        Common.ensureEmojis();
        hideHintSoon();
        const p = localPoint(e);
        drag.active = true;
        drag.id = e.pointerId;
        drag.sx = drag.cx = p.x;
        drag.sy = drag.cy = p.y;
        drag.ch = randChar();
        if (canvas.setPointerCapture) {
          try {
            canvas.setPointerCapture(e.pointerId);
          } catch (_) {}
        }
      });

      canvas.addEventListener('pointermove', (e) => {
        if (!drag.active || e.pointerId !== drag.id) return;
        const p = localPoint(e);
        drag.cx = p.x;
        drag.cy = p.y;
      });

      function endDrag(e) {
        if (!drag.active || e.pointerId !== drag.id) return;
        const p = localPoint(e);
        drag.cx = p.x;
        drag.cy = p.y;
        let dx = drag.cx - drag.sx,
          dy = drag.cy - drag.sy;
        const dist = Math.hypot(dx, dy);
        const minDim = Math.min(W, H);
        // speed scales with drag length relative to screen, capped.
        const speed = Math.min(dist / minDim, 1) * 3000 + 400;
        if (dist < 4) {
          dx = 0;
          dy = -1;
        } // pure tap: fire upward gently
        const inv = dist > 0 ? 1 / dist : 1;
        const nx = dx * inv,
          ny = dy * inv;
        bodies.push(
          makeBody(drag.sx, drag.sy, drag.ch, nx * speed, ny * speed, fontSize * shotSizeMult, true)
        );
        hasFired = true;
        drag.active = false;
        drag.id = null;
      }

      canvas.addEventListener('pointerup', endDrag);
      canvas.addEventListener('pointercancel', (e) => {
        if (e.pointerId === drag.id) {
          drag.active = false;
          drag.id = null;
        }
      });
      // iOS Safari: stop scroll/zoom gestures from stealing touches.
      canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

      // --- hint + controls ---
      const hintEl = document.getElementById('hint');
      let hintTimer = setTimeout(() => hintEl.classList.add('hidden'), 4000);
      function hideHintSoon() {
        clearTimeout(hintTimer);
        hintTimer = setTimeout(() => hintEl.classList.add('hidden'), 1200);
      }
      function showHint() {
        hintEl.classList.remove('hidden');
        clearTimeout(hintTimer);
        hintTimer = setTimeout(() => hintEl.classList.add('hidden'), 2500);
      }
      window.addEventListener('pointermove', (e) => {
        if (e.clientY >= window.innerHeight - 60) showHint();
      });
      // While the hint is hidden, the zone overlay catches pointerdowns in the
      // bottom band before they reach the canvas, so a tap there reveals the
      // hint instead of firing a stray shot. Once the hint is up, the CSS flips
      // the zone back to pointer-events:none and drag-to-fire works again.
      document.getElementById('hint-zone').addEventListener('pointerdown', showHint);

      // Fresh text on each load and reset: try a random Wikipedia article
      // first, falling back to a local string only if the fetch fails or
      // returns too little text. Keeps the grid empty during the request so
      // the fallback doesn't flash for a frame before the real text arrives.
      async function loadNewText() {
        hasFired = false;
        wordSource = [];
        buildBlock();
        try {
          const res = await fetch(WIKI_URL, { cache: 'no-store' });
          const data = await res.json();
          const page = Object.values(data.query.pages)[0];
          const words = toWords((page && page.extract) || '');
          if (words.length >= 12 && !hasFired) {
            wordSource = words;
            buildBlock();
            return;
          }
        } catch (_) {
          /* fall through to fallback */
        }
        if (!hasFired && !wordSource.length) {
          applyFallback();
          buildBlock();
        }
      }

      function adjustFont(delta) {
        const next = Math.max(FONT_MIN, Math.min(FONT_MAX, fontSize + delta));
        if (next === fontSize) return;
        userFontSize = next;
        buildBlock({ preserveShots: true });
      }
      function adjustShotSize(factor) {
        shotSizeMult = Math.max(SHOT_MULT_MIN, Math.min(SHOT_MULT_MAX, shotSizeMult * factor));
      }
      function adjustCols(delta) {
        const next = Math.max(DIM_MIN, Math.min(DIM_MAX, currentCols + delta));
        if (next === currentCols) return;
        userCols = next;
        buildBlock({ preserveShots: true });
      }
      function adjustRows(delta) {
        const next = Math.max(DIM_MIN, Math.min(DIM_MAX, currentRows + delta));
        if (next === currentRows) return;
        userRows = next;
        buildBlock({ preserveShots: true });
      }
      document.addEventListener('keydown', (e) => {
        if ((e.key === 'r' || e.key === 'R') && !e.repeat) {
          loadNewText();
          showHint();
        } else if (e.key === '+' || e.key === '=') {
          adjustFont(FONT_STEP);
          showHint();
        } else if (e.key === '-' || e.key === '_') {
          adjustFont(-FONT_STEP);
          showHint();
        } else if (e.key === ']' || e.key === '}') {
          adjustShotSize(SHOT_MULT_STEP);
          showHint();
        } else if (e.key === '[' || e.key === '{') {
          adjustShotSize(1 / SHOT_MULT_STEP);
          showHint();
        } else if (e.key === 'ArrowRight') {
          adjustCols(1);
          showHint();
        } else if (e.key === 'ArrowLeft') {
          adjustCols(-1);
          showHint();
        } else if (e.key === 'ArrowUp') {
          adjustRows(1);
          showHint();
        } else if (e.key === 'ArrowDown') {
          adjustRows(-1);
          showHint();
        }
      });
      document.getElementById('hb-reset').addEventListener('click', () => {
        loadNewText();
        showHint();
      });
      document.getElementById('hb-dark').addEventListener('click', () => {
        Common.toggleDark();
        showHint();
      });
      document.getElementById('hb-bigger').addEventListener('click', () => {
        adjustFont(FONT_STEP);
        showHint();
      });
      document.getElementById('hb-smaller').addEventListener('click', () => {
        adjustFont(-FONT_STEP);
        showHint();
      });
      document.getElementById('hb-shot-bigger').addEventListener('click', () => {
        adjustShotSize(SHOT_MULT_STEP);
        showHint();
      });
      document.getElementById('hb-shot-smaller').addEventListener('click', () => {
        adjustShotSize(1 / SHOT_MULT_STEP);
        showHint();
      });
      document.getElementById('hb-cols-bigger').addEventListener('click', () => {
        adjustCols(1);
        showHint();
      });
      document.getElementById('hb-cols-smaller').addEventListener('click', () => {
        adjustCols(-1);
        showHint();
      });
      document.getElementById('hb-rows-bigger').addEventListener('click', () => {
        adjustRows(1);
        showHint();
      });
      document.getElementById('hb-rows-smaller').addEventListener('click', () => {
        adjustRows(-1);
        showHint();
      });
      const emojiBtn = document.getElementById('hb-emoji');
      emojiBtn.addEventListener('click', () => {
        emojiMode = !emojiMode;
        if (emojiMode) Common.ensureEmojis();
        emojiBtn.textContent = emojiMode ? 'emoji on' : 'emoji';
        showHint();
      });
      document.getElementById('hb-sitemap').addEventListener('click', Common.openSitemap);
      Common.initSitemapShortcut();

      let resizeTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resize, 150);
      });

      resize();
      loadNewText();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
