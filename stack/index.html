<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruvan / stack</title>
  <link rel="icon" id="favicon">
  <link rel="stylesheet" href="/common.css">
  <style>
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      cursor: pointer;
      user-select: none;
    }
    #stack {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 0.85;
    }
    #stack > div { white-space: pre; }
    #hint {
      position: fixed;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
      font-size: 12px;
      color: #888;
      opacity: 1;
      transition: opacity 0.4s ease;
      user-select: none;
      z-index: 3;
    }
    #hint.hidden { opacity: 0; pointer-events: none; }
    #hint .hint-btn {
      cursor: pointer;
      text-decoration: underline;
      text-decoration-style: dotted;
      text-underline-offset: 2px;
    }
    #hint .hint-btn:hover { color: #333; }
    body.dark #hint .hint-btn:hover { color: #ccc; }
    #hint-zone {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 60px;
      z-index: 2;
    }
  </style>
  <script src="/common.js"></script>
</head>
<body>
  <div id="stack"></div>
  <div id="hint">
    <div style="white-space:nowrap"><span class="hint-btn" id="hb-fi">↑</span>/<span class="hint-btn" id="hb-fd">↓</span> font size</div>
    <div style="white-space:nowrap"><span class="hint-btn" id="hb-font">click</span> font</div>
    <div style="white-space:nowrap"><span class="hint-btn" id="hb-mf">f</span> multi font</div>
    <div style="white-space:nowrap"><span class="hint-btn" id="hb-goog">g</span> google fonts</div>
    <div style="white-space:nowrap"><span class="hint-btn" id="hb-dark">1</span> dark</div>
    <div style="white-space:nowrap"><span class="hint-btn" id="hb-text"><span id="hb-text-label"></span></span> text</div>
  </div>
  <div id="hint-zone"></div>
  <script>
    Common.paintFaviconR();
    Common.initDarkMode();
    Common.initCursorHide();

    const stackEl = document.getElementById('stack');
    let fontSize = 40;
    let fallbackItems = null;
    let currentFont = null;
    let multiFont = false;
    function applySize() { stackEl.style.fontSize = fontSize + 'px'; }
    applySize();

    function render() {
      const items = Common.parseQueryItems().length ? Common.parseQueryItems() : fallbackItems;
      stackEl.innerHTML = '';
      if (!items || items.length === 0) return;
      stackEl.style.fontFamily = (!multiFont && currentFont) ? `'${currentFont}', serif` : '';
      const probe = document.createElement('div');
      probe.textContent = items[0];
      stackEl.appendChild(probe);
      const lineH = probe.getBoundingClientRect().height || parseFloat(getComputedStyle(stackEl).fontSize) * 1.1;
      stackEl.removeChild(probe);
      const rows = Math.max(1, Math.ceil(window.innerHeight / lineH));
      const fontPool = (multiFont && Common.loadedGoogleFonts && Common.loadedGoogleFonts.size > 0)
        ? [...Common.loadedGoogleFonts].sort(() => Math.random() - 0.5)
        : null;
      const frag = document.createDocumentFragment();
      for (let i = 0; i < rows; i++) {
        const d = document.createElement('div');
        d.textContent = items[i % items.length];
        if (fontPool) d.style.fontFamily = `'${fontPool[i % fontPool.length]}', serif`;
        frag.appendChild(d);
      }
      stackEl.appendChild(frag);
    }
    render();
    window.addEventListener('resize', render);

    if (Common.parseQueryItems().length === 0) {
      fetch('/words.txt').then(r => r.text()).then(t => {
        const list = t.split(/\s+/).filter(w => w.length > 0);
        if (list.length) {
          const word = list[Math.floor(Math.random() * list.length)];
          fallbackItems = [word];
          history.replaceState(null, '', location.pathname + '?' + encodeURIComponent(word) + location.hash);
          render();
          refreshTextLabel();
        }
      }).catch(() => {});
    }

    const cooldown = Common.makeCooldown(500);

    async function pickFont() {
      if (!window.googleFonts) return;
      cooldown(async () => {
        const font = Common.pickRandomGoogleFont();
        await Common.loadGoogleFont(font);
        currentFont = font;
        render();
      });
    }

    async function loadMultiFonts() {
      if (!window.googleFonts) return;
      const probe = document.createElement('div');
      probe.style.cssText = `position:absolute;visibility:hidden;white-space:pre;line-height:0.85;font-size:${fontSize}px`;
      probe.textContent = 'x';
      document.body.appendChild(probe);
      const lineH = probe.getBoundingClientRect().height || fontSize * 0.85;
      document.body.removeChild(probe);
      const rows = Math.max(1, Math.ceil(window.innerHeight / lineH));
      await Promise.all(Array.from({ length: rows }, () =>
        Common.loadGoogleFont(Common.pickRandomGoogleFont())
      ));
      render();
    }

    function toggleMultiFont() {
      multiFont = !multiFont;
      if (multiFont && (!Common.loadedGoogleFonts || Common.loadedGoogleFonts.size < 5)) {
        loadMultiFonts();
      } else {
        render();
      }
      showHint();
    }

    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      if ((e.key === 'g' || e.key === 'G') && !e.repeat && currentFont) {
        Common.openFontSpecimen(currentFont);
        return;
      }
      if ((e.key === 'f' || e.key === 'F') && !e.repeat) {
        toggleMultiFont();
        return;
      }
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        fontSize = Math.max(8, Math.min(512, fontSize + (e.key === 'ArrowUp' ? 4 : -4)));
        applySize();
        render();
      }
    });

    const hintEl = document.getElementById('hint');
    const hintZone = document.getElementById('hint-zone');
    let hintTimer = null;
    function showHint() {
      hintEl.classList.remove('hidden');
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => hintEl.classList.add('hidden'), 2500);
    }
    showHint();
    hintZone.addEventListener('mouseenter', showHint);
    hintZone.addEventListener('mousemove', showHint);
    hintZone.addEventListener('touchstart', showHint, { passive: true });
    hintZone.addEventListener('touchend', e => e.stopPropagation());
    hintEl.addEventListener('click', e => e.stopPropagation());
    hintEl.addEventListener('touchstart', () => clearTimeout(hintTimer), { passive: true });
    hintEl.addEventListener('touchend', e => { e.stopPropagation(); showHint(); });
    hintEl.addEventListener('mouseenter', () => { clearTimeout(hintTimer); hintEl.classList.remove('hidden'); });
    hintEl.addEventListener('mouseleave', showHint);

    document.getElementById('hb-fi').addEventListener('click', () => { fontSize = Math.max(8, Math.min(512, fontSize + 4)); applySize(); render(); showHint(); });
    document.getElementById('hb-fd').addEventListener('click', () => { fontSize = Math.max(8, Math.min(512, fontSize - 4)); applySize(); render(); showHint(); });
    document.getElementById('hb-font').addEventListener('click', pickFont);
    document.getElementById('hb-mf').addEventListener('click', toggleMultiFont);
    document.getElementById('hb-goog').addEventListener('click', () => { if (currentFont) Common.openFontSpecimen(currentFont); });
    document.getElementById('hb-dark').addEventListener('click', () => { Common.toggleDark(); showHint(); });

    const textEditor = Common.initTextEditor({
      buttonEl: document.getElementById('hb-text'),
      labelEl: document.getElementById('hb-text-label'),
      getItems: () => Common.parseQueryItems().length ? Common.parseQueryItems() : (fallbackItems || []),
      onCommit: render,
      onEditStart: () => clearTimeout(hintTimer),
      onEditEnd: showHint,
    });
    const refreshTextLabel = textEditor.refresh;

    Common.onTap(pickFont);

    Common.loadScript('/fonts.js').then(pickFont);
  </script>
</body>
</html>
