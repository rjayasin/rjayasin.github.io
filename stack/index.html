<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruvan / stack</title>
  <link rel="icon" id="favicon">
  <link rel="stylesheet" href="/common.css">
  <style>
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      cursor: pointer;
      user-select: none;
    }
    #stack {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 0.85;
    }
    #stack > div { white-space: pre; }
  </style>
  <script src="/common.js"></script>
</head>
<body>
  <div id="stack"></div>
  <script>
    Common.paintFaviconR();
    Common.initDarkMode();
    Common.initCursorHide();

    const stackEl = document.getElementById('stack');
    let fontSize = 40;
    let fallbackItems = null;
    function applySize() { stackEl.style.fontSize = fontSize + 'px'; }
    applySize();

    function render() {
      const items = Common.parseQueryItems().length ? Common.parseQueryItems() : fallbackItems;
      stackEl.innerHTML = '';
      if (!items || items.length === 0) return;
      const probe = document.createElement('div');
      probe.textContent = items[0];
      stackEl.appendChild(probe);
      const lineH = probe.getBoundingClientRect().height || parseFloat(getComputedStyle(stackEl).fontSize) * 1.1;
      stackEl.removeChild(probe);
      const rows = Math.max(1, Math.ceil(window.innerHeight / lineH));
      const frag = document.createDocumentFragment();
      for (let i = 0; i < rows; i++) {
        const d = document.createElement('div');
        d.textContent = items[i % items.length];
        frag.appendChild(d);
      }
      stackEl.appendChild(frag);
    }
    render();
    window.addEventListener('resize', render);

    if (Common.parseQueryItems().length === 0) {
      fetch('/words.txt').then(r => r.text()).then(t => {
        const list = t.split(/\s+/).filter(w => w.length > 0);
        if (list.length) {
          fallbackItems = [list[Math.floor(Math.random() * list.length)]];
          render();
        }
      }).catch(() => {});
    }

    let currentFont = null;
    const cooldown = Common.makeCooldown(500);

    async function pickFont() {
      if (!window.googleFonts) return;
      cooldown(async () => {
        const font = Common.pickRandomGoogleFont();
        await Common.loadGoogleFont(font);
        currentFont = font;
        stackEl.style.fontFamily = `'${font}', serif`;
        render();
      });
    }

    document.addEventListener('keydown', e => {
      if ((e.key === 'g' || e.key === 'G') && !e.repeat && currentFont) {
        Common.openFontSpecimen(currentFont);
        return;
      }
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        fontSize = Math.max(8, Math.min(512, fontSize + (e.key === 'ArrowUp' ? 4 : -4)));
        applySize();
        render();
      }
    });

    Common.onTap(pickFont);

    Common.loadScript('/fonts.js').then(pickFont);
  </script>
</body>
</html>
