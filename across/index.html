<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruvan / across</title>
    <link rel="icon" id="favicon" />
    <link rel="stylesheet" href="/common.css" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        /* iOS needs the prefixed property (pre-18.2) and callout suppression,
           or dragging over text starts a selection and stalls scrubbing. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
      }
      #stage {
        position: relative;
      }
      #alphabet {
        position: absolute;
        left: 0;
        display: flex;
      }
      body.vert #alphabet {
        flex-direction: column;
      }
      .cell {
        text-align: center;
        font-weight: 600;
      }
      #alphabet .cell {
        color: #bbb;
      }
      body.dark #alphabet .cell {
        color: #555;
      }
      #word {
        position: absolute;
        left: 0;
        top: 0;
      }
      .word {
        position: absolute;
      }
      .word .cell {
        display: block;
      }
      body.vert .word {
        display: flex;
      }
      /* Selected letter (alphabet cell + the word's crossing letter):
         always grey, with a thin contrasting stroke. */
      #alphabet .cell.sel,
      .word .cell.cross {
        color: #bbb;
        -webkit-text-stroke: 1px #000;
        paint-order: stroke fill;
      }
      body.dark #alphabet .cell.sel,
      body.dark .word .cell.cross {
        color: #bbb;
        -webkit-text-stroke-color: #fff;
      }
      /* Single-line hint bar; pans horizontally when it overflows. Auto
         margins centre the pill yet keep the left edge reachable. */
      #hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 12px;
        display: flex;
        overflow-x: auto;
        scrollbar-width: none;
        touch-action: pan-x;
        overscroll-behavior-x: contain;
        -webkit-overflow-scrolling: touch;
        font-size: 12px;
        color: #888;
        opacity: 1;
        transition: opacity 0.4s ease;
        user-select: none;
        z-index: 3;
      }
      #hint::-webkit-scrollbar {
        display: none;
      }
      #hint::before,
      #hint::after {
        content: '';
        flex: 0 0 8px;
      }
      #hint-inner {
        flex: 0 0 auto;
        margin: 0 auto;
        white-space: nowrap;
        padding: 6px 10px;
        border-radius: 6px;
        background: #ffffff;
      }
      body.dark #hint-inner {
        background: #111111;
      }
      #hint.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #hint .hint-btn {
        cursor: pointer;
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 2px;
      }
      #hint .hint-btn:hover {
        color: #333;
      }
      body.dark #hint .hint-btn:hover {
        color: #ccc;
      }
      #hint-zone {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 60px;
        z-index: 2;
      }
    </style>
    <script src="/common.js"></script>
  </head>
  <body class="vert">
    <div id="stage">
      <div id="alphabet"></div>
      <div id="word"></div>
    </div>
    <div id="hint">
      <span id="hint-inner"
        ><span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-left">←</span>/<span class="hint-btn" id="hb-right"
            >→</span
          >
          letters</span
        >
        ·
        <span style="white-space: nowrap"><span class="hint-btn" id="hb-flip">a flip</span></span>
        ·
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-persist"
            >p persist <span class="hb-persist-label">off</span></span
          ></span
        >
        ·
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-wik">w wiktionary</span></span
        >
        ·
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-explore">e explorer</span></span
        >
        ·
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-etym">y etymology</span></span
        >
        ·
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-dark"
            >1 <span class="hb-dark-label">dark</span></span
          ></span
        >
        ·
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-sitemap">s sitemap</span></span
        ></span
      >
    </div>
    <div id="hint-zone"></div>
    <script>
      Common.paintFaviconR();
      Common.initDarkMode();
      Common.initCursorHide();

      const LETTERS = 'abcdefghijklmnopqrstuvwxyz'.split('');
      // Spacing as a fraction of font size: tight horizontal advance (monospace
      // glyphs are ~0.6em wide) and slightly condensed vertical line pitch.
      const COL = 0.62;
      const ROW = 0.9;
      // Nominal cross-axis cells used only to keep the font a sensible size; the
      // word can be any length and is shrunk per-word to fit (see wordFont).
      const VNOM = 13;
      // Small breathing room kept at the run-axis edges when shrinking a word.
      const MARGIN = 8;

      const stageEl = document.getElementById('stage');
      const alphabetEl = document.getElementById('alphabet');
      const wordEl = document.getElementById('word');

      let index = -1; // -1 = no word shown yet
      let vertical = true; // true: alphabet vertical / word runs across (the default)
      let cellW = 0;
      let cellH = 0;
      let fontSize = 0;

      function layout() {
        const maxFont = window.innerWidth < 640 ? 30 : 56;
        // The alphabet's 26 cells run along the main axis; the word runs along
        // the cross axis (sized by VNOM so the font stays reasonable).
        let byMain, byCross;
        if (vertical) {
          byMain = (window.innerHeight - 16) / (26 * ROW); // 26 letters down
          byCross = (window.innerWidth - 32) / (VNOM * COL); // word across
        } else {
          byMain = (window.innerWidth - 16) / (26 * COL); // 26 letters across
          byCross = (window.innerHeight - 90) / (VNOM * ROW); // word down
        }
        fontSize = Math.max(10, Math.floor(Math.min(maxFont, byMain, byCross)));
        cellW = fontSize * COL;
        cellH = fontSize * ROW;
        // The stage is just the alphabet (a row or a column); body flex centres
        // it. The word is positioned relative to it and may extend beyond it.
        stageEl.style.width = (vertical ? cellW : cellW * 26) + 'px';
        stageEl.style.height = (vertical ? cellH * 26 : cellH) + 'px';
        for (const c of alphabetEl.children) sizeCell(c);
        renderWords();
      }

      function sizeCell(el) {
        el.style.width = cellW + 'px';
        el.style.height = cellH + 'px';
        el.style.lineHeight = cellH + 'px';
        el.style.fontSize = fontSize + 'px';
      }

      // Size a word cell at an arbitrary font (independent of the alphabet).
      function sizeWordCell(el, f) {
        el.style.width = f * COL + 'px';
        el.style.height = f * ROW + 'px';
        el.style.lineHeight = f * ROW + 'px';
        el.style.fontSize = f + 'px';
      }

      // The crossing letter sits at the run axis's viewport centre, so the word
      // reaches pos+0.5 cells one way and length-pos-0.5 cells the other. Pick
      // the largest font (never above the alphabet's) that keeps both ends on
      // screen with a small margin; long words therefore shrink to fit while the
      // alphabet letter underneath stays at its full size.
      function wordFont(word, pos) {
        const cellsBefore = pos + 0.5;
        const cellsAfter = word.length - pos - 0.5;
        let before, after, factor;
        if (vertical) {
          // Word runs across: centre is innerWidth/2, symmetric margins.
          before = window.innerWidth / 2 - MARGIN;
          after = window.innerWidth / 2 - MARGIN;
          factor = COL;
        } else {
          // Word runs down: centre is innerHeight/2; leave room for the hint bar.
          before = window.innerHeight / 2 - MARGIN;
          after = window.innerHeight / 2 - 60;
          factor = ROW;
        }
        const advance = Math.min(before / cellsBefore, after / cellsAfter);
        return Math.max(6, Math.min(fontSize, Math.floor(advance / factor)));
      }

      function buildAlphabet() {
        const frag = document.createDocumentFragment();
        for (const ch of LETTERS) {
          const span = document.createElement('span');
          span.className = 'cell';
          span.textContent = ch;
          sizeCell(span);
          frag.appendChild(span);
        }
        alphabetEl.textContent = '';
        alphabetEl.appendChild(frag);
      }

      // Datamuse returns words *containing* the given letter, ranked by
      // frequency. One query per letter; results are cached (as promises so a
      // letter is only fetched once). Prefetched on load to keep switching snappy.
      const cache = {};
      function wordsFor(letter) {
        if (!cache[letter]) {
          cache[letter] = fetch(`https://api.datamuse.com/words?sp=*${letter}*&max=1000`)
            .then((r) => r.json())
            .then((arr) => arr.map((o) => o.word).filter((w) => /^[a-z]+$/.test(w)))
            .catch(() => []);
        }
        return cache[letter];
      }

      // Choose a random occurrence of `letter` in `word` as the intersection.
      function pickIntersection(word, letter) {
        const spots = [];
        for (let i = 0; i < word.length; i++) {
          if (word[i] === letter) spots.push(i);
        }
        return spots[Math.floor(Math.random() * spots.length)];
      }

      // Word(s) currently on screen, keyed by alphabet index → { word, pos }.
      // Without persistence only the current letter ever has an entry; with it,
      // every visited letter keeps its crossing word so they accumulate.
      let words = {};
      let persist = false; // hint-bar toggle: keep perpendicular words around

      function renderWords() {
        wordEl.textContent = '';
        for (const c of alphabetEl.children) c.classList.remove('sel');
        // Mark the selected letter even before its word arrives.
        if (index >= 0) alphabetEl.children[index].classList.add('sel');
        const frag = document.createDocumentFragment();
        for (const key in words) {
          const i = +key;
          const entry = words[i];
          if (!entry) continue;
          const isCurrent = i === index;
          const { word, pos } = entry;
          // Per-word font: full size when it fits, smaller when the word would
          // otherwise run off the run axis. The crossing cell is then centred on
          // the (full-size) alphabet letter it sits over.
          const wFont = wordFont(word, pos);
          const wCol = wFont * COL;
          const wRow = wFont * ROW;
          const wEl = document.createElement('div');
          wEl.className = 'word';
          if (vertical) {
            wEl.style.left = cellW / 2 - (pos + 0.5) * wCol + 'px';
            wEl.style.top = i * cellH + cellH / 2 - wRow / 2 + 'px';
          } else {
            wEl.style.left = i * cellW + cellW / 2 - wCol / 2 + 'px';
            wEl.style.top = cellH / 2 - (pos + 0.5) * wRow + 'px';
          }
          for (let j = 0; j < word.length; j++) {
            const span = document.createElement('span');
            span.className = 'cell';
            // Grey the crossing letter of the current word so the alphabet
            // letter it sits over reads as still-grey, not black.
            if (isCurrent && j === pos) span.classList.add('cross');
            span.textContent = word[j];
            sizeWordCell(span, wFont);
            wEl.appendChild(span);
          }
          frag.appendChild(wEl);
        }
        wordEl.appendChild(frag);
      }

      // Each letter's word is assigned once and sticks across revisits; the
      // whole set only resets after a full lap — reaching z and then coming
      // back to a — at which point every letter draws fresh.
      let assigned = {};
      let reachedZ = false;

      let seq = 0; // guards against a slow fetch landing after a newer move
      async function ensureWord() {
        if (index < 0) return;
        const my = ++seq;
        const target = index;
        if (assigned[target]) {
          words[target] = assigned[target];
          renderWords();
          return;
        }
        const letter = LETTERS[target];
        const list = await wordsFor(letter);
        if (my !== seq || index !== target || !list.length) return;
        const word = list[Math.floor(Math.random() * list.length)];
        assigned[target] = { word, pos: pickIntersection(word, letter) };
        words[target] = assigned[target];
        renderWords();
      }

      // Move to `next`. Without persistence the previous word is dropped; with
      // it the words for other letters stay on screen. Either way a letter
      // keeps its assigned word until an a→z→a cycle completes.
      function moveTo(next) {
        if (next === index) return;
        index = next;
        if (index === 25) {
          reachedZ = true;
        } else if (index === 0 && reachedZ) {
          // Full cycle done: drop all assignments so each letter (starting
          // with this fresh visit to a) picks a new word.
          assigned = {};
          reachedZ = false;
          if (persist) words = {};
        }
        if (!persist) words = {};
        seq++; // invalidate any in-flight pick
        renderWords();
        ensureWord();
      }

      function goTo(target) {
        moveTo(Math.max(0, Math.min(25, target)));
      }

      function go(delta) {
        moveTo(Math.max(-1, Math.min(25, index + delta)));
      }

      function togglePersist() {
        persist = !persist;
        const label = document.querySelector('.hb-persist-label');
        if (label) label.textContent = persist ? 'on' : 'off';
        if (!persist) {
          // Collapse back to just the current letter's word.
          const keep = words[index];
          words = {};
          if (keep) words[index] = keep;
          renderWords();
        }
      }

      // Hint arrows track the alphabet's axis: ↑/↓ when vertical, ←/→ when
      // horizontal. The buttons always mean previous (left) / next (right).
      function updateHintArrows() {
        document.getElementById('hb-left').textContent = vertical ? '↑' : '←';
        document.getElementById('hb-right').textContent = vertical ? '↓' : '→';
      }

      function flip() {
        vertical = !vertical;
        document.body.classList.toggle('vert', vertical);
        updateHintArrows();
        layout();
      }

      // Open the current word in a new tab at the given URL prefix (the word is
      // appended, encoded). No-op until a word is on screen.
      function openCurrent(prefix) {
        const entry = words[index];
        if (!entry) return;
        window.open(prefix + encodeURIComponent(entry.word), '_blank', 'noopener');
      }

      function openWord() {
        openCurrent('https://en.wiktionary.org/wiki/');
      }

      function openExplorer() {
        openCurrent('/explorer/?');
      }

      function openEtymology() {
        openCurrent('/etymology/?');
      }

      buildAlphabet();
      layout();
      window.addEventListener('resize', layout);

      // Warm the cache for every letter so switching is instant after load.
      LETTERS.forEach(wordsFor);

      document.addEventListener('keydown', (e) => {
        const t = e.target;
        if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
        // The alphabet's axis follows the orientation, so up/down drive it
        // when vertical and left/right when horizontal; left/right also stay
        // live in vertical mode so existing muscle memory keeps working.
        if (e.key === 'ArrowRight' || (vertical && e.key === 'ArrowDown')) {
          e.preventDefault();
          go(1);
        } else if (e.key === 'ArrowLeft' || (vertical && e.key === 'ArrowUp')) {
          e.preventDefault();
          go(-1);
        } else if (e.key === 'w' || e.key === 'W') {
          openWord();
        } else if (e.key === 'e' || e.key === 'E') {
          openExplorer();
        } else if (e.key === 'y' || e.key === 'Y') {
          openEtymology();
        } else if (e.key === 'a' || e.key === 'A') {
          flip();
        } else if (e.key === 'p' || e.key === 'P') {
          togglePersist();
        }
      });

      // Touch scrubbing: while the finger is held down, dragging along the
      // alphabet's main axis continuously switches the perpendicular word. The
      // axis follows the orientation — left/right when the alphabet is
      // horizontal, up/down when it's vertical. Each cell-width of travel from
      // the touch's starting point advances one letter, so the word keeps
      // changing as long as the finger keeps moving.
      let dragStartX = null;
      let dragStartY = null;
      let dragBaseIndex = 0;
      document.addEventListener(
        'touchstart',
        (e) => {
          if (e.touches.length !== 1) return;
          dragStartX = e.touches[0].clientX;
          dragStartY = e.touches[0].clientY;
          dragBaseIndex = index < 0 ? 0 : index;
        },
        { passive: true }
      );
      document.addEventListener(
        'touchmove',
        (e) => {
          if (dragStartX === null || e.touches.length !== 1) return;
          const dx = e.touches[0].clientX - dragStartX;
          const dy = e.touches[0].clientY - dragStartY;
          // Travel along the main axis; one letter per cell-step (clamped so a
          // tiny alphabet still needs a deliberate drag).
          const delta = vertical ? dy : dx;
          const step = Math.max(20, vertical ? cellH : cellW);
          goTo(dragBaseIndex + Math.round(delta / step));
        },
        { passive: true }
      );
      document.addEventListener(
        'touchend',
        () => {
          dragStartX = null;
          dragStartY = null;
        },
        { passive: true }
      );

      const hintEl = document.getElementById('hint');
      // Keep hint-bar panning from scrubbing the alphabet.
      hintEl.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
      hintEl.addEventListener('touchmove', (e) => e.stopPropagation(), { passive: true });
      const { show: showHint } = Common.initHintBar({
        hintEl,
        hintZoneEl: document.getElementById('hint-zone'),
      });
      document.getElementById('hb-left').addEventListener('click', () => {
        go(-1);
        showHint();
      });
      document.getElementById('hb-right').addEventListener('click', () => {
        go(1);
        showHint();
      });
      document.getElementById('hb-flip').addEventListener('click', () => {
        flip();
        showHint();
      });
      document.getElementById('hb-persist').addEventListener('click', () => {
        togglePersist();
        showHint();
      });
      document.getElementById('hb-wik').addEventListener('click', () => {
        openWord();
        showHint();
      });
      document.getElementById('hb-explore').addEventListener('click', () => {
        openExplorer();
        showHint();
      });
      document.getElementById('hb-etym').addEventListener('click', () => {
        openEtymology();
        showHint();
      });
      document.getElementById('hb-dark').addEventListener('click', () => {
        Common.toggleDark();
        showHint();
      });
      document.getElementById('hb-sitemap').addEventListener('click', Common.openSitemap);
      Common.initSitemapShortcut();
      updateHintArrows();
    </script>
  </body>
</html>
