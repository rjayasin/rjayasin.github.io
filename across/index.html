<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruvan / across</title>
    <link rel="icon" id="favicon" />
    <link rel="stylesheet" href="/common.css" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        touch-action: none;
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
      }
      #stage {
        position: relative;
      }
      #alphabet {
        position: absolute;
        left: 0;
        display: flex;
      }
      .cell {
        text-align: center;
        font-weight: 600;
      }
      #alphabet .cell {
        color: #bbb;
      }
      body.dark #alphabet .cell {
        color: #555;
      }
      #alphabet .cell.on {
        color: inherit;
      }
      #word {
        position: absolute;
        display: block;
      }
      #word .cell {
        display: block;
      }
      #hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 12px;
        text-align: center;
        font-size: 12px;
        color: #888;
        opacity: 1;
        transition: opacity 0.4s ease;
        user-select: none;
        z-index: 3;
      }
      #hint-inner {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 6px;
        background: #ffffff;
      }
      body.dark #hint-inner {
        background: #111111;
      }
      #hint.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #hint .hint-btn {
        cursor: pointer;
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 2px;
      }
      #hint .hint-btn:hover {
        color: #333;
      }
      body.dark #hint .hint-btn:hover {
        color: #ccc;
      }
      #hint-zone {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 60px;
        z-index: 2;
      }
    </style>
    <script src="/common.js"></script>
  </head>
  <body>
    <div id="stage">
      <div id="alphabet"></div>
      <div id="word"></div>
    </div>
    <div id="hint">
      <span id="hint-inner"
        ><span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-left">←</span>/<span class="hint-btn" id="hb-right"
            >→</span
          >
          letters</span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-wik">w wiktionary</span></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-dark"
            >1 <span class="hb-dark-label">dark</span></span
          ></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-sitemap">s sitemap</span></span
        ></span
      >
    </div>
    <div id="hint-zone"></div>
    <script>
      Common.paintFaviconR();
      Common.initDarkMode();
      Common.initCursorHide();

      const LETTERS = 'abcdefghijklmnopqrstuvwxyz'.split('');
      // Spacing as a fraction of font size: tight horizontal advance (monospace
      // glyphs are ~0.6em wide) and slightly condensed vertical line pitch.
      const COL = 0.62;
      const ROW = 0.9;
      // Nominal vertical rows used only to keep the font a sensible size; words
      // can be any length and simply extend past the viewport if longer.
      const VROWS = 13;

      const stageEl = document.getElementById('stage');
      const alphabetEl = document.getElementById('alphabet');
      const wordEl = document.getElementById('word');

      let words = null;
      let index = -1; // -1 = no word shown yet
      let cellW = 0;
      let cellH = 0;
      let fontSize = 0;

      function layout() {
        const maxFont = window.innerWidth < 640 ? 30 : 56;
        const byWidth = (window.innerWidth - 16) / (26 * COL);
        const byHeight = (window.innerHeight - 90) / (VROWS * ROW);
        fontSize = Math.max(10, Math.floor(Math.min(maxFont, byWidth, byHeight)));
        cellW = fontSize * COL;
        cellH = fontSize * ROW;
        // The stage is just the alphabet row; body flex centres it. The vertical
        // word is positioned relative to it and may extend above/below.
        stageEl.style.width = cellW * 26 + 'px';
        stageEl.style.height = cellH + 'px';
        for (const c of alphabetEl.children) sizeCell(c);
        renderWord();
      }

      function sizeCell(el) {
        el.style.width = cellW + 'px';
        el.style.height = cellH + 'px';
        el.style.lineHeight = cellH + 'px';
        el.style.fontSize = fontSize + 'px';
      }

      function buildAlphabet() {
        const frag = document.createDocumentFragment();
        for (const ch of LETTERS) {
          const span = document.createElement('span');
          span.className = 'cell';
          span.textContent = ch;
          sizeCell(span);
          frag.appendChild(span);
        }
        alphabetEl.textContent = '';
        alphabetEl.appendChild(frag);
      }

      function pickWord(letter) {
        const pool = words.filter((w) => w.includes(letter));
        return pool[Math.floor(Math.random() * pool.length)];
      }

      // Choose a random occurrence of `letter` in `word` as the intersection.
      function pickIntersection(word, letter) {
        const spots = [];
        for (let i = 0; i < word.length; i++) {
          if (word[i] === letter) spots.push(i);
        }
        return spots[Math.floor(Math.random() * spots.length)];
      }

      let current = null; // { word, pos } so resize re-renders the same word

      function renderWord() {
        wordEl.textContent = '';
        for (const c of alphabetEl.children) c.classList.remove('on');
        if (index < 0 || !words) return;

        const letter = LETTERS[index];
        if (!current) {
          const word = pickWord(letter);
          current = { word, pos: pickIntersection(word, letter) };
        }
        const { word, pos } = current;

        alphabetEl.children[index].classList.add('on');
        wordEl.style.left = index * cellW + 'px';
        wordEl.style.top = -pos * cellH + 'px';
        const frag = document.createDocumentFragment();
        for (let i = 0; i < word.length; i++) {
          const span = document.createElement('span');
          span.className = 'cell';
          span.textContent = word[i];
          sizeCell(span);
          frag.appendChild(span);
        }
        wordEl.appendChild(frag);
      }

      function go(delta) {
        if (!words) return;
        const next = Math.max(-1, Math.min(25, index + delta));
        if (next === index) return;
        index = next;
        current = null;
        renderWord();
      }

      function openWord() {
        if (!current) return;
        window.open(
          'https://en.wiktionary.org/wiki/' + encodeURIComponent(current.word),
          '_blank',
          'noopener'
        );
      }

      buildAlphabet();
      layout();
      window.addEventListener('resize', layout);

      // Pull random words from the API. A single large batch reliably covers
      // every letter (rare ones like q included); loop a couple more times only
      // if some letter is still missing.
      const API = 'https://random-word-api.herokuapp.com/word?number=2500';
      function missingLetter(pool) {
        return LETTERS.some((c) => !pool.some((w) => w.includes(c)));
      }
      async function loadWords() {
        const pool = [];
        for (let tries = 0; tries < 4; tries++) {
          try {
            const batch = await fetch(API).then((r) => r.json());
            for (const w of batch) {
              const lw = String(w).toLowerCase();
              if (/^[a-z]+$/.test(lw)) pool.push(lw);
            }
          } catch {
            break;
          }
          if (pool.length && !missingLetter(pool)) break;
        }
        if (pool.length) {
          words = pool;
          if (index >= 0) {
            current = null;
            renderWord();
          }
        }
      }
      loadWords();

      document.addEventListener('keydown', (e) => {
        const t = e.target;
        if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          go(1);
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          go(-1);
        } else if (e.key === 'w' || e.key === 'W') {
          openWord();
        }
      });

      let touchX = null;
      let touchY = null;
      document.addEventListener(
        'touchstart',
        (e) => {
          if (e.touches.length !== 1) return;
          touchX = e.touches[0].clientX;
          touchY = e.touches[0].clientY;
        },
        { passive: true }
      );
      document.addEventListener(
        'touchend',
        (e) => {
          if (touchX === null) return;
          const dx = e.changedTouches[0].clientX - touchX;
          const dy = e.changedTouches[0].clientY - touchY;
          touchX = null;
          if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
            go(dx > 0 ? 1 : -1);
          }
        },
        { passive: true }
      );

      const { show: showHint } = Common.initHintBar({
        hintEl: document.getElementById('hint'),
        hintZoneEl: document.getElementById('hint-zone'),
      });
      document.getElementById('hb-left').addEventListener('click', () => {
        go(-1);
        showHint();
      });
      document.getElementById('hb-right').addEventListener('click', () => {
        go(1);
        showHint();
      });
      document.getElementById('hb-wik').addEventListener('click', () => {
        openWord();
        showHint();
      });
      document.getElementById('hb-dark').addEventListener('click', () => {
        Common.toggleDark();
        showHint();
      });
      document.getElementById('hb-sitemap').addEventListener('click', Common.openSitemap);
      Common.initSitemapShortcut();
    </script>
  </body>
</html>
