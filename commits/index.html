<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruvan / commits</title>
    <link rel="stylesheet" href="/common.css" />
    <style>
      body {
        font-family: monospace;
        font-size: 13px;
        line-height: 1.6;
        padding: 48px 32px;
        max-width: 720px;
      }
      .day,
      .top-bar,
      .day:last-child .commits:last-child,
      header a,
      .commit a,
      .repo,
      .top-repo {
        transition:
          background-color 0.2s ease,
          color 0.2s ease,
          border-color 0.2s ease;
      }
      header {
        margin-bottom: 15px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
      }
      header a {
        color: #000;
        text-decoration: none;
      }
      header a:hover {
        text-decoration: underline;
      }
      h1 {
        font-size: 13px;
        font-weight: normal;
        letter-spacing: 0.05em;
      }
      .subtitle {
        color: #888;
        margin-top: 4px;
      }
      .log {
        display: flex;
        flex-direction: column;
        width: 100%;
      }
      .day {
        display: flex;
        flex-direction: column;
        border-top: 1px solid #ccc;
      }
      .top-bar + .day {
        border-top: none;
      }
      .day:last-child .commits:last-child {
        border-bottom: 1px solid #f0f0f0;
      }
      .top-bar {
        position: sticky;
        top: 0;
        background: #fff;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 24px;
        padding: 10px 0 4px;
        z-index: 2;
      }
      .top-bar[hidden] {
        display: none;
      }
      .top-repo {
        color: #888;
        font-size: 11px;
        text-decoration: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .top-repo:hover {
        color: #000;
      }
      .top-date {
        color: #888;
        font-size: 11px;
        white-space: nowrap;
        padding-top: 1px;
      }
      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 24px;
        padding: 8px 0 2px;
      }
      .repo {
        color: #888;
        font-size: 11px;
        text-decoration: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .repo:hover {
        color: #000;
      }
      .section-header .date {
        color: #888;
        font-size: 11px;
        white-space: nowrap;
      }
      .commits {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding-top: 0;
        padding-bottom: 8px;
      }
      .commit {
        display: grid;
        grid-template-columns: 8ch 1fr;
        column-gap: 12px;
      }
      @media (max-width: 640px) {
        body {
          font-size: 15px;
          padding: 32px 20px;
        }
        .repo,
        .top-repo,
        .top-date,
        .section-header .date {
          font-size: 12px;
        }
        h1 {
          font-size: 15px;
        }
        .commit {
          font-size: 13px;
        }
      }
      .time {
        color: #888;
      }
      .commit a {
        color: #000;
        text-decoration: none;
      }
      .commit a:hover {
        text-decoration: underline;
      }
      #status {
        color: #888;
        padding: 8px 0;
      }
      #gh-auth {
        flex-shrink: 0;
        width: 20px;
        height: 20px;
        padding: 0;
        border: none;
        background: none;
        cursor: pointer;
        color: #888;
        opacity: 0.7;
        transition:
          opacity 0.15s,
          color 0.15s;
      }
      #gh-auth:hover {
        opacity: 1;
        color: #000;
      }
      #gh-auth.authed {
        color: #000;
        opacity: 1;
      }
      #gh-auth svg {
        width: 100%;
        height: 100%;
        display: block;
        fill: currentColor;
      }
      body.dark header a,
      body.dark .commit a,
      body.dark .repo:hover,
      body.dark #gh-auth:hover,
      body.dark #gh-auth.authed {
        color: #fff;
      }
      body.dark .day {
        border-top-color: #333;
      }
      body.dark .day:last-child .commits:last-child {
        border-bottom-color: #1a1a1a;
      }
      body.dark .top-bar {
        background: #111;
      }
      body.dark .top-repo:hover {
        color: #fff;
      }
      body.dark .repo {
        color: #888;
      }
      .activity {
        margin: 0 0 20px;
      }
      .activity-toggle {
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        font: inherit;
        color: #888;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .activity-toggle:hover {
        color: #000;
      }
      .activity-toggle .caret {
        display: inline-block;
        font-size: 9px;
        transition: transform 0.15s ease;
      }
      .activity-toggle[aria-expanded='true'] .caret {
        transform: rotate(90deg);
      }
      .activity-body {
        padding-top: 12px;
        overflow-x: auto;
      }
      .activity-body[hidden] {
        display: none;
      }
      .activity svg text {
        fill: #888;
        font-size: 9px;
        font-family: monospace;
      }
      .activity .cell {
        stroke: rgba(27, 31, 35, 0.06);
        stroke-width: 1px;
      }
      .hm-legend {
        display: flex;
        align-items: center;
        gap: 6px;
        justify-content: flex-end;
        color: #888;
        font-size: 11px;
        margin-top: 8px;
      }
      body.dark .activity-toggle:hover {
        color: #fff;
      }
      .activity .cell {
        cursor: pointer;
      }
      .hm-popover {
        position: fixed;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 6px 8px;
        font-size: 11px;
        line-height: 1.4;
        white-space: nowrap;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        pointer-events: none;
        z-index: 10;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.15s ease,
          visibility 0.15s ease;
      }
      .hm-popover.visible {
        opacity: 1;
        visibility: visible;
      }
      /* downward triangle on the bottom edge, pointing at the cell */
      .hm-popover::before,
      .hm-popover::after {
        content: '';
        position: absolute;
        top: 100%;
        left: 50%;
        width: 0;
        height: 0;
        border: 6px solid transparent;
      }
      .hm-popover::before {
        margin-left: -6px;
        border-top-color: #ccc;
      }
      .hm-popover::after {
        margin-left: -5px;
        border-width: 5px;
        border-top-color: #fff;
      }
      .hm-popover .pop-dow {
        font-weight: bold;
        color: #000;
      }
      .hm-popover .pop-meta {
        color: #888;
      }
      body.dark .hm-popover {
        background: #222;
        border-color: #444;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }
      body.dark .hm-popover::before {
        border-top-color: #444;
      }
      body.dark .hm-popover::after {
        border-top-color: #222;
      }
      body.dark .hm-popover .pop-dow {
        color: #fff;
      }
    </style>
    <script src="/common.js"></script>
  </head>
  <body>
    <header>
      <div>
        <h1><a href="/">Ruvan</a> / commits</h1>
        <p class="subtitle" id="range"></p>
      </div>
      <button id="gh-auth" type="button" aria-label="Log in with GitHub" title="Log in with GitHub">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path
            fill-rule="evenodd"
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
          />
        </svg>
      </button>
    </header>
    <div class="activity" id="activity">
      <button
        class="activity-toggle"
        id="activity-toggle"
        type="button"
        aria-expanded="false"
        aria-label="Toggle commit graph"
      >
        <span class="caret">▸</span><span id="activity-label">📊</span>
      </button>
      <div class="activity-body" id="activity-body" hidden>
        <div id="heatmap"></div>
        <div class="hm-legend" id="hm-legend"></div>
      </div>
    </div>
    <div class="log" id="log">
      <div class="top-bar" id="top-bar" hidden>
        <!-- [html-validate-disable-next attribute-misuse: href is filled in by JS] -->
        <a class="top-repo" id="top-repo" target="_blank" rel="noopener"></a>
        <span class="top-date" id="top-date"></span>
      </div>
    </div>
    <p id="status">loading…</p>
    <div id="sentinel"></div>
    <script>
      (function () {
        const svg =
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="16" height="16" rx="3" fill="#2ea44f"/><text x="8" y="8" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#fff">R</text></svg>';
        Common.setFaviconHref('data:image/svg+xml,' + encodeURIComponent(svg));
      })();

      Common.initDarkMode();

      const USER = 'rjayasin';
      const BOT_REPO = 'rjayasin/rjayasin.github.io';
      const BOT_AUTHOR = '41898282+github-actions[bot]@users.noreply.github.com';
      const log = document.getElementById('log');
      const status = document.getElementById('status');
      const range = document.getElementById('range');
      const sentinel = document.getElementById('sentinel');
      const authBtn = document.getElementById('gh-auth');
      const topBar = document.getElementById('top-bar');
      const topRepo = document.getElementById('top-repo');
      const topDate = document.getElementById('top-date');

      function getToken() {
        return Common.GH.getToken();
      }

      // "Sign in with GitHub" (private repos need an authed token). Signing in
      // navigates to GitHub and back; the redirect is finished by authReady
      // below before the first fetch runs. Signing out reloads to drop back to
      // the public view.
      const auth = Common.GH.initAuthButton({
        buttonEl: authBtn,
        signedInTitle: 'Signed in to GitHub (click to sign out)',
        signedOutTitle: 'Sign in with GitHub to include private repos',
        onChange: () => location.reload(),
      });

      // Completes the OAuth redirect (if any) before commits are fetched, so
      // the first request already carries the token. Resolves immediately on a
      // normal load.
      const authReady = Common.GH.handleRedirect();
      authReady.then((signedIn) => {
        if (signedIn) auth.refresh();
      });

      let nextPage = 1;
      let loading = false;
      let exhausted = false;
      let currentDay = null;
      let currentDayRepos = null;
      let currentDayContainer = null;
      let hasFirstSection = false;
      let total = 0;
      let botCommits = [];
      let botCommitsAll = [];

      async function fetchBotCommits() {
        await authReady;
        const headers = { Accept: 'application/vnd.github+json' };
        const token = getToken();
        if (token) headers.Authorization = `Bearer ${token}`;
        const out = [];
        for (let page = 1; page <= 10; page++) {
          const r = await fetch(
            `https://api.github.com/repos/${BOT_REPO}/commits?author=${encodeURIComponent(BOT_AUTHOR)}&per_page=100&page=${page}`,
            { headers }
          );
          if (!r.ok) break;
          const items = await r.json();
          if (!items.length) break;
          for (const c of items) {
            out.push({
              commit: {
                committer: { date: c.commit.committer.date },
                message: c.commit.message,
              },
              repository: { full_name: BOT_REPO },
              html_url: c.html_url,
            });
          }
          if (items.length < 100) break;
        }
        out.sort((a, b) => new Date(b.commit.committer.date) - new Date(a.commit.committer.date));
        botCommits = out;
        botCommitsAll = out.slice();
      }

      const botPromise = fetchBotCommits().catch(() => {});

      const CURRENT_YEAR = new Date().getFullYear();

      function fmtDay(iso) {
        const d = new Date(iso);
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const yyyy = d.getFullYear();
        return yyyy === CURRENT_YEAR ? `${mm}-${dd}` : `${yyyy}-${mm}-${dd}`;
      }

      function fmtTime(iso) {
        const d = new Date(iso);
        let h = d.getHours();
        const ampm = h >= 12 ? 'pm' : 'am';
        h = h % 12 || 12;
        const min = String(d.getMinutes()).padStart(2, '0');
        return `${h}:${min}${ampm}`;
      }

      function escHtml(s) {
        return s
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      async function fetchPage(page) {
        await authReady;
        const headers = { Accept: 'application/vnd.github+json' };
        const token = getToken();
        if (token) headers.Authorization = `Bearer ${token}`;
        const r = await fetch(
          `https://api.github.com/search/commits?q=author:${USER}&sort=committer-date&order=desc&per_page=100&page=${page}`,
          { headers }
        );
        if (r.status === 401) {
          Common.GH.clearToken();
          auth.refresh();
          throw new Error('GitHub token rejected; logged out');
        }
        if (!r.ok) throw new Error(`GitHub API ${r.status}`);
        return r.json();
      }

      // Shared cache of search pages so the log and the activity heatmap
      // (identical author/sort query) never fetch the same page twice.
      const searchPageCache = new Map();
      function getSearchPage(page) {
        let p = searchPageCache.get(page);
        if (!p) {
          p = fetchPage(page);
          searchPageCache.set(page, p);
          p.catch(() => searchPageCache.delete(page)); // allow retry on failure
        }
        return p;
      }

      function renderCommit(c) {
        const date = c.commit.committer.date;
        const day = new Date(date).toDateString();
        const repo = c.repository.full_name;
        const msg = c.commit.message.split('\n')[0];

        if (currentDay !== day) {
          currentDay = day;
          currentDayRepos = new Map();
          currentDayContainer = document.createElement('div');
          currentDayContainer.className = 'day';
          log.appendChild(currentDayContainer);
        }

        let commitsEl = currentDayRepos.get(repo);
        if (!commitsEl) {
          const isDayStart = currentDayRepos.size === 0;
          const isVeryFirst = !hasFirstSection;
          hasFirstSection = true;
          const sec = document.createElement('section');
          sec.className = 'section';
          sec.dataset.repo = repo;
          sec.dataset.date = fmtDay(date);
          const dateSpan = isDayStart ? `<span class="date">${fmtDay(date)}</span>` : '';
          const headerHtml = isVeryFirst
            ? ''
            : `
          <header class="section-header">
            <a class="repo" href="https://github.com/${repo}" target="_blank" rel="noopener">${escHtml(repo)}</a>
            ${dateSpan}
          </header>`;
          sec.innerHTML = `${headerHtml}
          <div class="commits"></div>`;
          currentDayContainer.appendChild(sec);
          commitsEl = sec.querySelector('.commits');
          currentDayRepos.set(repo, commitsEl);
        }

        commitsEl.insertAdjacentHTML(
          'beforeend',
          `
        <div class="commit"><span class="time">${fmtTime(date)}</span><a href="${c.html_url}" target="_blank" rel="noopener">${escHtml(msg)}</a></div>`
        );
      }

      function drainBotsBefore(cutoffIso) {
        const cutoff = cutoffIso ? new Date(cutoffIso).getTime() : -Infinity;
        let drained = 0;
        while (botCommits.length) {
          const t = new Date(botCommits[0].commit.committer.date).getTime();
          if (t < cutoff) break;
          renderCommit(botCommits.shift());
          drained++;
        }
        return drained;
      }

      async function loadMore() {
        if (loading || exhausted) return;
        loading = true;
        status.textContent = 'loading…';

        let data;
        try {
          [data] = await Promise.all([getSearchPage(nextPage), botPromise]);
        } catch (e) {
          status.textContent = e.message;
          loading = false;
          exhausted = true;
          return;
        }

        const items = data.items || [];
        if (!items.length && total === 0 && !botCommits.length) {
          status.textContent = 'no commits';
          exhausted = true;
          loading = false;
          return;
        }

        let added = 0;
        for (const c of items) {
          added += drainBotsBefore(c.commit.committer.date);
          renderCommit(c);
          added++;
        }

        const lastPage = items.length < 100 || nextPage >= 10;
        if (lastPage) {
          added += drainBotsBefore(null);
        }

        total += added;
        range.textContent = `${total} commit${total === 1 ? '' : 's'}`;
        nextPage++;

        if (lastPage) {
          exhausted = true;
        }
        status.textContent = '';
        loading = false;
        scheduleTopBar();
      }

      let topBarRaf = null;
      function scheduleTopBar() {
        if (topBarRaf) return;
        topBarRaf = requestAnimationFrame(() => {
          topBarRaf = null;
          updateTopBar();
        });
      }

      function updateTopBar() {
        const sections = log.querySelectorAll('.section');
        if (!sections.length) return;
        topBar.hidden = false;
        const barBottom = topBar.getBoundingClientRect().bottom;
        let current = null;
        for (const s of sections) {
          const h = s.querySelector('.section-header');
          if (!h) {
            current = s;
            continue;
          }
          if (h.getBoundingClientRect().bottom < barBottom) {
            current = s;
          } else {
            break;
          }
        }
        if (!current) current = sections[0];
        const repo = current.dataset.repo;
        const date = current.dataset.date;
        if (topRepo.dataset.repo !== repo) {
          topRepo.textContent = repo;
          topRepo.href = `https://github.com/${repo}`;
          topRepo.dataset.repo = repo;
        }
        if (topDate.textContent !== date) topDate.textContent = date;
      }

      window.addEventListener('scroll', scheduleTopBar, { passive: true });
      Common.initSitemapShortcut();

      const io = new IntersectionObserver(
        (entries) => {
          if (entries.some((e) => e.isIntersecting)) loadMore();
        },
        { rootMargin: '400px' }
      );
      io.observe(sentinel);

      // ---- activity heatmap (trailing year, collapsed by default) ----
      (function initHeatmap() {
        const toggle = document.getElementById('activity-toggle');
        const bodyEl = document.getElementById('activity-body');
        const hmEl = document.getElementById('heatmap');
        const legendEl = document.getElementById('hm-legend');
        const SVGNS = 'http://www.w3.org/2000/svg';
        const CELL = 10,
          GAP = 2,
          STEP = CELL + GAP,
          TOP = 16,
          LEFT = 26,
          MINLBL = 18,
          GAMMA = 0.7;
        const MON = [
          'Jan',
          'Feb',
          'Mar',
          'Apr',
          'May',
          'Jun',
          'Jul',
          'Aug',
          'Sep',
          'Oct',
          'Nov',
          'Dec',
        ];
        const DOW = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        // single-hue green ramp; lighter low end, deeper/brighter high end per theme
        const LIGHT = [
          [0.0, [230, 250, 236]],
          [0.25, [150, 225, 165]],
          [0.5, [64, 196, 99]],
          [0.75, [28, 120, 52]],
          [1.0, [3, 46, 18]],
        ];
        const DARK = [
          [0.0, [12, 55, 33]],
          [0.25, [0, 109, 50]],
          [0.5, [38, 166, 65]],
          [0.75, [57, 211, 83]],
          [1.0, [150, 255, 170]],
        ];
        let counts = null;

        // popover shown on hover / click of a heatmap cell
        const pop = document.createElement('div');
        pop.className = 'hm-popover';
        const popDow = document.createElement('div');
        popDow.className = 'pop-dow';
        const popDate = document.createElement('div');
        popDate.className = 'pop-meta';
        const popCount = document.createElement('div');
        popCount.className = 'pop-meta';
        pop.append(popDow, popDate, popCount);
        document.body.appendChild(pop);
        let pinned = false;

        function showPop(rect, d, v) {
          popDow.textContent = DOW[d.getDay()];
          popDate.textContent = isoLocal(d);
          popCount.textContent = `${v} commit${v === 1 ? '' : 's'}`;
          const r = rect.getBoundingClientRect();
          pop.style.left = r.left + r.width / 2 + 'px';
          pop.style.top = r.top - 6 + 'px';
          pop.style.transform = 'translate(-50%, -100%)';
          pop.classList.add('visible');
        }
        function hidePop() {
          pop.classList.remove('visible');
        }
        document.addEventListener('click', () => {
          pinned = false;
          hidePop();
        });

        // Single delegated listener set on the container instead of three
        // listeners per cell (~1100 for a full year), so render() stays cheap.
        const parseLocal = (iso) => {
          const [y, m, d] = iso.split('-').map(Number);
          return new Date(y, m - 1, d);
        };
        const cellFromEvent = (e) => {
          const t = e.target;
          return t && t.getAttribute && t.hasAttribute('data-date') ? t : null;
        };
        function showPopFromCell(cell) {
          showPop(
            cell,
            parseLocal(cell.getAttribute('data-date')),
            +cell.getAttribute('data-count')
          );
        }
        hmEl.addEventListener('mouseover', (e) => {
          const cell = cellFromEvent(e);
          if (cell && !pinned) showPopFromCell(cell);
        });
        hmEl.addEventListener('mouseout', (e) => {
          if (cellFromEvent(e) && !pinned) hidePop();
        });
        hmEl.addEventListener('click', (e) => {
          const cell = cellFromEvent(e);
          if (!cell) return;
          e.stopPropagation();
          pinned = true;
          showPopFromCell(cell);
        });

        const isDark = () => document.body.classList.contains('dark');
        const pad = (n) => String(n).padStart(2, '0');
        const isoLocal = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        function el(tag, attrs, parent) {
          const e = document.createElementNS(SVGNS, tag);
          for (const k in attrs) e.setAttribute(k, attrs[k]);
          if (parent) parent.appendChild(e);
          return e;
        }
        function ramp(t, S) {
          t = Math.max(0, Math.min(1, t));
          for (let i = 1; i < S.length; i++) {
            if (t <= S[i][0]) {
              const [t0, c0] = S[i - 1];
              const [t1, c1] = S[i];
              const f = (t - t0) / (t1 - t0);
              const ch = (a, b) => Math.round(a + (b - a) * f);
              return `rgb(${ch(c0[0], c1[0])},${ch(c0[1], c1[1])},${ch(c0[2], c1[2])})`;
            }
          }
          const last = S[S.length - 1][1];
          return `rgb(${last.join(',')})`;
        }

        async function fetchData() {
          const c = {};
          const today = new Date();
          today.setHours(0, 0, 0, 0);
          const since = new Date(today);
          since.setDate(since.getDate() - 371); // trailing year + buffer
          const cutoff = since.getTime();
          // Walk the shared search pages (same query the log uses, desc by
          // committer-date) until we pass the trailing-year cutoff. Pages are
          // cached, so the log reuses whatever we fetch here and vice versa.
          for (let page = 1; page <= 10; page++) {
            let data;
            try {
              data = await getSearchPage(page);
            } catch (e) {
              break;
            }
            const items = data.items || [];
            if (!items.length) break;
            let passedCutoff = false;
            for (const it of items) {
              const d = new Date(it.commit.committer.date);
              if (d.getTime() < cutoff) {
                passedCutoff = true;
                continue;
              }
              c[isoLocal(d)] = (c[isoLocal(d)] || 0) + 1;
            }
            if (passedCutoff || items.length < 100) break;
          }
          try {
            await botPromise;
          } catch (e) {}
          for (const b of botCommitsAll) {
            const d = new Date(b.commit.committer.date);
            if (d.getTime() >= cutoff) {
              c[isoLocal(d)] = (c[isoLocal(d)] || 0) + 1;
            }
          }
          return c;
        }

        function render() {
          if (!counts) return;
          const S = isDark() ? DARK : LIGHT;
          const EMPTY = isDark() ? '#161b22' : '#ebedf0';
          hmEl.innerHTML = '';
          const today = new Date();
          today.setHours(0, 0, 0, 0);
          const start = new Date(today);
          start.setDate(start.getDate() - 364);
          start.setDate(start.getDate() - start.getDay()); // back to Sunday
          let gmax = 1,
            total = 0;
          for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
            const v = counts[isoLocal(d)] || 0;
            if (v > gmax) gmax = v;
            total += v;
          }
          const color = (v) => (v <= 0 ? EMPTY : ramp(Math.pow(v / gmax, GAMMA), S));
          const weeks = [];
          for (let cur = new Date(start); cur <= today; ) {
            const wk = [];
            for (let i = 0; i < 7; i++) {
              const d = new Date(cur);
              wk.push(d <= today ? d : null);
              cur.setDate(cur.getDate() + 1);
            }
            weeks.push(wk);
          }
          const W = LEFT + weeks.length * STEP + 8;
          const H = TOP + 7 * STEP;
          const svg = el('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}` }, hmEl);
          ['Mon', 'Wed', 'Fri'].forEach((lbl, k) => {
            const r = [1, 3, 5][k];
            el('text', { x: 0, y: TOP + r * STEP + CELL - 2 }, svg).textContent = lbl;
          });
          let lastMonth = -1,
            lastLabelX = -1e9;
          weeks.forEach((wk, i) => {
            const d = wk.find((x) => x);
            if (!d) return;
            const m = d.getMonth();
            const hasStart = wk.some((x) => x && x.getDate() <= 7);
            const x = LEFT + i * STEP;
            if (hasStart && m !== lastMonth && x - lastLabelX >= MINLBL) {
              el('text', { x, y: 9 }, svg).textContent = MON[m];
              lastMonth = m;
              lastLabelX = x;
            }
          });
          weeks.forEach((wk, i) =>
            wk.forEach((d, r) => {
              if (!d) return;
              const v = counts[isoLocal(d)] || 0;
              el(
                'rect',
                {
                  x: LEFT + i * STEP,
                  y: TOP + r * STEP,
                  width: CELL,
                  height: CELL,
                  rx: 2,
                  fill: color(v),
                  class: 'cell',
                  'data-date': isoLocal(d),
                  'data-count': v,
                },
                svg
              );
            })
          );
          // legend: Less [gradient] More
          legendEl.innerHTML = '';
          legendEl.appendChild(document.createTextNode('Less'));
          const ls = el('svg', { width: 90, height: 12 }, legendEl);
          const defs = el('defs', {}, ls);
          const grad = el(
            'linearGradient',
            { id: 'hm-grad', x1: '0', x2: '1', y1: '0', y2: '0' },
            defs
          );
          S.forEach((s) =>
            el('stop', { offset: s[0] * 100 + '%', 'stop-color': `rgb(${s[1].join(',')})` }, grad)
          );
          el(
            'rect',
            { x: 0, y: 1, width: 80, height: 10, rx: 2, fill: 'url(#hm-grad)', class: 'cell' },
            ls
          );
          legendEl.appendChild(document.createTextNode('More'));
          // start scrolled all the way right so the most recent weeks show first
          if (!bodyEl.hasAttribute('hidden')) bodyEl.scrollLeft = bodyEl.scrollWidth;
        }

        function toggleGraph() {
          const open = bodyEl.hasAttribute('hidden');
          if (open) {
            bodyEl.removeAttribute('hidden');
            toggle.setAttribute('aria-expanded', 'true');
            bodyEl.scrollLeft = bodyEl.scrollWidth;
          } else {
            bodyEl.setAttribute('hidden', '');
            toggle.setAttribute('aria-expanded', 'false');
          }
        }
        toggle.addEventListener('click', toggleGraph);

        // Press "g" to toggle the graph (ignore when typing in a field).
        document.addEventListener('keydown', (e) => {
          if (e.key !== 'g' || e.metaKey || e.ctrlKey || e.altKey) return;
          const t = e.target;
          if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable))
            return;
          e.preventDefault();
          toggleGraph();
        });
        window.addEventListener('darkmodechange', render);

        // Persist counts so revisits (and the first toggle) render instantly
        // from cache while fresh data loads in the background.
        const CACHE_KEY = 'hm_counts_v1' + (getToken() ? '_auth' : '');
        function loadCachedCounts() {
          try {
            const obj = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
            return obj && obj.counts ? obj.counts : null;
          } catch (e) {
            return null;
          }
        }
        function saveCachedCounts(c) {
          try {
            localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), counts: c }));
          } catch (e) {}
        }

        const cached = loadCachedCounts();
        if (cached) {
          counts = cached;
          render();
        }

        fetchData()
          .then((c) => {
            counts = c;
            saveCachedCounts(c);
            render();
          })
          .catch(() => {});
      })();
    </script>
  </body>
</html>
