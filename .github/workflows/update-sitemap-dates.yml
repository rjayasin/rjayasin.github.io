name: Update sitemap dates

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-sitemap-dates
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git identity
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Refresh sitemap dates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-sitemap-dates.js

      - name: Commit sitemap date updates
        run: |
          if git diff --quiet -- sitemap/dates.json; then
            echo "No sitemap date changes."
          else
            git add sitemap/dates.json
            git commit -m "sitemap: refresh dates"
          fi

      - name: Push
        run: |
          if [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]]; then
            echo "Nothing to push."
          else
            git push origin HEAD:main
          fi
