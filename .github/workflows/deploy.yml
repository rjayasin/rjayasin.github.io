name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *' # daily: refresh external-repo dates
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys; cancelling mid-deploy collides with the in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.dates.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Generate sitemap dates
        id: dates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/build-sitemap-dates.js
          if git diff --quiet -- sitemap/dates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sitemap/dates.json unchanged"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sitemap/dates.json updated"
          fi
      # Generate the TIL index from til/*.md frontmatter into the artifact.
      # Not committed to git — regenerated fresh on every deploy.
      - name: Build TIL index
        run: node scripts/build-til-index.js
      # Replace `?v=N` placeholders on local css/js references with content
      # hashes, so cached HTML and assets can't pair up across versions.
      - name: Fingerprint asset references
        run: git ls-files '*.html' | xargs node scripts/rewrite-asset-versions.js
      - uses: actions/configure-pages@v6
      # Keep the full git history out of the published artifact.
      - name: Trim git metadata from the Pages artifact
        run: rm -rf .git
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    # Deploy on pushes and manual runs; on the daily schedule only deploy when
    # the external-repo dates actually changed.
    if: github.event_name != 'schedule' || needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
