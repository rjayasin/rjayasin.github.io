name: Validate PR files

on:
  pull_request:

# Write access lets the autofix step push formatting fixes back to the PR
# branch. A GITHUB_TOKEN push does not retrigger workflows, so there is no
# risk of an infinite fix/validate loop.
permissions:
  contents: write

jobs:
  validate:
    # Not marked as a required check, so failures inform but don't gate merges.
    name: Autofix and validate files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Check out the PR branch head (not the merge commit) so any autofix
          # commit lands on the contributor's branch. Fork PRs fall back to the
          # default merge ref — this repo can't push to a fork branch anyway.
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}
      - uses: actions/setup-node@v6
        with:
          # html-validate 11 uses fs.globSync, which needs Node 22+
          node-version: '24'
      # Prettier is the only auto-fixable check; html-validate and the syntax
      # check are validation-only and still run below via `make check`.
      - name: Auto-fix formatting
        run: make format
      - name: Commit and push fixes
        # GITHUB_TOKEN can only push to same-repo PR branches, not forks.
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet; then
            echo 'Nothing to fix.'
          else
            git config user.name  'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -am '🤖 auto-fix formatting with prettier'
            git push
          fi
      # -k keeps going so every check reports even when an earlier one fails.
      # Runs on the now-formatted tree, so format-check passes and only the
      # non-fixable html/syntax checks can surface real failures.
      - run: make -k check
