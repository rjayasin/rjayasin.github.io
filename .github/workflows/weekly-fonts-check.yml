name: Weekly auto-updates

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RUN_LABEL: ${{ github.event_name == 'workflow_dispatch' && 'manual run' || 'scheduled run' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Configure git identity
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Detect new Google Fonts
        run: node scripts/check-new-fonts.js

      - name: Download missing .woff2 files
        run: node scripts/fetch-fonts.js

      - name: Refresh font licenses & attribution
        run: node scripts/fetch-licenses.js

      - name: Refresh font category/date metadata
        run: node scripts/fetch-font-meta.js

      - name: Commit font updates
        run: |
          if git diff --quiet -- fonts.js fonts-meta.js fonts/; then
            echo "No font changes."
          else
            git add fonts.js fonts-meta.js fonts/
            git commit -m "🤖 add new google fonts ($RUN_LABEL)"
          fi

      - name: Push
        run: |
          if [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]]; then
            echo "Nothing to push."
          else
            git push origin HEAD:main
          fi
