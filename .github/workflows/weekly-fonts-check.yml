name: Weekly auto-updates

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RUN_LABEL: ${{ github.event_name == 'workflow_dispatch' && 'manual run' || 'scheduled run' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Configure git identity
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Detect new Google Fonts
        run: node scripts/check-new-fonts.js

      - name: Download missing .woff2 files
        run: node scripts/fetch-fonts.js

      # Drops new fonts that look the same in English as one already cached
      # (or have no English letters) and records them in culled-fonts.json
      # so check-new-fonts.js won't add them again.
      - name: Drop near-duplicate new fonts
        run: |
          pip install --quiet -r scripts/requirements-fonts.txt
          python scripts/cull-new-fonts.py

      # Skips typefree families already kept or recorded in
      # culled-typefree-fonts.json, so only new ones are downloaded.
      - name: Add new typefree.org fonts
        run: |
          python scripts/import-typefree-fonts.py
          npx --yes prettier@3.3.3 --write typefree-fonts.js

      - name: Refresh font licenses & attribution
        run: node scripts/fetch-licenses.js

      - name: Refresh font category/date metadata
        run: node scripts/fetch-font-meta.js

      - name: Commit font updates
        run: |
          paths="fonts.js fonts-meta.js typefree-fonts.js fonts/ scripts/culled-fonts.json scripts/culled-typefree-fonts.json"
          git add $paths
          if git diff --cached --quiet -- $paths; then
            echo "No font changes."
          else
            git commit -m "🤖 add new fonts ($RUN_LABEL)"
          fi

      - name: Push
        run: |
          if [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]]; then
            echo "Nothing to push."
          else
            git push origin HEAD:main
          fi
