<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Ruvan / pinball</title>
    <link rel="icon" id="favicon" />
    <link rel="stylesheet" href="/common.css" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #game {
        position: fixed;
        inset: 0;
        display: block;
        touch-action: none;
        cursor: pointer;
      }
      body.hide-cursor,
      body.hide-cursor #game {
        cursor: none;
      }
      #hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 12px;
        text-align: center;
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 12px;
        color: #888;
        opacity: 1;
        transition: opacity 0.4s ease;
        user-select: none;
        z-index: 3;
        pointer-events: none;
      }
      #hint-inner {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 6px;
        background: #ffffff;
      }
      body.dark #hint-inner {
        background: #111111;
      }
      #hint.hidden {
        opacity: 0;
      }
      #hint.hidden .hint-btn {
        pointer-events: none;
      }
      #hint .hint-btn {
        cursor: pointer;
        pointer-events: auto;
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 2px;
      }
      #hint .hint-btn:hover {
        color: #333;
      }
      body.dark #hint .hint-btn:hover {
        color: #ccc;
      }
      #help {
        position: fixed;
        top: 10px;
        right: 12px;
        width: 24px;
        height: 24px;
        line-height: 22px;
        text-align: center;
        border: 1px solid #888;
        border-radius: 50%;
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 13px;
        color: #888;
        background: #ffffff;
        opacity: 0.75;
        cursor: pointer;
        user-select: none;
        z-index: 3;
      }
      body.dark #help {
        background: #111111;
      }
      #help:hover {
        color: #333;
        border-color: #333;
        opacity: 1;
      }
      body.dark #help:hover {
        color: #ccc;
        border-color: #ccc;
      }
    </style>
    <script src="/common.js"></script>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hint" class="hidden">
      <span id="hint-inner"
        ><span style="white-space: nowrap">tap bottom left/right to flip</span> &nbsp;·&nbsp;
        <span style="white-space: nowrap">pull plunger (or hold ↓) to launch</span> &nbsp;·&nbsp;
        <span style="white-space: nowrap"><span class="hint-btn" id="hb-reset">r reset</span></span>
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-dark"
            >1 <span class="hb-dark-label">dark</span></span
          ></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-sitemap">s sitemap</span></span
        ></span
      >
    </div>
    <div id="help">?</div>
    <script>
      Common.paintFaviconR();
      Common.initDarkMode();

      const MONO =
        'ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace';

      // The ball is always something round: color dots, sport balls, moons,
      // and plenty of the yellow circular faces.
      const BALL_EMOJIS = [
        '😀',
        '😃',
        '😄',
        '😁',
        '😆',
        '😅',
        '🙂',
        '🙃',
        '😉',
        '😊',
        '😇',
        '🥰',
        '😍',
        '🤩',
        '😋',
        '😜',
        '🤪',
        '😝',
        '🤗',
        '🤭',
        '🤔',
        '😐',
        '😶',
        '😏',
        '🙄',
        '😬',
        '😴',
        '😲',
        '😳',
        '🥺',
        '😢',
        '😭',
        '😤',
        '😠',
        '🤯',
        '😎',
        '🤓',
        '🧐',
        '🥴',
        '🥶',
        '🥵',
        '😷',
        '🤠',
        '🥳',
        '😈',
        '🔴',
        '🟠',
        '🟡',
        '🟢',
        '🔵',
        '🟣',
        '🟤',
        '⚫',
        '⚪',
        '⚽',
        '🏀',
        '🏐',
        '⚾',
        '🥎',
        '🎾',
        '🎱',
        '🌕',
        '🌑',
        '🌍',
        '🌎',
        '🌏',
        '🌝',
        '🌚',
        '🪩',
        '🧿',
        '🍊',
        '🥥',
        '💿',
        '📀',
        '🔮',
        '🪙',
      ];
      function pickBallEmoji() {
        return BALL_EMOJIS[Math.floor(Math.random() * BALL_EMOJIS.length)];
      }

      // The targets are a fleet of space invaders: little ASCII sprites in
      // rows, one sprite style per row, each non-space character a cell that
      // can be knocked loose as the invader takes damage.
      const INVADER_SPRITES = [
        // squid
        [' /\\ ', '/oo\\', '<~~>'],
        // crab
        ['d^^b', '{oo}', ' vv '],
        // block
        ['[==]', '|oo|', '/  \\'],
      ];

      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');

      let W = 0,
        H = 0,
        dpr = 1;
      let ballR, targetFont, cellW, cellH, flipFont, flipCharW;

      let balls = [];
      let invaders = [];
      let bullets = [];
      let fallers = []; // dead invaders tumbling out the bottom
      let powerups = []; // plus signs dropped by dead invaders
      let lasers = []; // rainbow crosses from a collected plus sign
      let particles = [];
      let pops = [];
      let score = 0;
      let wave = 1;
      let respawnAt = 0;
      let nextShotAt = 0;
      let nextWaveAt = 0;
      let gameOver = null; // string reason when the game has ended
      let gameOverAt = 0; // when it ended; restarts are locked out briefly
      let gameStarted = false; // set once the first ball enters the playfield
      let fleetProvoked = false; // set once the ball has struck an invader
      let respawnsUsed = 0;

      // --- physics constants ---
      // Tuned floaty: gentle gravity plus per-substep air drag give the ball
      // a slow, drifting arc instead of a hard arcade drop.
      // Speeds and accelerations are tuned for a ~780px-tall phone playfield
      // and get scaled with height in layout() so a full flip can still carry
      // the ball to the top targets on tall desktop windows.
      const GRAVITY = 780; // px/s^2
      const BALL_DRAG = 0.995; // per substep; caps fall speed at a lazy drift
      const WALL_REST = 0.72;
      const FUNNEL_REST = 0.45;
      const FLIP_REST = 0.45;
      const BUMPER_REST = 0.9;
      const BUMPER_KICK = 380; // min outgoing normal speed off an invader
      const MAX_SPEED = 1400;
      const HIT_COOLDOWN = 90; // ms between scoring hits on one invader

      // A desktop window is far taller and wider than the phone playfield the
      // constants above were tuned on, so height-scaling alone left the ball
      // drifting across a lot of empty table. Mouse-and-keyboard players get a
      // livelier version: quicker fall, less air drag, and a harder snap off
      // the blades. Touch keeps the original floaty feel.
      const DESKTOP = !!(
        window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches
      );
      const DESKTOP_GRAVITY = 1.22; // multipliers on the tuned constants
      const DESKTOP_MAX_SPEED = 1.2;
      const DESKTOP_KICK = 1.15;
      const DESKTOP_FLIP_SPEED = 1.2; // blades swing faster, so they hit harder
      const DESKTOP_DRAG = 0.9968; // less than the floaty default, but still there
      const DESKTOP_FLIP_REST = 0.55; // vs FLIP_REST

      // --- invader constants ---
      const INVADER_HITS = 3; // ball hits to kill one invader
      const HIT_SCORE = 100;
      const KILL_SCORE = 200;
      const MAX_RESPAWNS = 3; // fresh balls after a full drain; then it's over
      const BULLET_PENALTY = 200; // score lost to a bullet on wave 1
      const BULLET_PENALTY_PER_WAVE = 100; // extra damage per later wave
      const GAME_OVER_LOCK_MS = 2000; // no restarting until this has passed
      const FLEET_BASE_SPEED = 26; // px/s sideways at ref height
      const BULLET_SPEED = 300; // px/s at ref height
      const FIRST_SHOT_GRACE_MS = 2500;
      // A few invaders per fleet are "special": drawn in color, and killing
      // one releases extra balls into play. They get rarer wave by wave.
      const SPECIAL_CHANCE = 0.15;
      const SPECIAL_CHANCE_DECAY = 0.03; // less per wave, floored below
      const SPECIAL_CHANCE_MIN = 0.04;
      const SPECIAL_BONUS_BALLS = 2;
      const SPECIAL_HUES = [25, 130, 195, 315]; // orange, green, cyan, magenta

      // Powerup: a dying invader may drop a plus sign that tumbles down the
      // table. Touch it with a ball or a flipper and it detonates into a
      // rainbow cross — four beams racing out along the cardinals, hurting
      // every invader they sweep over.
      const POWERUP_DROP_CHANCE = 0.12; // per invader killed
      const POWERUP_FALL = 130; // px/s terminal drift at ref height
      const POWERUP_SCORE = 300;
      const LASER_SPEED = 1500; // px/s the beam front races outward
      const LASER_LIFE = 0.5; // s from detonation to faded out
      const LASER_HALF_W = 7; // px half-thickness of the damage beam
      const LASER_DAMAGE = 2; // invader hits per beam pass
      const LASER_DIRS = [
        [1, 0],
        [-1, 0],
        [0, 1],
        [0, -1],
      ];

      // Flipper angles are measured from horizontal; y grows downward so the
      // rest position droops toward the drain and "up" swings above it.
      const REST_ANGLE = 0.5;
      const UP_ANGLE = -0.62;
      const FLIP_UP_SPEED = 18; // rad/s
      const FLIP_DOWN_SPEED = 9;

      // side: -1 = left flipper, 1 = right (mirrored geometry).
      const flippers = [
        // prettier-ignore
        { side: -1, px: 0, py: 0, len: 0, thick: 0, angle: REST_ANGLE, prevAngle: REST_ANGLE, av: 0, pressed: false },
        // prettier-ignore
        { side: 1, px: 0, py: 0, len: 0, thick: 0, angle: REST_ANGLE, prevAngle: REST_ANGLE, av: 0, pressed: false },
      ];
      let funnelTopY = 0;
      // Height-scaled physics (see the constants above); set in layout().
      let physScale, gravity, maxSpeed, bumperKick, flipUpSpeed, flipDownSpeed, ballDrag, flipRest;

      // Shooter lane on the right edge, overlaid on the playfield: it only
      // materializes while a ball needs launching and fades away once the
      // ball clears it. New balls rest on a spring plunger at the bottom;
      // pulling it down and letting go fires the ball up the lane, around
      // the curve at the top, and out toward the top center.
      let laneW = 0,
        laneX = 0,
        laneCX = 0,
        curveR = 0,
        curveStartY = 0,
        plungerRestTop = 0,
        plungerTravel = 0;
      let laneAlpha = 1;
      const plunger = { pull: 0, pointerId: null, grabY: 0, keyHold: false };

      function isDark() {
        if (document.body.classList.contains('dark')) return true;
        if (document.body.classList.contains('light')) return false;
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      }
      function inkColor() {
        return isDark() ? '#f0f0f0' : '#111111';
      }

      function layout() {
        physScale = Math.max(1, H / 780);
        gravity = GRAVITY * physScale * (DESKTOP ? DESKTOP_GRAVITY : 1);
        maxSpeed = MAX_SPEED * physScale * (DESKTOP ? DESKTOP_MAX_SPEED : 1);
        bumperKick = BUMPER_KICK * physScale * (DESKTOP ? DESKTOP_KICK : 1);
        flipUpSpeed = FLIP_UP_SPEED * physScale * (DESKTOP ? DESKTOP_FLIP_SPEED : 1);
        flipDownSpeed = FLIP_DOWN_SPEED * physScale * (DESKTOP ? DESKTOP_FLIP_SPEED : 1);
        ballDrag = DESKTOP ? DESKTOP_DRAG : BALL_DRAG;
        flipRest = DESKTOP ? DESKTOP_FLIP_REST : FLIP_REST;

        const minDim = Math.min(W, H);
        ballR = Math.max(11, Math.min(20, Math.round(minDim / 40)));
        targetFont = Math.max(10, Math.min(18, Math.round(minDim / 48)));
        ctx.font = targetFont + 'px ' + MONO;
        cellW = ctx.measureText('M').width * 1.1;
        cellH = targetFont * 1.05;
        flipFont = Math.max(14, Math.min(24, Math.round(minDim / 34)));
        ctx.font = flipFont + 'px ' + MONO;
        flipCharW = ctx.measureText('M').width;

        laneW = Math.max(30, ballR * 2.4);
        laneX = W - laneW;
        laneCX = laneX + laneW / 2;
        curveR = Math.min(110, Math.max(56, W * 0.22));
        curveStartY = curveR + ballR + 10;
        plungerTravel = Math.min(80, H * 0.1);
        plungerRestTop = H - plungerTravel - 34;

        const len = Math.max(80, Math.min(170, minDim * 0.17));
        const tipGapHalf = len * 0.36; // half the drain width between tips
        const pivotY = H - 24 - Math.sin(REST_ANGLE) * len;
        const pivotDx = tipGapHalf + Math.cos(REST_ANGLE) * len;
        for (const f of flippers) {
          f.len = len;
          f.thick = flipFont * 0.42;
          f.px = W / 2 + f.side * pivotDx;
          f.py = pivotY;
        }
        funnelTopY = pivotY - len * 1.6;
      }

      // --- invaders ---
      function makeInvader(sprite, hx, hy, col) {
        const rows = sprite.length;
        const cells = [];
        let maxR = 0;
        for (let r = 0; r < rows; r++) {
          const line = sprite[r];
          for (let c = 0; c < line.length; c++) {
            const ch = line[c];
            if (ch === ' ') continue;
            const dx = (c - (line.length - 1) / 2) * cellW;
            const dy = (r - (rows - 1) / 2) * cellH;
            cells.push({ dx, dy, ch, alive: true });
            maxR = Math.max(maxR, Math.hypot(dx, dy));
          }
        }
        return {
          hx, // formation offset from the fleet origin
          hy,
          col,
          cells,
          hits: 0,
          alive: true,
          r: maxR + cellH * 0.5,
          hitR: Math.max(maxR * 0.8, cellH),
          lastHit: 0,
          flashT: 0,
          special: false,
          hue: 0,
        };
      }

      function specialColor(hue) {
        return 'hsl(' + hue + ', 90%, ' + (isDark() ? 60 : 38) + '%)';
      }

      // fleet.x/y is the center of the top-left invader; everyone else hangs
      // off it at fixed formation offsets so the whole grid marches together.
      let fleet = { x: 0, y: 0, yTarget: 0, dir: 1 };

      function buildFleet() {
        invaders = [];
        bullets = [];
        const invW = 4 * cellW;
        const invH = 3 * cellH;
        const gapX = invW * 0.65;
        const gapY = invH * 0.7;
        const cols = Math.max(4, Math.min(8, Math.floor((W * 0.72) / (invW + gapX))));
        const rows = H > 760 ? 4 : 3;
        const spanW = cols * invW + (cols - 1) * gapX;
        const fleetY = 78 + invH / 2;
        fleet = { x: (W - spanW) / 2 + invW / 2, y: fleetY, yTarget: fleetY, dir: 1 };
        for (let r = 0; r < rows; r++) {
          const sprite = INVADER_SPRITES[r % INVADER_SPRITES.length];
          for (let c = 0; c < cols; c++) {
            invaders.push(makeInvader(sprite, c * (invW + gapX), r * (invH + gapY), c));
          }
        }
        // sprinkle in the specials, always at least one per fleet
        const specialChance = Math.max(
          SPECIAL_CHANCE_MIN,
          SPECIAL_CHANCE - SPECIAL_CHANCE_DECAY * (wave - 1)
        );
        let specials = 0;
        for (const inv of invaders) {
          if (Math.random() < specialChance) {
            inv.special = true;
            inv.hue = SPECIAL_HUES[Math.floor(Math.random() * SPECIAL_HUES.length)];
            specials++;
          }
        }
        if (specials === 0) {
          const inv = invaders[Math.floor(Math.random() * invaders.length)];
          inv.special = true;
          inv.hue = SPECIAL_HUES[Math.floor(Math.random() * SPECIAL_HUES.length)];
        }
        nextShotAt = performance.now() + FIRST_SHOT_GRACE_MS;
      }

      // --- high scores (localStorage only) ---
      const HS_KEY = 'pinball-highscores';
      const HS_MAX = 5;
      let hsList = loadHighScores();
      let hsRank = -1; // this run's slot on the board, -1 if it missed

      function loadHighScores() {
        try {
          const list = JSON.parse(localStorage.getItem(HS_KEY));
          return Array.isArray(list) ? list : [];
        } catch (_) {
          return [];
        }
      }

      function recordHighScore(s, w) {
        if (s <= 0) return -1;
        const entry = { score: s, wave: w, date: new Date().toISOString().slice(0, 10) };
        const list = loadHighScores();
        list.push(entry);
        list.sort((a, b) => b.score - a.score);
        hsList = list.slice(0, HS_MAX);
        try {
          localStorage.setItem(HS_KEY, JSON.stringify(hsList));
        } catch (_) {}
        return hsList.indexOf(entry);
      }

      function triggerGameOver(reason) {
        if (gameOver) return;
        gameOver = reason;
        gameOverAt = performance.now();
        hsRank = recordHighScore(score, wave);
        for (const f of flippers) f.pressed = false;
      }

      function stepFleet(dt, now) {
        const aliveInv = invaders.filter((i) => i.alive);
        if (aliveInv.length === 0) {
          // wave cleared: pause a beat, then send in a faster fleet
          if (!nextWaveAt) {
            nextWaveAt = now + 1600;
          } else if (now >= nextWaveAt) {
            nextWaveAt = 0;
            wave++;
            buildFleet();
            addPop(W / 2, H * 0.3, 'wave ' + wave);
          }
          return;
        }

        // the invasion holds its ground only until the game's very first
        // launch — reloading mid-game buys no such mercy
        if (!gameStarted) return;

        // classic invaders pacing: the fewer left, the faster they scuttle
        const deadRatio = 1 - aliveInv.length / invaders.length;
        const speed = FLEET_BASE_SPEED * physScale * (1 + 2.2 * deadRatio + 0.25 * (wave - 1));
        fleet.x += fleet.dir * speed * dt;

        let minX = Infinity,
          maxX = -Infinity,
          maxY = -Infinity;
        for (const inv of aliveInv) {
          const x = fleet.x + inv.hx;
          minX = Math.min(minX, x - inv.r);
          maxX = Math.max(maxX, x + inv.r);
          maxY = Math.max(maxY, fleet.y + inv.hy + inv.r);
        }
        // each edge reversal queues a drop; the fleet glides down to it
        // instead of snapping a whole step at once
        if (fleet.dir > 0 && maxX > W - 10) {
          fleet.dir = -1;
          fleet.yTarget += cellH * 1.6;
        } else if (fleet.dir < 0 && minX < 10) {
          fleet.dir = 1;
          fleet.yTarget += cellH * 1.6;
        }
        if (fleet.y < fleet.yTarget) {
          fleet.y = Math.min(fleet.yTarget, fleet.y + cellH * 2.2 * dt);
        }
        if (maxY >= flippers[0].py - ballR) {
          triggerGameOver('the invaders reached the bottom');
          return;
        }

        // they only shoot back once provoked: the first ball to land on an
        // invader starts the war, and even then after a grace period
        if (fleetProvoked && now >= nextShotAt) {
          fireBullet(aliveInv);
          const base = Math.max(500, 1500 - (wave - 1) * 120);
          nextShotAt = now + base + Math.random() * 1200;
        }
      }

      // Only the bottom-most invader of a column may fire, like the original.
      function fireBullet(aliveInv) {
        const byCol = new Map();
        for (const inv of aliveInv) {
          const cur = byCol.get(inv.col);
          if (!cur || inv.hy > cur.hy) byCol.set(inv.col, inv);
        }
        const shooters = [...byCol.values()];
        const s = shooters[Math.floor(Math.random() * shooters.length)];
        bullets.push({
          x: fleet.x + s.hx,
          y: fleet.y + s.hy + s.r * 0.8,
          vy: (BULLET_SPEED + (wave - 1) * 25) * physScale,
          dead: false,
        });
      }

      function killInvader(inv, b) {
        inv.alive = false;
        score += KILL_SCORE;
        const x = fleet.x + inv.hx,
          y = fleet.y + inv.hy;
        addPop(x, y, '+' + KILL_SCORE);
        fallers.push({
          x,
          y,
          vx: (b ? b.vx * 0.15 : 0) + (Math.random() - 0.5) * 60,
          vy: 40,
          angle: 0,
          av: (Math.random() - 0.5) * 6,
          cells: inv.cells.filter((c) => c.alive),
          hue: inv.special ? inv.hue : null,
        });
        if (Math.random() < POWERUP_DROP_CHANCE) {
          powerups.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 70,
            vy: 30,
            r: cellH * 1.1,
            born: performance.now(),
            dead: false,
          });
        }

        // specials burst into extra balls, scattered from where they died
        if (inv.special) {
          // the multiball call-out lingers longer than ordinary score pops
          addPop(x, y - cellH * 1.6, 'multiball!', specialColor(inv.hue), 0.55);
          for (let i = 0; i < SPECIAL_BONUS_BALLS; i++) {
            balls.push({
              x: x + (Math.random() - 0.5) * 30,
              y,
              vx: (Math.random() - 0.5) * 400,
              vy: -(100 + Math.random() * 200) * physScale,
              r: ballR,
              ch: pickBallEmoji(),
              angle: 0,
              av: 0,
              inLane: false,
            });
          }
        }
      }

      // --- balls, particles, score pops ---
      // A new ball arrives resting on the plunger in the shooter lane; the
      // player pulls the plunger down and releases to fire it into play.
      function spawnBall() {
        balls.push({
          x: laneCX,
          y: plungerRestTop + plunger.pull * plungerTravel - ballR,
          vx: 0,
          vy: 0,
          r: ballR,
          ch: pickBallEmoji(),
          angle: 0,
          av: 0,
          inLane: true,
          curveA: null, // angle around the top curve while riding it
          railV: 0, // scalar speed along the curve rail
        });
      }

      // Fire the lane ball with speed proportional to how far the plunger was
      // pulled; a full pull clears the whole lane with a little to spare.
      function releasePlunger() {
        const pull = plunger.pull;
        plunger.pull = 0;
        const b = balls.find((bb) => bb.inLane);
        if (!b || pull < 0.05 || gameOver) return;
        const vFull = Math.sqrt(2 * gravity * H * 1.1);
        b.vy = -vFull * (0.32 + 0.98 * pull);
      }

      function spawnParticle(x, y, ch, vx, vy) {
        if (particles.length > 350) particles.shift();
        particles.push({
          x,
          y,
          vx,
          vy,
          ch,
          angle: 0,
          av: (Math.random() - 0.5) * 12,
          life: 1,
        });
      }

      function addPop(x, y, text, color, decay) {
        pops.push({ x, y, text, color, decay: decay || 1.3, life: 1 });
      }

      // Chip a couple of cells off a damaged invader, but keep a core so the
      // corpse still reads as a sprite when it falls.
      function knockInvaderCells(inv, n) {
        const aliveCells = inv.cells.filter((c) => c.alive);
        for (let i = 0; i < n && aliveCells.length > 4; i++) {
          const idx = Math.floor(Math.random() * aliveCells.length);
          const cell = aliveCells.splice(idx, 1)[0];
          cell.alive = false;
          const dir = Math.atan2(cell.dy, cell.dx) + (Math.random() - 0.5) * 1.2;
          const sp = 140 + Math.random() * 260;
          spawnParticle(
            fleet.x + inv.hx + cell.dx,
            fleet.y + inv.hy + cell.dy,
            cell.ch,
            Math.cos(dir) * sp,
            Math.sin(dir) * sp - 80
          );
        }
      }

      // --- collision helpers ---
      function clampSpeed(b) {
        const sp = Math.hypot(b.vx, b.vy);
        if (sp > maxSpeed) {
          const k = maxSpeed / sp;
          b.vx *= k;
          b.vy *= k;
        }
      }

      function pointSegDist(px0, py0, x1, y1, x2, y2) {
        const dx = x2 - x1,
          dy = y2 - y1;
        const L2 = dx * dx + dy * dy || 0.0001;
        let t = ((px0 - x1) * dx + (py0 - y1) * dy) / L2;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(px0 - (x1 + t * dx), py0 - (y1 + t * dy));
      }

      function collideSegment(b, x1, y1, x2, y2, rest, thick) {
        const dx = x2 - x1,
          dy = y2 - y1;
        const L2 = dx * dx + dy * dy || 0.0001;
        let t = ((b.x - x1) * dx + (b.y - y1) * dy) / L2;
        t = Math.max(0, Math.min(1, t));
        const px = x1 + t * dx,
          py = y1 + t * dy;
        let nx = b.x - px,
          ny = b.y - py;
        const d = Math.hypot(nx, ny) || 0.0001;
        const minD = b.r + thick;
        if (d >= minD) return false;
        nx /= d;
        ny /= d;
        b.x = px + nx * minD;
        b.y = py + ny * minD;
        const vn = b.vx * nx + b.vy * ny;
        if (vn < 0) {
          b.vx -= (1 + rest) * vn * nx;
          b.vy -= (1 + rest) * vn * ny;
        }
        return true;
      }

      // Test the ball against the blade at an explicit angle so step() can
      // sweep the check across the blade's motion within a substep — a fast
      // flip otherwise jumps the blade further per substep than the contact
      // radius and the ball clips straight through.
      function collideFlipper(b, f, angle) {
        const c = Math.cos(angle),
          s = Math.sin(angle);
        const tipX = f.px - f.side * c * f.len;
        const tipY = f.py + s * f.len;
        const dx = tipX - f.px,
          dy = tipY - f.py;
        const L2 = dx * dx + dy * dy || 0.0001;
        let t = ((b.x - f.px) * dx + (b.y - f.py) * dy) / L2;
        t = Math.max(0, Math.min(1, t));
        const px = f.px + t * dx,
          py = f.py + t * dy;
        let nx = b.x - px,
          ny = b.y - py;
        const d = Math.hypot(nx, ny) || 0.0001;
        const minD = b.r + f.thick;
        if (d >= minD) return;
        nx /= d;
        ny /= d;
        b.x = px + nx * minD;
        b.y = py + ny * minD;
        // Surface velocity at the contact point from the flipper's swing:
        // for the left flipper P(a) = pivot + len*t*(cos a, sin a), so
        // dP/da = len*t*(-sin a, cos a); the right side mirrors the x term.
        const ux = f.side < 0 ? -s : s;
        const uy = c;
        const sv = f.av * f.len * t;
        const rvx = b.vx - ux * sv;
        const rvy = b.vy - uy * sv;
        const vn = rvx * nx + rvy * ny;
        if (vn < 0) {
          b.vx -= (1 + flipRest) * vn * nx;
          b.vy -= (1 + flipRest) * vn * ny;
          const vt = rvx * -ny + rvy * nx;
          b.av = Math.max(-16, Math.min(16, b.av - (vt / b.r) * 0.25));
        }
        clampSpeed(b);
      }

      function collideInvader(b, inv, now) {
        if (!inv.alive) return;
        const ix = fleet.x + inv.hx,
          iy = fleet.y + inv.hy;
        let nx = b.x - ix,
          ny = b.y - iy;
        const d = Math.hypot(nx, ny) || 0.0001;
        const minD = b.r + inv.hitR;
        if (d >= minD) return;
        nx /= d;
        ny /= d;
        b.x = ix + nx * minD;
        b.y = iy + ny * minD;
        const vn = b.vx * nx + b.vy * ny;
        if (vn < 0) {
          b.vx -= (1 + BUMPER_REST) * vn * nx;
          b.vy -= (1 + BUMPER_REST) * vn * ny;
        }
        // Bumper kick: guarantee a lively outgoing speed away from center.
        const out = b.vx * nx + b.vy * ny;
        if (out < bumperKick) {
          b.vx += (bumperKick - out) * nx;
          b.vy += (bumperKick - out) * ny;
        }
        b.av = Math.max(-16, Math.min(16, b.av + (Math.random() - 0.5) * 10));
        clampSpeed(b);
        if (now - inv.lastHit > HIT_COOLDOWN) {
          if (!fleetProvoked) {
            fleetProvoked = true;
            nextShotAt = now + FIRST_SHOT_GRACE_MS;
          }
          damageInvader(inv, b.x, b.y, now, 1, b);
        }
      }

      // Shared by the ball and the laser: chip an invader, score it, and kill
      // it once it has taken enough.
      function damageInvader(inv, x, y, now, hits, b) {
        inv.lastHit = now;
        inv.flashT = now + 140;
        inv.hits += hits;
        const gained = HIT_SCORE * hits;
        score += gained;
        addPop(x, y, '+' + gained);
        knockInvaderCells(inv, 2 * hits);
        if (inv.hits >= INVADER_HITS) killInvader(inv, b || null);
      }

      function stepBullets(dt, now) {
        for (const bl of bullets) {
          bl.y += bl.vy * dt;
          // flipper hits cost points
          for (const f of flippers) {
            const c = Math.cos(f.angle),
              s = Math.sin(f.angle);
            const tipX = f.px - f.side * c * f.len;
            const tipY = f.py + s * f.len;
            if (pointSegDist(bl.x, bl.y, f.px, f.py, tipX, tipY) < f.thick + 5) {
              bl.dead = true;
              const damage = BULLET_PENALTY + (wave - 1) * BULLET_PENALTY_PER_WAVE;
              score -= damage;
              addPop(bl.x, bl.y - 14, '-' + damage, '#cc4444');
              for (let i = 0; i < 6; i++) {
                spawnParticle(bl.x, bl.y, '*', (Math.random() - 0.5) * 240, -Math.random() * 200);
              }
              if (score < 0) triggerGameOver('your score went negative');
              break;
            }
          }
          if (bl.dead) continue;
          // the ball soaks up bullets — a shield you can juggle
          for (const b of balls) {
            if (b.inLane) continue;
            if (Math.hypot(b.x - bl.x, b.y - bl.y) < b.r + 4) {
              bl.dead = true;
              for (let i = 0; i < 3; i++) {
                spawnParticle(bl.x, bl.y, '*', (Math.random() - 0.5) * 160, -Math.random() * 140);
              }
              break;
            }
          }
        }
        bullets = bullets.filter((bl) => !bl.dead && bl.y < H + 20);
      }

      // Dropped plus signs drift down the table until a ball or a flipper
      // touches them; either way they go off in the collector's face.
      function stepPowerups(dt, now) {
        const fall = POWERUP_FALL * physScale;
        for (const pu of powerups) {
          pu.vy = Math.min(fall, pu.vy + gravity * 0.1 * dt);
          pu.x += pu.vx * dt;
          pu.y += pu.vy * dt;
          if (pu.x < pu.r) {
            pu.x = pu.r;
            pu.vx = Math.abs(pu.vx);
          } else if (pu.x > W - pu.r) {
            pu.x = W - pu.r;
            pu.vx = -Math.abs(pu.vx);
          }

          for (const b of balls) {
            if (b.inLane) continue;
            if (Math.hypot(b.x - pu.x, b.y - pu.y) < b.r + pu.r * 0.7) pu.dead = true;
          }
          for (const f of flippers) {
            if (pu.dead) break;
            const c = Math.cos(f.angle),
              s = Math.sin(f.angle);
            const tipX = f.px - f.side * c * f.len;
            const tipY = f.py + s * f.len;
            if (pointSegDist(pu.x, pu.y, f.px, f.py, tipX, tipY) < f.thick + pu.r * 0.7) {
              pu.dead = true;
            }
          }
          if (pu.dead) fireLaser(pu.x, pu.y, now);
        }
        powerups = powerups.filter((pu) => !pu.dead && pu.y < H + 40);
      }

      function fireLaser(x, y, now) {
        const hue = Math.round(now / 4) % 360;
        lasers.push({ x, y, len: 0, life: 1, hue, hit: new Set() });
        score += POWERUP_SCORE;
        addPop(x, y - cellH, '+' + POWERUP_SCORE + ' laser!', specialColor(hue), 0.55);
        for (let i = 0; i < 10; i++) {
          const a = Math.random() * Math.PI * 2;
          const sp = 120 + Math.random() * 220;
          spawnParticle(x, y, '+', Math.cos(a) * sp, Math.sin(a) * sp - 60);
        }
      }

      // The beam fronts race outward along the cardinals; an invader is hit
      // once, the first time a front has swept past it.
      function stepLasers(dt, now) {
        for (const la of lasers) {
          la.len += LASER_SPEED * physScale * dt;
          la.life -= dt / LASER_LIFE;
          const half = LASER_HALF_W * physScale;
          for (const inv of invaders) {
            if (!inv.alive || la.hit.has(inv)) continue;
            const dx = fleet.x + inv.hx - la.x;
            const dy = fleet.y + inv.hy - la.y;
            const reach = la.len + inv.hitR;
            const across = inv.hitR + half;
            const onArm =
              (Math.abs(dy) < across && Math.abs(dx) < reach) ||
              (Math.abs(dx) < across && Math.abs(dy) < reach);
            if (!onArm) continue;
            la.hit.add(inv);
            damageInvader(inv, fleet.x + inv.hx, fleet.y + inv.hy, now, LASER_DAMAGE);
          }
        }
        lasers = lasers.filter((la) => la.life > 0);
      }

      // --- simulation ---
      function stepDebris(dt) {
        // raceway visibility: solid while a ball waits on or rides it, gone
        // as soon as it isn't needed
        const hasLaneBall = balls.some((b) => b.inLane);
        laneAlpha += ((hasLaneBall ? 1 : 0) - laneAlpha) * Math.min(1, dt * (hasLaneBall ? 12 : 8));
        if (!hasLaneBall && laneAlpha < 0.03) laneAlpha = 0;

        // dead invaders tumble out the bottom
        for (const fa of fallers) {
          fa.vy += gravity * 0.5 * dt;
          fa.x += fa.vx * dt;
          fa.y += fa.vy * dt;
          fa.angle += fa.av * dt;
        }
        fallers = fallers.filter((fa) => fa.y < H + 100);

        // loose glyph particles
        for (const p of particles) {
          p.vy += gravity * 0.6 * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.angle += p.av * dt;
          p.life -= dt * 0.9;
        }
        particles = particles.filter((p) => p.life > 0 && p.y < H + 40);

        for (const p of pops) {
          p.y -= 46 * dt;
          p.life -= dt * p.decay;
        }
        pops = pops.filter((p) => p.life > 0);
      }

      function step(dt, now) {
        if (gameOver) {
          // let the wreckage finish falling behind the game-over card
          stepDebris(dt);
          return;
        }

        for (const f of flippers) {
          const target = f.pressed ? UP_ANGLE : REST_ANGLE;
          f.prevAngle = f.angle;
          if (f.angle > target) {
            f.angle = Math.max(target, f.angle - flipUpSpeed * dt);
          } else if (f.angle < target) {
            f.angle = Math.min(target, f.angle + flipDownSpeed * dt);
          }
          f.av = (f.angle - f.prevAngle) / dt;
        }

        if (plunger.keyHold) plunger.pull = Math.min(1, plunger.pull + 1.6 * dt);

        stepFleet(dt, now);
        stepBullets(dt, now);
        stepPowerups(dt, now);
        stepLasers(dt, now);
        if (gameOver) {
          stepDebris(dt);
          return;
        }

        const lf = flippers[0],
          rf = flippers[1];
        for (const b of balls) {
          if (b.inLane) {
            // riding the quarter curve at the top of the lane: the rail
            // carries the ball from moving straight up to moving left, then
            // flings it out toward the top center of the playfield
            if (b.curveA != null) {
              b.railV -= gravity * Math.cos(b.curveA) * dt;
              if (b.railV <= 0) {
                // ran out of steam on the curve: drop back down the straight
                b.curveA = null;
                b.x = laneCX;
                b.y = curveStartY;
                b.vy = 0;
              } else {
                b.curveA += (b.railV / curveR) * dt;
                if (b.curveA >= Math.PI / 2) {
                  b.inLane = false;
                  gameStarted = true;
                  b.x = laneCX - curveR;
                  b.y = curveStartY - curveR;
                  b.vx = -Math.min(b.railV * 0.7, 760 * physScale);
                  b.vy = 0;
                } else {
                  b.x = laneCX - curveR + curveR * Math.cos(b.curveA);
                  b.y = curveStartY - curveR * Math.sin(b.curveA);
                }
              }
              continue;
            }
            // straight run: pure vertical motion, no drag, riding the plunger
            b.vy += gravity * dt;
            b.y += b.vy * dt;
            const restY = plungerRestTop + plunger.pull * plungerTravel - b.r;
            if (b.y >= restY) {
              b.y = restY;
              if (b.vy > 0) b.vy = -b.vy * 0.25;
              if (Math.abs(b.vy) < 60) b.vy = 0;
            }
            if (b.y <= curveStartY && b.vy < 0) {
              b.curveA = 0;
              b.railV = -b.vy;
              b.y = curveStartY;
            }
            continue;
          }

          b.vy += gravity * dt;
          b.vx *= ballDrag;
          b.vy *= ballDrag;
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.angle += b.av * dt;
          b.av *= 0.995;

          // outer walls (top and sides; the bottom is the drain)
          if (b.x < b.r) {
            b.x = b.r;
            if (b.vx < 0) b.vx = -b.vx * WALL_REST;
          }
          if (b.x > W - b.r) {
            b.x = W - b.r;
            if (b.vx > 0) b.vx = -b.vx * WALL_REST;
          }
          if (b.y < b.r && b.vy < 0) {
            b.y = b.r;
            b.vy = -b.vy * WALL_REST;
          }

          // funnel guides steering the ball onto the flippers; same collision
          // thickness as the blades so there's no bump at the pivot junction
          collideSegment(b, -20, funnelTopY, lf.px, lf.py, FUNNEL_REST, lf.thick);
          collideSegment(b, W + 20, funnelTopY, rf.px, rf.py, FUNNEL_REST, rf.thick);

          for (const f of flippers) {
            const sweep = f.angle - f.prevAngle;
            const n = Math.max(1, Math.ceil(Math.abs(sweep) / 0.05));
            for (let k = 1; k <= n; k++) collideFlipper(b, f, f.prevAngle + (sweep * k) / n);
          }
          for (const inv of invaders) collideInvader(b, inv, now);
        }

        // ball-ball collisions (multiball): equal-mass bounce
        for (let i = 0; i < balls.length; i++) {
          for (let j = i + 1; j < balls.length; j++) {
            const a = balls[i],
              b = balls[j];
            if (a.inLane || b.inLane) continue;
            let dx = b.x - a.x,
              dy = b.y - a.y;
            const minD = a.r + b.r;
            const d2 = dx * dx + dy * dy;
            if (d2 >= minD * minD) continue;
            const d = Math.sqrt(d2) || 0.0001;
            const nx = dx / d,
              ny = dy / d;
            const corr = (minD - d) / 2;
            a.x -= nx * corr;
            a.y -= ny * corr;
            b.x += nx * corr;
            b.y += ny * corr;
            const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
            if (vn < 0) {
              const jImp = (-(1 + 0.85) * vn) / 2;
              a.vx -= jImp * nx;
              a.vy -= jImp * ny;
              b.vx += jImp * nx;
              b.vy += jImp * ny;
            }
          }
        }

        // drain
        const before = balls.length;
        balls = balls.filter((b) => b.y < H + b.r * 3);
        if (before > 0 && balls.length === 0) {
          if (respawnsUsed >= MAX_RESPAWNS) {
            triggerGameOver('out of balls');
          } else {
            respawnAt = now + 900;
          }
        }

        stepDebris(dt);
      }

      // --- drawing ---
      function draw(now) {
        ctx.clearRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const ink = inkColor();

        // side walls; the right one yields to the shooter lane while it's
        // visible so the lane reads as the boundary, and returns as it fades
        ctx.fillStyle = ink;
        ctx.font = targetFont + 'px ' + MONO;
        ctx.globalAlpha = 0.3;
        for (let y = cellH; y < funnelTopY - cellH; y += cellH * 2) {
          ctx.fillText('|', 8, y);
        }
        ctx.globalAlpha = 0.3 * (1 - laneAlpha);
        if (ctx.globalAlpha > 0.01) {
          for (let y = cellH; y < funnelTopY - cellH; y += cellH * 2) {
            ctx.fillText('|', W - 8, y);
          }
        }
        ctx.globalAlpha = 1;

        // funnels; the stretch of the right guide that crosses the shooter
        // lane hides with the lane overlay, as if the tube sits on top of
        // the board there
        const lf = flippers[0],
          rf = flippers[1];
        ctx.globalAlpha = 0.65;
        drawSegmentChars(0, funnelTopY, lf.px, lf.py, '\\', targetFont);
        drawSegmentChars(W, funnelTopY, rf.px, rf.py, '/', targetFont, (x) =>
          x > laneX - cellW ? 1 - laneAlpha : 1
        );
        ctx.globalAlpha = 1;

        // the invader fleet; specials wear their color
        for (const inv of invaders) {
          if (!inv.alive) continue;
          const ix = fleet.x + inv.hx,
            iy = fleet.y + inv.hy;
          const flashing = now < inv.flashT;
          ctx.fillStyle = inv.special ? specialColor(inv.hue) : ink;
          ctx.font = (flashing ? Math.round(targetFont * 1.25) : targetFont) + 'px ' + MONO;
          for (const cell of inv.cells) {
            if (!cell.alive) continue;
            const jx = flashing ? (Math.random() - 0.5) * 3 : 0;
            const jy = flashing ? (Math.random() - 0.5) * 3 : 0;
            ctx.fillText(cell.ch, ix + cell.dx + jx, iy + cell.dy + jy);
          }
        }
        ctx.fillStyle = ink;

        // dead invaders tumbling out, specials still in their color
        ctx.font = targetFont + 'px ' + MONO;
        for (const fa of fallers) {
          ctx.fillStyle = fa.hue != null ? specialColor(fa.hue) : ink;
          ctx.translate(fa.x, fa.y);
          ctx.rotate(fa.angle);
          for (const cell of fa.cells) ctx.fillText(cell.ch, cell.dx, cell.dy);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        ctx.fillStyle = ink;

        // invader bullets: oversized and cycling through the whole
        // rainbow with a soft glow so incoming fire stands out from the
        // monochrome playfield; kept darker on the light theme so the
        // yellow-green stretch doesn't wash out on white
        const pulse = 0.5 + 0.5 * Math.sin(now / 90);
        const bulletHue = Math.round((now / 4) % 360);
        const bulletL = isDark() ? 52 + pulse * 12 : 38 + pulse * 6;
        ctx.font = Math.round(targetFont * (1.35 + pulse * 0.4)) + 'px ' + MONO;
        ctx.fillStyle = 'hsl(' + bulletHue + ', 95%, ' + Math.round(bulletL) + '%)';
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 4 + pulse * 8;
        for (const bl of bullets) ctx.fillText('!', bl.x, bl.y);
        ctx.shadowBlur = 0;
        ctx.fillStyle = ink;

        // the dropped plus signs: the emoji itself is a fixed color, so the
        // rainbow comes from a hue-cycling glow behind it, and it breathes
        // in and out so it reads as loot rather than debris
        for (const pu of powerups) {
          const puHue = Math.round((now / 3 + pu.born / 6) % 360);
          const beat = 0.5 + 0.5 * Math.sin((now - pu.born) / 110);
          ctx.font = Math.round(pu.r * 1.7 * (0.88 + beat * 0.28)) + 'px ' + MONO;
          ctx.shadowColor = 'hsl(' + puHue + ', 95%, 55%)';
          ctx.shadowBlur = 10 + beat * 14;
          // stacked passes deepen the halo without washing out the glyph
          for (let i = 0; i < 3; i++) ctx.fillText('➕', pu.x, pu.y);
          ctx.shadowBlur = 0;
        }

        // laser crosses: four beams out of the collection point, each a
        // rolling rainbow gradient that fades as the blast dies
        ctx.lineCap = 'round';
        for (const la of lasers) {
          const a = Math.max(0, Math.min(1, la.life));
          ctx.globalAlpha = a;
          ctx.lineWidth = LASER_HALF_W * 2 * physScale * (0.5 + a * 0.5);
          ctx.shadowBlur = 16;
          for (const [dx, dy] of LASER_DIRS) {
            const ex = la.x + dx * la.len,
              ey = la.y + dy * la.len;
            const grad = ctx.createLinearGradient(la.x, la.y, ex, ey);
            for (let i = 0; i <= 6; i++) {
              grad.addColorStop(
                i / 6,
                'hsl(' + ((la.hue + i * 60 + now / 2) % 360) + ', 95%, 58%)'
              );
            }
            ctx.strokeStyle = grad;
            ctx.shadowColor = 'hsl(' + ((la.hue + now / 2) % 360) + ', 95%, 58%)';
            ctx.beginPath();
            ctx.moveTo(la.x, la.y);
            ctx.lineTo(ex, ey);
            ctx.stroke();
          }
          ctx.shadowBlur = 0;
        }
        ctx.globalAlpha = 1;
        ctx.fillStyle = ink;

        // flippers: upright chars laid along the swinging segment
        ctx.font = flipFont + 'px ' + MONO;
        for (const f of flippers) {
          const c = Math.cos(f.angle),
            s = Math.sin(f.angle);
          const dx = -f.side * c,
            dy = s;
          const n = Math.max(4, Math.round(f.len / (flipCharW * 0.85)));
          for (let i = 0; i <= n; i++) {
            const t = i / n;
            const ch = i === n ? '#' : '=';
            ctx.fillText(ch, f.px + dx * f.len * t, f.py + dy * f.len * t);
          }
        }

        // shooter lane raceway, overlaid on the playfield: straight channel
        // up the right edge into a quarter curve at the top, plus the spring
        // plunger; only visible while a ball needs launching
        if (laneAlpha > 0.01) {
          ctx.font = targetFont + 'px ' + MONO;
          ctx.globalAlpha = 0.65 * laneAlpha;
          for (let y = curveStartY + cellH; y < H; y += cellH) {
            ctx.fillText('|', laneX, y);
            ctx.fillText('|', W - 8, y);
          }
          const ccx = laneCX - curveR,
            ccy = curveStartY;
          // outer arc sized to land exactly on the outer wall column at
          // W - 8, so the curve joins the vertical run instead of ending
          // clipped at the screen edge
          drawArcChars(ccx, ccy, W - 8 - ccx, 0, Math.PI / 2);
          drawArcChars(ccx, ccy, curveR - laneW / 2, 0, Math.PI / 2);
          const pTop = plungerRestTop + plunger.pull * plungerTravel;
          ctx.globalAlpha = 0.85 * laneAlpha;
          ctx.fillText('==', laneCX, pTop);
          const coilTop = pTop + cellH;
          const coilBot = H - 8;
          for (let i = 0; i < 4; i++) {
            ctx.fillText('w', laneCX, coilTop + ((coilBot - coilTop) * i) / 3);
          }
          ctx.globalAlpha = 1;
        }

        // loose glyph particles
        ctx.font = targetFont + 'px ' + MONO;
        for (const p of particles) {
          ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
          if (p.angle) {
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);
            ctx.fillText(p.ch, 0, 0);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          } else {
            ctx.fillText(p.ch, p.x, p.y);
          }
        }
        ctx.globalAlpha = 1;

        // balls
        for (const b of balls) {
          ctx.font = Math.round(b.r * 2) + 'px ' + MONO;
          if (b.angle) {
            ctx.translate(b.x, b.y);
            ctx.rotate(b.angle);
            ctx.fillText(b.ch, 0, 0);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          } else {
            ctx.fillText(b.ch, b.x, b.y);
          }
        }

        // score pops
        ctx.font = '13px ' + MONO;
        for (const p of pops) {
          ctx.fillStyle = p.color || ink;
          ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
          ctx.fillText(p.text, p.x, p.y);
        }
        ctx.globalAlpha = 1;
        ctx.fillStyle = ink;

        // score + wave + personal best
        ctx.textAlign = 'left';
        ctx.globalAlpha = 0.85;
        ctx.font = '14px ' + MONO;
        const sTxt = (score < 0 ? '-' : '') + String(Math.abs(score)).padStart(6, '0');
        const ballsLeft = Math.max(0, MAX_RESPAWNS - respawnsUsed);
        ctx.fillText('score ' + sTxt + ' · wave ' + wave + ' · balls ' + ballsLeft, 12, 22);
        ctx.globalAlpha = 1;
        ctx.textAlign = 'center';

        if (gameOver) {
          const gy = H * 0.32;
          // punch a clear window through the playfield so the card and
          // scoreboard stay readable over whatever the fleet left behind
          ctx.clearRect(W * 0.06, gy - 44, W * 0.88, 178 + hsList.length * 20);
          ctx.globalAlpha = 0.92;
          ctx.font = 'bold ' + Math.max(26, Math.min(44, Math.round(W / 14))) + 'px ' + MONO;
          ctx.fillText('GAME OVER', W / 2, gy);
          ctx.font = '14px ' + MONO;
          ctx.fillText(gameOver, W / 2, gy + 34);
          // the restart prompt only appears once the brief lockout is over
          if (now - gameOverAt >= GAME_OVER_LOCK_MS) {
            ctx.fillText('press r or tap to restart', W / 2, gy + 56);
          }
          // the local scoreboard, this run's entry marked with its rank
          if (hsList.length) {
            ctx.font = '13px ' + MONO;
            ctx.globalAlpha = 0.6;
            ctx.fillText('— high scores —', W / 2, gy + 96);
            for (let i = 0; i < hsList.length; i++) {
              const e = hsList[i];
              const mine = i === hsRank;
              ctx.globalAlpha = mine ? 0.95 : 0.6;
              if (mine) ctx.fillStyle = '#cc4444';
              // wave padded so every row is the same width, and the marker
              // drawn separately so this run's row stays in column with the
              // rest instead of being pushed left by the extra characters
              const line =
                i +
                1 +
                '. ' +
                String(e.score).padStart(6, '0') +
                '  wave ' +
                String(e.wave).padStart(2, ' ') +
                '  ' +
                e.date;
              const ly = gy + 118 + i * 20;
              ctx.fillText(line, W / 2, ly);
              if (mine) {
                ctx.fillText('◄', W / 2 + ctx.measureText(line).width / 2 + 14, ly);
                ctx.fillStyle = ink;
              }
            }
          }
          ctx.globalAlpha = 1;
        }
      }

      // Trace a quarter arc (angles measured up from +x, y up) in glyphs that
      // roughly follow the local tangent: | on the vertical stretch, \ in the
      // middle, - as the curve flattens out.
      function drawArcChars(cx, cy, r, a0, a1) {
        const n = Math.max(3, Math.round((r * (a1 - a0)) / (cellH * 0.9)));
        for (let i = 0; i <= n; i++) {
          const a = a0 + ((a1 - a0) * i) / n;
          const ch = a < Math.PI / 8 ? '|' : a > (3 * Math.PI) / 8 ? '-' : '\\';
          ctx.fillText(ch, cx + r * Math.cos(a), cy - r * Math.sin(a));
        }
      }

      // alphaAt(x, y), when given, scales the current alpha per character so
      // callers can dim just a stretch of the segment.
      function drawSegmentChars(x1, y1, x2, y2, ch, font, alphaAt) {
        ctx.font = font + 'px ' + MONO;
        const len = Math.hypot(x2 - x1, y2 - y1);
        const n = Math.max(2, Math.round(len / (cellH * 1.1)));
        const base = ctx.globalAlpha;
        for (let i = 0; i <= n; i++) {
          const t = i / n;
          const x = x1 + (x2 - x1) * t,
            y = y1 + (y2 - y1) * t;
          if (alphaAt) ctx.globalAlpha = base * alphaAt(x, y);
          ctx.fillText(ch, x, y);
        }
        ctx.globalAlpha = base;
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        layout();
        buildFleet();
        for (const b of balls) {
          if (b.inLane) {
            b.x = laneCX;
            b.y = plungerRestTop + plunger.pull * plungerTravel - b.r;
            b.vy = 0;
            b.curveA = null;
            continue;
          }
          b.x = Math.max(b.r, Math.min(W - b.r, b.x));
          b.y = Math.min(b.y, H * 0.5);
        }
      }

      // The mouse only gets in the way once a game is under way: park it for a
      // beat and it disappears, any nudge brings it straight back.
      const CURSOR_IDLE_MS = 1400;
      let lastMouseAt = performance.now();
      let cursorHidden = false;
      window.addEventListener('mousemove', () => {
        lastMouseAt = performance.now();
      });
      function updateCursor(now) {
        const hide = gameStarted && !gameOver && now - lastMouseAt > CURSOR_IDLE_MS;
        if (hide === cursorHidden) return;
        cursorHidden = hide;
        document.body.classList.toggle('hide-cursor', hide);
      }

      let lastT = performance.now();
      let acc = 0;
      const FIXED = 1 / 120; // seconds
      function frame(now) {
        let elapsed = (now - lastT) / 1000;
        lastT = now;
        if (elapsed > 0.05) elapsed = 0.05; // clamp after tab switch / hitch
        acc += elapsed;
        let iters = 0;
        while (acc >= FIXED && iters++ < 8) {
          step(FIXED, now);
          acc -= FIXED;
        }
        if (!gameOver && balls.length === 0 && now >= respawnAt) {
          respawnsUsed++;
          spawnBall();
        }
        updateCursor(now);
        draw(now);
        requestAnimationFrame(frame);
      }

      // --- input ---
      // A press in the shooter lane grabs the plunger (drag down to pull);
      // bottom-left / bottom-right presses elsewhere work the flippers.
      const pointerSides = new Map(); // pointerId -> flipper

      function localPoint(e) {
        const rect = canvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      }

      canvas.addEventListener('pointerdown', (e) => {
        hideHint();
        if (gameOver) {
          reset();
          return;
        }
        const p = localPoint(e);
        if (p.x > laneX && balls.some((b) => b.inLane)) {
          plunger.pointerId = e.pointerId;
          plunger.grabY = p.y - plunger.pull * plungerTravel * 1.3;
          if (canvas.setPointerCapture) {
            try {
              canvas.setPointerCapture(e.pointerId);
            } catch (_) {}
          }
          return;
        }
        if (p.y >= H * 0.55) {
          const f = p.x < W / 2 ? flippers[0] : flippers[1];
          f.pressed = true;
          pointerSides.set(e.pointerId, f);
          if (canvas.setPointerCapture) {
            try {
              canvas.setPointerCapture(e.pointerId);
            } catch (_) {}
          }
        }
      });

      canvas.addEventListener('pointermove', (e) => {
        if (plunger.pointerId !== e.pointerId) return;
        const p = localPoint(e);
        plunger.pull = Math.max(0, Math.min(1, (p.y - plunger.grabY) / (plungerTravel * 1.3)));
      });

      function releasePointer(e) {
        if (plunger.pointerId === e.pointerId) {
          plunger.pointerId = null;
          releasePlunger();
        }
        const f = pointerSides.get(e.pointerId);
        if (!f) return;
        pointerSides.delete(e.pointerId);
        // Only drop the flipper if no other pointer is still holding it.
        let held = false;
        for (const other of pointerSides.values()) if (other === f) held = true;
        if (!held) f.pressed = false;
      }
      canvas.addEventListener('pointerup', releasePointer);
      canvas.addEventListener('pointercancel', releasePointer);
      // iOS Safari: stop scroll/zoom gestures from stealing touches.
      canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

      function setFlipperKey(e, down) {
        if (gameOver) return false;
        if (e.key === 'ArrowLeft' || e.key === 'z' || e.key === 'Z') {
          flippers[0].pressed = down;
          return true;
        }
        if (e.key === 'ArrowRight' || e.key === '/') {
          flippers[1].pressed = down;
          return true;
        }
        if (e.key === ' ') {
          flippers[0].pressed = down;
          flippers[1].pressed = down;
          return true;
        }
        return false;
      }

      function reset() {
        // right after game over, ignore restarts briefly so a stray tap or
        // held key can't skip past the card before it registers
        if (gameOver && performance.now() - gameOverAt < GAME_OVER_LOCK_MS) return;
        // a run abandoned mid-game still counts toward the scoreboard
        if (!gameOver) recordHighScore(score, wave);
        score = 0;
        wave = 1;
        balls = [];
        bullets = [];
        fallers = [];
        powerups = [];
        lasers = [];
        particles = [];
        pops = [];
        nextWaveAt = 0;
        gameOver = null;
        gameStarted = false;
        fleetProvoked = false;
        respawnsUsed = 0;
        plunger.pull = 0;
        plunger.pointerId = null;
        plunger.keyHold = false;
        buildFleet();
        spawnBall();
      }

      document.addEventListener('keydown', (e) => {
        if (setFlipperKey(e, true)) {
          e.preventDefault();
        } else if (e.key === 'ArrowDown') {
          if (!gameOver) plunger.keyHold = true;
          e.preventDefault();
        } else if ((e.key === 'r' || e.key === 'R') && !e.repeat) {
          reset();
        }
      });
      document.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowDown') {
          plunger.keyHold = false;
          releasePlunger();
          return;
        }
        setFlipperKey(e, false);
      });

      // --- hint + controls ---
      // The hint bar stays hidden until the ? button is pressed, and any
      // press on the playfield dismisses it again.
      const hintEl = document.getElementById('hint');
      Common.initHintUpdated({ hintEl });
      function showHint() {
        hintEl.classList.remove('hidden');
      }
      function hideHint() {
        hintEl.classList.add('hidden');
      }
      document.getElementById('help').addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        if (hintEl.classList.contains('hidden')) showHint();
        else hideHint();
      });
      document.getElementById('hb-reset').addEventListener('click', () => {
        reset();
      });
      document.getElementById('hb-dark').addEventListener('click', () => {
        Common.toggleDark();
      });
      document.getElementById('hb-sitemap').addEventListener('click', Common.openSitemap);
      Common.initSitemapShortcut();

      let resizeTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resize, 150);
      });

      resize();
      spawnBall();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
