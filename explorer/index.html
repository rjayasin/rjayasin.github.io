<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruvan / explorer</title>
    <link rel="icon" id="favicon" />
    <link rel="stylesheet" href="/common.css" />
    <style>
      :root {
        --scale: 1;
        --muted: rgba(0, 0, 0, 0.45);
        --faint: rgba(0, 0, 0, 0.3);
        --line: rgba(0, 0, 0, 0.12);
        --hover: rgba(0, 0, 0, 0.05);
        --star: #e7b416;
        --side-bg: #fafafa;
        --search-base: 40px;
      }
      body.dark {
        --muted: rgba(255, 255, 255, 0.5);
        --faint: rgba(255, 255, 255, 0.35);
        --line: rgba(255, 255, 255, 0.16);
        --hover: rgba(255, 255, 255, 0.07);
        --side-bg: #161616;
      }
      @media (prefers-color-scheme: dark) {
        body:not(.light) {
          --muted: rgba(255, 255, 255, 0.5);
          --faint: rgba(255, 255, 255, 0.35);
          --line: rgba(255, 255, 255, 0.16);
          --hover: rgba(255, 255, 255, 0.07);
          --side-bg: #161616;
        }
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: 'Times New Roman', Times, Georgia, serif;
        overflow: hidden;
      }
      #app {
        display: flex;
        height: 100vh;
        height: 100dvh;
      }
      #main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      /* --- Search --- */
      #search-area {
        position: relative;
        padding: 16px;
        border-bottom: 1px solid var(--line);
        z-index: 5;
      }
      #search-row {
        position: relative;
        max-width: 560px;
        margin: 0 auto;
      }
      #search {
        font: inherit;
        font-size: calc(var(--search-base) * var(--scale));
        text-align: center;
        background: transparent;
        color: inherit;
        border: none;
        outline: none;
        display: block;
        width: 100%;
        /* symmetric padding keeps the word page-centered while clearing the star */
        padding: 0 44px;
        box-sizing: border-box;
      }
      #search::placeholder {
        color: var(--faint);
      }
      #fav-btn {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        font-size: calc(24px * var(--scale));
        line-height: 1;
        background: none;
        border: none;
        cursor: pointer;
        color: var(--faint);
        padding: 4px;
      }
      #fav-btn.active {
        color: var(--star);
      }
      #fav-btn[hidden] {
        display: none;
      }

      /* --- Suggestions --- */
      #suggestions {
        position: absolute;
        top: calc(100% + 12px);
        left: 50%;
        transform: translateX(-50%);
        width: min(440px, calc(100vw - 48px));
        background: #fff;
        border: 1.5px solid rgba(0, 0, 0, 0.8);
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        z-index: 50;
      }
      body.dark #suggestions {
        background: #191919;
        border-color: rgba(255, 255, 255, 0.8);
      }
      @media (prefers-color-scheme: dark) {
        body:not(.light) #suggestions {
          background: #191919;
          border-color: rgba(255, 255, 255, 0.8);
        }
      }
      .suggestion {
        padding: 10px 16px;
        font-size: calc(16px * var(--scale));
        cursor: pointer;
      }
      .suggestion + .suggestion {
        border-top: 1px solid var(--line);
      }
      .suggestion.highlighted {
        background: var(--hover);
      }

      /* --- Content --- */
      #content {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 24px 0 96px;
        transition: opacity 0.18s ease; /* keep in sync with FADE_MS */
      }
      #content.centered {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .placeholder {
        font-size: calc(18px * var(--scale));
        font-style: italic;
        color: var(--faint);
      }
      .section-title {
        font-size: calc(14px * var(--scale));
        font-weight: 600;
        color: var(--muted);
        margin-bottom: 10px;
      }
      .def-block {
        padding: 16px 32px;
      }
      .def-entry + .def-entry {
        border-top: 1px solid var(--line);
        margin-top: 20px;
        padding-top: 20px;
      }
      .def-head {
        margin-bottom: 8px;
      }
      .def-term {
        font-size: calc(24px * var(--scale));
        font-weight: 600;
      }
      .def-pos {
        font-size: calc(14px * var(--scale));
        font-style: italic;
        color: var(--muted);
        margin-left: 6px;
      }
      .def-phon {
        font-size: calc(15px * var(--scale));
        color: var(--muted);
        margin-left: 8px;
      }
      .phon-audio {
        font: inherit;
        font-size: calc(14px * var(--scale));
        line-height: 1;
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        padding: 2px 4px;
        margin-left: 2px;
      }
      .phon-audio:hover {
        color: inherit;
      }
      .def-body {
        font-size: calc(16px * var(--scale));
        line-height: 1.55;
      }
      .sense {
        margin: 4px 0;
      }
      .example {
        color: var(--muted);
        font-style: italic;
      }
      .origin-text {
        font-size: calc(16px * var(--scale));
        line-height: 1.55;
      }
      .w {
        border-radius: 2px;
      }
      @media (hover: hover) {
        .w:hover {
          background: var(--hover);
        }
      }
      /* Tap feedback: shows during the content fade-out, then the re-render
         replaces the span. var(--line) doubles as a highlight strong enough
         to read on mobile in both themes. */
      .w.tapped {
        background: var(--line);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      #syn-divider {
        border: none;
        border-top: 1px solid var(--line);
        margin: 8px 32px;
      }
      #synonyms {
        padding: 16px 32px;
      }
      #syn-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .syn-tag {
        font: inherit;
        font-size: calc(14px * var(--scale));
        color: inherit;
        background: none;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 6px 12px;
        cursor: pointer;
      }
      .syn-tag:hover {
        background: var(--hover);
      }
      .syn-status {
        font-size: calc(14px * var(--scale));
        font-style: italic;
        color: var(--faint);
      }
      /* Synonyms arrive after the definition; fade them in on swap. */
      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      #syn-tags,
      .syn-status {
        animation: fade-in 0.2s ease;
      }
      button,
      .suggestion,
      .side-item,
      .w {
        touch-action: manipulation;
      }
      @media (max-width: 700px) {
        :root {
          --search-base: 30px;
        }
        .def-block,
        #synonyms {
          padding-left: 20px;
          padding-right: 20px;
        }
        #syn-divider {
          margin-left: 20px;
          margin-right: 20px;
        }
      }

      /* --- Sidebar / drawer --- */
      #sidebar {
        width: 200px;
        flex: none;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        scrollbar-width: thin;
        background: var(--side-bg);
      }
      .side-section {
        padding: 14px 10px;
      }
      .side-section + .side-section {
        border-top: 1px solid var(--line);
      }
      .side-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 8px;
        padding: 0 6px;
      }
      .side-title {
        font-size: calc(11px * var(--scale));
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #clear-history {
        font: inherit;
        font-size: calc(12px * var(--scale));
        color: var(--faint);
        background: none;
        border: none;
        cursor: pointer;
      }
      #clear-history:hover {
        color: var(--muted);
      }
      .side-empty {
        font-size: calc(13px * var(--scale));
        font-style: italic;
        color: var(--faint);
        padding: 4px 6px;
      }
      .side-item {
        position: relative;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 6px;
        border-radius: 5px;
        cursor: pointer;
        font-size: calc(14px * var(--scale));
        user-select: none;
        -webkit-user-select: none;
      }
      .side-item.current {
        background: var(--hover);
      }
      @media (hover: hover) {
        .side-item:hover {
          background: var(--hover);
        }
      }
      /* fixed-width icon column keeps favorite and history terms aligned */
      .side-item .icon {
        flex: none;
        width: calc(14px * var(--scale));
        text-align: center;
        color: var(--faint);
      }
      .side-item .icon.star {
        color: var(--star);
        cursor: pointer;
        font-size: calc(11px * var(--scale));
      }
      .side-item .term {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .side-item .remove {
        flex: none;
        background: none;
        border: none;
        color: var(--faint);
        font: inherit;
        font-size: calc(13px * var(--scale));
        cursor: pointer;
        padding: 0 2px;
      }
      @media (hover: hover) {
        .side-item .remove {
          visibility: hidden;
        }
        .side-item:hover .remove {
          visibility: visible;
        }
      }
      .side-item .grip {
        flex: none;
        color: var(--faint);
        cursor: grab;
        touch-action: none;
        padding: 0 2px;
        font-size: calc(11px * var(--scale));
      }
      /* on hover-capable devices the grips stay out of sight until needed
         (they keep their space so rows don't shift); always shown on touch */
      @media (hover: hover) {
        .side-item .grip {
          opacity: 0;
          transition: opacity 0.15s ease;
        }
        .side-item:hover .grip {
          opacity: 1;
        }
      }
      .side-item.dragging {
        opacity: 0.4;
      }
      .drop-indicator {
        height: 2px;
        border-radius: 1px;
        background: var(--star);
        margin: 2px 8px;
      }

      /* Lives inside the header: vertically centered in it, sized like the
         favorite star. The open mobile drawer (z-index 80) covers it. */
      #panel-btn {
        position: absolute;
        top: 50%;
        left: 8px;
        transform: translateY(-50%);
        /* above the full-width search input, which would steal its taps */
        z-index: 10;
        font: inherit;
        font-size: calc(24px * var(--scale));
        line-height: 1;
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        padding: 6px 10px;
      }
      #backdrop {
        display: none;
      }

      @media (max-width: 859px) {
        #sidebar {
          position: fixed;
          top: 0;
          left: 0;
          bottom: 0;
          width: min(260px, 80vw);
          transform: translateX(-100%);
          transition: transform 0.25s ease;
          z-index: 80;
          padding-top: 8px;
        }
        #sidebar.open {
          transform: translateX(0);
          box-shadow: 0 0 24px rgba(0, 0, 0, 0.25);
        }
        #backdrop {
          display: block;
          position: fixed;
          inset: 0;
          background: rgba(0, 0, 0, 0.35);
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.25s ease;
          z-index: 70;
        }
        #backdrop.open {
          opacity: 1;
          pointer-events: auto;
        }
      }
      @media (min-width: 860px) {
        #sidebar.collapsed {
          display: none;
        }
        /* the sidebar sits to the left of #main, so mirror its width on the
           right to keep the search word centered on the page */
        #search-area {
          padding-right: calc(16px + 200px);
        }
        #sidebar.collapsed ~ #main #search-area {
          padding-right: 16px;
        }
      }

      /* --- Hint bar --- */
      #hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        text-align: center;
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 12px;
        color: #888;
        opacity: 1;
        transition: opacity 0.4s ease;
        user-select: none;
        z-index: 65;
        padding: 8px 8px 12px;
        /* opaque so scrolling content doesn't show through the bar */
        background: #fff;
      }
      body.dark #hint {
        background: #111;
      }
      @media (prefers-color-scheme: dark) {
        body:not(.light) #hint {
          background: #111;
        }
      }
      #hint.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #hint .hint-btn {
        cursor: pointer;
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 2px;
      }
      #hint .hint-btn:hover {
        color: #333;
      }
      body.dark #hint .hint-btn:hover {
        color: #ccc;
      }
      #hint-zone {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 50px;
        z-index: 64;
      }
    </style>
    <script src="/common.js"></script>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="side-section">
          <div class="side-head"><span class="side-title">Favorites</span></div>
          <div id="favorites-list"></div>
        </div>
        <div class="side-section">
          <div class="side-head">
            <span class="side-title">History</span>
            <button id="clear-history" hidden>Clear</button>
          </div>
          <div id="history-list"></div>
        </div>
      </aside>
      <main id="main">
        <header id="search-area">
          <button id="panel-btn" title="Toggle panel (h)">☰</button>
          <div id="search-row">
            <input
              id="search"
              type="text"
              placeholder="Search word"
              autocomplete="off"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              enterkeyhint="search"
            />
            <button id="fav-btn" hidden title="Toggle favorite (f)">☆</button>
            <div id="suggestions" hidden></div>
          </div>
        </header>
        <div id="content" class="centered">
          <div class="placeholder">Enter a word to explore</div>
        </div>
      </main>
    </div>
    <div id="backdrop"></div>
    <div id="hint">
      <span id="hint-inner">
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-fav">f favorite</span></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"><span class="hint-btn" id="hb-panel">h panel</span></span>
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"><span class="hint-btn" id="hb-defs">d defs</span></span>
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"><span class="hint-btn" id="hb-syns">y syns</span></span>
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-etym">e etymology</span></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-fi">+</span>/<span class="hint-btn" id="hb-fd">−</span>
          font</span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-dark"
            >1 <span class="hb-dark-label">dark</span></span
          ></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-sitemap">s sitemap</span></span
        >
      </span>
    </div>
    <div id="hint-zone"></div>
    <script>
      Common.paintFaviconR();
      Common.initDarkMode();
      Common.initSitemapShortcut();

      // ---------- Persistence ----------
      const WORDS_KEY = 'explorer-words';
      const PREFS_KEY = 'explorer-prefs';

      function loadJSON(key, fallback) {
        try {
          const v = JSON.parse(localStorage.getItem(key));
          return v == null ? fallback : v;
        } catch {
          return fallback;
        }
      }

      // entries: [{ term, date (ms), fav (bool), order (number) }]
      let entries = loadJSON(WORDS_KEY, []).filter((e) => e && typeof e.term === 'string');
      const prefs = Object.assign(
        { scale: 1, defs: true, syns: true, sidebar: true },
        loadJSON(PREFS_KEY, {})
      );

      function saveEntries() {
        localStorage.setItem(WORDS_KEY, JSON.stringify(entries));
      }
      function savePrefs() {
        localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
      }

      // ---------- State ----------
      let currentWord = '';
      let currentDef = null; // { term, sections: [{pos, senses:[{text, example}]}], origin }
      let synonyms = [];
      let synLoading = false;
      let lookupSeq = 0;
      const synCache = new Map();
      const isCoarse = window.matchMedia('(pointer: coarse)').matches;
      const isDesktop = () => window.matchMedia('(min-width: 860px)').matches;

      // ---------- Elements ----------
      const searchEl = document.getElementById('search');
      const favBtn = document.getElementById('fav-btn');
      const suggestionsEl = document.getElementById('suggestions');
      const contentEl = document.getElementById('content');
      const sidebarEl = document.getElementById('sidebar');
      const backdropEl = document.getElementById('backdrop');
      const favoritesListEl = document.getElementById('favorites-list');
      const historyListEl = document.getElementById('history-list');
      const clearHistoryBtn = document.getElementById('clear-history');

      // ---------- Font scaling ----------
      function applyScale() {
        document.documentElement.style.setProperty('--scale', prefs.scale);
      }
      function bumpScale(delta) {
        prefs.scale = Math.round(Math.min(2, Math.max(0.5, prefs.scale + delta)) * 10) / 10;
        savePrefs();
        applyScale();
      }
      applyScale();

      // ---------- Definitions: dictionaryapi.dev with Datamuse fallback ----------
      const POS_ABBR = { n: 'noun', v: 'verb', adj: 'adjective', adv: 'adverb', u: '' };

      async function fetchDefinition(term) {
        try {
          const r = await fetch(
            'https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(term)
          );
          if (r.ok) {
            const data = await r.json();
            if (Array.isArray(data) && data.length) {
              const sections = [];
              let origin = '';
              let phonetic = '';
              let audio = '';
              for (const entry of data) {
                if (entry.origin && !origin) origin = entry.origin;
                if (entry.phonetic && !phonetic) phonetic = entry.phonetic;
                for (const p of entry.phonetics || []) {
                  if (p.text && !phonetic) phonetic = p.text;
                  if (p.audio && !audio) audio = p.audio;
                }
                for (const meaning of entry.meanings || []) {
                  sections.push({
                    pos: meaning.partOfSpeech || '',
                    senses: (meaning.definitions || []).map((d) => ({
                      text: d.definition || '',
                      example: d.example || '',
                    })),
                  });
                }
              }
              if (sections.length) return { term, sections, origin, phonetic, audio };
            }
          }
        } catch {
          /* fall through to Datamuse */
        }
        try {
          const r = await fetch(
            'https://api.datamuse.com/words?sp=' + encodeURIComponent(term) + '&md=dr&ipa=1&max=1'
          );
          if (!r.ok) return null;
          const data = await r.json();
          const match = data && data[0];
          if (!match || match.word !== term || !Array.isArray(match.defs)) return null;
          const ipa = (match.tags || []).find((t) => t.startsWith('ipa_pron:'));
          const phonetic = ipa ? ipa.slice('ipa_pron:'.length) : '';
          const byPos = new Map();
          for (const def of match.defs) {
            const tab = def.indexOf('\t');
            const pos = POS_ABBR[def.slice(0, tab)] ?? def.slice(0, tab);
            if (!byPos.has(pos)) byPos.set(pos, []);
            byPos.get(pos).push({ text: def.slice(tab + 1), example: '' });
          }
          const sections = [...byPos].map(([pos, senses]) => ({ pos, senses }));
          return sections.length ? { term, sections, origin: '', phonetic, audio: '' } : null;
        } catch {
          return null;
        }
      }

      // ---------- Synonyms: Datamuse rel_syn, top 20 by score, cached ----------
      async function fetchSynonyms(term) {
        if (synCache.has(term)) return synCache.get(term);
        const r = await fetch('https://api.datamuse.com/words?rel_syn=' + encodeURIComponent(term));
        if (!r.ok) throw new Error('api');
        const data = await r.json();
        const result = data
          .sort((a, b) => (b.score || 0) - (a.score || 0))
          .slice(0, 20)
          .map((d) => d.word);
        synCache.set(term, result);
        return result;
      }

      // ---------- Suggestions: Datamuse /sug ----------
      let suggestions = [];
      let highlighted = -1;
      let suggestDebounce = null;
      let suggestSeq = 0;

      function hideSuggestions() {
        suggestions = [];
        highlighted = -1;
        renderSuggestions();
      }

      function requestSuggestions(prefix) {
        clearTimeout(suggestDebounce);
        if (prefix.length < 2) {
          hideSuggestions();
          return;
        }
        suggestDebounce = setTimeout(async () => {
          const seq = ++suggestSeq;
          try {
            const r = await fetch(
              'https://api.datamuse.com/sug?s=' + encodeURIComponent(prefix) + '&max=5'
            );
            if (!r.ok) return;
            const data = await r.json();
            if (seq !== suggestSeq || document.activeElement !== searchEl) return;
            suggestions = data.map((d) => d.word);
            highlighted = -1;
            renderSuggestions();
          } catch {
            /* ignore */
          }
        }, 150);
      }

      function setHighlight(i) {
        highlighted = i;
        [...suggestionsEl.children].forEach((el, j) => el.classList.toggle('highlighted', j === i));
      }

      function renderSuggestions() {
        suggestionsEl.innerHTML = '';
        if (!suggestions.length) {
          suggestionsEl.hidden = true;
          return;
        }
        suggestions.forEach((word, i) => {
          const div = document.createElement('div');
          div.className = 'suggestion' + (i === highlighted ? ' highlighted' : '');
          div.textContent = word;
          // Highlight in place — rebuilding the list here breaks iOS Safari,
          // which fires a synthesized mouseenter before the tap's mouse events
          // and aborts them if the target is removed from the DOM.
          div.addEventListener('mouseenter', () => setHighlight(i));
          suggestionsEl.appendChild(div);
        });
        suggestionsEl.hidden = false;
      }

      // Select on pointerup (works for both mouse and touch, and fires before
      // the input's blur). pointerdown's preventDefault keeps the input
      // focused while tapping; the movement guard ignores scroll gestures.
      let suggestionTap = null;
      suggestionsEl.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        suggestionTap = { x: e.clientX, y: e.clientY };
      });
      suggestionsEl.addEventListener('pointerup', (e) => {
        const start = suggestionTap;
        suggestionTap = null;
        const item = e.target.closest('.suggestion');
        if (!item || !start) return;
        if (Math.hypot(e.clientX - start.x, e.clientY - start.y) > 10) return;
        const word = item.textContent;
        hideSuggestions();
        lookupWord(word);
      });

      // ---------- Rendering ----------
      function placeholder(text) {
        contentEl.className = 'centered';
        contentEl.innerHTML = '';
        const div = document.createElement('div');
        div.className = 'placeholder';
        div.textContent = text;
        contentEl.appendChild(div);
      }

      // Wrap alphabetic words in spans so they can be tapped (mobile) or
      // ⌘/Ctrl-clicked (desktop) to look them up.
      function linkifyWords(text) {
        const frag = document.createDocumentFragment();
        for (const token of text.split(/([A-Za-z][A-Za-z'’-]*)/)) {
          if (!token) continue;
          if (/^[A-Za-z]/.test(token)) {
            const span = document.createElement('span');
            span.className = 'w';
            span.textContent = token;
            frag.appendChild(span);
          } else {
            frag.appendChild(document.createTextNode(token));
          }
        }
        return frag;
      }

      function renderContent() {
        if (!currentWord) {
          placeholder('Enter a word to explore');
          return;
        }
        if (!currentDef) {
          placeholder(`No definition found for “${currentWord}”`);
          return;
        }
        contentEl.className = '';
        contentEl.innerHTML = '';

        if (prefs.defs) {
          const block = document.createElement('div');
          block.className = 'def-block';
          block.id = 'definitions';
          currentDef.sections.forEach((section, i) => {
            const entry = document.createElement('div');
            entry.className = 'def-entry';
            const head = document.createElement('div');
            head.className = 'def-head';
            const term = document.createElement('span');
            term.className = 'def-term';
            term.textContent = currentDef.term;
            head.appendChild(term);
            if (i === 0) {
              if (currentDef.phonetic) {
                const phon = document.createElement('span');
                phon.className = 'def-phon';
                phon.textContent = currentDef.phonetic.startsWith('/')
                  ? currentDef.phonetic
                  : `/${currentDef.phonetic}/`;
                head.appendChild(phon);
              }
              if (currentDef.audio) {
                const play = document.createElement('button');
                play.className = 'phon-audio';
                play.textContent = '🔊';
                play.title = 'Play pronunciation';
                play.addEventListener('click', () => new Audio(currentDef.audio).play());
                head.appendChild(play);
              }
            }
            if (section.pos) {
              const pos = document.createElement('span');
              pos.className = 'def-pos';
              pos.textContent = `(${section.pos})`;
              head.appendChild(pos);
            }
            entry.appendChild(head);
            const body = document.createElement('div');
            body.className = 'def-body';
            section.senses.forEach((sense) => {
              const line = document.createElement('div');
              line.className = 'sense';
              line.appendChild(document.createTextNode('• '));
              line.appendChild(linkifyWords(sense.text));
              if (sense.example) {
                const ex = document.createElement('span');
                ex.className = 'example';
                ex.appendChild(document.createTextNode(' — “'));
                ex.appendChild(linkifyWords(sense.example));
                ex.appendChild(document.createTextNode('”'));
                line.appendChild(ex);
              }
              body.appendChild(line);
            });
            entry.appendChild(body);
            block.appendChild(entry);
          });
          if (currentDef.origin) {
            const entry = document.createElement('div');
            entry.className = 'def-entry';
            const head = document.createElement('div');
            head.className = 'def-head';
            const term = document.createElement('span');
            term.className = 'def-term';
            term.textContent = currentDef.term;
            head.appendChild(term);
            const pos = document.createElement('span');
            pos.className = 'def-pos';
            pos.textContent = '(origin)';
            head.appendChild(pos);
            entry.appendChild(head);
            const body = document.createElement('div');
            body.className = 'origin-text';
            body.appendChild(linkifyWords(currentDef.origin));
            entry.appendChild(body);
            block.appendChild(entry);
          }
          contentEl.appendChild(block);
        }

        if (prefs.syns) {
          if (prefs.defs) {
            const hr = document.createElement('hr');
            hr.id = 'syn-divider';
            contentEl.appendChild(hr);
          }
          const block = document.createElement('div');
          block.id = 'synonyms';
          const title = document.createElement('div');
          title.className = 'section-title';
          title.textContent = 'Synonyms';
          block.appendChild(title);
          if (synLoading) {
            const status = document.createElement('div');
            status.className = 'syn-status';
            status.textContent = 'Loading synonyms…';
            block.appendChild(status);
          } else if (!synonyms.length) {
            const status = document.createElement('div');
            status.className = 'syn-status';
            status.textContent = 'No synonyms found';
            block.appendChild(status);
          } else {
            const tags = document.createElement('div');
            tags.id = 'syn-tags';
            synonyms.forEach((syn) => {
              const btn = document.createElement('button');
              btn.className = 'syn-tag';
              btn.textContent = syn;
              btn.addEventListener('click', () => lookupWord(syn));
              tags.appendChild(btn);
            });
            block.appendChild(tags);
          }
          contentEl.appendChild(block);
        }
      }

      // Tap (touch) or ⌘/Ctrl-click (desktop) a word in a definition to explore it.
      contentEl.addEventListener('click', (e) => {
        const span = e.target.closest('.w');
        if (!span) return;
        if (!isCoarse && !e.metaKey && !e.ctrlKey) return;
        const word = span.textContent.replace(/[^A-Za-z'’-]/g, '');
        if (!word) return;
        span.classList.add('tapped');
        lookupWord(word);
      });

      // ---------- Sidebar ----------
      function historyEntries() {
        return entries.filter((e) => !e.fav).sort((a, b) => b.date - a.date);
      }
      function favoriteEntries() {
        return entries.filter((e) => e.fav).sort((a, b) => a.order - b.order);
      }

      function makeSideItem(entry, kind) {
        const row = document.createElement('div');
        row.className = 'side-item' + (entry.term === currentWord ? ' current' : '');
        row.dataset.term = entry.term;

        if (kind === 'fav') {
          const grip = document.createElement('span');
          grip.className = 'grip';
          grip.textContent = '⠿';
          grip.title = 'Drag to reorder';
          row.appendChild(grip);
          const star = document.createElement('span');
          star.className = 'icon star';
          star.textContent = '★';
          star.title = 'Remove from favorites';
          star.addEventListener('click', (e) => {
            e.stopPropagation();
            setFavorite(entry.term, false);
          });
          row.appendChild(star);
        } else {
          const dot = document.createElement('span');
          dot.className = 'icon';
          dot.textContent = '•';
          row.appendChild(dot);
        }

        const term = document.createElement('span');
        term.className = 'term';
        term.textContent = entry.term;
        row.appendChild(term);

        const remove = document.createElement('button');
        remove.className = 'remove';
        remove.textContent = '✕';
        remove.title = kind === 'fav' ? 'Remove from favorites' : 'Remove from history';
        remove.addEventListener('click', (e) => {
          e.stopPropagation();
          if (kind === 'fav') setFavorite(entry.term, false);
          else deleteEntry(entry.term);
        });
        row.appendChild(remove);

        row.addEventListener('click', () => {
          closeDrawerOnMobile();
          lookupWord(entry.term);
        });
        return row;
      }

      function renderSidebar() {
        const favs = favoriteEntries();
        favoritesListEl.innerHTML = '';
        if (!favs.length) {
          const empty = document.createElement('div');
          empty.className = 'side-empty';
          empty.textContent = 'No favorites yet';
          favoritesListEl.appendChild(empty);
        } else {
          favs.forEach((entry) => favoritesListEl.appendChild(makeSideItem(entry, 'fav')));
        }

        const hist = historyEntries().slice(0, 20);
        historyListEl.innerHTML = '';
        clearHistoryBtn.hidden = !hist.length;
        if (!hist.length) {
          const empty = document.createElement('div');
          empty.className = 'side-empty';
          empty.textContent = 'No history yet';
          historyListEl.appendChild(empty);
        } else {
          hist.forEach((entry) => historyListEl.appendChild(makeSideItem(entry, 'hist')));
        }
      }

      clearHistoryBtn.addEventListener('click', () => {
        entries = entries.filter((e) => e.fav);
        saveEntries();
        renderSidebar();
      });

      // ---------- Favorites drag-to-reorder (pointer events on the grip) ----------
      let drag = null; // { term, fromIndex, indicator }
      favoritesListEl.addEventListener('pointerdown', (e) => {
        const grip = e.target.closest('.grip');
        if (!grip) return;
        const row = grip.closest('.side-item');
        const rows = [...favoritesListEl.querySelectorAll('.side-item')];
        drag = { term: row.dataset.term, fromIndex: rows.indexOf(row), toIndex: null };
        row.classList.add('dragging');
        grip.setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      favoritesListEl.addEventListener('pointermove', (e) => {
        if (!drag) return;
        const rows = [...favoritesListEl.querySelectorAll('.side-item')];
        let to = rows.length;
        for (let i = 0; i < rows.length; i++) {
          const rect = rows[i].getBoundingClientRect();
          if (e.clientY < rect.top + rect.height / 2) {
            to = i;
            break;
          }
        }
        favoritesListEl.querySelector('.drop-indicator')?.remove();
        if (to === drag.fromIndex || to === drag.fromIndex + 1) {
          drag.toIndex = null;
          return;
        }
        drag.toIndex = to;
        const indicator = document.createElement('div');
        indicator.className = 'drop-indicator';
        if (to >= rows.length) favoritesListEl.appendChild(indicator);
        else favoritesListEl.insertBefore(indicator, rows[to]);
      });
      function endDrag() {
        if (!drag) return;
        favoritesListEl.querySelector('.drop-indicator')?.remove();
        if (drag.toIndex != null) {
          const ordered = favoriteEntries();
          const moved = ordered.splice(drag.fromIndex, 1)[0];
          const insertAt = drag.toIndex > drag.fromIndex ? drag.toIndex - 1 : drag.toIndex;
          ordered.splice(Math.min(insertAt, ordered.length), 0, moved);
          ordered.forEach((entry, i) => (entry.order = i));
          saveEntries();
        }
        drag = null;
        renderSidebar();
      }
      favoritesListEl.addEventListener('pointerup', endDrag);
      favoritesListEl.addEventListener('pointercancel', endDrag);

      // ---------- History / favorites model ----------
      function findEntry(term) {
        return entries.find((e) => e.term === term);
      }

      function addToHistory(term) {
        const existing = findEntry(term);
        if (existing) {
          if (!existing.fav) existing.date = Date.now();
        } else {
          entries.push({ term, date: Date.now(), fav: false, order: 0 });
        }
        saveEntries();
        renderSidebar();
      }

      function deleteEntry(term) {
        entries = entries.filter((e) => e.term !== term);
        saveEntries();
        renderSidebar();
      }

      function nextFavoriteOrder() {
        return entries.filter((e) => e.fav).reduce((max, e) => Math.max(max, e.order), -1) + 1;
      }

      function setFavorite(term, fav) {
        const existing = findEntry(term);
        if (existing) {
          existing.fav = fav;
          if (fav) existing.order = nextFavoriteOrder();
        } else if (fav) {
          entries.push({ term, date: Date.now(), fav: true, order: nextFavoriteOrder() });
        }
        saveEntries();
        renderSidebar();
        updateFavButton();
      }

      function toggleFavorite() {
        if (!currentWord) return;
        const existing = findEntry(currentWord);
        setFavorite(currentWord, !(existing && existing.fav));
      }

      // Open the current word in the etymology page (hint bar / "e").
      function openEtymology() {
        if (!currentWord) return;
        window.open('/etymology/?' + encodeURIComponent(currentWord), '_blank', 'noopener');
      }

      function updateFavButton() {
        favBtn.hidden = !currentWord;
        const entry = findEntry(currentWord);
        const isFav = !!(entry && entry.fav);
        favBtn.textContent = isFav ? '★' : '☆';
        favBtn.classList.toggle('active', isFav);
      }
      favBtn.addEventListener('click', toggleFavorite);

      // ---------- Lookup + browser-history navigation ----------
      const FADE_MS = 180; // keep in sync with #content's opacity transition

      async function lookupWord(word, opts = {}) {
        const term = word.trim().toLowerCase();
        if (!term) return;

        if (!opts.fromPop) {
          const url = location.pathname + '?' + encodeURIComponent(term);
          if (location.search !== '?' + encodeURIComponent(term)) {
            if (opts.replace) history.replaceState(null, '', url);
            else history.pushState(null, '', url);
          }
        }

        searchEl.value = term;
        searchEl.blur();
        hideSuggestions();
        currentWord = term;
        synonyms = [];
        synLoading = true;

        const seq = ++lookupSeq;
        contentEl.style.opacity = '0';
        const fadeOut = new Promise((r) => setTimeout(r, FADE_MS));
        const def = await fetchDefinition(term);
        await fadeOut;
        if (seq !== lookupSeq) return;
        currentDef = def;
        renderContent();
        contentEl.scrollTop = 0;
        contentEl.style.opacity = '1';
        updateFavButton();
        if (def) addToHistory(term);
        else renderSidebar(); // keep the current-word highlight in sync

        try {
          const syns = await fetchSynonyms(term);
          if (seq !== lookupSeq) return;
          synonyms = syns;
        } catch {
          if (seq !== lookupSeq) return;
          synonyms = [];
        }
        synLoading = false;
        renderContent();
      }

      window.addEventListener('popstate', () => {
        const items = Common.parseQueryItems();
        if (items.length) {
          lookupWord(items[0], { fromPop: true });
        } else {
          const seq = ++lookupSeq;
          currentWord = '';
          currentDef = null;
          searchEl.value = '';
          updateFavButton();
          contentEl.style.opacity = '0';
          renderSidebar();
          setTimeout(() => {
            if (seq !== lookupSeq) return;
            renderContent();
            contentEl.style.opacity = '1';
          }, FADE_MS);
        }
      });

      // ---------- Search field ----------
      searchEl.addEventListener('input', () => {
        highlighted = -1;
        requestSuggestions(searchEl.value.trim());
      });
      searchEl.addEventListener('blur', () => {
        setTimeout(hideSuggestions, 100);
      });
      searchEl.addEventListener('keydown', (e) => {
        // Keep typed characters from triggering page shortcuts ('1', 's', …).
        e.stopPropagation();
        if (e.key === 'ArrowDown' && suggestions.length) {
          e.preventDefault();
          setHighlight(Math.min(highlighted + 1, suggestions.length - 1));
        } else if (e.key === 'ArrowUp' && suggestions.length) {
          e.preventDefault();
          setHighlight(highlighted <= 0 ? -1 : highlighted - 1);
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (highlighted >= 0 && suggestions[highlighted]) {
            lookupWord(suggestions[highlighted]);
          } else {
            lookupWord(searchEl.value);
          }
        } else if (e.key === 'Escape') {
          hideSuggestions();
          searchEl.value = currentWord;
          searchEl.blur();
        }
      });

      // ---------- Panel (sidebar / mobile drawer) ----------
      let drawerOpen = false;
      function syncPanel() {
        if (isDesktop()) {
          sidebarEl.classList.toggle('collapsed', !prefs.sidebar);
          sidebarEl.classList.remove('open');
          backdropEl.classList.remove('open');
        } else {
          sidebarEl.classList.remove('collapsed');
          sidebarEl.classList.toggle('open', drawerOpen);
          backdropEl.classList.toggle('open', drawerOpen);
        }
      }
      function togglePanel() {
        if (isDesktop()) {
          prefs.sidebar = !prefs.sidebar;
          savePrefs();
        } else {
          drawerOpen = !drawerOpen;
        }
        syncPanel();
      }
      function closeDrawerOnMobile() {
        if (!isDesktop() && drawerOpen) {
          drawerOpen = false;
          syncPanel();
        }
      }
      document.getElementById('panel-btn').addEventListener('click', togglePanel);
      backdropEl.addEventListener('click', closeDrawerOnMobile);
      window.matchMedia('(min-width: 860px)').addEventListener('change', syncPanel);
      syncPanel();

      // ---------- Keyboard shortcuts ----------
      document.addEventListener('keydown', (e) => {
        const t = e.target;
        if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        if (e.key === '/') {
          e.preventDefault();
          searchEl.focus();
          searchEl.select();
        } else if (e.key === 'f' || e.key === 'F') {
          toggleFavorite();
        } else if (e.key === 'h' || e.key === 'H') {
          togglePanel();
        } else if (e.key === 'd' || e.key === 'D') {
          prefs.defs = !prefs.defs;
          savePrefs();
          renderContent();
        } else if (e.key === 'y' || e.key === 'Y') {
          prefs.syns = !prefs.syns;
          savePrefs();
          renderContent();
        } else if (e.key === 'e' || e.key === 'E') {
          openEtymology();
        } else if (e.key === '+' || e.key === '=') {
          bumpScale(0.1);
        } else if (e.key === '-' || e.key === '_') {
          bumpScale(-0.1);
        }
      });

      // ---------- Hint bar ----------
      document.getElementById('hb-fav').addEventListener('click', toggleFavorite);
      document.getElementById('hb-panel').addEventListener('click', togglePanel);
      document.getElementById('hb-defs').addEventListener('click', () => {
        prefs.defs = !prefs.defs;
        savePrefs();
        renderContent();
      });
      document.getElementById('hb-syns').addEventListener('click', () => {
        prefs.syns = !prefs.syns;
        savePrefs();
        renderContent();
      });
      document.getElementById('hb-etym').addEventListener('click', openEtymology);
      document.getElementById('hb-fi').addEventListener('click', () => bumpScale(0.1));
      document.getElementById('hb-fd').addEventListener('click', () => bumpScale(-0.1));
      document.getElementById('hb-dark').addEventListener('click', Common.toggleDark);
      document.getElementById('hb-sitemap').addEventListener('click', Common.openSitemap);
      Common.initHintBar({
        hintEl: document.getElementById('hint'),
        hintZoneEl: document.getElementById('hint-zone'),
      });

      // ---------- Init ----------
      renderSidebar();
      updateFavButton();
      const initial = Common.parseQueryItems();
      if (initial.length) {
        lookupWord(initial[0], { replace: true });
      } else {
        searchEl.focus();
      }
    </script>
  </body>
</html>
