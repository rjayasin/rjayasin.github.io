<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruvan / wave</title>
    <link rel="icon" id="favicon" />
    <link rel="stylesheet" href="/common.css" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        cursor: crosshair;
        user-select: none;
      }
      #wave-svg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #wave-svg text {
        fill: currentColor;
        dominant-baseline: middle;
        /* Firefox would snap textPath glyphs to the pixel grid by default,
           turning the smooth sub-pixel startOffset updates into visible
           jitter. geometricPrecision keeps positions on float values. */
        text-rendering: geometricPrecision;
      }
      #hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 12px;
        text-align: center;
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 12px;
        color: #888;
        opacity: 1;
        transition: opacity 0.4s ease;
        user-select: none;
        z-index: 3;
      }
      #hint-inner {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 6px;
        background: #ffffff;
      }
      body.dark #hint-inner {
        background: #111111;
      }
      #hint.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #hint .hint-btn {
        cursor: pointer;
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 2px;
      }
      #hint .hint-btn:hover {
        color: #333;
      }
      body.dark #hint .hint-btn:hover {
        color: #ccc;
      }
      #hint-zone {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 60px;
        z-index: 2;
      }
      #hb-text-label {
        display: inline-block;
        max-width: 220px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        vertical-align: bottom;
      }
      #hb-text .hint-input {
        max-width: 50vw;
      }
    </style>
    <script src="/common.js"></script>
  </head>
  <body>
    <svg id="wave-svg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <path id="wave-path" fill="none"></path>
      </defs>
      <text>
        <textPath id="wave-text" href="#wave-path" startOffset="0"></textPath>
      </text>
    </svg>
    <div id="hint">
      <span id="hint-inner"
        ><span style="white-space: nowrap">move cursor to bend the wave</span> &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-fi">+</span>/<span class="hint-btn" id="hb-fd">−</span>
          font size</span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-font">click font</span></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-goog">g google fonts</span></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-dark"
            >1 <span class="hb-dark-label">dark</span></span
          ></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-sitemap">s sitemap</span></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-text"><span id="hb-text-label"></span></span> text</span
        ></span
      >
    </div>
    <div id="hint-zone"></div>
    <script>
      Common.paintFaviconR();
      Common.initDarkMode();
      Common.initCursorHide();

      const FALLBACK =
        'A sine wave is a steady promise: leave and return, climb and descend, ' +
        'always finishing where it began so it can begin again. Drag the cursor and it bends, ' +
        'amplitude rising or falling, wavelength stretching like a held note.';
      const SEP = ' ';
      const SPEED = 70;

      let fontSize = window.innerWidth < 640 ? 22 : 36;
      let currentFont = null;
      let fallbackItems = [FALLBACK];

      const svgEl = document.getElementById('wave-svg');
      const pathEl = document.getElementById('wave-path');
      const textEl = document.querySelector('#wave-svg text');
      const textPathEl = document.getElementById('wave-text');

      let W = window.innerWidth;
      let H = window.innerHeight;
      // amplitude is half-peak-to-peak in px; wavelength is one cycle in px.
      // Defaults give a visible wave on first paint before any mouse input.
      let amplitude = Math.min(H, W) * 0.22;
      let wavelength = Math.max(180, Math.min(W, 700));
      let pathLen = 0;
      let unitLen = 0;
      let offset = 0;

      function unitText() {
        const items = Common.parseQueryItems().length ? Common.parseQueryItems() : fallbackItems;
        if (!items.length) return '';
        return items.join('/') + SEP;
      }

      function applyFont() {
        textEl.style.fontSize = fontSize + 'px';
        textEl.style.fontFamily = currentFont ? `'${currentFont}', serif` : '';
      }

      // Build a polyline path tracing a sine wave across the viewport. 240
      // segments keeps the curve smooth without choking the textPath layout.
      function buildPathData() {
        const cy = H / 2;
        const segs = 240;
        let d = '';
        for (let i = 0; i <= segs; i++) {
          const x = (i / segs) * W;
          const y = cy + amplitude * Math.sin((x / wavelength) * 2 * Math.PI);
          d += (i === 0 ? 'M ' : ' L ') + x.toFixed(2) + ' ' + y.toFixed(2);
        }
        return d;
      }

      function rebuild() {
        W = window.innerWidth;
        H = window.innerHeight;

        applyFont();
        pathEl.setAttribute('d', buildPathData());
        pathLen = pathEl.getTotalLength();

        const text = unitText();
        if (!text) {
          textPathEl.textContent = '';
          unitLen = 0;
          return;
        }

        // Measure period via the marginal length added by a second copy so
        // boundary kerning is included; without this, the scroll jumps at
        // every wrap when the text is short.
        textPathEl.textContent = text;
        const single = textPathEl.getComputedTextLength();
        textPathEl.textContent = text.repeat(2);
        const double = textPathEl.getComputedTextLength();
        unitLen = double - single;
        if (unitLen <= 0) unitLen = single;
        if (unitLen <= 0) return;

        const repeats = Math.max(2, Math.ceil((pathLen + 2 * unitLen) / unitLen));
        textPathEl.textContent = text.repeat(repeats);
      }

      let needsRebuild = false;
      function scheduleRebuild() {
        needsRebuild = true;
      }

      let lastT = performance.now();
      function tick(now) {
        const dt = Math.min(0.1, (now - lastT) / 1000);
        lastT = now;
        if (needsRebuild) {
          rebuild();
          needsRebuild = false;
        }
        if (unitLen > 0) {
          offset += SPEED * dt;
          const startOff = -(((offset % unitLen) + unitLen) % unitLen);
          textPathEl.setAttribute('startOffset', startOff);
        }
        requestAnimationFrame(tick);
      }

      rebuild();
      requestAnimationFrame(tick);
      window.addEventListener('resize', () => {
        W = window.innerWidth;
        H = window.innerHeight;
        scheduleRebuild();
      });

      // Pointer position bends the wave: distance from vertical center maps
      // to amplitude, horizontal position to wavelength. The mapping is
      // intentionally simple so the curve responds immediately.
      function applyPointer(x, y) {
        const dy = y - H / 2;
        amplitude = Math.min(H * 0.45, Math.abs(dy));
        const t = Math.max(0, Math.min(1, x / Math.max(1, W)));
        wavelength = 120 + t * Math.max(W * 0.9, 400);
        scheduleRebuild();
      }
      window.addEventListener('pointermove', (e) => {
        applyPointer(e.clientX, e.clientY);
      });

      const cooldown = Common.makeCooldown(500);
      async function pickFont() {
        if (!window.googleFonts) return;
        cooldown(async () => {
          const font = Common.pickRandomGoogleFont();
          await Common.loadGoogleFont(font);
          currentFont = font;
          console.log('font:', font);
          scheduleRebuild();
        });
      }

      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if ((e.key === 'g' || e.key === 'G') && !e.repeat && currentFont) {
          Common.openFontSpecimen(currentFont);
          return;
        }
        if (e.key === '+' || e.key === '=' || e.key === '-' || e.key === '_') {
          e.preventDefault();
          const delta = e.key === '+' || e.key === '=' ? 4 : -4;
          fontSize = Math.max(8, Math.min(256, fontSize + delta));
          scheduleRebuild();
          showHint();
        }
      });

      const hintEl = document.getElementById('hint');
      const hintZone = document.getElementById('hint-zone');
      let hintTimer = null;
      let hintLocked = false;
      function showHint() {
        hintEl.classList.remove('hidden');
        clearTimeout(hintTimer);
        if (hintLocked) return;
        hintTimer = setTimeout(() => hintEl.classList.add('hidden'), 2500);
      }
      showHint();
      hintZone.addEventListener('mouseenter', showHint);
      hintZone.addEventListener('mousemove', showHint);
      hintZone.addEventListener('touchstart', showHint, { passive: true });
      hintZone.addEventListener('touchend', (e) => e.stopPropagation());
      hintEl.addEventListener('click', (e) => e.stopPropagation());
      hintEl.addEventListener('touchstart', () => clearTimeout(hintTimer), { passive: true });
      hintEl.addEventListener('touchend', (e) => {
        e.stopPropagation();
        showHint();
      });
      hintEl.addEventListener('mouseenter', () => {
        clearTimeout(hintTimer);
        hintEl.classList.remove('hidden');
      });
      hintEl.addEventListener('mouseleave', showHint);

      document.getElementById('hb-fi').addEventListener('click', () => {
        fontSize = Math.max(8, Math.min(256, fontSize + 4));
        scheduleRebuild();
        showHint();
      });
      document.getElementById('hb-fd').addEventListener('click', () => {
        fontSize = Math.max(8, Math.min(256, fontSize - 4));
        scheduleRebuild();
        showHint();
      });
      document.getElementById('hb-font').addEventListener('click', pickFont);
      document.getElementById('hb-goog').addEventListener('click', () => {
        if (currentFont) Common.openFontSpecimen(currentFont);
      });
      document.getElementById('hb-dark').addEventListener('click', () => {
        Common.toggleDark();
        showHint();
      });
      document.getElementById('hb-sitemap').addEventListener('click', Common.openSitemap);
      Common.initSitemapShortcut();

      Common.initTextEditor({
        buttonEl: document.getElementById('hb-text'),
        labelEl: document.getElementById('hb-text-label'),
        getItems: () =>
          Common.parseQueryItems().length ? Common.parseQueryItems() : fallbackItems,
        onCommit: scheduleRebuild,
        onEditStart: () => {
          hintLocked = true;
          clearTimeout(hintTimer);
          hintEl.classList.remove('hidden');
        },
        onEditEnd: () => {
          hintLocked = false;
          showHint();
        },
      });

      Common.onTap(pickFont);

      Common.loadScript('/fonts.js').then(pickFont);
    </script>
  </body>
</html>
