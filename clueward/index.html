<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clueward</title>
    <link rel="icon" id="favicon" />
    <link rel="stylesheet" href="/common.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600&display=swap"
    />
    <style>
      :root {
        --muted: rgba(0, 0, 0, 0.5);
        --line: rgba(0, 0, 0, 0.15);
        --ok: #1a7f37;
        --bad: #cf222e;
        --close: #9a6700;
        --cell: #fff;
        --block: #000;
        --grid-line: #000;
        --sel: #a7d8ff;
        --sel-soft: #dcefff;
        --sel-edge: #1a73e8;
        --sel-tint: rgba(60, 150, 255, 0.4);
        --done: #33ad4d;
        --gave: #db4a4a;
        --given: #e4e4e4;
        --gold: #e8ae00;
        --frame: #8a8a8a;
        --flash: rgba(255, 255, 255, 0.5);
      }
      body.dark {
        --muted: rgba(255, 255, 255, 0.55);
        --line: rgba(255, 255, 255, 0.2);
        --ok: #3fb950;
        --bad: #f85149;
        --close: #d29922;
        --cell: #232323;
        --block: #050505;
        --grid-line: #050505;
        --sel: #1f5a8a;
        --sel-soft: #19324a;
        --sel-edge: #4ea1ff;
        --sel-tint: rgba(60, 150, 255, 0.35);
        --done: #2d7a40;
        --gave: #8f3333;
        --given: #3a3a3a;
        --gold: #f2c230;
        --frame: #555;
        --flash: rgba(70, 210, 100, 0.22);
      }
      @media (prefers-color-scheme: dark) {
        body:not(.light) {
          --muted: rgba(255, 255, 255, 0.55);
          --line: rgba(255, 255, 255, 0.2);
          --ok: #3fb950;
          --bad: #f85149;
          --close: #d29922;
          --cell: #232323;
          --block: #050505;
          --grid-line: #050505;
          --sel: #1f5a8a;
          --sel-soft: #19324a;
          --sel-edge: #4ea1ff;
          --sel-tint: rgba(60, 150, 255, 0.35);
          --done: #2d7a40;
          --gave: #8f3333;
          --given: #3a3a3a;
          --gold: #f2c230;
          --frame: #555;
          --flash: rgba(70, 210, 100, 0.22);
        }
      }
      body {
        min-height: 100dvh;
        padding: 16px;
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 13px;
      }
      #layout {
        display: flex;
        gap: 32px;
        align-items: flex-start;
      }
      #side {
        flex: 0 1 340px;
        min-width: 260px;
        padding: 8px 0 0 8px;
        display: flex;
        flex-direction: column;
        gap: 40px;
        min-height: calc(100dvh - 32px);
        position: sticky;
        top: 16px;
      }
      #brand {
        display: flex;
        flex-direction: column;
        gap: 24px;
        margin-bottom: -16px;
      }
      /* A one-line run of grid squares, with clued and revealed across
         halves alternating. */
      #logo {
        display: grid;
        grid-template-columns: repeat(8, minmax(0, 1fr));
        gap: 1px;
        padding: 1px;
        background: var(--grid-line);
        border: 3px solid var(--frame);
        container-type: inline-size;
        font-family: 'Libre Franklin', Helvetica, Arial, sans-serif;
        font-weight: 600;
        user-select: none;
      }
      #logo > span {
        position: relative;
        aspect-ratio: 1;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        font-size: calc(100cqi / 8 * 0.56);
        line-height: 1.5;
        background: linear-gradient(135deg, var(--done) 50%, var(--cell) 50%);
      }
      #logo > span:nth-child(even) {
        background: linear-gradient(135deg, var(--gave) 50%, var(--cell) 50%);
      }
      #logo .num {
        position: absolute;
        top: 1px;
        left: 2px;
        font-size: calc(100cqi / 8 * 0.26);
        font-weight: 400;
        line-height: 1;
      }
      #main {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        gap: 24px;
        align-items: flex-start;
      }
      #scorebar {
        display: flex;
        flex-direction: column;
        gap: 10px;
        color: var(--muted);
      }
      #meta:empty {
        display: none;
      }
      #tally {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 16px;
      }
      #tally .star {
        font-size: 1.2em;
      }
      #share {
        margin-left: auto;
        padding: 0.3em 0.9em;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--muted);
        text-decoration: none;
      }
      /* Clued and revealed shares of the puzzle's entries. */
      #progress {
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(
            to right,
            var(--done) var(--won, 0%),
            var(--gave) var(--won, 0%) var(--lost, 0%),
            transparent var(--lost, 0%)
          ),
          var(--line);
      }
      @media (hover: hover) {
        #share:hover {
          background: var(--line);
          color: inherit;
        }
      }
      #scorebar b {
        font-weight: normal;
        color: #000;
      }
      body.dark #scorebar b {
        color: #fff;
      }
      @media (prefers-color-scheme: dark) {
        body:not(.light) #scorebar b {
          color: #fff;
        }
      }
      #finished[hidden] {
        display: none;
      }
      #modes {
        display: flex;
        gap: 4px;
      }
      #modes button {
        padding: 0.3em 0.9em;
        border: 1px solid var(--line);
        border-radius: 6px;
        text-decoration: none;
        color: var(--muted);
      }
      #modes button[aria-pressed='true'] {
        background: var(--line);
        color: inherit;
      }
      #controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
      }
      /* Puzzle picking on the left, display settings on the right. */
      #controls .group {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #nav {
        display: flex;
        gap: 4px;
      }
      .tool {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 50%;
        color: var(--muted);
        font-size: 14px;
        line-height: 1;
        text-decoration: none;
      }
      .tool[hidden] {
        display: none;
      }
      /* Nudged by script so the emoji's ink sits in the middle of the button. */
      .tool > span {
        display: block;
      }
      #info-btn {
        font-size: 17px;
        font-weight: bold;
      }
      @media (hover: hover) {
        .tool:hover {
          background: var(--line);
          color: inherit;
        }
      }
      #theme {
        position: relative;
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 56px;
        height: 28px;
        padding: 0 5px;
        border: 1px solid var(--line);
        border-radius: 14px;
        text-decoration: none;
      }
      #theme::before {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--gold);
        transition: transform 0.2s ease;
      }
      body.dark #theme::before {
        transform: translateX(28px);
      }
      #theme svg {
        position: relative;
        width: 14px;
        height: 14px;
        fill: none;
        stroke: var(--muted);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: stroke 0.2s;
      }
      body:not(.dark) #theme .sun,
      body.dark #theme .moon {
        stroke: #000;
      }
      body.mini #grid-wrap {
        max-width: 420px;
      }
      #scorebar #finished {
        color: var(--ok);
      }
      #scorebar #score {
        color: var(--ok);
        font-weight: bold;
      }
      #grid-wrap {
        flex: 0 1 calc(100dvh - 32px);
        min-width: 280px;
      }
      #grid {
        display: grid;
        grid-template-columns: repeat(var(--cols, 15), minmax(0, 1fr));
        gap: 1px;
        position: relative;
        background: var(--grid-line);
        border: 4px solid var(--frame);
        user-select: none;
        touch-action: manipulation;
        container-type: inline-size;
        font-family: 'Libre Franklin', Helvetica, Arial, sans-serif;
      }
      #grid::before {
        content: '';
        position: absolute;
        inset: -4px;
        border: 4px solid var(--ok);
        opacity: 0;
        pointer-events: none;
      }
      #grid.complete::before {
        opacity: 1;
      }
      #grid.cheer::before {
        transition: opacity 0.32s ease-out var(--wave);
      }
      /* Finishing the grid lifts each square toward the viewer in a diagonal
         wave. Only transform and opacity animate, which keeps it smooth in
         Chrome: the scale and outward nudge stand in for translateZ(35px)
         under a 600px perspective. */
      #grid.cheer .sq:not(.block) {
        animation: sq-lift 0.45s calc(var(--k) * var(--step));
      }
      #grid.cheer .sq:not(.block)::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        background: var(--flash);
        box-shadow: 0 6px 12px -4px rgba(0, 0, 0, 0.4);
        opacity: 0;
        pointer-events: none;
        animation: sq-glint 0.45s calc(var(--k) * var(--step));
      }
      @keyframes sq-lift {
        from {
          animation-timing-function: cubic-bezier(0.2, 0.7, 0.4, 1);
        }
        40% {
          transform: translate(calc(var(--ox) * 6.2%), calc(var(--oy) * 6.2%)) scale(1.062);
          animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.3);
        }
      }
      @keyframes sq-glint {
        from {
          animation-timing-function: cubic-bezier(0.2, 0.7, 0.4, 1);
        }
        40% {
          opacity: 1;
          animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.3);
        }
      }
      .sq {
        position: relative;
        aspect-ratio: 1;
        background: var(--cell);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        font-size: calc(100cqi / var(--cols, 15) * 0.56);
        line-height: 1.5;
      }
      .sq.block {
        background: var(--block);
        cursor: default;
      }
      /* The across entry tints the top-left half, the down entry the
         bottom-right. */
      .sq:not(.block) {
        --a: var(--cell);
        --d: var(--cell);
        background: linear-gradient(135deg, var(--a) 50%, var(--d) 50%);
      }
      .sq.a-won {
        --a: var(--done);
      }
      .sq.a-gave {
        --a: var(--gave);
      }
      .sq.d-won {
        --d: var(--done);
      }
      .sq.d-gave {
        --d: var(--gave);
      }
      .sq.a-given {
        --a: var(--given);
      }
      .sq.d-given {
        --d: var(--given);
      }
      /* The selected entry is outlined rather than filled, so its squares'
         clued / revealed halves stay visible; the cursor square gets a
         see-through blue wash on top. The outline is one box placed over
         the entry's grid area, so it runs unbroken across the grid lines. */
      #sel-box {
        position: absolute;
        inset: 0;
        z-index: 1;
        border: 3px solid var(--sel-edge);
        pointer-events: none;
      }
      .sq.cur:not(.block) {
        background: linear-gradient(var(--sel-tint), var(--sel-tint)),
          linear-gradient(135deg, var(--a) 50%, var(--d) 50%);
      }
      .sq .num {
        position: absolute;
        top: 1px;
        left: 2px;
        font-size: calc(100cqi / var(--cols, 15) * 0.26);
        line-height: 1;
        /* sits over the selection outline, backed by its own half's colour */
        z-index: 2;
        padding: 0 1px;
        background: var(--a, var(--cell));
      }
      .sq.cur .num {
        background: linear-gradient(var(--sel-tint), var(--sel-tint)), var(--a);
      }
      .sq.starred .num,
      .sq.starred-a .num,
      .sq.starred-d .num {
        font-weight: 600;
      }
      .sq.starred .num {
        color: var(--gold);
      }
      /* A number starting both an across and a down entry goes gold one
         half at a time: the top half for the across, the bottom for the down. */
      .sq.starred-a .num::after,
      .sq.starred-d .num::after {
        content: attr(data-n);
        position: absolute;
        inset: 0;
        padding: 0 1px;
        color: var(--gold);
      }
      .sq.starred-a .num::after {
        clip-path: inset(0 0 50% 0);
      }
      .sq.starred-d .num::after {
        clip-path: inset(50% 0 0 0);
      }
      .sq.in {
        animation: sq-in 0.3s ease-out var(--in) backwards;
      }
      @keyframes sq-in {
        from {
          opacity: 0;
          transform: scale(0.6);
        }
      }
      #clues {
        flex: 1 1 360px;
        min-width: 340px;
        max-width: 640px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
        height: var(--grid-h, auto);
        font-family: 'Libre Franklin', Helvetica, Arial, sans-serif;
        font-size: 13px;
      }
      .list {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .list h2 {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--line);
      }
      /* The bottom padding lets the last clues scroll up past the disclaimer. */
      .list ol {
        list-style: none;
        overflow-y: auto;
        min-height: 0;
        flex: 1;
        padding-bottom: 32px;
      }
      .list li {
        display: grid;
        grid-template-columns: 2.4em 1fr;
        gap: 0 4px;
        padding: 4px 6px 4px 0;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        border-left: 4px solid transparent;
        line-height: 1.35;
      }
      .list li.cur {
        background: var(--sel-soft);
        border-left-color: var(--sel);
      }
      .list .n {
        font-weight: 600;
        text-align: right;
        padding-right: 4px;
      }
      .list .ans {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.08em;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .list .said {
        grid-column: 2;
      }
      .list .past {
        grid-column: 2;
        color: var(--muted);
        font-size: 12px;
      }
      .list li.won .ans {
        color: var(--ok);
      }
      .list li.given .said {
        color: var(--muted);
        font-style: italic;
      }
      .list li.lost .ans {
        color: var(--bad);
      }
      #word {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      /* The arrows sit either side of the answer. */
      #bar {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 12px 8px;
      }
      #bar-mid {
        display: contents;
      }
      #bar-mid > * {
        grid-column: 2;
      }
      #prev-clue {
        grid-area: 2 / 1;
      }
      #next-clue {
        grid-area: 2 / 3;
      }
      #bar .arrow {
        display: flex;
        align-items: center;
        padding: 0 6px;
        color: var(--muted);
      }
      #bar .arrow path {
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      @media (hover: hover) {
        #bar .arrow:hover {
          color: inherit;
        }
      }
      #which {
        color: var(--muted);
      }
      .pips {
        display: inline-flex;
        gap: 4px;
        margin-left: 6px;
        vertical-align: middle;
      }
      .pips i {
        width: 8px;
        height: 8px;
        border: 1px solid var(--muted);
        border-radius: 50%;
      }
      .pips i.on {
        background: var(--gold);
        border-color: var(--gold);
      }
      #answer {
        font-family: 'Libre Franklin', Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 26px;
        letter-spacing: 0.12em;
        text-indent: 0.12em;
        text-align: center;
        overflow-wrap: anywhere;
      }
      #bar-mid > #guess-form {
        grid-column: 1 / -1;
      }
      #guess-form {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px;
        background: var(--cell);
        border: 1px solid var(--line);
        border-radius: 8px;
        transition: border-color 0.15s;
      }
      #guess-form:focus-within {
        border-color: var(--gold);
      }
      #guess {
        flex: 1;
        min-width: 0;
        font: inherit;
        font-size: 1.4em;
        padding: 8px 0 8px 8px;
        background: transparent;
        color: inherit;
        border: none;
        outline: none;
      }
      #guess-btn {
        align-self: stretch;
        padding: 0 1em;
        background: var(--gold);
        color: #000;
        border-radius: 5px;
        font-weight: 600;
        text-decoration: none;
      }
      #guess-btn:disabled {
        background: var(--line);
        color: var(--muted);
      }
      #guess::placeholder {
        color: var(--muted);
        opacity: 0.6;
        font-size: 0.75em;
      }
      button {
        font: inherit;
        color: inherit;
        background: transparent;
        border: none;
        cursor: pointer;
        touch-action: manipulation;
        padding: 0 4px;
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 3px;
      }
      button:disabled {
        color: var(--muted);
        cursor: default;
        text-decoration: none;
      }
      button[hidden] {
        display: none;
      }
      #status {
        line-height: 1.5;
      }
      #status:empty,
      #guesses:empty {
        display: none;
      }
      #status q {
        quotes: '“' '”';
      }
      .ok {
        color: var(--ok);
      }
      .bad {
        color: var(--bad);
      }
      .close {
        color: var(--close);
      }
      #guesses {
        list-style: none;
        color: var(--muted);
      }
      #guesses li::before {
        content: '✗ ';
      }
      #guesses li.close::before {
        content: '~ ';
      }
      #known {
        color: var(--muted);
        line-height: 1.5;
      }
      #known[hidden] {
        display: none;
      }
      #known summary {
        cursor: pointer;
      }
      #known ul {
        margin: 8px 0 0 1.2em;
        max-height: 30vh;
        overflow-y: auto;
      }
      /* A styled scrollbar stays visible where the system's would hide until
         scrolled. */
      #known ul::-webkit-scrollbar {
        width: 8px;
      }
      #known ul::-webkit-scrollbar-track {
        background: var(--line);
        border-radius: 4px;
      }
      #known ul::-webkit-scrollbar-thumb {
        background: var(--muted);
        border-radius: 4px;
      }
      .star {
        color: var(--gold);
        font-size: 1.5em;
        line-height: 1;
      }
      #known li.hit {
        color: var(--ok);
      }
      /* The matcher's state on the left, and reveal on the right. */
      #under {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-top: -4px;
        font-size: 11px;
      }
      #under:not(:has(#matcher:not(:empty), #giveup:not([hidden]))) {
        display: none;
      }
      #giveup {
        margin: -8px 0 -8px auto;
        padding: 8px 0 8px 12px;
        color: var(--bad);
        text-decoration-style: dotted;
        text-underline-offset: 2px;
      }
      @media (hover: hover) {
        #giveup:hover {
          text-decoration-style: solid;
        }
      }
      #info {
        width: min(480px, calc(100% - 32px));
        max-height: calc(100dvh - 32px);
        margin: auto;
        padding: 20px 24px;
        overflow-y: auto;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--cell);
        color: inherit;
        line-height: 1.5;
      }
      #info::backdrop {
        background: rgba(0, 0, 0, 0.5);
      }
      #info h2 {
        margin: 0 32px 12px 0;
        font-size: 1.2em;
      }
      #info ul {
        margin: 0 0 0 1.2em;
        color: var(--muted);
      }
      #info p {
        margin-bottom: 12px;
      }
      #info h3 {
        margin: 16px 0 8px;
        font-size: 1em;
      }
      #info li + li {
        margin-top: 0.5em;
      }
      #info .keys-touch {
        display: none;
      }
      @media (pointer: coarse) {
        #info .keys-fine {
          display: none;
        }
        #info .keys-touch {
          display: list-item;
        }
      }
      #info-close {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        color: var(--muted);
        font-size: 20px;
        line-height: 1;
        text-decoration: none;
      }
      @media (hover: hover) {
        #info-close:hover {
          background: var(--line);
          color: inherit;
        }
      }
      #matcher {
        color: var(--muted);
      }
      #matcher.loading {
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.4;
        }
      }
      #matcher:empty {
        display: none;

    <script>
      Common.paintFavicon({ glyph: '✏️', fontSize: 44, transparent: true });
      if (matchMedia('(prefers-color-scheme: dark)').matches) document.body.classList.add('dark');
      // A wave runs from the left once each new grid has animated in and on
      // every click, each lifting squares from wherever an earlier wave has them.
      {
        const logo = document.getElementById('logo');
        const reduce = matchMedia('(prefers-reduced-motion: reduce)');
        const wave = () => {
          if (reduce.matches) return;
          [...logo.children].forEach((s, k) =>
            s.animate(
              [
                {
                  offset: 0,
                  translate: '0 0',
                  boxShadow: '0 0 0 0 transparent',
                  composite: 'add',
                  easing: 'cubic-bezier(0.2, 0.7, 0.4, 1)',
                },
                {
                  offset: 0.4,
                  translate: '0 -12%',
                  scale: '1.08',
                  boxShadow: '0 6px 12px -4px rgba(0, 0, 0, 0.4)',
                  easing: 'cubic-bezier(0.6, 0, 0.8, 0.3)',
                },
              ],
              { duration: 450, delay: k * 45 }
            )
          );
        };
        addEventListener('gridin', wave);
        logo.addEventListener('click', wave);
      }
      {
        const THEME = 'clueward-theme';
        const btn = document.getElementById('theme');
        const apply = (dark) => {
          document.body.classList.toggle('dark', dark);
          document.body.classList.toggle('light', !dark);
          btn.setAttribute('aria-checked', dark);
        };
        try {
          const saved = localStorage.getItem(THEME);
          if (saved) apply(saved === 'dark');
        } catch {}
        btn.addEventListener('click', () => {
          const dark = !document.body.classList.contains('dark');
          apply(dark);
          try {
            localStorage.setItem(THEME, dark ? 'dark' : 'light');
          } catch {}
        });
      }
      // Each emoji font draws its glyphs off center in the line, by a different amount per font,
      // so find each tool emoji's ink on a canvas and shift it to the middle of its circle.
      {
        const SCALE = 4;
        const ctx = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
        const center = (el) => {
          const box = el.getBoundingClientRect();
          if (!box.height) return;
          // A zero-size inline block sits on the baseline, so the page itself says where it is.
          const mark = document.createElement('i');
          mark.style.cssText = 'display: inline-block; width: 0; height: 0';
          el.prepend(mark);
          const at = mark.getBoundingClientRect();
          mark.remove();
          const size = parseFloat(getComputedStyle(el).fontSize);
          const side = Math.ceil(size * 3 * SCALE);
          ctx.canvas.width = ctx.canvas.height = side;
          ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
          // Any family will do: the glyph comes from the system emoji font either way.
          ctx.font = `${size}px sans-serif`;
          ctx.fillText(el.textContent.trim(), size, size * 2);
          const { data } = ctx.getImageData(0, 0, side, side);
          let top = side;
          let bottom = 0;
          let left = side;
          let right = 0;
          for (let y = 0; y < side; y++) {
            for (let x = 0; x < side; x++) {
              if (data[(y * side + x) * 4 + 3] > 8) {
                top = Math.min(top, y);
                bottom = y + 1;
                left = Math.min(left, x);
                right = Math.max(right, x + 1);
              }
            }
          }
          if (top >= bottom) return;
          // Ink centers relative to the pen position, then to the span's own box.
          const x = at.left - box.left + (left + right) / 2 / SCALE - size;
          const y = at.top - box.top + (top + bottom) / 2 / SCALE - size * 2;
          el.style.translate = `${(box.width / 2 - x).toFixed(2)}px ${(box.height / 2 - y).toFixed(2)}px`;
        };
        // Runs again when a hidden button such as today's puzzle shows up.
        const watch = new ResizeObserver((entries) => entries.forEach((e) => center(e.target)));
        document.querySelectorAll('.tool > span').forEach((el) => watch.observe(el));
      }
      Common.initHintUpdated({ hintEl: document.getElementById('hint') });

      // PUZZLES and SHARDS match what scripts/build-clueward.js wrote,
      // and MINIS what scripts/build-clueward-minis.js wrote; DATA
      // versions saved progress so a rebuild doesn't resume the wrong grid.
      const PUZZLES = 11349;
      const MINIS = 1000;
      const SHARDS = 256;
      const DATA = 2;
      // The game's old name, kept so saved progress survives the rename.
      const STORE = 'reverse-crossword';
      const WORTH = 100;
      const MISS = 25;
      const EXACT = 50;
      const TRIES = 4;
      const LEADERS = 10;
      const LAUNCH = Date.UTC(2026, 9, 16);
      const $ = (id) => document.getElementById(id);
      const gridEl = $('grid');
      const guessEl = $('guess');
      const statusEl = $('status');
      const esc = Common.escHtml;
      const fine = () => matchMedia('(pointer: fine)').matches;

      // --- persistence ------------------------------------------------------
      // daily is today's puzzle and cur the random one in progress, so a
      // reload picks up where it left off; miniDaily and miniCur are the same
      // for minis.

      const stats = (() => {
        const blank = {
          seen: [],
          miniSeen: [],
          scores: [],
          cur: null,
          daily: null,
          miniCur: null,
          miniDaily: null,
        };
        try {
          return { ...blank, ...JSON.parse(localStorage.getItem(STORE)) };
        } catch {
          return blank;
        }
      })();
      function saveStats() {
        stats.seen = stats.seen.slice(-2000);
        stats.miniSeen = stats.miniSeen.slice(-1000);
        try {
          localStorage.setItem(STORE, JSON.stringify(stats));
        } catch {}
      }

      // --- game state -------------------------------------------------------
      // puzzle.words[k]: { n, dir, ans, clue, own, given, cells, past }
      //   past is filled in from data/past/ when the entry is first selected.
      // state[k]: { done, won, given, said, best, misses, guesses: [{ text, close }], paid }

      let puzzle = null;
      let game = null;
      let state = [];
      let sel = 0;
      let lastCell = -1;

      const worthOf = (st) => Math.max(MISS, WORTH - MISS * st.misses);
      const playable = () => state.filter((st) => !st.given);
      const score = () => state.reduce((s, st) => s + (st.paid || 0), 0);
      // A mini's clues are its answers' most common past clues.
      const clueLabel = () => (game.mini ? 'the most common clue' : "the puzzle's clue");
      const label = (w) => `${w.n} ${w.dir === 'a' ? 'across' : 'down'}`;

      $('info').innerHTML = `
        <button id="info-close" type="button" aria-label="close">×</button>
        <h2 id="info-title">How to play</h2>
        <p>Clueward is a crossword in reverse: the grid is filled in, and you write the clues.</p>
        <ul>
          <li>Your clue counts if it matches any clue the NYT crossword used for that answer between 1976 and 2018.</li>
          <li>Your clue doesn't have to match word for word: a small typo or the same meaning counts too. Capitalization and punctuation don't matter. Type _ (underscore) for a blank.</li>
          <li>A correct clue is worth ${WORTH} points. Each wrong try takes off ${MISS}, and tries marked “close” cost nothing.</li>
          <li>An exact match to a past NYT clue earns ${EXACT} extra points and a <span class="star">★</span>.</li>
          <li>After ${TRIES} wrong tries, the clue is revealed. A revealed clue scores nothing.</li>
          <li>Once an answer is <span class="ok">clued</span> or <span class="bad">revealed</span>, you can see every past NYT clue for it, sorted by most to least used.</li>
          <li class="keys-touch">Tap a square twice to switch direction.</li>
        </ul>
        <div class="keys-fine">
          <h3>Keys</h3>
          <ul>
            <li>Tab / shift-tab: next or previous unclued answer</li>
            <li>↓ / →: switch to the down or across answer through the current square</li>
            <li>↑: bring back your last try</li>
            <li>Click a square twice to switch direction</li>
          </ul>
        </div>`;
      $('info-btn').addEventListener('click', () => $('info').showModal());
      $('info-close').addEventListener('click', () => $('info').close());
      $('info').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) e.currentTarget.close();
      });

      function recordScore() {
        const cur = game;
        if (!cur) return;
        cur.state = state;
        const entry = { t: cur.t, score: score(), solved: playable().filter((s) => s.won).length };
        entry.total = playable().length;
        entry.day = cur.day;
        entry.mini = cur.mini;
        stats.scores = stats.scores.filter((e) => e.t !== cur.t);
        if (entry.score > 0) stats.scores.push(entry);
        stats.scores.sort((a, b) => b.score - a.score || a.t - b.t);
        stats.scores = stats.scores.slice(0, LEADERS);
        saveStats();
        renderLeaders();
      }
      // The puzzle in progress is ranked as it changes, and shown below the
      // top ten if it hasn't made it in.
      function renderLeaders() {
        const list = $('leaders-list');
        list.textContent = '';
        const t = game?.t;
        const scores = stats.scores.filter((e) => !!e.mini === !!game?.mini);
        $('leaders-head').textContent = game?.mini ? 'your mini high scores' : 'your high scores';
        const live = scores.find((e) => e.t === t) || {
          t,
          score: score(),
          solved: playable().filter((s) => s.won).length,
          total: playable().length,
        };
        const all = [...scores.filter((e) => e !== live), live].filter((e) => e.score > 0);
        all.sort((a, b) => b.score - a.score || a.t - b.t);
        const rank = all.indexOf(live);
        const shown = all.slice(0, LEADERS);
        if (rank >= LEADERS) shown.push(null, live);
        if (!shown.length) {
          const li = document.createElement('li');
          li.textContent = 'none yet — clue an entry to score';
          list.appendChild(li);
        }
        for (const e of shown) {
          const li = document.createElement('li');
          if (!e) {
            li.textContent = '⋯';
            list.appendChild(li);
            continue;
          }
          const n = document.createElement('span');
          n.className = 'rank';
          n.textContent = all.indexOf(e) + 1;
          const b = document.createElement('b');
          b.textContent = e.score;
          const when =
            e === live
              ? 'this puzzle'
              : e.day
                ? `daily #${e.day}`
                : new Date(e.t).toLocaleDateString();
          li.append(n, b, `${e.solved}/${e.total} · ${when}`);
          if (e === live) li.className = 'mine';
          list.appendChild(li);
        }
      }

      // --- loading ------------------------------------------------------------

      async function fetchPuzzle(id, mini) {
        const r = await fetch(`data/${mini ? 'minis' : 'puzzles'}/${id}.json`);
        if (!r.ok) throw new Error(`puzzle ${id}: ${r.status}`);
        return r.json();
      }

      function pickId(mini) {
        const seen = new Set(mini ? stats.miniSeen : stats.seen);
        let id;
        for (let tries = 0; tries < 50; tries++) {
          id = Math.floor(Math.random() * (mini ? MINIS : PUZZLES));
          if (!seen.has(id)) break;
        }
        return id;
      }

      // Each answer's past clues live in one of SHARDS files picked by an
      // FNV-1a hash of the answer, as in scripts/build-clueward.js.
      function shardOf(ans) {
        let h = 0x811c9dc5;
        for (let i = 0; i < ans.length; i++) h = Math.imul(h ^ ans.charCodeAt(i), 0x01000193);
        return ((h >>> 0) % SHARDS).toString(16).padStart(2, '0');
      }
      const shards = new Map();
      function pastOf(w) {
        if (w.past) return Promise.resolve(w.past);
        const s = shardOf(w.ans);
        if (!shards.has(s)) {
          const load = fetch(`data/past/${s}.json`).then((r) => {
            if (!r.ok) throw new Error(`past clues ${s}: ${r.status}`);
            return r.json();
          });
          load.catch(() => shards.delete(s));
          shards.set(s, load);
        }
        return shards.get(s).then((bank) => {
          w.past = [...(bank[w.ans] || []), ...(w.own ? [w.clue] : [])];
          return w.past;
        });
      }

      // Builds the entries from the [number, clue, flag] lists, numbering
      // squares the standard way and reading each answer off the grid.
      function layout(p) {
        const size = Math.round(Math.sqrt(p.grid.length));
        const open = (r, c) =>
          r >= 0 && c >= 0 && r < size && c < size && p.grid[r * size + c] !== '.';
        const starts = {};
        let n = 0;
        for (let r = 0; r < size; r++)
          for (let c = 0; c < size; c++) {
            if (!open(r, c)) continue;
            const a = !open(r, c - 1) && open(r, c + 1);
            const d = !open(r - 1, c) && open(r + 1, c);
            if (a || d) starts[++n] = r * size + c;
          }
        p.size = size;
        p.words = [];
        for (const dir of ['a', 'd']) {
          const step = dir === 'a' ? 1 : size;
          for (const [n, clue, flag] of p[dir]) {
            const cells = [];
            let r = Math.floor(starts[n] / size);
            let c = starts[n] % size;
            while (open(r, c)) {
              cells.push(r * size + c);
              if (dir === 'a') c++;
              else r++;
            }
            const ans = cells.map((i) => p.grid[i]).join('');
            p.words.push({ n, dir, clue, ans, cells, own: flag === 1, given: flag === 2 });
          }
        }
        return p;
      }

      // Daily puzzles are numbered from LAUNCH by the local date. Each plays
      // the next puzzle, in file order, that ran on its weekday; Sundays take
      // Thursday's, since there are no Sunday puzzles.
      function today() {
        const d = new Date();
        return (
          Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - LAUNCH) / 864e5) + 1
        );
      }
      let dayIndex = null;
      async function dailyId(n) {
        dayIndex ||= fetch('data/days.json').then((r) => {
          if (!r.ok) throw new Error(`days: ${r.status}`);
          return r.json();
        });
        const days = await dayIndex.catch((err) => {
          dayIndex = null;
          throw err;
        });
        const weekday = (m) => {
          const d = (((new Date(LAUNCH).getUTCDay() + m - 1) % 7) + 7) % 7;
          return String(d || 4);
        };
        let k = 0;
        for (let m = 1; m < n; m++) if (weekday(m) === weekday(n)) k++;
        const ids = [...days].flatMap((d, i) => (d === weekday(n) ? [i] : []));
        return ids[k % ids.length];
      }

      let loading = false;
      async function openPuzzle(rec) {
        if (loading) return;
        loading = true;
        $('next').disabled = true;
        try {
          puzzle = layout(await fetchPuzzle(rec.id, rec.mini));
          if (!rec.state) {
            rec.state = puzzle.words.map((w) => ({
              done: w.given,
              won: false,
              given: w.given,
              misses: 0,
              guesses: [],
            }));
            (rec.mini ? stats.miniSeen : stats.seen).push(rec.id);
          }
          game = rec;
          state = rec.state;
          saveStats();
        } finally {
          loading = false;
          $('next').disabled = false;
        }
        // Select before rendering, since the last puzzle's entry may not
        // exist in this one, as when a mini follows a full puzzle.
        const first = state.findIndex((st) => !st.done);
        sel = first < 0 ? 0 : first;
        lastCell = -1;
        render();
        select(sel, true);
      }

      // The page plays today's puzzle, puzzle n at ?p=n, today's mini at
      // ?mini, or mini n at ?mini=n, resuming any of them if it's the one
      // saved. Minis are already shuffled, so daily mini #n plays mini n - 1.
      async function start() {
        const q = new URLSearchParams(location.search);
        const mini = q.has('mini');
        const p = mini ? q.get('mini') : q.get('p');
        const id = p ? Number(p) : NaN;
        const [curKey, dailyKey] = mini ? ['miniCur', 'miniDaily'] : ['cur', 'daily'];
        const saved = (rec, match) => rec?.v === DATA && rec.state && match(rec);
        document.body.classList.toggle('mini', mini);
        for (const b of $('modes').children)
          b.setAttribute('aria-pressed', (b.dataset.mode === 'mini') === mini);
        try {
          let rec;
          if (Number.isInteger(id) && id >= 0 && id < (mini ? MINIS : PUZZLES)) {
            rec = saved(stats[curKey], (r) => r.id === id)
              ? stats[curKey]
              : { v: DATA, id, t: Date.now(), mini };
            stats[curKey] = rec;
          } else {
            const day = today();
            const id = mini ? (((day - 1) % MINIS) + MINIS) % MINIS : await dailyId(day);
            rec = saved(stats[dailyKey], (r) => r.day === day && r.id === id)
              ? stats[dailyKey]
              : { v: DATA, id, t: Date.now(), day, mini };
            stats[dailyKey] = rec;
          }
          await openPuzzle(rec);
        } catch (err) {
          console.error(err);
          setStatus('bad', 'couldn’t load the puzzle');
        }
      }
      addEventListener('popstate', start);

      // --- rendering ----------------------------------------------------------

      function render() {
        const p = puzzle;
        const meta = [];
        if (game.day) meta.push(`daily ${game.mini ? 'mini ' : ''}#${game.day}`);
        if (!game.mini)
          meta.push(
            new Date(p.date + 'T12:00').toLocaleDateString(undefined, {
              weekday: 'short',
              month: 'short',
              day: 'numeric',
              year: 'numeric',
            }),
            p.by
          );
        $('meta').textContent = meta.join(' · ');
        $('today').hidden = !!game.day;
        const step = p.size > 5 ? 30 : 60;
        const mid = (p.size - 1) / 2;
        gridEl.style.setProperty('--cols', p.size);
        gridEl.style.setProperty('--step', step + 'ms');
        gridEl.style.setProperty('--wave', 2 * (p.size - 1) * step + 120 + 'ms');
        gridEl.classList.remove('complete', 'cheer');
        gridEl.textContent = '';
        const nums = new Map(p.words.map((w) => [w.cells[0], w.n]));
        for (let i = 0; i < p.grid.length; i++) {
          const el = document.createElement('div');
          el.id = `sq-${i}`;
          if (p.grid[i] === '.') el.className = 'sq block';
          else {
            const r = Math.floor(i / p.size);
            const c = i % p.size;
            el.className = 'sq in';
            el.style.setProperty('--in', Math.round(Math.random() * 400) + 'ms');
            el.style.setProperty('--k', r + c);
            el.style.setProperty('--ox', c - mid);
            el.style.setProperty('--oy', r - mid);
            el.textContent = p.grid[i];
            if (nums.has(i)) {
              const n = document.createElement('span');
              n.className = 'num';
              n.textContent = n.dataset.n = nums.get(i);
              el.prepend(n);
            }
            el.addEventListener('click', () => clickCell(i));
          }
          gridEl.appendChild(el);
        }
        const first = gridEl.firstChild;
        Promise.allSettled(
          gridEl
            .getAnimations({ subtree: true })
            .filter((a) => a.animationName === 'sq-in')
            .map((a) => a.finished)
        ).then(() => first.isConnected && dispatchEvent(new Event('gridin')));
        for (const dir of ['a', 'd']) {
          const ol = $(`list-${dir}`);
          ol.textContent = '';
          p.words.forEach((w, k) => {
            if (w.dir !== dir) return;
            const li = document.createElement('li');
            li.id = `clue-${k}`;
            li.addEventListener('click', () => {
              select(k, true);
              bringFormIntoView();
            });
            ol.appendChild(li);
            paintClue(k);
          });
        }
        paintCells();
        updateScore();
        renderLeaders();
      }

      function paintClue(k) {
        const w = puzzle.words[k];
        const st = state[k];
        const li = $(`clue-${k}`);
        li.className =
          (st.given ? 'given' : st.done ? (st.won ? 'won' : 'lost') : '') +
          (k === sel ? ' cur' : '');
        li.innerHTML = `<span class="n">${w.n}</span><span class="ans">${w.ans}</span>`;
        if (st.won) {
          li.innerHTML += `<span class="said">${esc(st.said)}${st.exact ? ' <span class="star">★</span>' : ''}</span>`;
          if (st.best && st.best.toLowerCase() !== st.said.toLowerCase())
            li.innerHTML += `<span class="past">≈ ${esc(st.best)}</span>`;
        } else if (st.done) li.innerHTML += `<span class="said">${esc(w.clue)}</span>`;
      }

      // Each half of a square shows one of its entries: green once clued, red
      // once revealed. A square in only one entry is tinted whole.
      function paintCells() {
        const through = new Map();
        puzzle.words.forEach((w, k) => {
          for (const i of w.cells) {
            const s = through.get(i) || {};
            s[w.dir] = state[k];
            through.set(i, s);
          }
        });
        const w = puzzle.words[sel];
        const on = new Set(w.cells);
        // A clue number turns gold once every entry starting there earns a
        // ★, or half gold when only one of its across and down has.
        const stars = new Map();
        puzzle.words.forEach((w, k) => {
          const s = stars.get(w.cells[0]) || {};
          s[w.dir] = !!state[k].exact;
          stars.set(w.cells[0], s);
        });
        for (const [i, sts] of through) {
          const el = $(`sq-${i}`);
          const s = stars.get(i) || {};
          const all = Object.values(s).length > 0 && Object.values(s).every(Boolean);
          el.classList.toggle('starred', all);
          el.classList.toggle('starred-a', !all && !!s.a);
          el.classList.toggle('starred-d', !all && !!s.d);
          for (const half of ['a', 'd']) {
            const st = sts[half] || sts.a || sts.d;
            el.classList.toggle(`${half}-won`, st.won);
            el.classList.toggle(`${half}-gave`, st.done && !st.won && !st.given);
            el.classList.toggle(`${half}-given`, st.given);
          }
          el.classList.toggle('cur', on.has(i) && i === lastCell);
        }
        let box = $('sel-box');
        if (!box) {
          box = document.createElement('div');
          box.id = 'sel-box';
          gridEl.append(box);
        }
        const [a, z] = [w.cells[0], w.cells.at(-1)];
        const n = puzzle.size;
        box.style.gridRow = `${Math.floor(a / n) + 1} / ${Math.floor(z / n) + 2}`;
        box.style.gridColumn = `${(a % n) + 1} / ${(z % n) + 2}`;
      }

      function select(k, focus) {
        const prev = sel;
        sel = k;
        const w = puzzle.words[k];
        if (!w.cells.includes(lastCell)) lastCell = w.cells[0];
        if ($(`clue-${prev}`)) paintClue(prev);
        paintClue(k);
        scrollList($(`clue-${k}`));
        paintCells();
        showWord();
        pastOf(w).then(
          () => Matcher.warm(w),
          () => {}
        );
        if (focus && !state[k].done && (fine() || typing)) guessEl.focus();
      }

      // Scrolls only the clue list, not the page, which on a phone would
      // jump away from the grid.
      function scrollList(li) {
        const ol = li.parentElement;
        const a = li.getBoundingClientRect();
        const b = ol.getBoundingClientRect();
        if (a.top < b.top) ol.scrollTop += a.top - b.top;
        else if (a.bottom > b.bottom) ol.scrollTop += a.bottom - b.bottom;
      }

      // On a touchscreen the keyboard stays up when moving to another entry
      // while writing a clue, and stays down otherwise.
      let typing = false;
      document.addEventListener(
        'pointerdown',
        () => {
          typing = document.activeElement === guessEl;
        },
        true
      );

      function bringFormIntoView() {
        const r = $('guess-form').getBoundingClientRect();
        if (r.top < 0 || r.bottom > innerHeight)
          $('guess-form').scrollIntoView({ block: 'center', behavior: 'smooth' });
      }

      function clickCell(i) {
        const words = puzzle.words
          .map((w, k) => (w.cells.includes(i) ? k : -1))
          .filter((k) => k >= 0);
        if (!words.length) return;
        let k = words.find((k) => puzzle.words[k].dir === puzzle.words[sel].dir) ?? words[0];
        if (i === lastCell && words.length > 1) k = words.find((x) => x !== sel) ?? k;
        lastCell = i;
        select(k, true);
      }

      function showWord() {
        const w = puzzle.words[sel];
        const st = state[sel];
        $('which').textContent = label(w);
        if (!st.done) {
          const left = Math.max(0, TRIES - st.misses);
          $('which').insertAdjacentHTML(
            'beforeend',
            ` · ${worthOf(st)} points <span class="pips" role="img" aria-label="${left} of ${TRIES} tries left">${'<i class="on"></i>'.repeat(left)}${'<i></i>'.repeat(TRIES - left)}</span>`
          );
        }
        $('answer').textContent = w.ans;
        $('answer').className = st.won ? 'ok' : st.done && !st.given ? 'bad' : '';
        guessEl.value = '';
        recall = -1;
        guessEl.disabled = st.done;
        guessEl.placeholder = st.done
          ? st.won
            ? 'clued'
            : 'revealed'
          : `write a clue for ${w.ans}`;
        $('guess-btn').disabled = st.done;
        $('giveup').hidden = st.done;
        const ul = $('guesses');
        ul.textContent = '';
        for (const g of st.guesses) addGuessLi(g);
        statusEl.textContent = '';
        if (st.given)
          setStatus('', `${clueLabel()}: <q>${esc(w.clue)}</q> — no other clues to match`);
        else if (st.won) {
          setStatus(
            'ok',
            `✓ <q>${esc(st.said)}</q>` +
              (st.exact ? ' <span class="star">★</span>' : '') +
              (st.best && st.best.toLowerCase() !== st.said.toLowerCase()
                ? ` ≈ <q>${esc(st.best)}</q>`
                : '') +
              `<br><span style="color:var(--muted)">${clueLabel()}: <q>${esc(w.clue)}</q></span>` +
              `<br>+${st.paid || 0} points`
          );
        } else if (st.done) setStatus('bad', `${clueLabel()}: <q>${esc(w.clue)}</q><br>0 points`);
        $('known').hidden = true;
        $('known').open = true;
        if (st.done && !st.given)
          pastOf(w).then(
            () => puzzle.words[sel] === w && showKnown(),
            () => {}
          );
      }

      function showKnown() {
        const w = puzzle.words[sel];
        const st = state[sel];
        const known = $('known');
        known.hidden = false;
        known.querySelector('summary').textContent = `${w.past.length} past clue${
          w.past.length === 1 ? '' : 's'
        } for ${w.ans}`;
        const kl = known.querySelector('ul');
        kl.textContent = '';
        for (const c of w.past) {
          const li = document.createElement('li');
          li.textContent = c;
          if (c === st.best) li.className = 'hit';
          kl.appendChild(li);
        }
      }

      function setStatus(cls, html) {
        statusEl.innerHTML = `<span class="${cls}">${html}</span>`;
      }
      function addGuessLi(g) {
        const li = document.createElement('li');
        li.textContent = g.text + (g.close ? ' (close)' : g.why ? ` (${g.why})` : ` (−${MISS})`);
        if (g.close || g.why) li.className = 'close';
        $('guesses').prepend(li);
      }

      function updateScore(cheer) {
        $('score').textContent = score();
        const n = playable().length;
        const won = playable().filter((s) => s.won).length;
        const lost = playable().filter((s) => s.done && !s.won).length;
        $('solved').textContent = `${won}/${n}`;
        $('stars').textContent = playable().filter((s) => s.won && s.exact).length;
        $('progress').style.setProperty('--won', (100 * won) / (n || 1) + '%');
        $('progress').style.setProperty('--lost', (100 * (won + lost)) / (n || 1) + '%');
        $('share').hidden = !playable().some((s) => s.done);
        const done = state.every((s) => s.done);
        $('finished').hidden = !done;
        if (cheer && done) gridEl.classList.add('cheer');
        gridEl.classList.toggle('complete', done);
        renderLeaders();
      }

      function shareText() {
        const sts = playable();
        const won = sts.filter((s) => s.won).length;
        const stars = sts.filter((s) => s.exact).length;
        const q = game.mini
          ? game.day
            ? '?mini'
            : `?mini=${game.id}`
          : game.day
            ? ''
            : `?p=${game.id}`;
        const name = game.mini ? 'Clueward Mini' : 'Clueward';
        return [
          game.day
            ? `${name} #${game.day}`
            : game.mini
              ? `${name} ${game.id + 1}`
              : `${name} · NYT ${puzzle.date}`,
          `${score()} points · ${won}/${sts.length} clued` + (stars ? ` · ${stars}★` : ''),
          location.origin + location.pathname + q,
        ].join('\n');
      }
      let shareTimer = null;
      $('share').addEventListener('click', async () => {
        const btn = $('share');
        const text = shareText();
        const flash = (msg) => {
          btn.textContent = msg;
          clearTimeout(shareTimer);
          shareTimer = setTimeout(() => (btn.textContent = 'share'), 1500);
        };
        try {
          if (navigator.share && matchMedia('(pointer: coarse)').matches) {
            await navigator.share({ text });
            return;
          }
          await navigator.clipboard.writeText(text);
          flash('copied!');
        } catch (err) {
          if (err.name !== 'AbortError') flash('couldn’t copy');
        }
      });

      // --- guessing -----------------------------------------------------------

      function settle(k, won) {
        const st = state[k];
        st.done = true;
        st.won = won;
        recordScore();
        paintClue(k);
        paintCells();
        updateScore(true);
      }

      function nextOpen(k, step = 1) {
        const n = state.length;
        for (let d = 1; d <= n; d++) {
          const j = (((k + step * d) % n) + n) % n;
          if (!state[j].done) return j;
        }
        return -1;
      }

      let judging = false;
      async function submitGuess(text) {
        text = text.trim();
        const k = sel;
        const st = state[k];
        const w = puzzle.words[k];
        if (!text || st.done || judging) return;
        // The box stays enabled while judging, since disabling it would
        // drop a phone's keyboard after every try.
        judging = true;
        const slow = setTimeout(() => sel === k && setStatus('', 'checking…'), 400);
        let v;
        try {
          await pastOf(w);
          v = await Matcher.judge(text, w);
        } catch (err) {
          console.error(err);
          setStatus('bad', 'couldn’t load past clues — try again');
          return;
        } finally {
          judging = false;
          clearTimeout(slow);
        }
        if (sel !== k) return;
        if (v.result === 'yes') {
          st.said = text;
          st.best = v.best;
          st.exact = !!v.exact;
          st.paid = worthOf(st) + (st.exact ? EXACT : 0);
          settle(k, true);
          showWord();
          if (nextOpen(k) >= 0 && fine())
            statusEl.firstChild.insertAdjacentHTML(
              'beforeend',
              '<br><span style="color:var(--muted)">enter for the next clue</span>'
            );
          return;
        }
        const g = { text, close: v.result === 'close' };
        if (v.result === 'giveaway') g.why = 'gives it away';
        else if (!g.close) st.misses++;
        st.guesses.push(g);
        if (st.misses >= TRIES) {
          settle(k, false);
          showWord();
          statusEl.firstChild.insertAdjacentHTML('afterbegin', `${TRIES} wrong tries<br>`);
          return;
        }
        recordScore();
        showWord();
        setStatus(
          g.why || g.close ? 'close' : 'bad',
          g.why
            ? `a clue can't contain ${esc(w.ans)}`
            : g.close
              ? 'close — try another angle'
              : `no clue like that has run for ${esc(w.ans)}`
        );
        guessEl.focus();
      }

      $('guess-form').addEventListener('submit', (e) => {
        e.preventDefault();
        submitGuess(guessEl.value);
      });
      $('giveup').addEventListener('click', () => {
        if (state[sel].done) return;
        settle(sel, false);
        showWord();
      });
      $('next').addEventListener('click', () => {
        if (loading) return;
        const mini = !!game?.mini;
        stats[mini ? 'miniCur' : 'cur'] = null;
        history.pushState(null, '', mini ? `?mini=${pickId(true)}` : `?p=${pickId()}`);
        start();
      });
      $('today').addEventListener('click', () => {
        if (loading) return;
        history.pushState(null, '', location.pathname + (game?.mini ? '?mini' : ''));
        start();
      });
      for (const b of $('modes').children)
        b.addEventListener('click', () => {
          if (loading || (b.dataset.mode === 'mini') === !!game?.mini) return;
          history.pushState(
            null,
            '',
            location.pathname + (b.dataset.mode === 'mini' ? '?mini' : '')
          );
          start();
        });
      // The arrows step to the previous / next unclued entry, or the adjacent
      // one once every entry is done.
      for (const [id, step] of [
        ['prev-clue', -1],
        ['next-clue', 1],
      ]) {
        $(id).addEventListener('mousedown', (e) => e.preventDefault());
        $(id).addEventListener('click', () => {
          if (!puzzle) return;
          const j = nextOpen(sel, step);
          select(j < 0 ? (sel + step + state.length) % state.length : j, true);
        });
      }

      // ↑ in the clue box steps back through this entry's tries, newest first.
      let recall = -1;
      guessEl.addEventListener('input', () => {
        recall = -1;
      });
      guessEl.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp' && !e.metaKey && !e.ctrlKey && !e.altKey && !e.shiftKey) {
          const tries = state[sel].guesses.map((g) => g.text).reverse();
          if (!tries.length) return;
          e.preventDefault();
          recall = Math.min(recall + 1, tries.length - 1);
          guessEl.value = tries[recall];
          guessEl.setSelectionRange(guessEl.value.length, guessEl.value.length);
        }
        if (e.key === 'Escape') guessEl.blur();
      });
      // Tab and shift-tab anywhere move to the next or previous open entry, or
      // any entry once the puzzle is complete, and once an entry is settled,
      // enter moves on too.
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== 'Tab') return;
        if (e.metaKey || e.ctrlKey || e.altKey || !puzzle || $('info').open) return;
        if (
          e.key === 'Enter' &&
          (!state[sel].done || e.target.closest('input, button, summary, a'))
        )
          return;
        const step = e.shiftKey ? -1 : 1;
        let j = nextOpen(sel, step);
        if (j < 0 && e.key === 'Tab') j = (sel + step + state.length) % state.length;
        if (j < 0) return;
        e.preventDefault();
        select(j, true);
      });
      // ↓ and → switch to the down and across entry through the current
      // square. In the clue box they only do so while it's empty, so they
      // still move the caret through a half-written clue.
      document.addEventListener('keydown', (e) => {
        const dir = { ArrowDown: 'd', ArrowRight: 'a' }[e.key];
        if (!dir || e.metaKey || e.ctrlKey || e.altKey || e.shiftKey || !puzzle || $('info').open)
          return;
        if (e.target.closest('input') ? e.target.value : e.target.closest('summary')) return;
        const k = puzzle.words.findIndex((w) => w.dir === dir && w.cells.includes(lastCell));
        if (k < 0) return;
        e.preventDefault();
        if (k !== sel) select(k, true);
      });

      // Keep the clue lists as tall as the grid beside them.
      new ResizeObserver(() => {
        $('clues').style.setProperty('--grid-h', gridEl.offsetHeight + 'px');
      }).observe(gridEl);

      // --- clue matching --------------------------------------------------------
      // The rules are in matcher.js. This runs their embedding model and
      // shows when it's loading.
      const Matcher = (() => {
        const matcherEl = $('matcher');
        let ready = false;
        let loading = null;
        const cache = new Map();

        // The model runs in embed-worker.js; replies come back by request id.
        let worker = null;
        let nextId = 0;
        const pending = new Map();
        function load() {
          if (!loading) {
            matcherEl.textContent = 'loading matcher…';
            matcherEl.classList.add('loading');
            loading = new Promise((resolve, reject) => {
              worker = new Worker('embed-worker.js', { type: 'module' });
              worker.onerror = (e) => reject(new Error(e.message || 'worker failed'));
              worker.onmessage = ({ data }) => {
                if (data.ready) resolve();
                else if (data.id === undefined) reject(new Error(data.error));
                else {
                  const p = pending.get(data.id);
                  pending.delete(data.id);
                  if (data.error) p.reject(new Error(data.error));
                  else p.resolve(data.vecs);
                }
              };
            })
              .finally(() => matcherEl.classList.remove('loading'))
              .then(
                () => {
                  ready = true;
                  matcherEl.textContent = '';
                },
                (err) => {
                  console.error('matcher:', err);
                  matcherEl.textContent =
                    'semantic matcher failed to load — near-exact matches only';
                }
              );
          }
          return loading;
        }

        // cache maps each text to a promise of its vector, so a text already
        // on its way to the worker isn't sent twice.
        function embed(texts) {
          const missing = [...new Set(texts.filter((t) => !cache.has(t)))];
          if (missing.length) {
            const id = nextId++;
            const batch = new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
            worker.postMessage({ id, texts: missing });
            missing.forEach((t, i) => {
              const vec = batch.then((vecs) => vecs[i]);
              vec.catch(() => cache.delete(t));
              cache.set(t, vec);
            });
          }
          return Promise.all(texts.map((t) => cache.get(t)));
        }

        // Embed an entry's past clues, most common first and WARM at a time,
        // while the selection rests on it, so checking a guess usually only
        // has to embed the guess. Moving on stops it after the current batch.
        const { WARM, pastTexts } = ClueMatcher;
        let warmTimer = null;
        function warm(w) {
          clearTimeout(warmTimer);
          warmTimer = setTimeout(async () => {
            await load();
            for (let i = 0; i < w.past.length; i += WARM) {
              if (!ready || puzzle.words[sel] !== w) return;
              await embed(pastTexts(w.past.slice(i, i + WARM))).catch(() => {});
            }
          }, 300);
        }

        const judge = (guess, w) =>
          ClueMatcher.judge(guess, w.ans, w.past, async () => {
            await load();
            return ready ? embed : null;
          });

        return { warm, judge };
      })();

      start();
    </script>
  </body>
</html>
