<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruvan / word-search</title>
    <link rel="icon" id="favicon" />
    <link rel="stylesheet" href="/common.css" />
    <style>
      :root {
        --muted: rgba(0, 0, 0, 0.45);
        --faint: rgba(0, 0, 0, 0.3);
        --line: rgba(0, 0, 0, 0.12);
        --hover: rgba(0, 0, 0, 0.05);
      }
      body.dark {
        --muted: rgba(255, 255, 255, 0.5);
        --faint: rgba(255, 255, 255, 0.35);
        --line: rgba(255, 255, 255, 0.16);
        --hover: rgba(255, 255, 255, 0.07);
      }
      @media (prefers-color-scheme: dark) {
        body:not(.light) {
          --muted: rgba(255, 255, 255, 0.5);
          --faint: rgba(255, 255, 255, 0.35);
          --line: rgba(255, 255, 255, 0.16);
          --hover: rgba(255, 255, 255, 0.07);
        }
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        /* dvh so iOS browser chrome can't push the results scroller off-screen. */
        height: 100dvh;
        overflow: hidden;
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
      }
      #top {
        flex: 0 0 auto;
        padding: 20px 16px 12px;
        border-bottom: 1px solid var(--line);
      }
      #q {
        display: block;
        width: 100%;
        font: inherit;
        font-size: clamp(20px, 6vw, 28px);
        text-align: center;
        background: transparent;
        color: inherit;
        border: none;
        outline: none;
      }
      #q::placeholder {
        color: var(--faint);
      }
      #status {
        max-width: 560px;
        margin: 8px auto 0;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
        min-height: 15px;
      }
      #status .sort-btn {
        cursor: pointer;
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 2px;
        /* padding, not margin: a bigger tap target without moving the dots */
        display: inline-block;
        padding: 6px 4px;
        margin: -6px 0;
      }
      #status .sort-btn.active {
        color: inherit;
      }
      #sorts[hidden] {
        display: none;
      }
      #results {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        /* the extra bottom padding keeps the last rows clear of the hint bar */
        padding: 16px 16px 48px;
        column-gap: 24px;
      }
      /* Multicol at a fixed height pans sideways; the default single column is
         block flow and scrolls down. */
      body:not(.one-col) #results {
        column-width: 160px;
      }
      #results a {
        display: block;
        color: inherit;
        text-decoration: none;
        padding: 1px 4px;
        border-radius: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #results a:hover {
        background: var(--hover);
      }
      #hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 12px;
        display: flex;
        overflow-x: auto;
        scrollbar-width: none;
        font-size: 12px;
        color: #888;
        opacity: 1;
        transition: opacity 0.4s ease;
        user-select: none;
        z-index: 3;
      }
      #hint::-webkit-scrollbar {
        display: none;
      }
      #hint::before,
      #hint::after {
        content: '';
        flex: 0 0 8px;
      }
      #hint-inner {
        flex: 0 0 auto;
        margin: 0 auto;
        white-space: nowrap;
        padding: 6px 10px;
        border-radius: 6px;
        background: #ffffff;
      }
      body.dark #hint-inner {
        background: #111111;
      }
      @media (prefers-color-scheme: dark) {
        body:not(.light) #hint-inner {
          background: #111111;
        }
      }
      #hint.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #hint .hint-btn {
        cursor: pointer;
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 2px;
      }
      #hint .hint-btn:hover {
        color: #333;
      }
      body.dark #hint .hint-btn:hover {
        color: #ccc;
      }
      #hint-zone {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 60px;
        z-index: 2;
      }
    </style>
    <script src="/common.js"></script>
  </head>
  <body class="one-col">
    <div id="top">
      <input
        id="q"
        type="text"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        placeholder="search"
        aria-label="search words"
      />
      <div id="status">
        <span id="count"></span
        ><span id="sorts" hidden>
          ·
          <span class="sort-btn" id="sort-alpha">a–z</span>
          ·
          <span class="sort-btn" id="sort-length">length</span></span
        >
      </div>
    </div>
    <div id="results"></div>
    <div id="hint">
      <span id="hint-inner"
        ><span style="white-space: nowrap">regex ok</span> ·
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-cols"><span id="cols-label">columns</span></span></span
        >
        ·
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-dark"><span class="hb-dark-label">dark</span></span></span
        >
        ·
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-sitemap">sitemap</span></span
        ></span
      >
    </div>
    <div id="hint-zone"></div>
    <script>
      Common.paintFaviconR();
      Common.initDarkMode();

      const WORDS_URL = 'https://raw.githubusercontent.com/dolph/dictionary/master/enable1.txt';
      const PAGE = 300;

      const qEl = document.getElementById('q');
      const countEl = document.getElementById('count');
      const sortsEl = document.getElementById('sorts');
      const resultsEl = document.getElementById('results');

      let words = null;
      let sortKey = 'alpha'; // 'alpha' | 'length'
      let sortAsc = true;
      let ordering = []; // every match, in sort order
      let shown = 0; // how much of it is in the DOM

      function escapeRe(s) {
        return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      }

      // A query that doesn't compile is matched literally rather than erroring.
      function matcher(q) {
        try {
          return { re: new RegExp(q, 'i'), literal: false };
        } catch {
          return { re: new RegExp(escapeRe(q), 'i'), literal: true };
        }
      }

      // Matches arrive alphabetical, so a–z ascending needs no sorting; length
      // buckets instead of comparing, keeping each band a–z.
      function ordered(matches) {
        if (sortKey === 'alpha') return sortAsc ? matches : matches.slice().reverse();
        const byLength = [];
        let longest = 0;
        for (const w of matches) {
          (byLength[w.length] ||= []).push(w);
          if (w.length > longest) longest = w.length;
        }
        const out = [];
        for (let n = 0; n <= longest; n++) {
          const band = byLength[sortAsc ? n : longest - n];
          if (!band) continue;
          for (const w of band) out.push(w);
        }
        return out;
      }

      function paintSorts() {
        const arrow = sortAsc ? ' ↑' : ' ↓';
        const alphaEl = document.getElementById('sort-alpha');
        const lengthEl = document.getElementById('sort-length');
        alphaEl.textContent = 'a–z' + (sortKey === 'alpha' ? arrow : '');
        lengthEl.textContent = 'length' + (sortKey === 'length' ? arrow : '');
        alphaEl.classList.toggle('active', sortKey === 'alpha');
        lengthEl.classList.toggle('active', sortKey === 'length');
      }

      function appendPage() {
        const end = Math.min(shown + PAGE, ordering.length);
        if (end === shown) return;
        const frag = document.createDocumentFragment();
        for (let i = shown; i < end; i++) {
          const a = document.createElement('a');
          a.href = 'https://en.wiktionary.org/wiki/' + encodeURIComponent(ordering[i]);
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = ordering[i];
          frag.appendChild(a);
        }
        resultsEl.appendChild(frag);
        shown = end;
      }

      // Whichever axis overflows is the one being scrolled: the default single
      // column grows downward, the multi-column view sideways.
      function nearEnd() {
        const r = resultsEl;
        const room = 600;
        if (r.scrollHeight > r.clientHeight)
          return r.scrollHeight - r.clientHeight - r.scrollTop < room;
        if (r.scrollWidth > r.clientWidth)
          return r.scrollWidth - r.clientWidth - r.scrollLeft < room;
        return true; // nothing to scroll yet — keep filling
      }

      // Pages have to keep coming until something overflows, or there is no
      // scrollbar to pull the rest in with.
      function fill() {
        let guard = 40;
        while (guard-- > 0 && shown < ordering.length && nearEnd()) appendPage();
      }

      function render() {
        const q = qEl.value.trim();
        resultsEl.textContent = '';
        resultsEl.scrollTop = 0;
        resultsEl.scrollLeft = 0;
        ordering = [];
        shown = 0;
        sortsEl.hidden = true;
        if (!words) {
          countEl.textContent = 'loading enable1…';
          return;
        }
        if (!q) {
          countEl.textContent = words.length.toLocaleString() + ' words';
          return;
        }
        const { re, literal } = matcher(q);
        const matches = [];
        for (const w of words) {
          if (re.test(w)) matches.push(w);
        }
        ordering = ordered(matches);
        fill();
        let msg =
          ordering.length.toLocaleString() + (ordering.length === 1 ? ' match' : ' matches');
        if (literal) msg += ' · literal (invalid regex)';
        countEl.textContent = msg;
        sortsEl.hidden = false;
        paintSorts();
      }

      resultsEl.addEventListener('scroll', fill, { passive: true });
      window.addEventListener('resize', fill);

      // ?<regex>[&sort=length-desc]. Encoding escapes any "&" in the regex, so
      // the first one starts the options. Not Common.parseQueryItems: it splits
      // on "/", which a regex can contain.
      const DEFAULT_SORT = 'alpha-asc';

      function readUrl() {
        const raw = location.search.replace(/^\?/, '');
        const amp = raw.indexOf('&');
        const rawQuery = amp === -1 ? raw : raw.slice(0, amp);
        let query;
        try {
          query = decodeURIComponent(rawQuery);
        } catch {
          query = rawQuery;
        }
        const sort = amp === -1 ? '' : new URLSearchParams(raw.slice(amp + 1)).get('sort') || '';
        const [key, dir] = sort.split('-');
        return {
          query,
          sortKey: key === 'length' ? 'length' : 'alpha',
          sortAsc: dir !== 'desc',
        };
      }

      // Sort is dropped with an empty box, keeping the leading value unambiguous.
      function syncUrl() {
        const q = qEl.value.trim();
        const sort = sortKey + (sortAsc ? '-asc' : '-desc');
        let search = '';
        if (q) {
          search = '?' + encodeURIComponent(q);
          if (sort !== DEFAULT_SORT) search += '&sort=' + sort;
        }
        if (location.search === search) return;
        history.replaceState(null, '', location.pathname + search + location.hash);
      }

      qEl.addEventListener('input', () => {
        syncUrl();
        render();
      });
      qEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === 'Escape') {
          e.preventDefault();
          qEl.blur();
        }
      });
      document.addEventListener('keydown', (e) => {
        if (e.key !== '/' || e.target === qEl || e.metaKey || e.ctrlKey || e.altKey) return;
        e.preventDefault();
        qEl.focus();
        qEl.select();
      });

      // Clicking the active sort reverses it; the other switches, ascending.
      function chooseSort(key) {
        if (sortKey === key) sortAsc = !sortAsc;
        else {
          sortKey = key;
          sortAsc = true;
        }
        syncUrl();
        render();
      }

      document.getElementById('sort-alpha').addEventListener('click', () => chooseSort('alpha'));
      document.getElementById('sort-length').addEventListener('click', () => chooseSort('length'));

      function applyUrl() {
        const state = readUrl();
        qEl.value = state.query;
        sortKey = state.sortKey;
        sortAsc = state.sortAsc;
        render();
      }

      window.addEventListener('popstate', applyUrl);

      applyUrl();
      qEl.focus();

      fetch(WORDS_URL)
        .then((r) => {
          if (!r.ok) throw new Error(r.status);
          return r.text();
        })
        .then((text) => {
          words = text.split('\n').filter(Boolean);
          render();
        })
        .catch(() => {
          countEl.textContent = 'could not load enable1';
        });

      const hintEl = document.getElementById('hint');
      const { show: showHint } = Common.initHintBar({
        hintEl,
        hintZoneEl: document.getElementById('hint-zone'),
      });
      const colsLabel = document.getElementById('cols-label');
      document.getElementById('hb-cols').addEventListener('click', () => {
        const oneCol = document.body.classList.toggle('one-col');
        colsLabel.textContent = oneCol ? 'columns' : '1 column';
        showHint();
      });
      document.getElementById('hb-dark').addEventListener('click', () => {
        Common.toggleDark();
        showHint();
      });
      document.getElementById('hb-sitemap').addEventListener('click', Common.openSitemap);
    </script>
  </body>
</html>
