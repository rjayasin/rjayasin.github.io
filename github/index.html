<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruvan / commits</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      background: #ffffff;
      color: #000000;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.6;
      padding: 48px 32px;
      max-width: 720px;
    }
    header {
      margin-bottom: 40px;
    }
    header a {
      color: #000;
      text-decoration: none;
    }
    header a:hover {
      text-decoration: underline;
    }
    h1 {
      font-size: 13px;
      font-weight: normal;
      letter-spacing: 0.05em;
    }
    .subtitle {
      color: #888;
      margin-top: 4px;
    }
    .log {
      display: flex;
      flex-direction: column;
      gap: 0;
      width: max-content;
      min-width: 100%;
    }
    .day {
      display: grid;
      grid-template-columns: 60px 1fr;
      column-gap: 24px;
      padding: 12px 0;
      border-top: 2px solid #000;
      width: 100%;
    }
    .day:last-child {
      border-bottom: 1px solid #f0f0f0;
    }
    .day-label {
      color: #888;
      white-space: nowrap;
      padding-top: 1px;
    }
    .day-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .repo-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .repo {
      color: #888;
      font-size: 11px;
      text-decoration: none;
      white-space: nowrap;
      margin-bottom: 2px;
    }
    .repo:hover { color: #000; }
    .commit {
      display: grid;
      grid-template-columns: 48px 1fr;
      column-gap: 12px;
      white-space: nowrap;
    }
    .time {
      color: #888;
    }
    .commit a {
      color: #000;
      text-decoration: none;
    }
    .commit a:hover { text-decoration: underline; }
    #status {
      color: #888;
      padding: 8px 0;
    }
  </style>
</head>
<body>
  <header>
    <h1><a href="/">Ruvan</a> / commits</h1>
    <p class="subtitle" id="range"></p>
  </header>
  <div class="log" id="log"></div>
  <p id="status">loading…</p>
  <div id="sentinel"></div>
  <script>
    const USER = 'rjayasin';
    const log = document.getElementById('log');
    const status = document.getElementById('status');
    const range = document.getElementById('range');
    const sentinel = document.getElementById('sentinel');

    let nextPage = 1;
    let loading = false;
    let exhausted = false;
    let currentDay = null;
    let total = 0;

    function fmtDay(iso) {
      const d = new Date(iso);
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${mm}-${dd}`;
    }

    function fmtTime(iso) {
      const d = new Date(iso);
      const hh = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${hh}:${min}`;
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function fetchPage(page) {
      const r = await fetch(
        `https://api.github.com/search/commits?q=author:${USER}&sort=committer-date&order=desc&per_page=100&page=${page}`,
        { headers: { Accept: 'application/vnd.github+json' } }
      );
      if (!r.ok) throw new Error(`GitHub API ${r.status}`);
      return r.json();
    }

    async function loadMore() {
      if (loading || exhausted) return;
      loading = true;
      status.textContent = 'loading…';

      let data;
      try {
        data = await fetchPage(nextPage);
      } catch (e) {
        status.textContent = e.message;
        loading = false;
        exhausted = true;
        return;
      }

      const items = data.items || [];
      if (!items.length && total === 0) {
        status.textContent = 'no commits';
        exhausted = true;
        loading = false;
        return;
      }

      for (const c of items) {
        const date = c.commit.committer.date;
        const day = new Date(date).toDateString();
        const repo = c.repository.full_name;
        const msg = c.commit.message.split('\n')[0];

        if (!currentDay || currentDay.day !== day) {
          const dayEl = document.createElement('div');
          dayEl.className = 'day';
          dayEl.innerHTML = `
            <span class="day-label">${fmtDay(date)}</span>
            <div class="day-body"></div>`;
          log.appendChild(dayEl);
          currentDay = { day, bodyEl: dayEl.querySelector('.day-body'), repos: new Map() };
        }

        let repoEl = currentDay.repos.get(repo);
        if (!repoEl) {
          repoEl = document.createElement('div');
          repoEl.className = 'repo-group';
          repoEl.innerHTML = `<a class="repo" href="https://github.com/${repo}" target="_blank" rel="noopener">${escHtml(repo)}</a>`;
          currentDay.bodyEl.appendChild(repoEl);
          currentDay.repos.set(repo, repoEl);
        }

        repoEl.insertAdjacentHTML('beforeend', `
          <div class="commit"><span class="time">${fmtTime(date)}</span><a href="${c.html_url}" target="_blank" rel="noopener">${escHtml(msg)}</a></div>`);
      }

      total += items.length;
      range.textContent = `${total} commit${total === 1 ? '' : 's'}`;
      nextPage++;

      if (items.length < 100 || nextPage > 10) {
        exhausted = true;
        status.textContent = '';
      } else {
        status.textContent = '';
      }
      loading = false;
    }

    const io = new IntersectionObserver(entries => {
      if (entries.some(e => e.isIntersecting)) loadMore();
    }, { rootMargin: '400px' });
    io.observe(sentinel);
  </script>
</body>
</html>
