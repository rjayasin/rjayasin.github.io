<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruvan / commits</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      background: #ffffff;
      color: #000000;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.6;
      padding: 48px 32px;
      max-width: 720px;
    }
    header {
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }
    header a {
      color: #000;
      text-decoration: none;
    }
    header a:hover {
      text-decoration: underline;
    }
    h1 {
      font-size: 13px;
      font-weight: normal;
      letter-spacing: 0.05em;
    }
    .subtitle {
      color: #888;
      margin-top: 4px;
    }
    .log {
      display: flex;
      flex-direction: column;
      width: 100%;
    }
    .section {
      display: flex;
      flex-direction: column;
    }
    .section.day-start {
      border-top: 1px solid #ccc;
    }
    .section:last-child .commits {
      border-bottom: 1px solid #f0f0f0;
    }
    .section-header {
      position: sticky;
      top: 0;
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 24px;
      padding: 10px 0 0;
      line-height: 1.2;
      z-index: 1;
    }
    .repo {
      color: #888;
      font-size: 11px;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .repo:hover { color: #000; }
    .date {
      color: #888;
      white-space: nowrap;
      padding-top: 1px;
    }
    .commits {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-top: 0;
      padding-bottom: 8px;
    }
    .commit {
      display: grid;
      grid-template-columns: 8ch 1fr;
      column-gap: 12px;
    }
    @media (max-width: 640px) {
      body {
        font-size: 15px;
        padding: 32px 20px;
      }
      .repo { font-size: 12px; }
      h1 { font-size: 15px; }
    }
    .time {
      color: #888;
    }
    .commit a {
      color: #000;
      text-decoration: none;
    }
    .commit a:hover { text-decoration: underline; }
    #status {
      color: #888;
      padding: 8px 0;
    }
    #gh-auth {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
      color: #888;
      opacity: 0.7;
      transition: opacity 0.15s, color 0.15s;
    }
    #gh-auth:hover { opacity: 1; color: #000; }
    #gh-auth.authed { color: #000; opacity: 1; }
    #gh-auth svg { width: 100%; height: 100%; display: block; fill: currentColor; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1><a href="/">Ruvan</a> / commits</h1>
      <p class="subtitle" id="range"></p>
    </div>
    <button id="gh-auth" type="button" aria-label="Log in with GitHub" title="Log in with GitHub">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
    </button>
  </header>
  <div class="log" id="log"></div>
  <p id="status">loading…</p>
  <div id="sentinel"></div>
  <script>
    const USER = 'rjayasin';
    const TOKEN_KEY = 'gh_token';
    const log = document.getElementById('log');
    const status = document.getElementById('status');
    const range = document.getElementById('range');
    const sentinel = document.getElementById('sentinel');
    const authBtn = document.getElementById('gh-auth');

    function getToken() {
      return localStorage.getItem(TOKEN_KEY) || '';
    }

    function refreshAuthBtn() {
      if (getToken()) {
        authBtn.classList.add('authed');
        authBtn.title = 'Logged in to GitHub (click to log out)';
      } else {
        authBtn.classList.remove('authed');
        authBtn.title = 'Log in with GitHub to include private repos';
      }
    }

    authBtn.addEventListener('click', () => {
      if (getToken()) {
        if (confirm('Log out of GitHub?')) {
          localStorage.removeItem(TOKEN_KEY);
          location.reload();
        }
        return;
      }
      const msg =
        'Paste a GitHub personal access token to include private repos.\n\n' +
        'Create one at https://github.com/settings/tokens\n' +
        '  • Classic token: scope "repo"\n' +
        '  • Fine-grained: read access to "Contents" + "Metadata"\n\n' +
        'The token is stored only in this browser (localStorage).';
      const token = prompt(msg, '');
      if (token && token.trim()) {
        localStorage.setItem(TOKEN_KEY, token.trim());
        location.reload();
      }
    });

    refreshAuthBtn();

    let nextPage = 1;
    let loading = false;
    let exhausted = false;
    let currentDay = null;
    let currentDayRepos = null;
    let total = 0;

    const CURRENT_YEAR = new Date().getFullYear();

    function fmtDay(iso) {
      const d = new Date(iso);
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const yyyy = d.getFullYear();
      return yyyy === CURRENT_YEAR ? `${mm}-${dd}` : `${yyyy}-${mm}-${dd}`;
    }

    function fmtTime(iso) {
      const d = new Date(iso);
      let h = d.getHours();
      const ampm = h >= 12 ? 'pm' : 'am';
      h = h % 12 || 12;
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${h}:${min}${ampm}`;
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function fetchPage(page) {
      const headers = { Accept: 'application/vnd.github+json' };
      const token = getToken();
      if (token) headers.Authorization = `Bearer ${token}`;
      const r = await fetch(
        `https://api.github.com/search/commits?q=author:${USER}&sort=committer-date&order=desc&per_page=100&page=${page}`,
        { headers }
      );
      if (r.status === 401) {
        localStorage.removeItem(TOKEN_KEY);
        refreshAuthBtn();
        throw new Error('GitHub token rejected; logged out');
      }
      if (!r.ok) throw new Error(`GitHub API ${r.status}`);
      return r.json();
    }

    async function loadMore() {
      if (loading || exhausted) return;
      loading = true;
      status.textContent = 'loading…';

      let data;
      try {
        data = await fetchPage(nextPage);
      } catch (e) {
        status.textContent = e.message;
        loading = false;
        exhausted = true;
        return;
      }

      const items = data.items || [];
      if (!items.length && total === 0) {
        status.textContent = 'no commits';
        exhausted = true;
        loading = false;
        return;
      }

      for (const c of items) {
        const date = c.commit.committer.date;
        const day = new Date(date).toDateString();
        const repo = c.repository.full_name;
        const msg = c.commit.message.split('\n')[0];

        if (currentDay !== day) {
          currentDay = day;
          currentDayRepos = new Map();
        }

        let commitsEl = currentDayRepos.get(repo);
        if (!commitsEl) {
          const sec = document.createElement('section');
          sec.className = 'section';
          if (currentDayRepos.size === 0) sec.classList.add('day-start');
          sec.innerHTML = `
            <header class="section-header">
              <a class="repo" href="https://github.com/${repo}" target="_blank" rel="noopener">${escHtml(repo)}</a>
              <span class="date">${fmtDay(date)}</span>
            </header>
            <div class="commits"></div>`;
          log.appendChild(sec);
          commitsEl = sec.querySelector('.commits');
          currentDayRepos.set(repo, commitsEl);
        }

        commitsEl.insertAdjacentHTML('beforeend', `
          <div class="commit"><span class="time">${fmtTime(date)}</span><a href="${c.html_url}" target="_blank" rel="noopener">${escHtml(msg)}</a></div>`);
      }

      total += items.length;
      range.textContent = `${total} commit${total === 1 ? '' : 's'}`;
      nextPage++;

      if (items.length < 100 || nextPage > 10) {
        exhausted = true;
        status.textContent = '';
      } else {
        status.textContent = '';
      }
      loading = false;
    }

    const io = new IntersectionObserver(entries => {
      if (entries.some(e => e.isIntersecting)) loadMore();
    }, { rootMargin: '400px' });
    io.observe(sentinel);
  </script>
</body>
</html>
