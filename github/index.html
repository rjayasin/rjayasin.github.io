<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruvan / commits</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      background: #ffffff;
      color: #000000;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.6;
      padding: 48px 32px;
      max-width: 720px;
    }
    header {
      margin-bottom: 40px;
    }
    header a {
      color: #000;
      text-decoration: none;
    }
    header a:hover {
      text-decoration: underline;
    }
    h1 {
      font-size: 13px;
      font-weight: normal;
      letter-spacing: 0.05em;
    }
    .subtitle {
      color: #888;
      margin-top: 4px;
    }
    .log {
      display: flex;
      flex-direction: column;
      gap: 0;
      width: max-content;
      min-width: 100%;
    }
    .entry {
      display: grid;
      grid-template-columns: 90px 1fr;
      column-gap: 24px;
      padding: 8px 0;
      border-top: 1px solid #f0f0f0;
      width: 100%;
    }
    .entry.day-start {
      border-top: 2px solid #000;
    }
    .entry:last-child {
      border-bottom: 1px solid #f0f0f0;
    }
    .date {
      color: #888;
      white-space: nowrap;
      padding-top: 1px;
    }
    .right {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .repo {
      color: #888;
      font-size: 11px;
      text-decoration: none;
      white-space: nowrap;
    }
    .repo:hover { color: #000; }
    .message {
      white-space: nowrap;
    }
    .message a {
      color: #000;
      text-decoration: none;
    }
    .message a:hover { text-decoration: underline; }
    #status {
      color: #888;
      padding: 8px 0;
    }
  </style>
</head>
<body>
  <header>
    <h1><a href="/">Ruvan</a> / commits</h1>
    <p class="subtitle" id="range"></p>
  </header>
  <div class="log" id="log"></div>
  <p id="status">loading…</p>
  <div id="sentinel"></div>
  <script>
    const USER = 'rjayasin';
    const log = document.getElementById('log');
    const status = document.getElementById('status');
    const range = document.getElementById('range');
    const sentinel = document.getElementById('sentinel');

    let nextPage = 1;
    let loading = false;
    let exhausted = false;
    let lastDay = null;
    let total = 0;

    function fmtDate(iso) {
      const d = new Date(iso);
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${mm}-${dd} ${hh}:${min}`;
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function fetchPage(page) {
      const r = await fetch(
        `https://api.github.com/search/commits?q=author:${USER}&sort=committer-date&order=desc&per_page=100&page=${page}`,
        { headers: { Accept: 'application/vnd.github+json' } }
      );
      if (!r.ok) throw new Error(`GitHub API ${r.status}`);
      return r.json();
    }

    async function loadMore() {
      if (loading || exhausted) return;
      loading = true;
      status.textContent = 'loading…';

      let data;
      try {
        data = await fetchPage(nextPage);
      } catch (e) {
        status.textContent = e.message;
        loading = false;
        exhausted = true;
        return;
      }

      const items = data.items || [];
      if (!items.length && total === 0) {
        status.textContent = 'no commits';
        exhausted = true;
        loading = false;
        return;
      }

      const html = items.map(c => {
        const date = c.commit.committer.date;
        const day = new Date(date).toDateString();
        const cls = day !== lastDay ? ' day-start' : '';
        lastDay = day;
        const repo = c.repository.full_name;
        const msg = c.commit.message.split('\n')[0];
        return `
        <div class="entry${cls}">
          <span class="date">${fmtDate(date)}</span>
          <div class="right">
            <a class="repo" href="https://github.com/${repo}" target="_blank" rel="noopener">${escHtml(repo)}</a>
            <span class="message"><a href="${c.html_url}" target="_blank" rel="noopener">${escHtml(msg)}</a></span>
          </div>
        </div>`;
      }).join('');

      log.insertAdjacentHTML('beforeend', html);
      total += items.length;
      range.textContent = `${total} commit${total === 1 ? '' : 's'}`;
      nextPage++;

      if (items.length < 100 || nextPage > 10) {
        exhausted = true;
        status.textContent = '';
      } else {
        status.textContent = '';
      }
      loading = false;
    }

    const io = new IntersectionObserver(entries => {
      if (entries.some(e => e.isIntersecting)) loadMore();
    }, { rootMargin: '400px' });
    io.observe(sentinel);
  </script>
</body>
</html>
