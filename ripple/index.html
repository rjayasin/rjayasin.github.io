<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Ruvan / ripple</title>
    <link rel="icon" id="favicon" />
    <link rel="stylesheet" href="/common.css" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #canvas {
        position: fixed;
        inset: 0;
        display: block;
        touch-action: none;
      }
      #hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 12px;
        text-align: center;
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 12px;
        color: #888;
        opacity: 1;
        transition: opacity 0.4s ease;
        user-select: none;
        z-index: 3;
        pointer-events: none;
      }
      #hint-inner {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 6px;
        background: #ffffff;
      }
      body.dark #hint-inner {
        background: #111111;
      }
      #hint.hidden {
        opacity: 0;
      }
      #hint.hidden .hint-btn {
        pointer-events: none;
      }
      #hint .hint-btn {
        cursor: pointer;
        pointer-events: auto;
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 2px;
      }
      #hint .hint-btn:hover {
        color: #333;
      }
      body.dark #hint .hint-btn:hover {
        color: #ccc;
      }
      #hint-zone {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 60px;
        z-index: 2;
        pointer-events: none;
      }
      #hint.hidden ~ #hint-zone {
        pointer-events: auto;
      }
      #hb-text-label {
        display: inline-block;
        max-width: 220px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        vertical-align: bottom;
      }
      #hb-text .hint-input {
        max-width: 50vw;
      }
    </style>
    <script src="/common.js"></script>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="hint">
      <span id="hint-inner"
        ><span style="white-space: nowrap">click or tap to send a ripple</span> &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-fi">+</span>/<span class="hint-btn" id="hb-fd">−</span>
          size</span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"><span class="hint-btn" id="hb-font">f font</span></span>
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-goog">g google fonts</span></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-dark"
            >1 <span class="hb-dark-label">dark</span></span
          ></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-sitemap">s sitemap</span></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-text"><span id="hb-text-label"></span></span> text</span
        ></span
      >
    </div>
    <div id="hint-zone"></div>
    <script>
      Common.paintFaviconR();
      Common.initDarkMode();

      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const FALLBACK = 'ripple';

      let W = 0,
        H = 0,
        dpr = 1;
      let fontSize = window.innerWidth < 640 ? 22 : 32;
      let cellW = 0,
        cellH = 0,
        cols = 0,
        rows = 0;
      let cells = [];
      let currentFont = null;
      let fallbackItems = [FALLBACK];

      // Each ripple is a Gaussian-windowed sine wave propagating from (x, y).
      // u = c*age - d is the signed distance from the moving wave front; the
      // envelope exp(-α u²) tightens the pulse, and exp(-β age) decays it
      // overall so the ring eventually fades to nothing.
      const RIPPLE_SPEED = 720; // px/s — how fast the ring expands
      const RIPPLE_WAVELENGTH_FACTOR = 6; // λ in cellW units
      const RIPPLE_ENV_WIDTH_FACTOR = 4; // pulse width in cellW units
      const RIPPLE_TIME_DECAY = 0.55; // 1/s — energy bleed-off
      const RIPPLE_MAX_AGE = 6; // seconds before pruning
      const ripples = [];

      function isDark() {
        if (document.body.classList.contains('dark')) return true;
        if (document.body.classList.contains('light')) return false;
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      }
      function inkColor() {
        return isDark() ? '#f0f0f0' : '#111111';
      }

      function currentText() {
        const items = Common.parseQueryItems().length ? Common.parseQueryItems() : fallbackItems;
        return items.join('/') + ' ';
      }

      function rebuild() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const family = currentFont ? `'${currentFont}', serif` : 'serif';
        ctx.font = `${fontSize}px ${family}`;
        cellW = Math.max(6, ctx.measureText('M').width * 1.3);
        cellH = fontSize * 1.35;

        cols = Math.max(1, Math.ceil(W / cellW));
        rows = Math.max(1, Math.ceil(H / cellH));

        const text = currentText();
        cells = new Array(cols * rows);
        const chars = [...text];
        for (let i = 0; i < cells.length; i++) cells[i] = chars[i % chars.length];
      }

      function draw(t) {
        const ageSec = (now) => (t - now) / 1000;
        ctx.clearRect(0, 0, W, H);
        const family = currentFont ? `'${currentFont}', serif` : 'serif';
        ctx.font = `${fontSize}px ${family}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = inkColor();

        const k = (2 * Math.PI) / (cellW * RIPPLE_WAVELENGTH_FACTOR);
        const envWidth = cellW * RIPPLE_ENV_WIDTH_FACTOR;
        const alpha = 1 / (envWidth * envWidth);
        const ampPx = cellW * 0.7;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const baseX = (c + 0.5) * cellW;
            const baseY = (r + 0.5) * cellH;
            let dx = 0,
              dy = 0;
            for (let i = 0; i < ripples.length; i++) {
              const rip = ripples[i];
              const age = ageSec(rip.t0);
              const distX = baseX - rip.x;
              const distY = baseY - rip.y;
              const d = Math.hypot(distX, distY) || 0.0001;
              const u = RIPPLE_SPEED * age - d;
              const env = Math.exp(-alpha * u * u) * Math.exp(-RIPPLE_TIME_DECAY * age);
              const a = ampPx * Math.sin(k * u) * env;
              dx += (distX / d) * a;
              dy += (distY / d) * a;
            }
            ctx.fillText(cells[r * cols + c], baseX + dx, baseY + dy);
          }
        }

        // Prune expired ripples (envelope is effectively zero everywhere).
        for (let i = ripples.length - 1; i >= 0; i--) {
          if (ageSec(ripples[i].t0) > RIPPLE_MAX_AGE) ripples.splice(i, 1);
        }
      }

      let raf = null;
      function tick(now) {
        draw(now);
        raf = requestAnimationFrame(tick);
      }

      function localPoint(e) {
        const rect = canvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      }

      function addRipple(p) {
        ripples.push({ x: p.x, y: p.y, t0: performance.now() });
      }

      canvas.addEventListener('pointerdown', (e) => {
        addRipple(localPoint(e));
      });
      canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

      const cooldown = Common.makeCooldown(500);
      async function pickFont() {
        if (!window.googleFonts) return;
        cooldown(async () => {
          const font = Common.pickRandomGoogleFont();
          await Common.loadGoogleFont(font);
          currentFont = font;
          console.log('font:', font);
          rebuild();
        });
      }

      function adjustFont(delta) {
        const next = Math.max(8, Math.min(120, fontSize + delta));
        if (next === fontSize) return;
        fontSize = next;
        rebuild();
      }

      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if ((e.key === 'g' || e.key === 'G') && !e.repeat && currentFont) {
          Common.openFontSpecimen(currentFont);
        } else if ((e.key === 'f' || e.key === 'F') && !e.repeat) {
          pickFont();
        } else if (e.key === '+' || e.key === '=') {
          adjustFont(4);
          showHint();
        } else if (e.key === '-' || e.key === '_') {
          adjustFont(-4);
          showHint();
        }
      });

      const hintEl = document.getElementById('hint');
      let hintTimer = setTimeout(() => hintEl.classList.add('hidden'), 4000);
      function showHint() {
        hintEl.classList.remove('hidden');
        clearTimeout(hintTimer);
        hintTimer = setTimeout(() => hintEl.classList.add('hidden'), 2500);
      }
      function hideHintSoon() {
        clearTimeout(hintTimer);
        hintTimer = setTimeout(() => hintEl.classList.add('hidden'), 1200);
      }
      canvas.addEventListener('pointerdown', hideHintSoon);
      window.addEventListener('pointermove', (e) => {
        if (e.clientY >= window.innerHeight - 60) showHint();
      });
      document.getElementById('hint-zone').addEventListener('pointerdown', showHint);

      document.getElementById('hb-fi').addEventListener('click', () => {
        adjustFont(4);
        showHint();
      });
      document.getElementById('hb-fd').addEventListener('click', () => {
        adjustFont(-4);
        showHint();
      });
      document.getElementById('hb-font').addEventListener('click', pickFont);
      document.getElementById('hb-goog').addEventListener('click', () => {
        if (currentFont) Common.openFontSpecimen(currentFont);
      });
      document.getElementById('hb-dark').addEventListener('click', () => {
        Common.toggleDark();
        showHint();
      });
      document.getElementById('hb-sitemap').addEventListener('click', Common.openSitemap);
      Common.initSitemapShortcut();

      Common.initTextEditor({
        buttonEl: document.getElementById('hb-text'),
        labelEl: document.getElementById('hb-text-label'),
        getItems: () =>
          Common.parseQueryItems().length ? Common.parseQueryItems() : fallbackItems,
        onCommit: rebuild,
        onEditStart: () => {
          clearTimeout(hintTimer);
          hintEl.classList.remove('hidden');
        },
        onEditEnd: () => {
          showHint();
        },
      });

      let resizeTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(rebuild, 150);
      });

      rebuild();
      raf = requestAnimationFrame(tick);

      Common.loadScript('/fonts.js').then(pickFont);
    </script>
  </body>
</html>
