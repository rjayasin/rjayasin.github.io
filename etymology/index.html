<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruvan / etymology</title>
    <link rel="icon" id="favicon" />
    <link rel="stylesheet" href="/common.css" />
    <style>
      :root {
        --muted: rgba(0, 0, 0, 0.45);
        --faint: rgba(0, 0, 0, 0.3);
        --line: rgba(0, 0, 0, 0.18);
        --hover: rgba(0, 0, 0, 0.05);
        --card-bg: #fafafa;
        --star: #e7b416;
        --side-bg: #fafafa;
      }
      body.dark {
        --muted: rgba(255, 255, 255, 0.5);
        --faint: rgba(255, 255, 255, 0.35);
        --line: rgba(255, 255, 255, 0.22);
        --hover: rgba(255, 255, 255, 0.07);
        --card-bg: #181818;
        --side-bg: #161616;
      }
      @media (prefers-color-scheme: dark) {
        body:not(.light) {
          --muted: rgba(255, 255, 255, 0.5);
          --faint: rgba(255, 255, 255, 0.35);
          --line: rgba(255, 255, 255, 0.22);
          --hover: rgba(255, 255, 255, 0.07);
          --card-bg: #181818;
          --side-bg: #161616;
        }
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: 'Times New Roman', Times, Georgia, serif;
        overflow: hidden;
      }
      #app {
        display: flex;
        height: 100vh;
        height: 100dvh;
      }
      #main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      /* --- Header --- */
      #header {
        position: relative;
        padding: 16px;
        border-bottom: 1px solid var(--line);
      }
      #search-row {
        position: relative;
        max-width: 560px;
        margin: 0 auto;
      }
      #search {
        font: inherit;
        font-size: 34px;
        text-align: center;
        background: transparent;
        color: inherit;
        border: none;
        outline: none;
        display: block;
        width: 100%;
        /* symmetric padding keeps the word centered while clearing the
           hamburger on the left and the star + shuffle icons on the right */
        padding: 0 72px;
        box-sizing: border-box;
      }
      #search::placeholder {
        color: var(--faint);
      }
      #random-btn {
        position: absolute;
        right: 6px;
        top: 50%;
        transform: translateY(-50%);
        font: inherit;
        font-size: 22px;
        line-height: 1;
        background: none;
        border: none;
        cursor: pointer;
        color: #000;
        padding: 6px;
      }
      /* Star toggle for the current word, left of the shuffle icon. */
      #fav-btn {
        position: absolute;
        right: 40px;
        top: 50%;
        transform: translateY(-50%);
        font: inherit;
        font-size: 24px;
        line-height: 1;
        background: none;
        border: none;
        cursor: pointer;
        color: var(--faint);
        padding: 4px;
      }
      #fav-btn.active {
        color: var(--star);
      }
      #fav-btn[hidden] {
        display: none;
      }
      body.dark #random-btn {
        color: #fff;
      }
      @media (prefers-color-scheme: dark) {
        body:not(.light) #random-btn {
          color: #fff;
        }
      }
      /* Match the shuffle icon to the header's divider line (var(--line)):
         the divider's base color at its alpha, applied to the whole SVG so
         the two crossing strokes don't darken where they overlap. */
      #random-btn svg {
        display: block;
        width: 22px;
        height: 22px;
        opacity: 0.18;
      }
      body.dark #random-btn svg {
        opacity: 0.22;
      }
      @media (prefers-color-scheme: dark) {
        body:not(.light) #random-btn svg {
          opacity: 0.22;
        }
      }
      #random-btn:hover svg {
        opacity: 0.5;
      }

      /* --- Content / tree --- */
      #content {
        flex: 1;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
        padding: 32px 16px 96px;
        transition: opacity 0.18s ease; /* keep in sync with FADE_MS */
        /* Allow one-finger panning but reserve two-finger pinches for our own
           tree zoom (handled in JS) rather than the browser's page zoom. */
        touch-action: pan-x pan-y;
      }
      #content.centered {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .status {
        font-size: 18px;
        font-style: italic;
        color: var(--faint);
      }
      .status a {
        color: var(--muted);
      }

      /* Loading spinner shown while fetching from the Wiktionary API. */
      .spinner {
        width: 28px;
        height: 28px;
        border: 2px solid var(--line);
        border-top-color: var(--muted);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Nested flexbox tree with connector lines drawn by ::before/::after. */
      .tree {
        width: max-content;
        min-width: 100%;
      }
      /* The tree reads bottom-up — the word at the bottom, ancestors rising
         above it. The connector geometry below is written top-down, so mirror
         the whole tree vertically; .node mirrors each card back upright. */
      .tree > ul {
        transform: scaleY(-1);
      }
      .tree ul {
        display: flex;
        justify-content: center;
        list-style: none;
        position: relative;
        padding-top: 22px;
      }
      .tree > ul {
        padding-top: 0;
      }
      /* vertical drop from the parent node into the children row */
      .tree ul ul::before {
        content: '';
        position: absolute;
        top: 0;
        left: 50%;
        height: 22px;
        border-left: 1px solid var(--line);
      }
      .tree li {
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        padding: 22px 10px 0;
      }
      /* horizontal distribution line plus the drop to each child */
      .tree li::before,
      .tree li::after {
        content: '';
        position: absolute;
        top: 0;
        right: 50%;
        width: 50%;
        height: 22px;
        border-top: 1px solid var(--line);
      }
      .tree li::after {
        right: auto;
        left: 50%;
        border-left: 1px solid var(--line);
      }
      .tree li:first-child::before,
      .tree li:last-child::after {
        border-top: none;
      }
      .tree li:last-child::before {
        border-right: 1px solid var(--line);
        border-radius: 0 6px 0 0;
      }
      .tree li:first-child::after {
        border-radius: 6px 0 0 0;
      }
      /* an only child continues straight down: one line, no elbows */
      .tree li:only-child::before {
        display: none;
      }
      .tree li:only-child::after {
        border-top: none;
        border-radius: 0;
      }
      .tree > ul > li {
        padding-top: 0;
      }
      .tree > ul > li::before,
      .tree > ul > li::after {
        display: none;
      }

      .node {
        background: var(--card-bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 16px 10px;
        text-align: center;
        max-width: 240px;
        /* Grow the card to fit its widest unbreakable word so words are never
           split mid-letter; this wins over max-width when a word is longer. */
        min-width: min-content;
        transform: scaleY(-1); /* undo the .tree > ul mirror */
      }
      .node.clickable {
        cursor: pointer;
      }
      @media (hover: hover) {
        .node.clickable:hover {
          background: var(--hover);
        }
      }
      .node .rel {
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 9px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--faint);
        margin-top: 3px;
      }
      .node .lang {
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 3px;
      }
      .node .form {
        font-size: 21px;
        line-height: 1.2;
      }
      .node .form.empty {
        color: var(--faint);
      }
      .node .tr {
        font-size: 13px;
        color: var(--muted);
        margin-top: 1px;
      }
      .node .gloss {
        font-size: 13px;
        font-style: italic;
        color: var(--muted);
        margin-top: 2px;
      }
      .tree > ul > li > .node .form {
        font-size: 30px;
      }

      /* Wrap the tree, definition, and source line in one max-content column so
         the narrower blocks center on the tree's center (i.e. under the root
         node) rather than on the viewport when the tree overflows horizontally.
         Fill at least the content area's height and lay the blocks out as a
         flex column so the source line (margin-top: auto) is pinned to the
         bottom even when the tree is short. */
      .content-inner {
        width: max-content;
        min-width: 100%;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        /* Pinch-to-zoom (touch) scales this block from its top-left corner; the
           sizer below then reserves the scaled area so panning still works. */
        transform-origin: 0 0;
      }
      /* Wraps .content-inner. Transparent (display: contents) at 1:1 so the tree
         lays out exactly as if it weren't here; while zoomed it becomes a block
         sized to the scaled tree so #content's scrollbars track it. */
      .zoom-sizer {
        display: contents;
      }

      /* Definition of the looked-up word, shown beneath the bottommost node.
         width: fit-content shrink-wraps the block to its text (up to 540px) so
         margin auto centers that block — and thus the center of the
         left-aligned text — under the root node, instead of stretching the
         block full-width and stranding the text at the left edge. */
      #definition {
        width: fit-content;
        max-width: 540px;
        margin: 30px auto 0;
        text-align: left;
      }
      #definition[hidden] {
        display: none;
      }
      #definition .def-pos {
        text-align: center;
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--faint);
        margin-bottom: 8px;
      }
      #definition .def-senses {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      #definition .def-sense {
        font-size: 16px;
        line-height: 1.5;
        margin: 5px 0;
        padding-left: 18px;
        text-indent: -18px;
      }
      #definition .def-sense::before {
        content: '•';
        color: var(--faint);
        margin-right: 8px;
      }

      #source-line {
        text-align: center;
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 11px;
        color: var(--faint);
        /* auto top margin pins the line to the bottom of the content area when
           the tree is short; padding keeps a minimum gap when it isn't. */
        margin-top: auto;
        padding-top: 36px;
      }
      #source-line a {
        color: inherit;
      }

      button,
      .node {
        touch-action: manipulation;
      }
      @media (max-width: 700px) {
        #search {
          font-size: 26px;
        }
        #content {
          padding: 24px 10px 96px;
        }
        /* On a phone the definition's 540px cap can exceed the viewport, and
           since .content-inner is max-content that overflow forces horizontal
           scrolling even when the tree itself fits. Hold the block to the
           viewport (minus #content's 10px side padding) so its text wraps. */
        #definition {
          max-width: min(540px, calc(100vw - 20px));
        }
        .node {
          padding: 6px 10px 8px;
          max-width: 180px;
        }
        .node .form {
          font-size: 17px;
        }
        .tree > ul > li > .node .form {
          font-size: 24px;
        }
        .tree li {
          padding-left: 5px;
          padding-right: 5px;
        }
      }

      /* --- Sidebar / drawer (starred words) --- */
      #sidebar {
        width: 200px;
        flex: none;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        scrollbar-width: thin;
        background: var(--side-bg);
      }
      .side-section {
        padding: 14px 10px;
      }
      .side-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 8px;
        padding: 0 6px;
      }
      .side-title {
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .side-empty {
        font-size: 14px;
        font-style: italic;
        color: var(--faint);
        padding: 4px 6px;
      }
      .side-item {
        position: relative;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 6px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 15px;
        user-select: none;
        -webkit-user-select: none;
      }
      .side-item.current {
        background: var(--hover);
      }
      @media (hover: hover) {
        .side-item:hover {
          background: var(--hover);
        }
      }
      .side-item .icon.star {
        flex: none;
        width: 14px;
        text-align: center;
        color: var(--star);
        cursor: pointer;
        font-size: 11px;
      }
      .side-item .term {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .side-item .term .side-lang {
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
        margin-left: 5px;
      }
      .side-item .remove {
        flex: none;
        background: none;
        border: none;
        color: var(--faint);
        font: inherit;
        font-size: 14px;
        cursor: pointer;
        padding: 0 2px;
      }
      @media (hover: hover) {
        .side-item .remove {
          visibility: hidden;
        }
        .side-item:hover .remove {
          visibility: visible;
        }
      }
      .side-item .grip {
        flex: none;
        color: var(--faint);
        cursor: grab;
        touch-action: none;
        padding: 0 2px;
        font-size: 11px;
      }
      /* on hover-capable devices the grips stay out of sight until needed
         (they keep their space so rows don't shift); always shown on touch */
      @media (hover: hover) {
        .side-item .grip {
          opacity: 0;
          transition: opacity 0.15s ease;
        }
        .side-item:hover .grip {
          opacity: 1;
        }
      }
      .side-item.dragging {
        opacity: 0.4;
      }
      .drop-indicator {
        height: 2px;
        border-radius: 1px;
        background: var(--star);
        margin: 2px 8px;
      }

      /* Hamburger lives inside the header, vertically centered and sized
         like the shuffle icon. The open mobile drawer (z-index 80) covers it. */
      #panel-btn {
        position: absolute;
        top: 50%;
        left: 8px;
        transform: translateY(-50%);
        /* above the full-width search input, which would steal its taps */
        z-index: 10;
        font: inherit;
        font-size: 24px;
        line-height: 1;
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        padding: 6px 10px;
      }
      #backdrop {
        display: none;
      }

      @media (max-width: 859px) {
        #sidebar {
          position: fixed;
          top: 0;
          left: 0;
          bottom: 0;
          width: min(260px, 80vw);
          transform: translateX(-100%);
          transition: transform 0.25s ease;
          z-index: 80;
          padding-top: 8px;
        }
        #sidebar.open {
          transform: translateX(0);
          box-shadow: 0 0 24px rgba(0, 0, 0, 0.25);
        }
        #backdrop {
          display: block;
          position: fixed;
          inset: 0;
          background: rgba(0, 0, 0, 0.35);
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.25s ease;
          z-index: 70;
        }
        #backdrop.open {
          opacity: 1;
          pointer-events: auto;
        }
      }
      @media (min-width: 860px) {
        #sidebar.collapsed {
          display: none;
        }
      }

      /* --- Hint bar --- */
      /* Single-line hint bar; pans horizontally when it overflows (on a phone
         the full set of shortcuts is wider than the screen). Auto margins
         centre the pill yet keep its left edge reachable while scrolling. */
      #hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 12px;
        display: flex;
        overflow-x: auto;
        scrollbar-width: none;
        touch-action: pan-x;
        overscroll-behavior-x: contain;
        -webkit-overflow-scrolling: touch;
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 12px;
        color: #888;
        opacity: 1;
        transition: opacity 0.4s ease;
        user-select: none;
        z-index: 65;
      }
      #hint::-webkit-scrollbar {
        display: none;
      }
      /* Flex spacers so the centred pill can scroll clear of both edges. */
      #hint::before,
      #hint::after {
        content: '';
        flex: 0 0 8px;
      }
      #hint-inner {
        flex: 0 0 auto;
        margin: 0 auto;
        white-space: nowrap;
        padding: 6px 10px;
        border-radius: 6px;
        background: #fff;
      }
      body.dark #hint-inner {
        background: #111;
      }
      @media (prefers-color-scheme: dark) {
        body:not(.light) #hint-inner {
          background: #111;
        }
      }
      #hint.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #hint .hint-btn {
        cursor: pointer;
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 2px;
      }
      #hint .hint-btn:hover {
        color: #333;
      }
      body.dark #hint .hint-btn:hover {
        color: #ccc;
      }
      #hint-zone {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 50px;
        z-index: 64;
      }
    </style>
    <script src="/common.js"></script>
    <script src="engine.js"></script>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="side-section">
          <div class="side-head"><span class="side-title">Starred</span></div>
          <div id="starred-list"></div>
        </div>
      </aside>
      <main id="main">
        <header id="header">
          <button id="panel-btn" title="Toggle starred panel (h)" aria-label="Toggle starred panel">
            ☰
          </button>
          <div id="search-row">
            <input
              id="search"
              type="text"
              placeholder="word"
              autocomplete="off"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              enterkeyhint="search"
            />
            <button id="fav-btn" hidden title="Star word (f)" aria-label="Star word">☆</button>
            <button id="random-btn" title="Random word (r)" aria-label="Random word">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M3 7 C 9 7, 13 17, 16.5 17" />
                <polyline points="16.5 14 20 17 16.5 20" />
                <path d="M3 17 C 9 17, 13 7, 16.5 7" />
                <polyline points="16.5 4 20 7 16.5 10" />
              </svg>
            </button>
          </div>
        </header>
        <div id="content" class="centered"><div class="status">…</div></div>
      </main>
    </div>
    <div id="backdrop"></div>
    <div id="hint">
      <span id="hint-inner">
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-random">r random</span></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-search">/ search</span></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"><span class="hint-btn" id="hb-fav">f star</span></span>
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"><span class="hint-btn" id="hb-panel">h panel</span></span>
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"><span class="hint-btn" id="hb-def">d def</span></span>
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-explorer">e explorer</span></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-dark"
            >1 <span class="hb-dark-label">dark</span></span
          ></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-sitemap">s sitemap</span></span
        >
      </span>
    </div>
    <div id="hint-zone"></div>
    <script>
      Common.paintFaviconR();
      Common.initDarkMode();
      Common.initSitemapShortcut();

      // ---------- Rendering ----------
      const contentEl = document.getElementById('content');
      const searchEl = document.getElementById('search');

      function nodeEl(node, isRoot) {
        const div = document.createElement('div');
        div.className = 'node';
        const lang = document.createElement('div');
        lang.className = 'lang';
        lang.textContent = langName(node.lang);
        div.appendChild(lang);
        const form = document.createElement('div');
        form.className = 'form' + (node.form ? '' : ' empty');
        form.textContent = node.form || '—';
        div.appendChild(form);
        if (node.tr) {
          const tr = document.createElement('div');
          tr.className = 'tr';
          tr.textContent = node.tr;
          div.appendChild(tr);
        }
        if (node.gloss) {
          const gloss = document.createElement('div');
          gloss.className = 'gloss';
          gloss.textContent = '“' + node.gloss + '”';
          div.appendChild(gloss);
        }
        // The relation sits at the card's bottom edge, nearest the
        // descendant (below it) that the relation describes.
        if (node.rel && !isRoot) {
          const rel = document.createElement('div');
          rel.className = 'rel';
          rel.textContent = node.rel === '+' ? '+' : node.rel;
          div.appendChild(rel);
        }
        if (isRoot) {
          div.classList.add('clickable');
          div.title = 'View on Wiktionary';
          div.addEventListener('click', () => {
            window.open(wiktionaryUrl(node.form, node.lang), '_blank', 'noopener');
          });
        } else if (node.form && sectionName(node.lang)) {
          div.classList.add('clickable');
          div.title = 'Trace ' + node.form;
          div.addEventListener('click', () => lookup(node.form, node.lang));
        }
        return div;
      }

      function subtreeEl(node, isRoot) {
        const li = document.createElement('li');
        li.appendChild(nodeEl(node, isRoot));
        if (node.children.length) {
          const ul = document.createElement('ul');
          for (const child of node.children) ul.appendChild(subtreeEl(child, false));
          li.appendChild(ul);
        }
        return li;
      }

      // Bring the looked-up word — bottom center of the tree — into view.
      function scrollToWord() {
        contentEl.scrollTop = contentEl.scrollHeight;
        contentEl.scrollLeft = (contentEl.scrollWidth - contentEl.clientWidth) / 2;
      }

      // ---------- Pinch-to-zoom (touch) ----------
      // Large trees overflow a phone screen; a two-finger pinch scales the tree
      // so more of it fits at once (or to read small ancestors up close).
      //
      // The tree is scaled with a CSS `transform: scale()` rather than the
      // `zoom` property: zoom is unreliable here because the layout flips nodes
      // with their own transforms (see .node), and mobile WebKit then reflows
      // the spacing without scaling the flipped text — a transform composes
      // with those flips and scales everything uniformly. A transform doesn't
      // resize the element's layout box, though, so the .zoom-sizer wrapper is
      // grown to the scaled dimensions to keep #content's scroll area (and thus
      // one-finger panning) correct at any scale. The pinch midpoint is held
      // fixed by adjusting scroll, so the tree grows/shrinks around the fingers.
      const ZOOM_MIN = 0.3;
      const ZOOM_MAX = 2.5;
      let contentInnerEl = null;
      let contentSizerEl = null;
      let treeZoom = 1;
      let naturalW = 0; // unscaled layout size of .content-inner, measured lazily
      let naturalH = 0;

      function clamp(v, lo, hi) {
        return Math.min(hi, Math.max(lo, v));
      }

      // Apply a zoom level, optionally keeping the content point under
      // (focalX, focalY) — viewport coordinates — pinned in place.
      function setTreeZoom(next, focalX, focalY) {
        next = clamp(next, ZOOM_MIN, ZOOM_MAX);
        const prev = treeZoom;
        if (!contentInnerEl || !contentSizerEl) {
          treeZoom = next;
          return;
        }
        if (next === 1) {
          // Back to pristine: drop every override so the tree lays out exactly
          // as its base CSS describes (sizer transparent again).
          contentSizerEl.style.cssText = '';
          contentInnerEl.style.transform = '';
          contentInnerEl.style.width = '';
          contentInnerEl.style.height = '';
          contentInnerEl.style.minWidth = '';
          contentInnerEl.style.minHeight = '';
        } else {
          // Measure the natural (unscaled) size once per tree, then lock the
          // block to it so scaling can't feed back into layout. Clearing the
          // overrides first lets this re-measure correctly even when already
          // zoomed (e.g. after the definition loads and invalidates the size).
          if (!naturalW) {
            contentInnerEl.style.transform = '';
            contentInnerEl.style.width = '';
            contentInnerEl.style.height = '';
            contentInnerEl.style.minWidth = '';
            contentInnerEl.style.minHeight = '';
            naturalW = contentInnerEl.offsetWidth;
            naturalH = contentInnerEl.offsetHeight;
          }
          contentInnerEl.style.width = naturalW + 'px';
          contentInnerEl.style.height = naturalH + 'px';
          contentInnerEl.style.minWidth = '0';
          contentInnerEl.style.minHeight = '0';
          contentInnerEl.style.transform = 'scale(' + next + ')';
          contentSizerEl.style.display = 'block';
          contentSizerEl.style.width = naturalW * next + 'px';
          contentSizerEl.style.height = naturalH * next + 'px';
        }
        treeZoom = next;
        if (prev === next || focalX == null) return;
        // Keep the content fraction under the finger fixed: the sizer is the
        // scroll content, so a point at scroll offset P scales as P*next/prev.
        const rect = contentEl.getBoundingClientRect();
        const fx = focalX - rect.left;
        const fy = focalY - rect.top;
        contentEl.scrollLeft = (contentEl.scrollLeft + fx) * (next / prev) - fx;
        contentEl.scrollTop = (contentEl.scrollTop + fy) * (next / prev) - fy;
      }

      let pinchStartDist = 0;
      let pinchStartZoom = 1;

      function touchDist(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.hypot(dx, dy);
      }

      contentEl.addEventListener(
        'touchstart',
        (e) => {
          if (e.touches.length !== 2 || !contentInnerEl) return;
          pinchStartDist = touchDist(e.touches);
          pinchStartZoom = treeZoom;
          e.preventDefault(); // suppress the browser's own page zoom
        },
        { passive: false }
      );
      contentEl.addEventListener(
        'touchmove',
        (e) => {
          if (e.touches.length !== 2 || !pinchStartDist) return;
          e.preventDefault();
          const dist = touchDist(e.touches);
          const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
          const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          setTreeZoom(pinchStartZoom * (dist / pinchStartDist), midX, midY);
        },
        { passive: false }
      );
      function endPinch(e) {
        if (e.touches.length < 2) pinchStartDist = 0;
      }
      contentEl.addEventListener('touchend', endPinch);
      contentEl.addEventListener('touchcancel', endPinch);
      // iOS fires its own gesture events for two-finger zoom; block them over
      // the tree so only our pinch handler scales it.
      contentEl.addEventListener('gesturestart', (e) => e.preventDefault());

      // The locked dimensions reflect the current viewport; a rotation changes
      // it, so snap back to 1:1 rather than leaving a stale, clipped scroll area.
      window.addEventListener('orientationchange', () => setTreeZoom(1));

      // The tree's natural size changed (e.g. the definition loaded or toggled);
      // forget the cached measurement and, if zoomed, re-apply at the new size.
      function refreshTreeZoom() {
        naturalW = naturalH = 0;
        if (treeZoom !== 1) setTreeZoom(treeZoom);
      }

      // ---------- Definition (shown under the bottommost node) ----------
      // Senses are read from the looked-up word's rendered page (the same HTML
      // the etymology tree comes from), scoped to its language section and
      // first part-of-speech list. Wiktionary's REST definition endpoint is
      // tidier but drops template-transcluded content (e.g. the exponent in
      // "10⁵⁷") and leaks template CSS, so the fully-rendered senses are used.
      let defSeq = 0;

      // Turn a sense's <li> into a fragment that is plain text except for the
      // sub/sup that carry meaning (so "H₂O" and "10⁵⁷" render): quotations and
      // subsenses (nested lists), sense labels, footnotes, and any remote
      // markup are dropped, and every other element is unwrapped to its text.
      function sanitizeSense(li) {
        const frag = document.createDocumentFragment();
        (function walk(node, out) {
          for (const child of node.childNodes) {
            if (child.nodeType === 3) {
              out.appendChild(document.createTextNode(child.nodeValue));
              continue;
            }
            if (child.nodeType !== 1) continue;
            const tag = child.tagName.toLowerCase();
            if (tag === 'ul' || tag === 'ol' || tag === 'dl') continue; // quotations / subsenses
            if (tag === 'style' || tag === 'script' || tag === 'link') continue;
            if (child.classList.contains('usage-label-sense')) continue; // (US, rare, …)
            if (child.classList.contains('reference')) continue; // footnote markers
            if (tag === 'sub' || tag === 'sup') {
              const el = document.createElement(tag);
              walk(child, el);
              out.appendChild(el);
            } else {
              walk(child, out); // unwrap everything else to its text
            }
          }
        })(li, frag);
        // Collapse whitespace across the kept text nodes and trim the ends.
        const texts = [];
        (function collect(n) {
          for (const c of n.childNodes) {
            if (c.nodeType === 3) texts.push(c);
            else collect(c);
          }
        })(frag);
        texts.forEach((t) => (t.nodeValue = t.nodeValue.replace(/\s+/g, ' ')));
        if (texts.length) {
          texts[0].nodeValue = texts[0].nodeValue.replace(/^\s+/, '');
          const last = texts[texts.length - 1];
          last.nodeValue = last.nodeValue.replace(/\s+$/, '');
        }
        return frag;
      }

      // The part of speech and first few senses from the first definition list
      // in the given language's section of a rendered page.
      function definitionFromHtml(html, lang) {
        const section = sectionName(lang);
        if (!section || !html) return null;
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const root = doc.querySelector('.mw-parser-output');
        if (!root) return null;
        const anchor = section.replace(/ /g, '_');
        let langHeading = null;
        for (const wrap of root.querySelectorAll(':scope > .mw-heading2')) {
          const h2 = wrap.querySelector('h2');
          if (h2 && (h2.id === anchor || h2.textContent.trim() === section)) {
            langHeading = wrap;
            break;
          }
        }
        if (!langHeading) return null;
        let pos = '';
        let ol = null;
        for (let n = langHeading.nextElementSibling; n; n = n.nextElementSibling) {
          if (n.classList.contains('mw-heading2')) break; // reached the next language
          if (n.classList.contains('mw-heading')) {
            const h = n.querySelector('h3, h4, h5, h6');
            if (h)
              pos = (h.id || '').replace(/_\d+$/, '').replace(/_/g, ' ') || h.textContent.trim();
            continue;
          }
          if (n.tagName === 'OL') {
            if (!n.classList.contains('references')) {
              ol = n;
              break;
            }
            continue;
          }
          const found = n.querySelector('ol:not(.references)');
          if (found) {
            ol = found;
            break;
          }
        }
        if (!ol) return null;
        const senses = [];
        for (const li of ol.children) {
          if (li.tagName !== 'LI') continue;
          const frag = sanitizeSense(li);
          if (frag.textContent.trim()) senses.push(frag);
          if (senses.length === 3) break;
        }
        return senses.length ? { partOfSpeech: pos, senses } : null;
      }

      async function loadDefinition(form, lang, container) {
        if (!form || form.startsWith('*')) return; // reconstructions have no entry page
        const my = ++defSeq;
        const html = await fetchPageHtml(pageTitleFor(form, lang));
        if (my !== defSeq || !container.isConnected || !html) return;
        const data = definitionFromHtml(html, lang);
        if (!data) return;
        if (data.partOfSpeech) {
          const pos = document.createElement('div');
          pos.className = 'def-pos';
          pos.textContent = data.partOfSpeech;
          container.appendChild(pos);
        }
        const list = document.createElement('ul');
        list.className = 'def-senses';
        for (const frag of data.senses) {
          const li = document.createElement('li');
          li.className = 'def-sense';
          li.appendChild(frag);
          list.appendChild(li);
        }
        container.appendChild(list);
        // The block just grew taller; if zoomed, re-measure so the scroll area
        // includes the definition.
        refreshTreeZoom();
        // Bring the new definition into view if the word was at the bottom.
        const slack = contentEl.scrollHeight - contentEl.scrollTop - contentEl.clientHeight;
        if (slack < 80) scrollToWord();
      }

      // Toggle the definition block (hint bar / "d"). Fetches lazily the first
      // time it's shown for the current word.
      function toggleDef() {
        prefs.def = !prefs.def;
        savePrefs();
        const def = document.getElementById('definition');
        if (!def) return;
        def.hidden = !prefs.def;
        if (prefs.def && !def.childElementCount) loadDefinition(currentForm, currentLang, def);
        else refreshTreeZoom(); // shown-from-cache or hidden: size changed
      }

      // Open the current word in the explorer (hint bar / "e").
      function openExplorer() {
        if (!currentForm) return;
        window.open('/explorer/?' + encodeURIComponent(currentForm), '_blank', 'noopener');
      }

      function renderTree(root) {
        contentEl.className = '';
        contentEl.innerHTML = '';
        const inner = document.createElement('div');
        inner.className = 'content-inner';
        const tree = document.createElement('div');
        tree.className = 'tree';
        const ul = document.createElement('ul');
        ul.appendChild(subtreeEl(root, true));
        tree.appendChild(ul);
        inner.appendChild(tree);
        const def = document.createElement('div');
        def.id = 'definition';
        def.hidden = !prefs.def;
        inner.appendChild(def);
        if (prefs.def) loadDefinition(root.form, root.lang, def);
        const source = document.createElement('div');
        source.id = 'source-line';
        const a = document.createElement('a');
        a.href = wiktionaryUrl(root.form, root.lang);
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = 'wiktionary';
        source.append('source: ', a, ' (CC BY-SA)');
        inner.appendChild(source);
        const sizer = document.createElement('div');
        sizer.className = 'zoom-sizer';
        sizer.appendChild(inner);
        contentEl.appendChild(sizer);
        // Each new tree starts at 1:1; pinch-to-zoom (touch) scales this block.
        contentInnerEl = inner;
        contentSizerEl = sizer;
        treeZoom = 1;
        naturalW = naturalH = 0;
      }

      function renderStatus(text, link) {
        contentInnerEl = contentSizerEl = null;
        contentEl.className = 'centered';
        contentEl.innerHTML = '';
        const div = document.createElement('div');
        div.className = 'status';
        div.textContent = text;
        if (link) {
          const a = document.createElement('a');
          a.href = link.href;
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = link.text;
          div.append(' — ', a);
        }
        contentEl.appendChild(div);
      }

      function renderSpinner() {
        contentInnerEl = contentSizerEl = null;
        contentEl.className = 'centered';
        contentEl.innerHTML = '';
        const div = document.createElement('div');
        div.className = 'spinner';
        contentEl.appendChild(div);
      }

      // ---------- Lookup / navigation ----------
      const FADE_MS = 180; // keep in sync with #content's opacity transition
      let seq = 0;

      // The game (/etymology/game/) maintains a static store of pre-built
      // trees — a manifest listing per-band chunk files under game/trees/ —
      // and serves English lookups from it when possible: instant, zero
      // Wiktionary calls, and it keeps working while the API is rate-limited.
      const savedTrees = new Map(); // lowercased form -> tree
      const savedTreesReady = fetch('game/manifest.json', { cache: 'no-cache' })
        .then((r) => (r.ok ? r.json() : null))
        .then((m) => {
          if (!m || typeof m !== 'object' || !m.chunks) return;
          const jobs = [];
          for (const [band, counts] of Object.entries(m.chunks)) {
            counts.forEach((_, i) => {
              const name = `${band}-${String(i).padStart(3, '0')}`;
              jobs.push(
                fetch(`game/trees/${name}.json`, { cache: 'no-cache' })
                  .then((r) => (r.ok ? r.json() : null))
                  .then((data) => {
                    if (data && typeof data === 'object' && !Array.isArray(data)) {
                      for (const [k, v] of Object.entries(data))
                        if (v && typeof v === 'object') savedTrees.set(k.toLowerCase(), v);
                    }
                  })
                  .catch(() => {})
              );
            });
          }
          return Promise.all(jobs);
        })
        .catch(() => {
          /* no store — every word is built from Wiktionary as before */
        });

      async function cachedOrBuiltTree(form, lang) {
        if (lang === 'en') {
          await savedTreesReady; // a local static file — quick, and worth the wait
          const cached = savedTrees.get(form.toLowerCase());
          if (cached) {
            // Cached trees carry bare language codes; fill in any names
            // missing from LANGS the same way a fresh build would.
            await resolveLangNames(collectLangs(cached));
            return cached;
          }
        }
        return buildTree(form, lang);
      }

      function queryFor(form, lang) {
        return encodeURIComponent(lang === 'en' ? form : form + '@' + lang);
      }

      function setUrl(form, lang, replace) {
        const q = '?' + queryFor(form, lang);
        if (location.search === q) return;
        const url = location.pathname + q;
        if (replace) history.replaceState(null, '', url);
        else history.pushState(null, '', url);
      }

      async function lookup(form, lang, opts = {}) {
        form = form.trim();
        if (!form) return;
        if (lang === 'en') form = form.toLowerCase();
        const my = ++seq;
        if (!opts.fromPop) setUrl(form, lang, opts.replace);
        searchEl.value = lang === 'en' ? form : form + ' (' + langName(lang) + ')';
        setCurrent(form, lang);
        searchEl.blur();
        contentEl.style.opacity = '0';
        const fadeOut = new Promise((r) => setTimeout(r, FADE_MS));
        let resolved = false;
        const treePromise = cachedOrBuiltTree(form, lang).then((t) => ((resolved = true), t));
        await fadeOut;
        if (my !== seq) return;
        // If the fetch is still outstanding after the fade, show a spinner so
        // the wait (recursive API calls can be slow) isn't a blank screen.
        if (!resolved) {
          renderSpinner();
          contentEl.style.opacity = '1';
        }
        const tree = await treePromise;
        if (my !== seq) return;
        // The label was set from langName before the tree (and its language
        // names) resolved; refresh it now that the full name is known.
        if (lang !== 'en') searchEl.value = form + ' (' + langName(lang) + ')';
        if (tree) renderTree(tree);
        else {
          renderStatus('no etymology found for “' + form + '”', {
            href: wiktionaryUrl(form, lang),
            text: 'check wiktionary',
          });
        }
        scrollToWord();
        contentEl.style.opacity = '1';
      }

      // Buffer a few ready-to-render random words so pressing "random" again
      // is instant — the slow part (drawing + fetching until one has an
      // etymology) is paid ahead of time in the background.
      const RANDOM_BUFFER = 2;
      const randomQueue = [];
      let prefilling = false;
      async function prefillRandom() {
        if (prefilling) return;
        prefilling = true;
        try {
          while (randomQueue.length < RANDOM_BUFFER) {
            const item = await findRandomTree();
            if (!item) break; // word list unavailable; stop trying
            randomQueue.push(item);
          }
        } finally {
          prefilling = false;
        }
      }

      function showRandom(item, opts) {
        setUrl(item.word, 'en', opts.replace);
        searchEl.value = item.word;
        setCurrent(item.word, 'en');
        renderTree(item.tree);
        scrollToWord();
      }

      async function randomWord(opts = {}) {
        const my = ++seq;
        // Serve a buffered word instantly, then top the buffer back up.
        const buffered = randomQueue.shift();
        if (buffered) {
          showRandom(buffered, opts);
          prefillRandom();
          return;
        }
        // Nothing buffered yet — do a live draw behind the spinner.
        contentEl.style.opacity = '0';
        await new Promise((r) => setTimeout(r, FADE_MS));
        if (my !== seq) return;
        renderSpinner();
        contentEl.style.opacity = '1';
        const item = await findRandomTree();
        if (my !== seq) return;
        if (item) showRandom(item, opts);
        else renderStatus('the dice came up empty — try again');
        prefillRandom();
      }

      window.addEventListener('popstate', () => {
        const items = Common.parseQueryItems();
        if (!items.length) return;
        const at = items[0].lastIndexOf('@');
        if (at > 0) lookup(items[0].slice(0, at), items[0].slice(at + 1), { fromPop: true });
        else lookup(items[0], 'en', { fromPop: true });
      });

      // ---------- Input + shortcuts ----------
      // Tapping/clicking into the search bar highlights any existing word so a
      // new query overwrites it immediately, without deleting it first.
      let selectOnTap = false;
      searchEl.addEventListener('focus', () => {
        selectOnTap = true;
        searchEl.select();
      });
      // Mobile browsers reposition the caret on the touch that follows focus,
      // which would clear the selection; reselect once after that tap.
      searchEl.addEventListener('mouseup', (e) => {
        if (selectOnTap) {
          e.preventDefault();
          searchEl.select();
          selectOnTap = false;
        }
      });
      searchEl.addEventListener('blur', () => {
        selectOnTap = false;
      });

      searchEl.addEventListener('keydown', (e) => {
        e.stopPropagation();
        if (e.key === 'Enter') {
          e.preventDefault();
          lookup(searchEl.value, 'en');
        } else if (e.key === 'Escape') {
          searchEl.blur();
        }
      });

      document.getElementById('random-btn').addEventListener('click', () => randomWord());

      document.addEventListener('keydown', (e) => {
        const t = e.target;
        if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        if (e.key === '/') {
          e.preventDefault();
          searchEl.focus();
          searchEl.select();
        } else if (e.key === 'r' || e.key === 'R') {
          randomWord();
        } else if (e.key === 'f' || e.key === 'F') {
          toggleStar();
        } else if (e.key === 'h' || e.key === 'H') {
          togglePanel();
        } else if (e.key === 'd' || e.key === 'D') {
          toggleDef();
        } else if (e.key === 'e' || e.key === 'E') {
          openExplorer();
        }
      });

      // ---------- Hint bar ----------
      document.getElementById('hb-random').addEventListener('click', () => randomWord());
      document.getElementById('hb-search').addEventListener('click', () => {
        searchEl.focus();
        searchEl.select();
      });
      document.getElementById('hb-fav').addEventListener('click', toggleStar);
      document.getElementById('hb-panel').addEventListener('click', togglePanel);
      document.getElementById('hb-def').addEventListener('click', toggleDef);
      document.getElementById('hb-explorer').addEventListener('click', openExplorer);
      document.getElementById('hb-dark').addEventListener('click', Common.toggleDark);
      document.getElementById('hb-sitemap').addEventListener('click', Common.openSitemap);
      Common.initHintBar({
        hintEl: document.getElementById('hint'),
        hintZoneEl: document.getElementById('hint-zone'),
      });

      // ---------- Starred words ----------
      // Persisted in localStorage and shown in the hamburger panel. A word is
      // identified by its form + language, so the same spelling in different
      // languages stays distinct.
      const STARS_KEY = 'etymology-stars';
      const PREFS_KEY = 'etymology-prefs';

      function loadJSON(key, fallback) {
        try {
          const v = JSON.parse(localStorage.getItem(key));
          return v == null ? fallback : v;
        } catch {
          return fallback;
        }
      }

      // stars: [{ form, lang, date (ms), order (number) }]
      let stars = loadJSON(STARS_KEY, []).filter(
        (e) => e && typeof e.form === 'string' && typeof e.lang === 'string'
      );
      const prefs = Object.assign({ sidebar: true, def: true }, loadJSON(PREFS_KEY, {}));

      function saveStars() {
        localStorage.setItem(STARS_KEY, JSON.stringify(stars));
      }
      function savePrefs() {
        localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
      }

      let currentForm = '';
      let currentLang = '';
      const isDesktop = () => window.matchMedia('(min-width: 860px)').matches;

      const panelBtn = document.getElementById('panel-btn');
      const favBtn = document.getElementById('fav-btn');
      const sidebarEl = document.getElementById('sidebar');
      const backdropEl = document.getElementById('backdrop');
      const starredListEl = document.getElementById('starred-list');

      function findStar(form, lang) {
        return stars.find((e) => e.form === form && e.lang === lang);
      }
      function nextOrder() {
        return stars.reduce((max, e) => Math.max(max, e.order), -1) + 1;
      }

      function setStar(form, lang, on) {
        const existing = findStar(form, lang);
        if (on && !existing) {
          stars.push({ form, lang, date: Date.now(), order: nextOrder() });
        } else if (!on && existing) {
          stars = stars.filter((e) => e !== existing);
        }
        saveStars();
        renderSidebar();
        updateFavButton();
      }

      function toggleStar() {
        if (!currentForm) return;
        setStar(currentForm, currentLang, !findStar(currentForm, currentLang));
      }

      function updateFavButton() {
        favBtn.hidden = !currentForm;
        const on = !!findStar(currentForm, currentLang);
        favBtn.textContent = on ? '★' : '☆';
        favBtn.classList.toggle('active', on);
      }

      // Called on every lookup so the star button and panel highlight track
      // the word currently on screen.
      function setCurrent(form, lang) {
        currentForm = form;
        currentLang = lang;
        document.title = form ? form + ' • etymology' : 'Ruvan / etymology';
        updateFavButton();
        renderSidebar();
      }

      // ---------- Sidebar ----------
      function starredEntries() {
        return [...stars].sort((a, b) => a.order - b.order);
      }

      function makeSideItem(entry) {
        const row = document.createElement('div');
        const isCurrent = entry.form === currentForm && entry.lang === currentLang;
        row.className = 'side-item' + (isCurrent ? ' current' : '');

        const grip = document.createElement('span');
        grip.className = 'grip';
        grip.textContent = '⠿';
        grip.title = 'Drag to reorder';
        row.appendChild(grip);

        const star = document.createElement('span');
        star.className = 'icon star';
        star.textContent = '★';
        star.title = 'Remove star';
        star.addEventListener('click', (e) => {
          e.stopPropagation();
          setStar(entry.form, entry.lang, false);
        });
        row.appendChild(star);

        const term = document.createElement('span');
        term.className = 'term';
        term.textContent = entry.form;
        if (entry.lang !== 'en') {
          const lang = document.createElement('span');
          lang.className = 'side-lang';
          lang.textContent = langName(entry.lang);
          term.appendChild(lang);
        }
        row.appendChild(term);

        const remove = document.createElement('button');
        remove.className = 'remove';
        remove.textContent = '✕';
        remove.title = 'Remove star';
        remove.addEventListener('click', (e) => {
          e.stopPropagation();
          setStar(entry.form, entry.lang, false);
        });
        row.appendChild(remove);

        row.addEventListener('click', () => {
          closeDrawerOnMobile();
          lookup(entry.form, entry.lang);
        });
        return row;
      }

      function renderSidebar() {
        const entries = starredEntries();
        starredListEl.innerHTML = '';
        if (!entries.length) {
          const empty = document.createElement('div');
          empty.className = 'side-empty';
          empty.textContent = 'No starred words yet';
          starredListEl.appendChild(empty);
          return;
        }
        entries.forEach((entry) => starredListEl.appendChild(makeSideItem(entry)));
      }

      // ---------- Drag-to-reorder (pointer events on the grip) ----------
      let drag = null; // { fromIndex, toIndex }
      starredListEl.addEventListener('pointerdown', (e) => {
        const grip = e.target.closest('.grip');
        if (!grip) return;
        const row = grip.closest('.side-item');
        const rows = [...starredListEl.querySelectorAll('.side-item')];
        drag = { fromIndex: rows.indexOf(row), toIndex: null };
        row.classList.add('dragging');
        grip.setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      starredListEl.addEventListener('pointermove', (e) => {
        if (!drag) return;
        const rows = [...starredListEl.querySelectorAll('.side-item')];
        let to = rows.length;
        for (let i = 0; i < rows.length; i++) {
          const rect = rows[i].getBoundingClientRect();
          if (e.clientY < rect.top + rect.height / 2) {
            to = i;
            break;
          }
        }
        starredListEl.querySelector('.drop-indicator')?.remove();
        if (to === drag.fromIndex || to === drag.fromIndex + 1) {
          drag.toIndex = null;
          return;
        }
        drag.toIndex = to;
        const indicator = document.createElement('div');
        indicator.className = 'drop-indicator';
        if (to >= rows.length) starredListEl.appendChild(indicator);
        else starredListEl.insertBefore(indicator, rows[to]);
      });
      function endDrag() {
        if (!drag) return;
        starredListEl.querySelector('.drop-indicator')?.remove();
        if (drag.toIndex != null) {
          const ordered = starredEntries();
          const moved = ordered.splice(drag.fromIndex, 1)[0];
          const insertAt = drag.toIndex > drag.fromIndex ? drag.toIndex - 1 : drag.toIndex;
          ordered.splice(Math.min(insertAt, ordered.length), 0, moved);
          ordered.forEach((entry, i) => (entry.order = i));
          saveStars();
        }
        drag = null;
        renderSidebar();
      }
      starredListEl.addEventListener('pointerup', endDrag);
      starredListEl.addEventListener('pointercancel', endDrag);

      // ---------- Panel (sidebar / mobile drawer) ----------
      let drawerOpen = false;
      function syncPanel() {
        if (isDesktop()) {
          sidebarEl.classList.toggle('collapsed', !prefs.sidebar);
          sidebarEl.classList.remove('open');
          backdropEl.classList.remove('open');
        } else {
          sidebarEl.classList.remove('collapsed');
          sidebarEl.classList.toggle('open', drawerOpen);
          backdropEl.classList.toggle('open', drawerOpen);
        }
      }
      function togglePanel() {
        if (isDesktop()) {
          prefs.sidebar = !prefs.sidebar;
          savePrefs();
        } else {
          drawerOpen = !drawerOpen;
        }
        syncPanel();
      }
      function closeDrawerOnMobile() {
        if (!isDesktop() && drawerOpen) {
          drawerOpen = false;
          syncPanel();
        }
      }
      panelBtn.addEventListener('click', togglePanel);
      favBtn.addEventListener('click', toggleStar);
      backdropEl.addEventListener('click', closeDrawerOnMobile);
      window.matchMedia('(min-width: 860px)').addEventListener('change', syncPanel);

      renderSidebar();
      updateFavButton();
      syncPanel();

      // ---------- Init ----------
      const initial = Common.parseQueryItems();
      if (initial.length) {
        const at = initial[0].lastIndexOf('@');
        if (at > 0) lookup(initial[0].slice(0, at), initial[0].slice(at + 1), { replace: true });
        else lookup(initial[0], 'en', { replace: true });
      } else {
        renderStatus('search a word, or press r for a random one');
      }
      // Warm the buffer so the first random word is ready on demand.
      prefillRandom();
    </script>
  </body>
</html>
