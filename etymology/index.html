<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruvan / etymology</title>
    <link rel="icon" id="favicon" />
    <link rel="stylesheet" href="/common.css" />
    <style>
      :root {
        --muted: rgba(0, 0, 0, 0.45);
        --faint: rgba(0, 0, 0, 0.3);
        --line: rgba(0, 0, 0, 0.18);
        --hover: rgba(0, 0, 0, 0.05);
        --card-bg: #fafafa;
        --star: #e7b416;
        --side-bg: #fafafa;
      }
      body.dark {
        --muted: rgba(255, 255, 255, 0.5);
        --faint: rgba(255, 255, 255, 0.35);
        --line: rgba(255, 255, 255, 0.22);
        --hover: rgba(255, 255, 255, 0.07);
        --card-bg: #181818;
        --side-bg: #161616;
      }
      @media (prefers-color-scheme: dark) {
        body:not(.light) {
          --muted: rgba(255, 255, 255, 0.5);
          --faint: rgba(255, 255, 255, 0.35);
          --line: rgba(255, 255, 255, 0.22);
          --hover: rgba(255, 255, 255, 0.07);
          --card-bg: #181818;
          --side-bg: #161616;
        }
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: 'Times New Roman', Times, Georgia, serif;
        overflow: hidden;
      }
      #app {
        display: flex;
        height: 100vh;
        height: 100dvh;
      }
      #main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      /* --- Header --- */
      #header {
        position: relative;
        padding: 16px;
        border-bottom: 1px solid var(--line);
      }
      #search-row {
        position: relative;
        max-width: 560px;
        margin: 0 auto;
      }
      #search {
        font: inherit;
        font-size: 34px;
        text-align: center;
        background: transparent;
        color: inherit;
        border: none;
        outline: none;
        display: block;
        width: 100%;
        /* symmetric padding keeps the word centered while clearing the
           hamburger on the left and the star + shuffle icons on the right */
        padding: 0 72px;
        box-sizing: border-box;
      }
      #search::placeholder {
        color: var(--faint);
      }
      #random-btn {
        position: absolute;
        right: 6px;
        top: 50%;
        transform: translateY(-50%);
        font: inherit;
        font-size: 22px;
        line-height: 1;
        background: none;
        border: none;
        cursor: pointer;
        color: #000;
        padding: 6px;
      }
      /* Star toggle for the current word, left of the shuffle icon. */
      #fav-btn {
        position: absolute;
        right: 40px;
        top: 50%;
        transform: translateY(-50%);
        font: inherit;
        font-size: 24px;
        line-height: 1;
        background: none;
        border: none;
        cursor: pointer;
        color: var(--faint);
        padding: 4px;
      }
      #fav-btn.active {
        color: var(--star);
      }
      #fav-btn[hidden] {
        display: none;
      }
      body.dark #random-btn {
        color: #fff;
      }
      @media (prefers-color-scheme: dark) {
        body:not(.light) #random-btn {
          color: #fff;
        }
      }
      /* Match the shuffle icon to the header's divider line (var(--line)):
         the divider's base color at its alpha, applied to the whole SVG so
         the two crossing strokes don't darken where they overlap. */
      #random-btn svg {
        display: block;
        width: 22px;
        height: 22px;
        opacity: 0.18;
      }
      body.dark #random-btn svg {
        opacity: 0.22;
      }
      @media (prefers-color-scheme: dark) {
        body:not(.light) #random-btn svg {
          opacity: 0.22;
        }
      }
      #random-btn:hover svg {
        opacity: 0.5;
      }

      /* --- Content / tree --- */
      #content {
        flex: 1;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
        padding: 32px 16px 96px;
        transition: opacity 0.18s ease; /* keep in sync with FADE_MS */
      }
      #content.centered {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .status {
        font-size: 18px;
        font-style: italic;
        color: var(--faint);
      }
      .status a {
        color: var(--muted);
      }

      /* Loading spinner shown while fetching from the Wiktionary API. */
      .spinner {
        width: 28px;
        height: 28px;
        border: 2px solid var(--line);
        border-top-color: var(--muted);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Nested flexbox tree with connector lines drawn by ::before/::after. */
      .tree {
        width: max-content;
        min-width: 100%;
      }
      /* The tree reads bottom-up — the word at the bottom, ancestors rising
         above it. The connector geometry below is written top-down, so mirror
         the whole tree vertically; .node mirrors each card back upright. */
      .tree > ul {
        transform: scaleY(-1);
      }
      .tree ul {
        display: flex;
        justify-content: center;
        list-style: none;
        position: relative;
        padding-top: 22px;
      }
      .tree > ul {
        padding-top: 0;
      }
      /* vertical drop from the parent node into the children row */
      .tree ul ul::before {
        content: '';
        position: absolute;
        top: 0;
        left: 50%;
        height: 22px;
        border-left: 1px solid var(--line);
      }
      .tree li {
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        padding: 22px 10px 0;
      }
      /* horizontal distribution line plus the drop to each child */
      .tree li::before,
      .tree li::after {
        content: '';
        position: absolute;
        top: 0;
        right: 50%;
        width: 50%;
        height: 22px;
        border-top: 1px solid var(--line);
      }
      .tree li::after {
        right: auto;
        left: 50%;
        border-left: 1px solid var(--line);
      }
      .tree li:first-child::before,
      .tree li:last-child::after {
        border-top: none;
      }
      .tree li:last-child::before {
        border-right: 1px solid var(--line);
        border-radius: 0 6px 0 0;
      }
      .tree li:first-child::after {
        border-radius: 6px 0 0 0;
      }
      /* an only child continues straight down: one line, no elbows */
      .tree li:only-child::before {
        display: none;
      }
      .tree li:only-child::after {
        border-top: none;
        border-radius: 0;
      }
      .tree > ul > li {
        padding-top: 0;
      }
      .tree > ul > li::before,
      .tree > ul > li::after {
        display: none;
      }

      .node {
        background: var(--card-bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 16px 10px;
        text-align: center;
        max-width: 240px;
        /* Grow the card to fit its widest unbreakable word so words are never
           split mid-letter; this wins over max-width when a word is longer. */
        min-width: min-content;
        transform: scaleY(-1); /* undo the .tree > ul mirror */
      }
      .node.clickable {
        cursor: pointer;
      }
      @media (hover: hover) {
        .node.clickable:hover {
          background: var(--hover);
        }
      }
      .node .rel {
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 9px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--faint);
        margin-top: 3px;
      }
      .node .lang {
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 3px;
      }
      .node .form {
        font-size: 21px;
        line-height: 1.2;
      }
      .node .form.empty {
        color: var(--faint);
      }
      .node .tr {
        font-size: 13px;
        color: var(--muted);
        margin-top: 1px;
      }
      .node .gloss {
        font-size: 13px;
        font-style: italic;
        color: var(--muted);
        margin-top: 2px;
      }
      .tree > ul > li > .node .form {
        font-size: 30px;
      }

      /* Wrap the tree, definition, and source line in one max-content column so
         the narrower blocks center on the tree's center (i.e. under the root
         node) rather than on the viewport when the tree overflows horizontally. */
      .content-inner {
        width: max-content;
        min-width: 100%;
      }

      /* Definition of the looked-up word, shown beneath the bottommost node.
         width: fit-content shrink-wraps the block to its text (up to 540px) so
         margin auto centers that block — and thus the center of the
         left-aligned text — under the root node, instead of stretching the
         block full-width and stranding the text at the left edge. */
      #definition {
        width: fit-content;
        max-width: 540px;
        margin: 30px auto 0;
        text-align: left;
      }
      #definition[hidden] {
        display: none;
      }
      #definition .def-pos {
        text-align: center;
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--faint);
        margin-bottom: 8px;
      }
      #definition .def-senses {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      #definition .def-sense {
        font-size: 16px;
        line-height: 1.5;
        margin: 5px 0;
        padding-left: 18px;
        text-indent: -18px;
      }
      #definition .def-sense::before {
        content: '•';
        color: var(--faint);
        margin-right: 8px;
      }

      #source-line {
        text-align: center;
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 11px;
        color: var(--faint);
        margin-top: 36px;
      }
      #source-line a {
        color: inherit;
      }

      button,
      .node {
        touch-action: manipulation;
      }
      @media (max-width: 700px) {
        #search {
          font-size: 26px;
        }
        #content {
          padding: 24px 10px 96px;
        }
        .node {
          padding: 6px 10px 8px;
          max-width: 180px;
        }
        .node .form {
          font-size: 17px;
        }
        .tree > ul > li > .node .form {
          font-size: 24px;
        }
        .tree li {
          padding-left: 5px;
          padding-right: 5px;
        }
      }

      /* --- Sidebar / drawer (starred words) --- */
      #sidebar {
        width: 200px;
        flex: none;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        scrollbar-width: thin;
        background: var(--side-bg);
      }
      .side-section {
        padding: 14px 10px;
      }
      .side-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 8px;
        padding: 0 6px;
      }
      .side-title {
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .side-empty {
        font-size: 14px;
        font-style: italic;
        color: var(--faint);
        padding: 4px 6px;
      }
      .side-item {
        position: relative;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 6px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 15px;
        user-select: none;
        -webkit-user-select: none;
      }
      .side-item.current {
        background: var(--hover);
      }
      @media (hover: hover) {
        .side-item:hover {
          background: var(--hover);
        }
      }
      .side-item .icon.star {
        flex: none;
        width: 14px;
        text-align: center;
        color: var(--star);
        cursor: pointer;
        font-size: 11px;
      }
      .side-item .term {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .side-item .term .side-lang {
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
        margin-left: 5px;
      }
      .side-item .remove {
        flex: none;
        background: none;
        border: none;
        color: var(--faint);
        font: inherit;
        font-size: 14px;
        cursor: pointer;
        padding: 0 2px;
      }
      @media (hover: hover) {
        .side-item .remove {
          visibility: hidden;
        }
        .side-item:hover .remove {
          visibility: visible;
        }
      }
      .side-item .grip {
        flex: none;
        color: var(--faint);
        cursor: grab;
        touch-action: none;
        padding: 0 2px;
        font-size: 11px;
      }
      /* on hover-capable devices the grips stay out of sight until needed
         (they keep their space so rows don't shift); always shown on touch */
      @media (hover: hover) {
        .side-item .grip {
          opacity: 0;
          transition: opacity 0.15s ease;
        }
        .side-item:hover .grip {
          opacity: 1;
        }
      }
      .side-item.dragging {
        opacity: 0.4;
      }
      .drop-indicator {
        height: 2px;
        border-radius: 1px;
        background: var(--star);
        margin: 2px 8px;
      }

      /* Hamburger lives inside the header, vertically centered and sized
         like the shuffle icon. The open mobile drawer (z-index 80) covers it. */
      #panel-btn {
        position: absolute;
        top: 50%;
        left: 8px;
        transform: translateY(-50%);
        /* above the full-width search input, which would steal its taps */
        z-index: 10;
        font: inherit;
        font-size: 24px;
        line-height: 1;
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        padding: 6px 10px;
      }
      #backdrop {
        display: none;
      }

      @media (max-width: 859px) {
        #sidebar {
          position: fixed;
          top: 0;
          left: 0;
          bottom: 0;
          width: min(260px, 80vw);
          transform: translateX(-100%);
          transition: transform 0.25s ease;
          z-index: 80;
          padding-top: 8px;
        }
        #sidebar.open {
          transform: translateX(0);
          box-shadow: 0 0 24px rgba(0, 0, 0, 0.25);
        }
        #backdrop {
          display: block;
          position: fixed;
          inset: 0;
          background: rgba(0, 0, 0, 0.35);
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.25s ease;
          z-index: 70;
        }
        #backdrop.open {
          opacity: 1;
          pointer-events: auto;
        }
      }
      @media (min-width: 860px) {
        #sidebar.collapsed {
          display: none;
        }
      }

      /* --- Hint bar --- */
      #hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        text-align: center;
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 12px;
        color: #888;
        opacity: 1;
        transition: opacity 0.4s ease;
        user-select: none;
        z-index: 65;
        padding: 8px 8px 12px;
        background: #fff;
      }
      body.dark #hint {
        background: #111;
      }
      @media (prefers-color-scheme: dark) {
        body:not(.light) #hint {
          background: #111;
        }
      }
      #hint.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #hint .hint-btn {
        cursor: pointer;
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 2px;
      }
      #hint .hint-btn:hover {
        color: #333;
      }
      body.dark #hint .hint-btn:hover {
        color: #ccc;
      }
      #hint-zone {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 50px;
        z-index: 64;
      }
    </style>
    <script src="/common.js"></script>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="side-section">
          <div class="side-head"><span class="side-title">Starred</span></div>
          <div id="starred-list"></div>
        </div>
      </aside>
      <main id="main">
        <header id="header">
          <button id="panel-btn" title="Toggle starred panel (h)" aria-label="Toggle starred panel">
            ☰
          </button>
          <div id="search-row">
            <input
              id="search"
              type="text"
              placeholder="word"
              autocomplete="off"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              enterkeyhint="search"
            />
            <button id="fav-btn" hidden title="Star word (f)" aria-label="Star word">☆</button>
            <button id="random-btn" title="Random word (n)" aria-label="Random word">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M3 7 C 9 7, 13 17, 16.5 17" />
                <polyline points="16.5 14 20 17 16.5 20" />
                <path d="M3 17 C 9 17, 13 7, 16.5 7" />
                <polyline points="16.5 4 20 7 16.5 10" />
              </svg>
            </button>
          </div>
        </header>
        <div id="content" class="centered"><div class="status">…</div></div>
      </main>
    </div>
    <div id="backdrop"></div>
    <div id="hint">
      <span id="hint-inner">
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-random">n random</span></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-search">/ search</span></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"><span class="hint-btn" id="hb-fav">f star</span></span>
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"><span class="hint-btn" id="hb-panel">h panel</span></span>
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"><span class="hint-btn" id="hb-def">d def</span></span>
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-dark"
            >1 <span class="hb-dark-label">dark</span></span
          ></span
        >
        &nbsp;·&nbsp;
        <span style="white-space: nowrap"
          ><span class="hint-btn" id="hb-sitemap">s sitemap</span></span
        >
      </span>
    </div>
    <div id="hint-zone"></div>
    <script>

      Common.initSitemapShortcut();

        ur: 'Urdu',
        pal: 'Middle Persian',
        peo: 'Old Persian',
        fa: 'Persian',
        'fa-cls': 'Classical Persian',
        ps: 'Pashto',
        ku: 'Kurdish',
        bn: 'Bengali',
        mr: 'Marathi',
        gu: 'Gujarati',
        pa: 'Punjabi',
        ne: 'Nepali',
        si: 'Sinhalese',
        ta: 'Tamil',
        te: 'Telugu',
        ml: 'Malayalam',
        kn: 'Kannada',
        'dra-pro': 'Proto-Dravidian',
        ar: 'Arabic',
        'sem-pro': 'Proto-Semitic',
        'afa-pro': 'Proto-Afroasiatic',
        he: 'Hebrew',
        hbo: 'Biblical Hebrew',
        arc: 'Aramaic',
        syc: 'Classical Syriac',
        akk: 'Akkadian',
        phn: 'Phoenician',
        egy: 'Egyptian',
        cop: 'Coptic',
        mt: 'Maltese',
        am: 'Amharic',
        gez: 'Geʽez',
        tr: 'Turkish',
        ota: 'Ottoman Turkish',
        'trk-pro': 'Proto-Turkic',
        az: 'Azerbaijani',
        kk: 'Kazakh',
        ky: 'Kyrgyz',
        uz: 'Uzbek',
        tt: 'Tatar',
        mn: 'Mongolian',
        zh: 'Chinese',
        ltc: 'Middle Chinese',
        och: 'Old Chinese',
        cmn: 'Mandarin',
        yue: 'Cantonese',
        'sit-pro': 'Proto-Sino-Tibetan',
        bo: 'Tibetan',
        my: 'Burmese',
        ja: 'Japanese',
        ojp: 'Old Japanese',
        ko: 'Korean',
        okm: 'Middle Korean',
        vi: 'Vietnamese',
        th: 'Thai',
        km: 'Khmer',
        lo: 'Lao',
        ms: 'Malay',
        id: 'Indonesian',
        jv: 'Javanese',
        tl: 'Tagalog',
        'poz-pro': 'Proto-Malayo-Polynesian',
        'map-pro': 'Proto-Austronesian',
        haw: 'Hawaiian',
        mi: 'Maori',
        sm: 'Samoan',
        to: 'Tongan',
        fj: 'Fijian',
        hu: 'Hungarian',
        fi: 'Finnish',
        et: 'Estonian',
        'urj-pro': 'Proto-Uralic',
        eu: 'Basque',
        ka: 'Georgian',
        hy: 'Armenian',
        xcl: 'Old Armenian',
        sq: 'Albanian',
        sw: 'Swahili',
        zu: 'Zulu',
        'bnt-pro': 'Proto-Bantu',
        yo: 'Yoruba',
        ha: 'Hausa',
        wo: 'Wolof',
        nci: 'Classical Nahuatl',
        qu: 'Quechua',
        gn: 'Guaraní',
        ay: 'Aymara',
        chr: 'Cherokee',
        oj: 'Ojibwe',
        'alg-pro': 'Proto-Algonquian',
        ett: 'Etruscan',
        sux: 'Sumerian',
        hit: 'Hittite',
        xto: 'Tocharian A',
        txb: 'Tocharian B',
        eo: 'Esperanto',
        mul: 'Translingual',
        und: 'Undetermined',
      };
      // Etymology-only varieties live under their parent language's heading.
      const SECTION_OVERRIDES = {
        'la-cla': 'Latin',
        'la-lat': 'Latin',
        'la-vul': 'Latin',
        'la-med': 'Latin',
        'la-new': 'Latin',
        'la-ecc': 'Latin',
        'VL.': 'Latin',
        'LL.': 'Latin',
        'ML.': 'Latin',
        'NL.': 'Latin',
        'EL.': 'Latin',
        'grc-koi': 'Ancient Greek',
        'fa-cls': 'Persian',
        cmn: 'Chinese',
        yue: 'Chinese',
      };
      // Languages whose entry titles drop the vowel-length marks shown in
      // etymology templates (Latin macrons, Old English macrons/dots, …).
      const STRIP_MARKS = new Set([
        'la',
        'la-cla',
        'la-lat',
        'la-vul',
        'la-med',
        'la-new',
        'la-ecc',
        'VL.',
        'LL.',
        'ML.',
        'NL.',
        'EL.',
        'itc-ola',
        'ang',
        'grc',
        'grc-koi',
      ]);

      // Names fetched from Wiktionary for codes missing from LANGS above, so a
      // language is always written out in full rather than left as a bare code.
      // Populated by resolveLangNames(); consulted only for display.
      const RESOLVED = {};
      const langResolveFailed = new Set();

      function langName(code) {
        return LANGS[code] || RESOLVED[code] || code;
      }
      function sectionName(code) {
        return SECTION_OVERRIDES[code] || LANGS[code] || null;
      }
      function stripMarks(s) {
        return s.normalize('NFD').replace(/[̄̆̇]/g, '').normalize('NFC');
      }

      // ---------- Wikitext parsing ----------
      // Etymology sections describe descent with a small set of templates:
      //   {{inh|en|enm|water}}  inherited   {{bor|en|fr|ballet}}  borrowed
      //   {{der|en|la|aqua}}    derived     {{m|grc|λόγος}}       mention
      // Successive templates in the "From X, from Y, from Z" prose form the
      // ancestry chain; a "+" between them (or a compound/affix template)
      // splits the tree into branches.
      const CHAIN_REL = {
        inh: 'inherited',
        'inh+': 'inherited',
        der: 'derived',
        'der+': 'derived',
        bor: 'borrowed',
        'bor+': 'borrowed',
        lbor: 'learned borrowing',
        slbor: 'semi-learned borrowing',
        obor: 'orthographic borrowing',
        ubor: 'unadapted borrowing',
        cal: 'calque',
        calque: 'calque',
        clq: 'calque',
        pcal: 'partial calque',
        psm: 'phono-semantic match',
        m: 'from',
        mention: 'from',
        'm+': 'from',
        l: 'from',
        link: 'from',
      };
      // First positional param of {{m}}/{{l}} is already the language.
      const MENTION_NAMES = new Set(['m', 'mention', 'm+', 'l', 'link']);
      const COMPOUND_NAMES = new Set([
        'compound',
        'com',
        'affix',
        'af',
        'surf',
        'suffix',
        'suf',
        'prefix',
        'pre',
        'confix',
        'con',
        'blend',
        'univerbation',
        'univ',
      ]);

      // The newer {{ety}}/{{etymon}} "etymon" templates encode descent as a
      // language code followed by derivation keywords (each prefixed with ":")
      // and etymons of the form "lang:term<modifiers>". A keyword applies to
      // every etymon after it. Each template names only the immediate
      // ancestor(s); deeper ancestry is recovered by tracing each one.
      //   {{ety|en|:bor|es:tortilla}}  English borrowed from Spanish tortilla
      const ETYMON_NAMES = new Set(['ety', 'etymon']);
      const ETYMON_REL = {
        from: 'from',
        der: 'derived',
        derived: 'derived',
        uder: 'derived',
        inh: 'inherited',
        inherited: 'inherited',
        bor: 'borrowed',
        borrowed: 'borrowed',
        lbor: 'learned borrowing',
        slbor: 'semi-learned borrowing',
        obor: 'orthographic borrowing',
        ubor: 'unadapted borrowing',
        cal: 'calque',
        calque: 'calque',
        clq: 'calque',
        pcal: 'partial calque',
        sl: 'semantic loan',
        'semantic loan': 'semantic loan',
        psm: 'phono-semantic match',
      };
      // Keywords that join etymons with a "+" (compound parts), rendered like
      // the {{affix}}/{{compound}} templates above.
      const ETYMON_AFFIX = new Set([
        'af',
        'affix',
        'afeq',
        'compound',
        'com',
        'con',
        'confix',
        'blend',
        'univ',
        'univerbation',
      ]);

      // Extract top-level {{…}} templates with positional/named params.
      function parseTemplates(text) {
        const out = [];
        let i = 0;
        while (i < text.length) {
          const open = text.indexOf('{{', i);
          if (open === -1) break;
          let depth = 0;
          let j = open;
          let close = -1;
          while (j < text.length - 1) {
            if (text[j] === '{' && text[j + 1] === '{') {
              depth++;
              j += 2;
            } else if (text[j] === '}' && text[j + 1] === '}') {
              depth--;
              j += 2;
              if (depth === 0) {
                close = j;
                break;
              }
            } else {
              j++;
            }
          }
          if (close === -1) break;
          const inner = text.slice(open + 2, close - 2);
          const parts = splitTop(inner);
          const name = (parts.shift() || '').trim().toLowerCase();
          const pos = [];
          const named = {};
          for (const part of parts) {
            const eq = topLevelEq(part);
            if (eq !== -1) named[part.slice(0, eq).trim()] = part.slice(eq + 1).trim();
            else pos.push(part.trim());
          }
          out.push({ name, pos, named, start: open, end: close });
          i = close;
        }
        return out;
      }

      // Split template params on | ignoring nested {{…}} and [[…]].
      function splitTop(s) {
        const parts = [];
        let depth = 0;
        let cur = '';
        for (let i = 0; i < s.length; i++) {
          const two = s.slice(i, i + 2);
          if (two === '{{' || two === '[[') {
            depth++;
            cur += two;
            i++;
          } else if (two === '}}' || two === ']]') {
            depth--;
            cur += two;
            i++;
          } else if (s[i] === '|' && depth === 0) {
            parts.push(cur);
            cur = '';
          } else {
            cur += s[i];
          }
        }
        parts.push(cur);
        return parts;
      }

      function topLevelEq(s) {
        let depth = 0;
        for (let i = 0; i < s.length; i++) {
          const two = s.slice(i, i + 2);
          if (two === '{{' || two === '[[') {
            depth++;
            i++;
          } else if (two === '}}' || two === ']]') {
            depth--;
            i++;
          } else if (s[i] === '=' && depth === 0) {
            return i;
          }
        }
        return -1;
      }

      function cleanText(s) {
        return (s || '')
          .replace(/\[\[[^\]|]*\|([^\]]*)\]\]/g, '$1')
          .replace(/\[\[([^\]]*)\]\]/g, '$1')
          .replace(/'{2,}/g, '')
          .replace(/<[^>]*>/g, '')
          .trim();
      }

      // The ==Language== section of a page's wikitext.
      function extractLangSection(wikitext, language) {
        const text = wikitext
          .replace(/<!--[\s\S]*?-->/g, '')
          .replace(/<ref[\s\S]*?(<\/ref>|\/>)/gi, '');
        const esc = language.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp('(^|\\n)==\\s*' + esc + '\\s*==\\s*\\n');
        const m = re.exec(text);
        if (!m) return null;
        const start = m.index + m[0].length;
        const next = /\n==[^=]/.exec(text.slice(start));
        return next ? text.slice(start, start + next.index) : text.slice(start);
      }

      // The first Etymology subsection (handles "Etymology" and "Etymology 1").
      function extractEtymology(section) {
        const m = /(^|\n)(={3,})\s*Etymology(\s+1)?\s*\2\s*\n/.exec(section);
        if (!m) return null;
        const start = m.index + m[0].length;
        const next = /\n=/.exec(section.slice(start));
        return (next ? section.slice(start, start + next.index) : section.slice(start)).trim();
      }

      // Prose after these markers lists cognates and cross-references,
      // not ancestors — cut before extracting the chain.
      const STOP_RE =
        /\b(?:[Cc]ognate|[Cc]ompare|[Rr]elated to|[Mm]ore at|[Dd]oublet|[Ss]ee also|[Aa]kin to|[Dd]isplaced|[Ss]uperseded|[Ss]ynchronically)\b/;

      function makeNode(form, lang, rel, gloss, tr) {
        return {
          form: cleanText(form),
          lang,
          rel,
          gloss: cleanText(gloss),
          tr: tr || '',
          children: [],
        };
      }

      function chainNodeFrom(t) {
        const mention = MENTION_NAMES.has(t.name);
        const lang = mention ? t.pos[0] : t.pos[1];
        if (!lang) return null;
        let form = mention ? t.pos[1] : t.pos[2];
        const alt = mention ? t.pos[2] : t.pos[3];
        const gloss = t.named.t || t.named.gloss || (mention ? t.pos[3] : t.pos[4]) || '';
        if (form === '-') form = '';
        return makeNode(alt || form || '', lang, CHAIN_REL[t.name], gloss, t.named.tr);
      }

      function compoundParts(t) {
        const lang = t.pos[0];
        const parts = [];
        t.pos.slice(1).forEach((raw, idx) => {
          let part = raw;
          if (!part || part === '-') return;
          if ((t.name === 'suffix' || t.name === 'suf') && idx > 0 && !part.startsWith('-')) {
            part = '-' + part;
          }
          if ((t.name === 'prefix' || t.name === 'pre') && idx === 0 && !part.endsWith('-')) {
            part = part + '-';
          }
          const gloss = t.named['t' + (idx + 1)] || t.named['gloss' + (idx + 1)] || '';
          parts.push(makeNode(part, lang, '+', gloss));
        });
        return parts;
      }

      // Parse one etymon spec ("lang:term<t:gloss><tr:…><alt:…>"). The
      // language code is optional (defaults to the entry's); "-" hides the
      // term, showing only the language.
      function etymonSpec(raw, defLang) {
        const mods = {};
        const reMod = /<([a-z]+):([^<>]*)>/gi;
        let m;
        while ((m = reMod.exec(raw))) mods[m[1].toLowerCase()] = m[2];
        let base = raw;
        let prev;
        do {
          prev = base;
          base = base.replace(/<[^<>]*>/g, ''); // drop flag/value modifiers
        } while (base !== prev);
        base = base.trim();
        let lang = defLang;
        let term = base;
        const ci = base.indexOf(':');
        if (ci !== -1) {
          lang = base.slice(0, ci).trim();
          term = base.slice(ci + 1).trim();
        }
        if (term === '-') term = '';
        return {
          lang,
          form: mods.alt || term,
          gloss: mods.t || mods.gloss || '',
          tr: mods.tr || '',
        };
      }

      // Grow the tree from the immediate ancestors named in an {{ety}}/
      // {{etymon}} template. Used as a fallback for pages that no longer
      // spell the chain out in prose (e.g. "tortilla"); each ancestor is
      // flagged for tracing so its own ancestry can be filled in later.
      function buildFromEtymon(text, root, rootLang) {
        const t = parseTemplates(text).find((t) => ETYMON_NAMES.has(t.name));
        if (!t) return false;
        const entryLang = t.pos[0];
        let rel = 'from';
        let affix = false;
        let built = false;
        for (const raw of t.pos.slice(1)) {
          const arg = raw.trim();
          if (!arg) continue;
          if (arg.startsWith(':')) {
            const kw = arg
              .slice(1)
              .replace(/<[\s\S]*$/, '')
              .trim()
              .toLowerCase();
            affix = ETYMON_AFFIX.has(kw);
            rel = affix ? '+' : ETYMON_REL[kw] || kw;
            continue;
          }
          const spec = etymonSpec(arg, entryLang);
          if (!spec.lang) continue;
          if (spec.lang === rootLang && spec.form === root.form) continue;
          const node = makeNode(spec.form, spec.lang, rel, spec.gloss, spec.tr);
          if (!affix) node.trace = true;
          root.children.push(node);
          built = true;
        }
        return built;
      }

      // Walk the first template-bearing paragraph and grow the tree under root.
      function buildChain(etymText, root, rootLang) {
        for (const para of etymText.split(/\n{2,}/)) {
          const stop = STOP_RE.exec(para);
          const text = stop ? para.slice(0, stop.index) : para;
          const templates = parseTemplates(text).filter(
            (t) => CHAIN_REL[t.name] || COMPOUND_NAMES.has(t.name)
          );
          if (!templates.length) continue;
          let attach = root; // parent of the next chain node
          let last = null;
          let lastEnd = 0;
          for (const t of templates) {
            const gap = text.slice(lastEnd, t.start);
            lastEnd = t.end;
            if (COMPOUND_NAMES.has(t.name)) {
              // Morphological analysis describes the headword itself; an
              // ancestor-language compound belongs to the current node.
              const target = t.pos[0] === rootLang ? root : last || root;
              for (const part of compoundParts(t)) target.children.push(part);
              continue;
            }
            const node = chainNodeFrom(t);
            if (!node) continue;
            // Skip the headword itself and repeated mentions of the same form.
            if (node.lang === rootLang && node.form === root.form && !root.children.length)
              continue;
            if (last && node.lang === last.lang && node.form === last.form) {
              if (!last.gloss && node.gloss) last.gloss = node.gloss;
              continue;
            }
            // Descent steps are spelled out ("from X, from Y"); a bare
            // comma, parenthesis, or "+" introduces an alternate form or
            // compound part — a sibling branch, not an ancestor.
            const sibling =
              last &&
              gap.length <= 30 &&
              (gap.includes('+') ||
                /(^|[\s,;])(or|and)\s/.test(gap) ||
                !/(from|via|through|of|ultimately|after|<)/i.test(gap));
            if (last && !sibling) attach = last;
            attach.children.push(node);
            last = node;
          }
          return true;
        }
        return buildFromEtymon(etymText, root, rootLang);
      }

      // ---------- Wiktionary fetch ----------
      const API =
        'https://en.wiktionary.org/w/api.php?action=parse&prop=wikitext&format=json' +
        '&formatversion=2&redirects=1&origin=*&page=';
      const pageCache = new Map();

      function fetchWikitext(title) {
        if (!pageCache.has(title)) {
          pageCache.set(
            title,
            fetch(API + encodeURIComponent(title))
              .then((r) => (r.ok ? r.json() : null))
              .then((j) => (j && j.parse && j.parse.wikitext) || null)
              .catch(() => null)
          );
        }
        return pageCache.get(title);
      }

      // Rendered HTML of a page. Wiktionary builds the full "Etymology tree"
      // (an .etytree NavFrame) server-side here, recursively tracing every
      // ancestor — so when one is present we can mirror it exactly instead of
      // reconstructing the chain from wikitext templates.
      const HTML_API =
        'https://en.wiktionary.org/w/api.php?action=parse&prop=text&format=json' +
        '&formatversion=2&redirects=1&origin=*&page=';
      const htmlCache = new Map();

      function fetchPageHtml(title) {
        if (!htmlCache.has(title)) {
          htmlCache.set(
            title,
            fetch(HTML_API + encodeURIComponent(title))
              .then((r) => (r.ok ? r.json() : null))
              .then((j) => (j && j.parse && j.parse.text) || null)
              .catch(() => null)
          );
        }
        return htmlCache.get(title);
      }

      // Resolve language/family codes to their canonical names via Wiktionary's
      // own language data, so the tree never has to fall back to a raw code.
      // Unknown codes are batched into a single expandtemplates call; both
      // successes and failures are cached so each code is fetched at most once.
      const LANG_API =
        'https://en.wiktionary.org/w/api.php?action=expandtemplates&prop=wikitext' +
        '&format=json&formatversion=2&origin=*&text=';
      const LANG_SEP = '␟'; // unit separator: won't occur inside a name

      async function resolveLangNames(codes) {
        const todo = [...new Set(codes)].filter(
          (c) => c && !LANGS[c] && !RESOLVED[c] && !langResolveFailed.has(c)
        );
        if (!todo.length) return;
        const text = todo
          .map((c) => '{{#invoke:languages/templates|getByCode|' + c + '|getCanonicalName}}')
          .join(LANG_SEP);
        try {
          const r = await fetch(LANG_API + encodeURIComponent(text));
          if (!r.ok) throw new Error('http');
          const j = await r.json();
          const out = (j && j.expandtemplates && j.expandtemplates.wikitext) || '';
          const names = out.split(LANG_SEP);
          todo.forEach((c, i) => {
            const name = (names[i] || '').trim();
            // A bad code expands to a Lua/script error or empty text; in that
            // case keep falling back to the code rather than showing noise.
            if (name && !/error|#invoke|\{\{|\[\[/i.test(name)) RESOLVED[c] = name;
            else langResolveFailed.add(c);
          });
        } catch {
          todo.forEach((c) => langResolveFailed.add(c));
        }
      }

      function collectLangs(node, acc = []) {
        acc.push(node.lang);
        for (const child of node.children) collectLangs(child, acc);
        return acc;
      }

      function pageTitleFor(form, lang) {
        const name = langName(lang);
        if (form.startsWith('*')) return 'Reconstruction:' + name + '/' + form.slice(1);
        return STRIP_MARKS.has(lang) ? stripMarks(form) : form;
      }

      // Fetch a word's etymology and build its tree. Compound parts are
      // expanded recursively (depth-limited, shared fetch budget).
      async function getTree(form, lang, depth = 0, budget = { left: 10 }) {
        if (budget.left <= 0) return null;
        budget.left--;
        const section = sectionName(lang);
        if (!section) return null;
        const wikitext = await fetchWikitext(pageTitleFor(form, lang));
        if (!wikitext) return null;
        const langSection = extractLangSection(wikitext, section);
        if (!langSection) return null;
        const ety = extractEtymology(langSection);
        if (!ety) return null;
        const root = makeNode(form, lang, '');
        if (!buildChain(ety, root, lang)) return null;
        if (depth < 2) {
          for (const child of root.children) {
            // Compound parts (+) and lone etymon-template ancestors carry no
            // ancestry of their own yet — trace each to fill in its chain.
            if ((child.rel !== '+' && !child.trace) || !child.form || child.children.length)
              continue;
            const sub = await getTree(child.form, child.lang, depth + 1, budget);
            if (sub) {
              child.children = sub.children;
              if (!child.gloss) child.gloss = sub.gloss;
            }
          }
        }
        // The full tree is built; fill in any names missing from LANGS before
        // it's handed off to be rendered.
        if (depth === 0) await resolveLangNames(collectLangs(root));
        return root;
      }

      // ---------- Wiktionary "Etymology tree" (.etytree) ----------
      // Relation labels shown in the rendered tree (e.g. "der.", "bor.")
      // mapped to the words our cards use. Anything unmapped falls back to the
      // <abbr>'s title (its spelled-out form).
      const ETYTREE_REL = {
        der: 'derived',
        inh: 'inherited',
        bor: 'borrowed',
        lbor: 'learned borrowing',
        slbor: 'semi-learned borrowing',
        obor: 'orthographic borrowing',
        ubor: 'unadapted borrowing',
        cal: 'calque',
        clq: 'calque',
        calque: 'calque',
        pcal: 'partial calque',
        psm: 'phono-semantic match',
        sl: 'semantic loan',
      };

      // Turn one .etytree-block into a node: its language and term come from the
      // mention link; the optional label (sitting on the block) is the relation
      // to the descendant directly below it — exactly what our .rel renders.
      function etytreeBlockNode(block) {
        const i = block.querySelector('.etytree-term i');
        const lang = i ? i.getAttribute('lang') || '' : '';
        const form = i ? i.textContent.trim() : '';
        const trEl = block.querySelector('.mention-tr');
        const glossEl = block.querySelector('.mention-gloss');
        const labEl = block.querySelector('.etytree-label abbr');
        let rel = '';
        if (labEl) {
          const key = labEl.textContent.trim().replace(/\.$/, '').toLowerCase();
          rel = ETYTREE_REL[key] || (labEl.getAttribute('title') || '').toLowerCase();
        }
        return makeNode(
          form,
          lang,
          rel,
          glossEl ? glossEl.textContent : '',
          trEl ? trEl.textContent.trim() : ''
        );
      }

      // The tree is laid out bottom-up: within a container, blocks (and
      // branch-groups) are stacked oldest-first and the bottom one is the
      // headword. Each item is the ancestor of the item below it, so reading
      // bottom-to-top yields our parent→children chain. A branch-group holds
      // the several lineages that merge into the block just beneath it; each
      // branch is itself such a sequence.
      function parseEtytreeSeq(el) {
        const items = [];
        for (const c of el.children) {
          if (c.classList.contains('etytree-block') || c.classList.contains('etytree-branch-group'))
            items.push(c);
        }
        if (!items.length) return null;
        const root = etytreeBlockNode(items[items.length - 1]);
        let cur = root;
        for (let k = items.length - 2; k >= 0; k--) {
          const it = items[k];
          if (it.classList.contains('etytree-block')) {
            const parent = etytreeBlockNode(it);
            cur.children.push(parent);
            cur = parent;
          } else {
            for (const br of it.children) {
              if (!br.classList.contains('etytree-branch')) continue;
              const branch = parseEtytreeSeq(br);
              if (branch) cur.children.push(branch);
            }
            break; // a branch-group is the top of its sequence
          }
        }
        return root;
      }

      function etytreeBottomLang(frame) {
        const blocks = frame.querySelectorAll('.etytree-block');
        const last = blocks[blocks.length - 1];
        const i = last && last.querySelector('.etytree-term i');
        return i ? i.getAttribute('lang') || '' : '';
      }

      // Mirror the page's rendered Etymology tree, if it has one. Picks the tree
      // whose headword (bottom block) is in the looked-up language.
      async function treeFromEtytree(form, lang) {
        if (!sectionName(lang)) return null;
        const html = await fetchPageHtml(pageTitleFor(form, lang));
        if (!html || html.indexOf('etytree') === -1) return null;
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const frames = doc.querySelectorAll('.etytree.NavFrame');
        if (!frames.length) return null;
        // A page can carry trees for several languages (e.g. descendants
        // sections); only mirror the one whose headword is in this language.
        let frame = null;
        for (const f of frames) {
          if (etytreeBottomLang(f) === lang) {
            frame = f;
            break;
          }
        }
        if (!frame) return null;
        const body = frame.querySelector('.etytree-body');
        const root = body && parseEtytreeSeq(body);
        if (!root || !root.children.length) return null;
        await resolveLangNames(collectLangs(root));
        return root;
      }

      // Prefer Wiktionary's own tree; fall back to parsing the etymology prose.
      async function buildTree(form, lang) {
        const mirrored = await treeFromEtytree(form, lang);
        if (mirrored) return mirrored;
        return getTree(form, lang);
      }

      // ---------- Rendering ----------
      const contentEl = document.getElementById('content');
      const searchEl = document.getElementById('search');

      function nodeEl(node, isRoot) {
        const div = document.createElement('div');
        div.className = 'node';
        const lang = document.createElement('div');
        lang.className = 'lang';
        lang.textContent = langName(node.lang);
        div.appendChild(lang);
        const form = document.createElement('div');
        form.className = 'form' + (node.form ? '' : ' empty');
        form.textContent = node.form || '—';
        div.appendChild(form);
        if (node.tr) {
          const tr = document.createElement('div');
          tr.className = 'tr';
          tr.textContent = node.tr;
          div.appendChild(tr);
        }
        if (node.gloss) {
          const gloss = document.createElement('div');
          gloss.className = 'gloss';
          gloss.textContent = '“' + node.gloss + '”';
          div.appendChild(gloss);
        }
        // The relation sits at the card's bottom edge, nearest the
        // descendant (below it) that the relation describes.
        if (node.rel && !isRoot) {
          const rel = document.createElement('div');
          rel.className = 'rel';
          rel.textContent = node.rel === '+' ? '+' : node.rel;
          div.appendChild(rel);
        }
        if (isRoot) {
          div.classList.add('clickable');
          div.title = 'View on Wiktionary';
          div.addEventListener('click', () => {
            window.open(wiktionaryUrl(node.form, node.lang), '_blank', 'noopener');
          });
        } else if (node.form && sectionName(node.lang)) {
          div.classList.add('clickable');
          div.title = 'Trace ' + node.form;
          div.addEventListener('click', () => lookup(node.form, node.lang));
        }
        return div;
      }

      function subtreeEl(node, isRoot) {
        const li = document.createElement('li');
        li.appendChild(nodeEl(node, isRoot));
        if (node.children.length) {
          const ul = document.createElement('ul');
          for (const child of node.children) ul.appendChild(subtreeEl(child, false));
          li.appendChild(ul);
        }
        return li;
      }

      // Bring the looked-up word — bottom center of the tree — into view.
      function scrollToWord() {
        contentEl.scrollTop = contentEl.scrollHeight;
        contentEl.scrollLeft = (contentEl.scrollWidth - contentEl.clientWidth) / 2;
      }

      function wiktionaryUrl(form, lang) {
        return 'https://en.wiktionary.org/wiki/' + encodeURIComponent(pageTitleFor(form, lang));
      }

      // ---------- Definition (shown under the bottommost node) ----------
      // The looked-up word's senses, pulled from Wiktionary's REST definition
      // endpoint (structured per language, so it works for any root language).
      const DEF_API = 'https://en.wiktionary.org/api/rest_v1/page/definition/';
      const defCache = new Map();
      let defSeq = 0;

      function fetchDefinition(form, lang) {
        if (!form || form.startsWith('*')) return Promise.resolve(null); // no entry page
        const title = pageTitleFor(form, lang);
        const key = lang + '|' + title;
        if (!defCache.has(key)) {
          defCache.set(
            key,
            fetch(DEF_API + encodeURIComponent(title) + '?redirect=true')
              .then((r) => (r.ok ? r.json() : null))
              .then((j) => (j && j[lang]) || null)
              .catch(() => null)
          );
        }
        return defCache.get(key);
      }

      // Definition senses come back as HTML; render them as plain text so no
      // remote markup (or its images/scripts) ever touches the page.
      function htmlToText(html) {
        const doc = new DOMParser().parseFromString(html || '', 'text/html');
        return doc.body.textContent.replace(/\s+/g, ' ').trim();
      }

      async function loadDefinition(form, lang, container) {
        const my = ++defSeq;
        const groups = await fetchDefinition(form, lang);
        if (my !== defSeq || !container.isConnected || !groups) return;
        const group = groups.find((g) => g.definitions && g.definitions.length);
        if (!group) return;
        const senses = group.definitions
          .map((d) => htmlToText(d.definition))
          .filter(Boolean)
          .slice(0, 3);
        if (!senses.length) return;
        if (group.partOfSpeech) {
          const pos = document.createElement('div');
          pos.className = 'def-pos';
          pos.textContent = group.partOfSpeech;
          container.appendChild(pos);
        }
        const list = document.createElement('ul');
        list.className = 'def-senses';
        for (const text of senses) {
          const li = document.createElement('li');
          li.className = 'def-sense';
          li.textContent = text;
          list.appendChild(li);
        }
        container.appendChild(list);
        // Bring the new definition into view if the word was at the bottom.
        const slack = contentEl.scrollHeight - contentEl.scrollTop - contentEl.clientHeight;
        if (slack < 80) scrollToWord();
      }

      // Toggle the definition block (hint bar / "d"). Fetches lazily the first
      // time it's shown for the current word.
      function toggleDef() {
        prefs.def = !prefs.def;
        savePrefs();
        const def = document.getElementById('definition');
        if (!def) return;
        def.hidden = !prefs.def;
        if (prefs.def && !def.childElementCount) loadDefinition(currentForm, currentLang, def);
      }

      function renderTree(root) {
        contentEl.className = '';
        contentEl.innerHTML = '';
        const inner = document.createElement('div');
        inner.className = 'content-inner';
        const tree = document.createElement('div');
        tree.className = 'tree';
        const ul = document.createElement('ul');
        ul.appendChild(subtreeEl(root, true));
        tree.appendChild(ul);
        inner.appendChild(tree);
        const def = document.createElement('div');
        def.id = 'definition';
        def.hidden = !prefs.def;
        inner.appendChild(def);
        if (prefs.def) loadDefinition(root.form, root.lang, def);
        const source = document.createElement('div');
        source.id = 'source-line';
        const a = document.createElement('a');
        a.href = wiktionaryUrl(root.form, root.lang);
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = 'wiktionary';
        source.append('source: ', a, ' (CC BY-SA)');
        inner.appendChild(source);
        contentEl.appendChild(inner);
      }

      function renderStatus(text, link) {
        contentEl.className = 'centered';
        contentEl.innerHTML = '';
        const div = document.createElement('div');
        div.className = 'status';
        div.textContent = text;
        if (link) {
          const a = document.createElement('a');
          a.href = link.href;
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = link.text;
          div.append(' — ', a);
        }
        contentEl.appendChild(div);
      }

      function renderSpinner() {
        contentEl.className = 'centered';
        contentEl.innerHTML = '';
        const div = document.createElement('div');
        div.className = 'spinner';
        contentEl.appendChild(div);
      }

      // ---------- Lookup / navigation ----------
      const FADE_MS = 180; // keep in sync with #content's opacity transition
      let seq = 0;

      function queryFor(form, lang) {
        return encodeURIComponent(lang === 'en' ? form : form + '@' + lang);
      }

      function setUrl(form, lang, replace) {
        const q = '?' + queryFor(form, lang);
        if (location.search === q) return;
        const url = location.pathname + q;
        if (replace) history.replaceState(null, '', url);
        else history.pushState(null, '', url);
      }

      async function lookup(form, lang, opts = {}) {
        form = form.trim();
        if (!form) return;
        if (lang === 'en') form = form.toLowerCase();
        const my = ++seq;
        if (!opts.fromPop) setUrl(form, lang, opts.replace);
        searchEl.value = lang === 'en' ? form : form + ' (' + langName(lang) + ')';
        setCurrent(form, lang);
        searchEl.blur();
        contentEl.style.opacity = '0';
        const fadeOut = new Promise((r) => setTimeout(r, FADE_MS));
        let resolved = false;
        const treePromise = buildTree(form, lang).then((t) => ((resolved = true), t));
        await fadeOut;
        if (my !== seq) return;
        // If the fetch is still outstanding after the fade, show a spinner so
        // the wait (recursive API calls can be slow) isn't a blank screen.
        if (!resolved) {
          renderSpinner();
          contentEl.style.opacity = '1';
        }
        const tree = await treePromise;
        if (my !== seq) return;
        // The label was set from langName before the tree (and its language
        // names) resolved; refresh it now that the full name is known.
        if (lang !== 'en') searchEl.value = form + ' (' + langName(lang) + ')';
        if (tree) renderTree(tree);
        else {
          renderStatus('no etymology found for “' + form + '”', {
            href: wiktionaryUrl(form, lang),
            text: 'check wiktionary',
          });
        }
        scrollToWord();
        contentEl.style.opacity = '1';
      }

      // ---------- Random words ----------
      // Draw random main-namespace entries straight from Wiktionary rather
      // than a fixed list. Titles span every language and part of speech, so
      // keep just the ones that look like a plain lowercase headword.
      const RANDOM_API =
        'https://en.wiktionary.org/w/api.php?action=query&list=random' +
        '&rnnamespace=0&rnlimit=20&format=json&formatversion=2&origin=*';

      function fetchRandomWords() {
        return fetch(RANDOM_API)
          .then((r) => (r.ok ? r.json() : null))
          .then((j) => ((j && j.query && j.query.random) || []).map((p) => p.title))
          .then((titles) => titles.filter((t) => /^[a-z]+$/.test(t)))
          .catch(() => []);
      }

      // Draw words until one has a documented history, returning its built
      // tree. Most random entries have no parseable English etymology (other
      // languages, missing sections), so draw fresh batches and trace the
      // first that does, within a bounded budget.
      async function findRandomTree() {
        for (let batch = 0; batch < 4; batch++) {
          const words = await fetchRandomWords();
          for (const word of words) {
            const tree = await buildTree(word, 'en');
            if (tree) return { word, tree };
          }
        }
        return null;
      }

      // Buffer a few ready-to-render random words so pressing "random" again
      // is instant — the slow part (drawing + fetching until one has an
      // etymology) is paid ahead of time in the background.
      const RANDOM_BUFFER = 2;
      const randomQueue = [];
      let prefilling = false;
      async function prefillRandom() {
        if (prefilling) return;
        prefilling = true;
        try {
          while (randomQueue.length < RANDOM_BUFFER) {
            const item = await findRandomTree();
            if (!item) break; // word list unavailable; stop trying
            randomQueue.push(item);
          }
        } finally {
          prefilling = false;
        }
      }

      function showRandom(item, opts) {
        setUrl(item.word, 'en', opts.replace);
        searchEl.value = item.word;
        setCurrent(item.word, 'en');
        renderTree(item.tree);
        scrollToWord();
      }

      async function randomWord(opts = {}) {
        const my = ++seq;
        // Serve a buffered word instantly, then top the buffer back up.
        const buffered = randomQueue.shift();
        if (buffered) {
          showRandom(buffered, opts);
          prefillRandom();
          return;
        }
        // Nothing buffered yet — do a live draw behind the spinner.
        contentEl.style.opacity = '0';
        await new Promise((r) => setTimeout(r, FADE_MS));
        if (my !== seq) return;
        renderSpinner();
        contentEl.style.opacity = '1';
        const item = await findRandomTree();
        if (my !== seq) return;
        if (item) showRandom(item, opts);
        else renderStatus('the dice came up empty — try again');
        prefillRandom();
      }

      window.addEventListener('popstate', () => {
        const items = Common.parseQueryItems();
        if (!items.length) return;
        const at = items[0].lastIndexOf('@');
        if (at > 0) lookup(items[0].slice(0, at), items[0].slice(at + 1), { fromPop: true });
        else lookup(items[0], 'en', { fromPop: true });
      });

      // ---------- Input + shortcuts ----------
      // Tapping/clicking into the search bar highlights any existing word so a
      // new query overwrites it immediately, without deleting it first.
      let selectOnTap = false;
      searchEl.addEventListener('focus', () => {
        selectOnTap = true;
        searchEl.select();
      });
      // Mobile browsers reposition the caret on the touch that follows focus,
      // which would clear the selection; reselect once after that tap.
      searchEl.addEventListener('mouseup', (e) => {
        if (selectOnTap) {
          e.preventDefault();
          searchEl.select();
          selectOnTap = false;
        }
      });
      searchEl.addEventListener('blur', () => {
        selectOnTap = false;
      });

      searchEl.addEventListener('keydown', (e) => {
        e.stopPropagation();
        if (e.key === 'Enter') {
          e.preventDefault();
          lookup(searchEl.value, 'en');
        } else if (e.key === 'Escape') {
          searchEl.blur();
        }
      });

      document.getElementById('random-btn').addEventListener('click', () => randomWord());

      document.addEventListener('keydown', (e) => {
        const t = e.target;
        if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        if (e.key === '/') {
          e.preventDefault();
          searchEl.focus();
          searchEl.select();
        } else if (e.key === 'n' || e.key === 'N') {
          randomWord();
        } else if (e.key === 'f' || e.key === 'F') {
          toggleStar();
        } else if (e.key === 'h' || e.key === 'H') {
          togglePanel();
        } else if (e.key === 'd' || e.key === 'D') {
          toggleDef();
        }
      });

      // ---------- Hint bar ----------
      document.getElementById('hb-random').addEventListener('click', () => randomWord());
      document.getElementById('hb-search').addEventListener('click', () => {
        searchEl.focus();
        searchEl.select();
      });
      document.getElementById('hb-fav').addEventListener('click', toggleStar);
      document.getElementById('hb-panel').addEventListener('click', togglePanel);
      document.getElementById('hb-def').addEventListener('click', toggleDef);
      document.getElementById('hb-dark').addEventListener('click', Common.toggleDark);
      document.getElementById('hb-sitemap').addEventListener('click', Common.openSitemap);
      Common.initHintBar({
        hintEl: document.getElementById('hint'),
        hintZoneEl: document.getElementById('hint-zone'),
      });

      // ---------- Starred words ----------
      // Persisted in localStorage and shown in the hamburger panel. A word is
      // identified by its form + language, so the same spelling in different
      // languages stays distinct.
      const STARS_KEY = 'etymology-stars';
      const PREFS_KEY = 'etymology-prefs';

      function loadJSON(key, fallback) {
        try {
          const v = JSON.parse(localStorage.getItem(key));
          return v == null ? fallback : v;
        } catch {
          return fallback;
        }
      }

      // stars: [{ form, lang, date (ms), order (number) }]
      let stars = loadJSON(STARS_KEY, []).filter(
        (e) => e && typeof e.form === 'string' && typeof e.lang === 'string'
      );
      const prefs = Object.assign({ sidebar: true, def: true }, loadJSON(PREFS_KEY, {}));

      function saveStars() {
        localStorage.setItem(STARS_KEY, JSON.stringify(stars));
      }
      function savePrefs() {
        localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
      }

      let currentForm = '';
      let currentLang = '';
      const isDesktop = () => window.matchMedia('(min-width: 860px)').matches;

      const panelBtn = document.getElementById('panel-btn');
      const favBtn = document.getElementById('fav-btn');
      const sidebarEl = document.getElementById('sidebar');
      const backdropEl = document.getElementById('backdrop');
      const starredListEl = document.getElementById('starred-list');

      function findStar(form, lang) {
        return stars.find((e) => e.form === form && e.lang === lang);
      }
      function nextOrder() {
        return stars.reduce((max, e) => Math.max(max, e.order), -1) + 1;
      }

      function setStar(form, lang, on) {
        const existing = findStar(form, lang);
        if (on && !existing) {
          stars.push({ form, lang, date: Date.now(), order: nextOrder() });
        } else if (!on && existing) {
          stars = stars.filter((e) => e !== existing);
        }
        saveStars();
        renderSidebar();
        updateFavButton();
      }

      function toggleStar() {
        if (!currentForm) return;
        setStar(currentForm, currentLang, !findStar(currentForm, currentLang));
      }

      function updateFavButton() {
        favBtn.hidden = !currentForm;
        const on = !!findStar(currentForm, currentLang);
        favBtn.textContent = on ? '★' : '☆';
        favBtn.classList.toggle('active', on);
      }

      // Called on every lookup so the star button and panel highlight track
      // the word currently on screen.
      function setCurrent(form, lang) {
        currentForm = form;
        currentLang = lang;
        document.title = form ? form + ' • etymology' : 'Ruvan / etymology';
        updateFavButton();
        renderSidebar();
      }

      // ---------- Sidebar ----------
      function starredEntries() {
        return [...stars].sort((a, b) => a.order - b.order);
      }

      function makeSideItem(entry) {
        const row = document.createElement('div');
        const isCurrent = entry.form === currentForm && entry.lang === currentLang;
        row.className = 'side-item' + (isCurrent ? ' current' : '');

        const grip = document.createElement('span');
        grip.className = 'grip';
        grip.textContent = '⠿';
        grip.title = 'Drag to reorder';
        row.appendChild(grip);

        const star = document.createElement('span');
        star.className = 'icon star';
        star.textContent = '★';
        star.title = 'Remove star';
        star.addEventListener('click', (e) => {
          e.stopPropagation();
          setStar(entry.form, entry.lang, false);
        });
        row.appendChild(star);

        const term = document.createElement('span');
        term.className = 'term';
        term.textContent = entry.form;
        if (entry.lang !== 'en') {
          const lang = document.createElement('span');
          lang.className = 'side-lang';
          lang.textContent = langName(entry.lang);
          term.appendChild(lang);
        }
        row.appendChild(term);

        const remove = document.createElement('button');
        remove.className = 'remove';
        remove.textContent = '✕';
        remove.title = 'Remove star';
        remove.addEventListener('click', (e) => {
          e.stopPropagation();
          setStar(entry.form, entry.lang, false);
        });
        row.appendChild(remove);

        row.addEventListener('click', () => {
          closeDrawerOnMobile();
          lookup(entry.form, entry.lang);
        });
        return row;
      }

      function renderSidebar() {
        const entries = starredEntries();
        starredListEl.innerHTML = '';
        if (!entries.length) {
          const empty = document.createElement('div');
          empty.className = 'side-empty';
          empty.textContent = 'No starred words yet';
          starredListEl.appendChild(empty);
          return;
        }
        entries.forEach((entry) => starredListEl.appendChild(makeSideItem(entry)));
      }

      // ---------- Drag-to-reorder (pointer events on the grip) ----------
      let drag = null; // { fromIndex, toIndex }
      starredListEl.addEventListener('pointerdown', (e) => {
        const grip = e.target.closest('.grip');
        if (!grip) return;
        const row = grip.closest('.side-item');
        const rows = [...starredListEl.querySelectorAll('.side-item')];
        drag = { fromIndex: rows.indexOf(row), toIndex: null };
        row.classList.add('dragging');
        grip.setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      starredListEl.addEventListener('pointermove', (e) => {
        if (!drag) return;
        const rows = [...starredListEl.querySelectorAll('.side-item')];
        let to = rows.length;
        for (let i = 0; i < rows.length; i++) {
          const rect = rows[i].getBoundingClientRect();
          if (e.clientY < rect.top + rect.height / 2) {
            to = i;
            break;
          }
        }
        starredListEl.querySelector('.drop-indicator')?.remove();
        if (to === drag.fromIndex || to === drag.fromIndex + 1) {
          drag.toIndex = null;
          return;
        }
        drag.toIndex = to;
        const indicator = document.createElement('div');
        indicator.className = 'drop-indicator';
        if (to >= rows.length) starredListEl.appendChild(indicator);
        else starredListEl.insertBefore(indicator, rows[to]);
      });
      function endDrag() {
        if (!drag) return;
        starredListEl.querySelector('.drop-indicator')?.remove();
        if (drag.toIndex != null) {
          const ordered = starredEntries();
          const moved = ordered.splice(drag.fromIndex, 1)[0];
          const insertAt = drag.toIndex > drag.fromIndex ? drag.toIndex - 1 : drag.toIndex;
          ordered.splice(Math.min(insertAt, ordered.length), 0, moved);
          ordered.forEach((entry, i) => (entry.order = i));
          saveStars();
        }
        drag = null;
        renderSidebar();
      }
      starredListEl.addEventListener('pointerup', endDrag);
      starredListEl.addEventListener('pointercancel', endDrag);

      // ---------- Panel (sidebar / mobile drawer) ----------
      let drawerOpen = false;
      function syncPanel() {
        if (isDesktop()) {
          sidebarEl.classList.toggle('collapsed', !prefs.sidebar);
          sidebarEl.classList.remove('open');
          backdropEl.classList.remove('open');
        } else {
          sidebarEl.classList.remove('collapsed');
          sidebarEl.classList.toggle('open', drawerOpen);
          backdropEl.classList.toggle('open', drawerOpen);
        }
      }
      function togglePanel() {
        if (isDesktop()) {
          prefs.sidebar = !prefs.sidebar;
          savePrefs();
        } else {
          drawerOpen = !drawerOpen;
        }
        syncPanel();
      }
      function closeDrawerOnMobile() {
        if (!isDesktop() && drawerOpen) {
          drawerOpen = false;
          syncPanel();
        }
      }
      panelBtn.addEventListener('click', togglePanel);
      favBtn.addEventListener('click', toggleStar);
      backdropEl.addEventListener('click', closeDrawerOnMobile);
      window.matchMedia('(min-width: 860px)').addEventListener('change', syncPanel);

      renderSidebar();
      updateFavButton();
      syncPanel();

      // ---------- Init ----------
      const initial = Common.parseQueryItems();
      if (initial.length) {
        const at = initial[0].lastIndexOf('@');
        if (at > 0) lookup(initial[0].slice(0, at), initial[0].slice(at + 1), { replace: true });
        else lookup(initial[0], 'en', { replace: true });
      } else {
        renderStatus('search a word, or press n for a random one');
      }
      // Warm the buffer so the first random word is ready on demand.
      prefillRandom();
    </script>
  </body>
</html>
