<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fonts</title>
    <link rel="icon" id="favicon" />
    <link rel="stylesheet" href="/common.css" />
    <link rel="stylesheet" href="/fonts/explorer.css" />
    <script src="/common.js"></script>
  </head>
  <body>
    <header id="controls">
      <h1><a href="/">Ruvan</a> / fonts</h1>
      <input id="sample-input" type="text" autocomplete="off" spellcheck="false" placeholder="type anything…" />
      <nav id="filters">
        <span class="group" id="cat-buttons">
          <button type="button" data-cat="all" class="active">all</button>
        </span>
        <span class="sep">|</span>
        <span class="group" id="sort-buttons">
          <button type="button" data-sort="new" class="active">newest</button>
          <span class="dot">·</span>
          <button type="button" data-sort="abc">abc</button>
        </span>
        <span class="sep">|</span>
        <span id="count"></span>
      </nav>
    </header>
    <main id="list"></main>
    <div id="sentinel"></div>
    <script>
      Common.initDarkMode();
      Common.initSitemapShortcut();
      Common.paintFavicon({ glyph: '🔤', fontSize: 48, transparent: true });
      Promise.all([Common.loadScript('/fonts.js'), Common.loadScript('/fonts-meta.js')]).then(
        () => Common.loadScript('/fonts/explorer.js')
      );
    </script>
  </body>
</html>
