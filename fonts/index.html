<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>fonts</title>
    <link rel="icon" id="favicon" />
    <link rel="stylesheet" href="/common.css" />
    <!-- The ?v= values are dev-only placeholders: the deploy workflow rewrites
         them to content hashes (scripts/rewrite-asset-versions.js), so fresh
         HTML can't pair with stale cached assets (Pages caches everything for
         10 minutes, and mixed versions break the controls). -->
    <link rel="stylesheet" href="/fonts/explorer.css?v=dev" />
    <script src="/common.js"></script>
  </head>
  <body>
    <header id="controls">
      <nav id="filters">
        <span class="group expander" id="sample">
          <button
            type="button"
            id="sample-toggle"
            title="sample text"
            aria-label="sample text"
            aria-expanded="false"
            aria-controls="sample-input"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M5 2.5c1.5 0 3 .5 3 2v7c0 1.5-1.5 2-3 2M11 2.5c-1.5 0-3 .5-3 2v7c0 1.5 1.5 2 3 2M6.3 8h3.4" />
            </svg>
          </button>
          <input
            id="sample-input"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="type anything…"
            aria-label="sample text"
            tabindex="-1"
          />
        </span>
        <span class="sep">|</span>
        <span class="group expander" id="search">
          <button
            type="button"
            id="search-toggle"
            title="search font names"
            aria-label="search font names"
            aria-expanded="false"
            aria-controls="search-input"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <circle cx="6.5" cy="6.5" r="4.5" />
              <path d="M10 10l4.5 4.5" />
            </svg>
          </button>
          <input
            id="search-input"
            type="text"
            autocomplete="off"
            spellcheck="false"
            enterkeyhint="search"
            placeholder="font name"
            aria-label="search font names"
            tabindex="-1"
          />
        </span>
        <span class="sep">|</span>
        <span class="group" id="sort">
          <select id="sort-select" aria-label="sort order">
            <option value="random">random</option>
            <option value="new">newest</option>
            <option value="abc">abc</option>
          </select>
          <span class="caret" aria-hidden="true">▾</span>
        </span>
        <span class="sep">|</span>
        <span class="group" id="size-buttons">
          <button type="button" data-size="-4" title="smaller samples">a−</button>
          <span class="dot">·</span>
          <button type="button" data-size="4" title="larger samples">a+</button>
        </span>
        <span class="sep">|</span>
        <button type="button" id="minimal-toggle">minimal</button>
        <span class="sep">|</span>
        <span id="count"></span>
        <span class="sep">|</span>
        <span class="group" id="cat-buttons">
          <button type="button" data-cat="all" class="active">all</button>
        </span>
      </nav>
    </header>
    <main id="list"></main>
    <div id="sentinel"></div>
    <div id="single" hidden>
      <div id="single-top">
        <div id="single-info" class="info"></div>
        <input
          id="single-input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="type anything…"
        />
        <span class="group" id="single-size-buttons">
          <button type="button" data-size="-4" title="smaller samples">a−</button>
          <span class="dot">·</span>
          <button type="button" data-size="4" title="larger samples">a+</button>
        </span>
        <button type="button" id="single-close" title="close">×</button>
      </div>
      <div id="single-tiles"></div>
    </div>
    <script>
      Common.initDarkMode();
      Common.initSitemapShortcut();
      Common.paintFavicon({ glyph: '🔤', fontSize: 48, transparent: true });
      Promise.all([
        Common.loadScript('/fonts.js'),
        Common.loadScript('/fonts-meta.js'),
        Common.loadScript('/typefree-fonts.js'),
      ]).then(() => Common.loadScript('/fonts/explorer.js?v=dev'));
    </script>
  </body>
</html>
