<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>fonts</title>
    <link rel="icon" id="favicon" />
    <link rel="stylesheet" href="/common.css" />
    <!-- The ?v= values are dev-only placeholders: the deploy workflow rewrites
         them to content hashes (scripts/rewrite-asset-versions.js), so fresh
         HTML can't pair with stale cached assets (Pages caches everything for
         10 minutes, and mixed versions break the controls). -->
    <link rel="stylesheet" href="/fonts/explorer.css?v=dev" />
    <script src="/common.js"></script>
  </head>
  <body>
    <header id="controls">
      <nav id="filters">
        <span class="group expander" id="sample">
          <button
            type="button"
            id="sample-toggle"
            title="sample text"
            aria-label="sample text"
            aria-expanded="false"
            aria-controls="sample-input"
          >
            <!-- An outline take on ✍️: the mask hides the pen behind the fist. -->
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <defs>
                <mask id="sample-hand-mask">
                  <rect width="24" height="24" fill="#fff" />
                  <path fill="#000" stroke="#000" stroke-width="2.6" d="M23 8.5C19.5 6.8 16 6.8 13.2 8.4L10.6 10.4C9.4 11.4 9.4 13 10.3 14C10.9 16 12.6 17.2 14.6 17.2L18.5 17C20 16.8 21.5 16.2 23 15.6Z" />
                </mask>
              </defs>
              <path mask="url(#sample-hand-mask)" d="M17.6 1.4l3 3L8.4 16.6l-4.3 1.3 1.3-4.3z" />
              <path d="M23 8.5C19.5 6.8 16 6.8 13.2 8.4L10.6 10.4C9.4 11.4 9.4 13 10.3 14C10.9 16 12.6 17.2 14.6 17.2L18.5 17C20 16.8 21.5 16.2 23 15.6" />
              <path d="M10.3 14l3.2-.6M12 16.4l3-.4M13.2 8.4c.9 1.4 2.5 2 4.2 1.6M1.5 22h9" />
            </svg>
          </button>
          <input
            id="sample-input"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="type anything…"
            aria-label="sample text"
            tabindex="-1"
          />
        </span>
        <span class="sep">|</span>
        <span class="group expander" id="search">
          <button
            type="button"
            id="search-toggle"
            title="search font names"
            aria-label="search font names"
            aria-expanded="false"
            aria-controls="search-input"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <circle cx="6.5" cy="6.5" r="4.5" />
              <path d="M10 10l4.5 4.5" />
            </svg>
          </button>
          <input
            id="search-input"
            type="text"
            autocomplete="off"
            spellcheck="false"
            enterkeyhint="search"
            placeholder="font name"
            aria-label="search font names"
            tabindex="-1"
          />
        </span>
        <span class="sep">|</span>
        <span class="group" id="sort-buttons">
          <button type="button" data-sort="random" class="active">random</button>
          <span class="dot">·</span>
          <button type="button" data-sort="new">newest</button>
          <span class="dot">·</span>
          <button type="button" data-sort="abc">abc</button>
        </span>
        <span class="sep">|</span>
        <span class="group" id="size-buttons">
          <button type="button" data-size="-4" title="smaller samples">a−</button>
          <span class="dot">·</span>
          <button type="button" data-size="4" title="larger samples">a+</button>
        </span>
        <span class="sep">|</span>
        <button type="button" id="minimal-toggle">minimal</button>
        <span class="sep">|</span>
        <span id="count"></span>
        <span class="sep">|</span>
        <span class="group" id="cat-buttons">
          <button type="button" data-cat="all" class="active">all</button>
        </span>
      </nav>
    </header>
    <main id="list"></main>
    <div id="sentinel"></div>
    <div id="single" hidden>
      <div id="single-top">
        <div id="single-info" class="info"></div>
        <input
          id="single-input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="type anything…"
        />
        <button type="button" id="single-close" title="close">×</button>
      </div>
      <div id="single-tiles"></div>
    </div>
    <script>
      Common.initDarkMode();
      Common.initSitemapShortcut();
      Common.paintFavicon({ glyph: '🔤', fontSize: 48, transparent: true });
      Promise.all([Common.loadScript('/fonts.js'), Common.loadScript('/fonts-meta.js')]).then(
        () => Common.loadScript('/fonts/explorer.js?v=dev')
      );
    </script>
  </body>
</html>
