<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Ruvan / snake</title>
    <link rel="icon" id="favicon" />
    <link rel="stylesheet" href="/common.css" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #wrap {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
      }
      #board {
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        /* Rows are spaced by a hair more than 1ch (the monospace character
           advance) so the vertical cell spacing stays close to the horizontal
           column width while giving rows a little breathing room. */
        line-height: 1.15ch;
        white-space: pre;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      /* Snake/pellet glyphs are drawn from many scripts (incl. double-width CJK
         and emoji); pinning each to a one-character box keeps the grid columns
         aligned and lets wide glyphs overflow their cell instead of shifting the
         row. */
      #board .cell {
        display: inline-block;
        width: 1ch;
        height: 1.15ch;
        line-height: 1.15ch;
        text-align: center;
        vertical-align: top;
        overflow: visible;
      }
      #board .head {
        color: #2e9e5b;
      }
      #board .pellet {
        color: #d6409f;
      }
      body.dark #board .head {
        color: #54c98a;
      }
      body.dark #board .pellet {
        color: #ff8dd1;
      }
      @media (prefers-color-scheme: dark) {
        body:not(.light) #board .head {
          color: #54c98a;
        }
        body:not(.light) #board .pellet {
          color: #ff8dd1;
        }
      }
      /* Outward ring drawn over a freshly spawned pellet: a quick expanding,
         fading circle tinted the same pink as the pellet itself. It is a
         throwaway element positioned in viewport coordinates over the pellet's
         cell and removed once its animation ends. */
      .pellet-pulse {
        position: fixed;
        border-radius: 50%;
        border: 2px solid #d6409f;
        pointer-events: none;
        z-index: 4;
        opacity: 0.9;
        transform: translate(-50%, -50%) scale(0.3);
        animation: pellet-pulse 0.45s ease-out forwards;
      }
      body.dark .pellet-pulse {
        border-color: #ff8dd1;
      }
      @media (prefers-color-scheme: dark) {
        body:not(.light) .pellet-pulse {
          border-color: #ff8dd1;
        }
      }
      @keyframes pellet-pulse {
        from {
          opacity: 0.9;
          transform: translate(-50%, -50%) scale(0.3);
        }
        to {
          opacity: 0;
          transform: translate(-50%, -50%) scale(1);
        }
      }
      #score {
        position: fixed;
        top: 12px;
        left: 0;
        right: 0;
        text-align: center;
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 12px;
        color: #888;
        user-select: none;
        pointer-events: none;
        z-index: 3;
      }
      #gh-auth {
        position: fixed;
        top: 10px;
        right: 12px;
        width: 22px;
        height: 22px;
        padding: 0;
        border: none;
        background: none;
        cursor: pointer;
        color: #999;
        opacity: 0.65;
        transition:
          opacity 0.15s,
          color 0.15s;
        z-index: 6;
      }
      #gh-auth:hover,
      #gh-auth.authed {
        opacity: 1;
        color: #000;
      }
      #gh-auth svg {
        width: 100%;
        height: 100%;
        display: block;
        fill: currentColor;
      }
      body.dark #gh-auth:hover,
      body.dark #gh-auth.authed {
        color: #fff;
      }
      @media (prefers-color-scheme: dark) {
        body:not(.light) #gh-auth:hover,
        body:not(.light) #gh-auth.authed {
          color: #fff;
        }
      }
      /* Leaderboard rendered inside the ready/game-over overlay. */
      .lb {
        margin-top: 12px;
        font-size: 12px;
        color: #888;
        min-width: 168px;
      }
      .lb-title {
        text-align: center;
        color: #aaa;
        margin-bottom: 4px;
        letter-spacing: 0.04em;
      }
      .lb ol {
        margin: 0;
        padding: 0;
        list-style: none;
        text-align: left;
      }
      .lb li {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        line-height: 1.5;
      }
      .lb-rank {
        color: #999;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .lb-score {
        color: #555;
      }
      body.dark .lb-score {
        color: #ccc;
      }
      .lb-empty,
      .lb-best,
      .lb-signin {
        text-align: center;
        color: #aaa;
        margin-top: 6px;
      }
      /* A run that just landed on the shared board blinks in a bright gold so
         the player can spot their fresh entry among the existing scores. */
      @keyframes lb-blink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0.2;
        }
      }
      .lb li.lb-new {
        animation: lb-blink 0.8s steps(1, end) infinite;
      }
      .lb li.lb-new .lb-rank,
      .lb li.lb-new .lb-score {
        color: #ffcc00;
        font-weight: 700;
        text-shadow: 0 0 6px rgba(255, 204, 0, 0.85);
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 16px;
        color: #555;
        pointer-events: none;
        z-index: 4;
        transition: opacity 0.2s ease;
      }
      body.dark #overlay {
        color: #bbb;
      }
      #overlay.hidden {
        opacity: 0;
      }
      #overlay .ov-inner {
        display: inline-block;
        padding: 10px 16px;
        border-radius: 8px;
        background: #ffffff;
        line-height: 1.5;
      }
      body.dark #overlay .ov-inner {
        background: #111111;
      }
      #overlay small {
        color: #888;
        font-size: 12px;
      }
      /* The game-over sub-line swaps between a countdown ("play again in Ns")
         and the longer "tap / space / r to play again" prompt. A hidden sizer
         holding the widest variant reserves the space so the overlay — and the
         leaderboard inside it — keeps a constant width across that swap. */
      #ov-sub {
        display: inline-block;
        position: relative;
        white-space: nowrap;
      }
      #ov-sub .ov-sub-size {
        visibility: hidden;
      }
      #ov-sub .ov-sub-text {
        position: absolute;
        left: 0;
        right: 0;
        white-space: nowrap;
      }
      #hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 12px;
        text-align: center;
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 12px;
        color: #888;
        opacity: 1;
        transition: opacity 0.4s ease;
        user-select: none;
        z-index: 5;
      }
      #hint.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #hint .hint-btn {
        cursor: pointer;
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 2px;
      }
      #hint .hint-btn:hover {
        color: #333;
      }
      body.dark #hint .hint-btn:hover {
        color: #ccc;
      }
      #hint-zone {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 60px;
        z-index: 4;
      }
    </style>
    <script src="/common.js"></script>
  </head>
  <body>
    <div id="wrap"><pre id="board"></pre></div>
    <div id="score"></div>
    <button id="gh-auth" type="button" aria-label="Sign in with GitHub" title="Sign in with GitHub">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path
          fill-rule="evenodd"
          d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
        />
      </svg>
    </button>
    <div id="overlay" class="hidden"></div>
    <div id="hint">
      <span style="white-space: nowrap"
        ><span class="hint-btn" id="hb-arrows">↑↓←→</span> / swipe move</span
      >
      &nbsp;·&nbsp;
      <span style="white-space: nowrap"
        ><span class="hint-btn" id="hb-restart">r restart</span></span
      >
      &nbsp;·&nbsp;
      <span style="white-space: nowrap"><span class="hint-btn" id="hb-scores">h scores</span></span>
      &nbsp;·&nbsp;
      <span style="white-space: nowrap"
        ><span class="hint-btn" id="hb-smaller">−</span>/<span class="hint-btn" id="hb-bigger"
          >+</span
        >
        size</span
      >
      &nbsp;·&nbsp;
      <span style="white-space: nowrap"
        ><span class="hint-btn" id="hb-dark">1 <span class="hb-dark-label">dark</span></span></span
      >
      &nbsp;·&nbsp;
      <span style="white-space: nowrap"
        ><span class="hint-btn" id="hb-sitemap">s sitemap</span></span
      >
    </div>
    <div id="hint-zone"></div>
    <script>
      Common.setFaviconHref(
        'data:image/svg+xml,' +
          encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><text x="8" y="13" font-size="14" text-anchor="middle">🐍</text></svg>'
          )
      );
      Common.initDarkMode();

      const wrap = document.getElementById('wrap');
      const board = document.getElementById('board');
      const overlay = document.getElementById('overlay');
      const scoreEl = document.getElementById('score');

      // The snake's body is a list of glyphs: glyph i (counting from the head)
      // is painted at body cell i, so the body reads head→tail. Eating a pellet
      // appends its glyph and grows the snake by one, so the body spells out
      // everything it has swallowed. Glyphs are kept as separate array entries
      // (rather than one joined string) so a multi-code-unit emoji stays intact
      // as a single body cell instead of being split across surrogate halves.
      const INITIAL = 'snake';
      // Pellet glyphs come from the same spread of writing systems (plus emoji)
      // as the shooter and gravity pages, so each pellet — and the body segment
      // grown from it — can be a letter from almost any script. Ranges are
      // inclusive code-point spans densely filled with standalone, renderable
      // base characters (combining-mark blocks avoided).
      const CHAR_RANGES = [
        [0x0041, 0x005a],
        [0x0061, 0x007a],
        [0x0030, 0x0039], // Latin + digits
        [0x00c0, 0x00ff],
        [0x0100, 0x017f], // accented Latin
        [0x0391, 0x03a9],
        [0x03b1, 0x03c9], // Greek
        [0x0410, 0x044f], // Cyrillic
        [0x0531, 0x0556],
        [0x0561, 0x0586], // Armenian
        [0x05d0, 0x05ea], // Hebrew
        [0x0621, 0x064a], // Arabic
        [0x0905, 0x0939], // Devanagari
        [0x0e01, 0x0e2e], // Thai
        [0x10d0, 0x10fa], // Georgian
        [0x3041, 0x3096],
        [0x30a1, 0x30fa], // Hiragana + Katakana
        [0x4e00, 0x9fa0], // CJK
        [0xac00, 0xd7a3], // Hangul
        [0x2190, 0x21ff],
        [0x2200, 0x22ff], // arrows + math symbols
      ];
      function pickFromRanges(ranges) {
        const [lo, hi] = ranges[Math.floor(Math.random() * ranges.length)];
        return String.fromCodePoint(lo + Math.floor(Math.random() * (hi - lo + 1)));
      }
      function pickEmoji() {
        // window.EMOJIS loads async from /emojis.js; before it lands we fall back
        // to a script letter so early pellets aren't blank.
        if (!window.EMOJIS) return pickFromRanges(CHAR_RANGES);
        return window.EMOJIS[Math.floor(Math.random() * window.EMOJIS.length)];
      }
      // Roughly one pellet in five is an emoji, the rest script letters, matching
      // randChar() on the shooter and gravity pages.
      function randPellet() {
        return Math.random() < 0.2 ? pickEmoji() : pickFromRanges(CHAR_RANGES);
      }
      const DIRS = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 },
      };

      let fontSize = 0;
      let charW = 0,
        charH = 0,
        cols = 0,
        rows = 0;
      let body = [],
        glyphs = [],
        dir = DIRS.right,
        queue = [],
        eaten = 0;
      let pellet = null;
      let state = 'ready'; // ready | playing | over
      let timer = null;

      function setup() {
        const vw = window.innerWidth,
          vh = window.innerHeight;
        if (!fontSize) fontSize = Math.max(14, Math.min(28, Math.round(Math.min(vw, vh) / 22)));
        board.style.fontSize = fontSize + 'px';
        const probe = document.createElement('span');
        probe.style.cssText =
          'position:absolute;visibility:hidden;white-space:pre;line-height:1;font-family:inherit;font-size:inherit';
        probe.textContent = 'M'.repeat(100);
        board.appendChild(probe);
        charW = probe.getBoundingClientRect().width / 100;
        board.removeChild(probe);
        // Rows are spaced a hair more than the character width (via
        // line-height: 1.15ch) so the vertical step stays close to the
        // horizontal one with a little extra room; keep charH in sync.
        charH = charW * 1.15;
        cols = Math.max(12, Math.floor(vw / charW));
        rows = Math.max(12, Math.floor(vh / charH));
      }

      function key(c) {
        return c.y * cols + c.x;
      }

      // Flash a quick expanding ring over a cell, tinted to match the pellet.
      // The element lives in viewport coordinates (the board cell's pixel center)
      // and removes itself when the animation finishes.
      function pulseAt(cell) {
        if (!charW) return;
        const rect = board.getBoundingClientRect();
        const el = document.createElement('div');
        el.className = 'pellet-pulse';
        const size = Math.max(24, charW * 6);
        el.style.width = size + 'px';
        el.style.height = size + 'px';
        el.style.left = rect.left + (cell.x + 0.5) * charW + 'px';
        el.style.top = rect.top + (cell.y + 0.5) * charH + 'px';
        el.addEventListener('animationend', () => el.remove());
        document.body.appendChild(el);
      }

      function spawnPellet() {
        const occupied = new Set(body.map(key));
        if (occupied.size >= cols * rows) {
          pellet = null;
          return;
        }
        let x, y;
        do {
          x = Math.floor(Math.random() * cols);
          y = Math.floor(Math.random() * rows);
        } while (occupied.has(y * cols + x));
        pellet = { x, y, ch: randPellet() };
        pulseAt(pellet);
      }

      function reset() {
        clearTimeout(timer);
        clearInterval(overTimer);
        overTimer = null;
        restartLockUntil = 0;
        highlightIndex = -1;
        lastWasBest = false;
        scoresOpen = false;
        const cx = Math.floor(cols / 2),
          cy = Math.floor(rows / 2);
        body = [];
        for (let i = 0; i < INITIAL.length; i++) body.push({ x: cx - i, y: cy });
        glyphs = [...INITIAL];
        dir = DIRS.right;
        queue = [];
        eaten = 0;
        spawnPellet();
        state = 'ready';
        updateScore();
        render();
        showOverlay('ready');
      }

      function schedule() {
        clearTimeout(timer);
        timer = setTimeout(step, Math.max(70, 130 - eaten * 2));
      }

      function startPlaying(d) {
        dir = d;
        queue = [];
        state = 'playing';
        hideOverlay();
        schedule();
      }

      // Reject reversals and duplicates against the latest pending direction so a
      // quick two-tap (e.g. up then left) both register without folding back on
      // the neck within one step.
      function turn(name) {
        const nd = DIRS[name];
        const last = queue.length ? queue[queue.length - 1] : dir;
        if (nd.x === -last.x && nd.y === -last.y) return;
        if (nd.x === last.x && nd.y === last.y) return;
        queue.push(nd);
      }

      function handleDir(name) {
        if (scoresOpen) {
          closeScores();
          return;
        }
        if (state === 'playing') {
          turn(name);
          return;
        }
        if (state === 'over') {
          if (!canRestart()) return;
          reset();
        }
        const nd = DIRS[name];
        if (nd.x === -dir.x && nd.y === -dir.y) return; // can't start into the body
        startPlaying(nd);
      }

      function handleTap() {
        if (scoresOpen) {
          closeScores();
          return;
        }
        if (state === 'playing') return;
        if (state === 'over') {
          if (!canRestart()) return;
          reset();
        }
        startPlaying(DIRS.right);
      }

      function step() {
        if (queue.length) {
          const nd = queue.shift();
          if (!(nd.x === -dir.x && nd.y === -dir.y)) dir = nd;
        }
        const head = body[0];
        // Walls wrap: stepping off one edge re-enters from the opposite one.
        const nx = (head.x + dir.x + cols) % cols;
        const ny = (head.y + dir.y + rows) % rows;
        const willGrow = pellet && nx === pellet.x && ny === pellet.y;
        // The tail vacates this step unless we're growing, so moving into the
        // current tail cell is allowed.
        const checkLen = willGrow ? body.length : body.length - 1;
        for (let i = 0; i < checkLen; i++) {
          if (body[i].x === nx && body[i].y === ny) return gameOver();
        }
        body.unshift({ x: nx, y: ny });
        if (willGrow) {
          glyphs.push(pellet.ch);
          eaten++;
          updateScore();
          spawnPellet();
        } else {
          body.pop();
        }
        render();
        schedule();
      }

      function gameOver() {
        state = 'over';
        clearTimeout(timer);
        lastWasBest = eaten > getBest();
        if (lastWasBest) setBest(eaten);
        // Hold the board for a few seconds; tick the overlay so the countdown
        // updates and the play-again prompt appears once the lock lifts.
        restartLockUntil = Date.now() + RESTART_LOCK_MS;
        clearInterval(overTimer);
        overTimer = setInterval(() => {
          if (Date.now() >= restartLockUntil) {
            clearInterval(overTimer);
            overTimer = null;
          }
          // Patch only the countdown line so a full overlay rebuild doesn't
          // restart the highlighted row's blink animation each tick.
          const sub = document.getElementById('ov-sub');
          if (sub && state === 'over' && !scoresOpen) sub.innerHTML = overSubHtml();
        }, 250);
        render();
        showOverlay('over');
        postScore(eaten);
      }

      // Restarts are blocked during the post-game-over hold; every other state
      // can start/restart freely.
      function canRestart() {
        return state !== 'over' || Date.now() >= restartLockUntil;
      }

      function esc(ch) {
        return ch === '&' ? '&amp;' : ch === '<' ? '&lt;' : ch === '>' ? '&gt;' : ch;
      }

      function render() {
        const cells = new Array(cols * rows).fill(' ');
        const cls = new Map();
        for (let i = 0; i < body.length; i++) {
          const k = key(body[i]);
          cells[k] = glyphs[i] || '·';
          cls.set(k, i === 0 ? 'cell head' : 'cell');
        }
        if (pellet) {
          const pk = key(pellet);
          cells[pk] = pellet.ch;
          cls.set(pk, 'cell pellet');
        }
        let html = '';
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            const k = y * cols + x;
            const ch = esc(cells[k]);
            const c = cls.get(k);
            html += c ? '<span class="' + c + '">' + ch + '</span>' : ch;
          }
          if (y < rows - 1) html += '\n';
        }
        board.innerHTML = html;
      }

      function updateScore() {
        scoreEl.textContent = 'score ' + eaten;
      }

      // --- leaderboard ---
      // High scores live in snake/scores.json. Everyone reads the published
      // file (no auth); a signed-in player whose run cracks the top MAX_SCORES
      // writes it back via the GitHub Contents API, which is published by the
      // existing deploy workflow. Each visitor also keeps a private best in
      // localStorage for instant feedback and so anonymous players see a board.
      const REPO = 'rjayasin/rjayasin.github.io';
      const SCORES_PATH = 'snake/scores.json';
      const MAX_SCORES = 10;
      const BEST_KEY = 'snake_best';
      let leaderboard = [];
      let ghLogin = null;
      let posting = false;
      let lastWasBest = false;
      // Index into `leaderboard` of the run that just cracked the shared board,
      // so its row can be drawn bright + blinking; -1 means nothing to flag.
      let highlightIndex = -1;
      // After a game over the board is held for at least RESTART_LOCK_MS so the
      // scores stay readable; restart inputs are ignored until it elapses.
      const RESTART_LOCK_MS = 5000;
      let restartLockUntil = 0;
      let overTimer = null;
      // The high-scores overlay can be toggled on top of any game state; opening
      // it mid-play pauses the timer and closing resumes.
      let scoresOpen = false;

      const ghAuth = Common.GH.initAuthButton({
        buttonEl: document.getElementById('gh-auth'),
        signedInTitle: 'Signed in to GitHub (click to sign out)',
        signedOutTitle: 'Sign in with GitHub to post high scores',
        onChange: refreshOverlay,
      });

      function getBest() {
        return parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0;
      }
      function setBest(n) {
        localStorage.setItem(BEST_KEY, String(n));
      }

      // GitHub returns/expects file contents as base64; wrap btoa/atob so
      // non-ASCII names (GitHub logins are ASCII, but be safe) survive.
      function b64encode(str) {
        return btoa(unescape(encodeURIComponent(str)));
      }
      function b64decode(b64) {
        return decodeURIComponent(escape(atob(b64.replace(/\s/g, ''))));
      }

      function sortScores(list) {
        return list
          .filter((s) => s && typeof s.score === 'number')
          .sort((a, b) => b.score - a.score)
          .slice(0, MAX_SCORES);
      }

      function qualifies(score) {
        if (score <= 0) return false;
        if (leaderboard.length < MAX_SCORES) return true;
        return score > leaderboard[leaderboard.length - 1].score;
      }

      async function loadLeaderboard() {
        try {
          const r = await fetch('scores.json?t=' + Date.now(), { cache: 'no-store' });
          if (r.ok) {
            const data = await r.json();
            if (Array.isArray(data)) leaderboard = sortScores(data);
          }
        } catch (e) {
          /* keep whatever we have */
        }
        refreshOverlay();
      }

      async function whoami(token) {
        if (ghLogin) return ghLogin;
        const r = await fetch('https://api.github.com/user', {
          headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${token}` },
        });
        if (!r.ok) throw new Error('whoami failed');
        ghLogin = (await r.json()).login;
        return ghLogin;
      }

      async function postScore(score) {
        if (posting || !Common.GH.isAuthed() || !qualifies(score)) return;
        posting = true;
        const token = Common.GH.getToken();
        const headers = { Accept: 'application/vnd.github+json', Authorization: `Bearer ${token}` };
        const url = `https://api.github.com/repos/${REPO}/contents/${SCORES_PATH}`;
        try {
          const name = await whoami(token);
          // Re-read the file for its sha + latest contents so we merge with,
          // rather than clobber, any score posted elsewhere since page load.
          const getR = await fetch(url, { headers });
          if (getR.status === 401) {
            Common.GH.clearToken();
            ghAuth.refresh();
            return;
          }
          let sha;
          let current = [];
          if (getR.ok) {
            const f = await getR.json();
            sha = f.sha;
            try {
              const parsed = JSON.parse(b64decode(f.content));
              if (Array.isArray(parsed)) current = parsed;
            } catch (e) {
              /* malformed file — start fresh from our entry */
            }
          }
          const entry = { name, score, date: new Date().toISOString().slice(0, 10) };
          const next = sortScores(current.concat([entry]));
          // Only commit when this run actually lands in the top MAX_SCORES of the
          // freshly read board; identity check so a tie with an existing score
          // still resolves to our own entry. Either way, reflect the latest board.
          if (!next.includes(entry)) {
            leaderboard = sortScores(current);
            return;
          }
          leaderboard = next;
          highlightIndex = next.indexOf(entry);
          const putR = await fetch(url, {
            method: 'PUT',
            headers,
            body: JSON.stringify({
              message: `snake: high score ${score} by ${name}`,
              content: b64encode(JSON.stringify(next, null, 2) + '\n'),
              sha,
            }),
          });
          if (putR.ok) leaderboard = next;
        } catch (e) {
          /* network/permission error: keep the local score, skip publishing */
        } finally {
          posting = false;
          refreshOverlay();
        }
      }

      function lbEsc(n) {
        return String(n == null ? '?' : n)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function leaderboardHtml() {
        let html = '<div class="lb"><div class="lb-title">high scores</div>';
        if (leaderboard.length) {
          html += '<ol>';
          leaderboard.forEach((s, i) => {
            html +=
              (i === highlightIndex ? '<li class="lb-new">' : '<li>') +
              '<span class="lb-rank">' +
              (i + 1) +
              '. ' +
              lbEsc(s.name) +
              '</span><span class="lb-score">' +
              s.score +
              '</span></li>';
          });
          html += '</ol>';
        } else {
          html += '<div class="lb-empty">no scores yet</div>';
        }
        const best = getBest();
        if (best > 0) html += '<div class="lb-best">your best ' + best + '</div>';
        if (!Common.GH.isAuthed())
          html += '<div class="lb-signin">sign in (top right) to post</div>';
        return html + '</div>';
      }

      // Sub-line under "game over": a live countdown while the board is held,
      // then the play-again prompt once the restart lock lifts.
      const playAgainText = 'tap / space / r to play again';
      function overSubHtml() {
        const remain = Math.ceil((restartLockUntil - Date.now()) / 1000);
        const best = lastWasBest && eaten > 0 ? 'new personal best! · ' : '';
        const msg = remain > 0 ? best + 'play again in ' + remain + 's' : best + playAgainText;
        // A hidden sizer carries the widest variant (the play-again prompt) while
        // the visible text is overlaid on top, so the box width never changes as
        // the countdown gives way to the prompt.
        return (
          '<span class="ov-sub-size">' +
          best +
          playAgainText +
          '</span><span class="ov-sub-text">' +
          msg +
          '</span>'
        );
      }

      function showOverlay(kind) {
        let head;
        if (kind === 'over') {
          head = 'game over · ate ' + eaten + '<br><small id="ov-sub">' + overSubHtml() + '</small>';
        } else {
          head = '↑ ↓ ← →&nbsp;&nbsp;or swipe to start';
        }
        overlay.innerHTML = '<span class="ov-inner">' + head + leaderboardHtml() + '</span>';
        overlay.classList.remove('hidden');
      }
      function hideOverlay() {
        overlay.classList.add('hidden');
      }

      // Repaint the overlay for the current context: the scores view if open,
      // otherwise the ready/game-over screen (nothing while actively playing).
      function refreshOverlay() {
        if (scoresOpen) showScores();
        else if (state !== 'playing') showOverlay(state === 'over' ? 'over' : 'ready');
      }

      function showScores() {
        overlay.innerHTML =
          '<span class="ov-inner">' + leaderboardHtml() + '<small>tap / h to close</small></span>';
        overlay.classList.remove('hidden');
      }

      function openScores() {
        if (scoresOpen) return;
        scoresOpen = true;
        clearTimeout(timer); // pause a running game (harmless when idle)
        showScores();
        loadLeaderboard(); // pull the latest, then refreshOverlay repaints
      }

      function closeScores() {
        if (!scoresOpen) return;
        scoresOpen = false;
        if (state === 'playing') {
          hideOverlay();
          schedule(); // resume the paused game
        } else {
          showOverlay(state === 'over' ? 'over' : 'ready');
        }
      }

      function toggleScores() {
        if (scoresOpen) closeScores();
        else openScores();
      }

      function setFont(delta) {
        const next = Math.max(8, Math.min(48, fontSize + delta));
        if (next === fontSize) return;
        fontSize = next;
        setup();
        reset();
      }

      // --- input ---
      const KEYMAP = {
        ArrowUp: 'up',
        ArrowDown: 'down',
        ArrowLeft: 'left',
        ArrowRight: 'right',
      };
      document.addEventListener('keydown', (e) => {
        if (KEYMAP[e.key]) {
          e.preventDefault();
          handleDir(KEYMAP[e.key]);
        } else if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          handleTap();
        } else if ((e.key === 'r' || e.key === 'R') && !e.repeat) {
          if (canRestart()) reset();
          showHint();
        } else if ((e.key === 'h' || e.key === 'H') && !e.repeat) {
          toggleScores();
          showHint();
        } else if (e.key === '+' || e.key === '=') {
          setFont(2);
          showHint();
        } else if (e.key === '-' || e.key === '_') {
          setFont(-2);
          showHint();
        }
      });

      let tsx = 0,
        tsy = 0,
        tmoved = false;
      const SWIPE = 22;
      wrap.addEventListener(
        'touchstart',
        (e) => {
          const t = e.touches[0];
          tsx = t.clientX;
          tsy = t.clientY;
          tmoved = false;
        },
        { passive: true }
      );
      wrap.addEventListener(
        'touchmove',
        (e) => {
          e.preventDefault();
          const t = e.touches[0];
          const dx = t.clientX - tsx,
            dy = t.clientY - tsy;
          if (Math.abs(dx) < SWIPE && Math.abs(dy) < SWIPE) return;
          tmoved = true;
          if (Math.abs(dx) > Math.abs(dy)) handleDir(dx > 0 ? 'right' : 'left');
          else handleDir(dy > 0 ? 'down' : 'up');
          tsx = t.clientX;
          tsy = t.clientY;
        },
        { passive: false }
      );
      wrap.addEventListener('touchend', () => {
        if (!tmoved) handleTap();
      });
      wrap.addEventListener('click', (e) => {
        if (e.target.closest('#hint')) return;
        handleTap();
      });

      let resizeTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          setup();
          reset();
        }, 150);
      });

      const { show: showHint } = Common.initHintBar({
        hintEl: document.getElementById('hint'),
        hintZoneEl: document.getElementById('hint-zone'),
      });

      document.getElementById('hb-arrows').addEventListener('click', () => {
        handleTap();
        showHint();
      });
      document.getElementById('hb-restart').addEventListener('click', () => {
        if (canRestart()) reset();
        showHint();
      });
      document.getElementById('hb-scores').addEventListener('click', () => {
        toggleScores();
        showHint();
      });
      document.getElementById('hb-bigger').addEventListener('click', () => {
        setFont(2);
        showHint();
      });
      document.getElementById('hb-smaller').addEventListener('click', () => {
        setFont(-2);
        showHint();
      });
      document.getElementById('hb-dark').addEventListener('click', () => {
        Common.toggleDark();
        showHint();
      });
      document.getElementById('hb-sitemap').addEventListener('click', Common.openSitemap);
      Common.initSitemapShortcut();

      Common.ensureEmojis();
      setup();
      reset();

      // Finish any OAuth redirect (storing the token), sync the button, then
      // load the published high scores into the overlay.
      Common.GH.handleRedirect().then((signedIn) => {
        if (signedIn) ghAuth.refresh();
        loadLeaderboard();
      });
    </script>
  </body>
</html>
