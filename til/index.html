<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruvan / til</title>
    <link rel="icon" id="favicon" />
    <link rel="stylesheet" href="/common.css" />
    <style>
      body {
        /* Greys and hairlines are named once here so the two dark-mode blocks
           at the bottom only restate the handful that actually change. */
        --muted: #888;
        --rule: #e9e9e9;
        --faint: #cfcfcf;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        line-height: 1.6;
        padding: 48px 32px;
        max-width: 720px;
      }
      a,
      h1 {
        transition:
          background-color 0.2s ease,
          color 0.2s ease,
          border-color 0.2s ease;
      }
      header {
        margin-bottom: 15px;
      }
      header a {
        color: #000;
        text-decoration: none;
      }
      header a:hover {
        text-decoration: underline;
      }
      h1 {
        font-size: 15px;
        font-weight: normal;
        letter-spacing: 0.05em;
      }
      .subtitle {
        color: var(--muted);
        margin-top: 4px;
      }
      #list-view ul {
        list-style: none;
        margin-top: 26px;
        border-top: 1px solid var(--rule);
      }
      #filter-line {
        color: var(--muted);
        margin-top: 26px;
      }
      #filter-line + ul {
        margin-top: 8px;
      }
      /* Rows get room to breathe and a hairline each, so a title that wraps
         onto a second line still reads as one entry rather than running into
         the next one. */
      #list-view li {
        padding: 10px 0;
        border-bottom: 1px solid var(--rule);
      }
      /* One block per row, floats contained, with the line height pinned in px
         so the floated date shares a line box with the title text. */
      #list-view .entry {
        display: flow-root;
        line-height: 20px;
      }
      /* Tags sit on their own line under the title, dotted apart so a long
         run of them reads as separate links instead of one grey phrase. */
      #list-view .tags {
        display: block;
        margin-top: 2px;
        font-size: 13px;
        line-height: 1.35;
      }
      #list-view .tags .sep {
        color: var(--faint);
        margin: 0 6px;
        user-select: none;
      }
      a.tag {
        color: var(--muted);
        text-decoration: none;
      }
      a.tag:hover {
        text-decoration: underline;
      }
      /* The date floats to the right of whichever line of the title it lands
         on -- the only line when the title fits, the last one when it wraps --
         so it never sits alone above or below the entry it dates. On wrapped
         entries alignDates() then pulls it in to the title's own right edge
         (see there). Tabular figures keep the column from wobbling. */
      #list-view .when {
        float: right;
        margin-left: 20px;
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      #list-view a:not(.tag) {
        color: #000;
        text-decoration: none;
      }
      #list-view a:hover {
        text-decoration: underline;
      }
      .meta {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        margin-bottom: 14px;
      }
      .meta a {
        color: var(--muted);
        text-decoration: none;
      }
      .meta a:hover {
        text-decoration: underline;
      }
      #post h1 {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0;
        margin-bottom: 12px;
      }
      #post h2,
      #post h3,
      #post h4 {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0;
        margin: 18px 0 6px;
      }
      #post p {
        margin: 10px 0;
      }
      #post ul,
      #post ol {
        margin: 10px 0;
        padding-left: 22px;
      }
      #post li {
        padding: 1px 0;
      }
      #post a {
        color: #000;
      }
      #post pre,
      #post code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.9em;
      }
      #post pre {
        background: #f5f5f5;
        padding: 10px 12px;
        overflow-x: auto;
        margin: 10px 0;
      }
      #post code {
        background: #f5f5f5;
        padding: 1px 4px;
      }
      #post pre code {
        background: none;
        padding: 0;
      }
      #post blockquote {
        border-left: 2px solid #ccc;
        padding-left: 10px;
        color: #666;
        margin: 10px 0;
      }
      #post hr {
        border: none;
        border-top: 1px solid #ccc;
        margin: 16px 0;
      }
      /* Everything past the `<!-- claude -->` marker is claude's notes rather
         than my own writing, so it gets its own tinted panel, outlined in a
         dash to mark it as an aside. Code blocks are re-tinted a shade darker
         so they still read against it. */
      #post .claude {
        margin: 20px -18px 0;
        padding: 16px 18px 18px;
        background: #f7f7f7;
        border: 1px dashed var(--faint);
        border-radius: 5px;
      }
      #post .claude > :nth-child(2) {
        margin-top: 0;
      }
      #post .claude-label {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      #post .claude-label span {
        display: inline-block;
        padding: 2px 9px;
        border: 1px solid #e2e2e2;
        border-radius: 999px;
        background: #fff;
        color: #8c8c8c;
      }
      #post .claude pre,
      #post .claude code {
        background: #ececec;
      }
      #post .claude pre code {
        background: none;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 640px) {
        body {
          padding: 32px 20px;
        }
      }
      body.dark {
        --rule: #262626;
        --faint: #3a3a3a;
      }
      body.dark header a,
      body.dark #list-view a:not(.tag),
      body.dark #post a {
        color: #fff;
      }
      body.dark #post pre,
      body.dark #post code {
        background: #1d1d1d;
      }
      body.dark #post blockquote {
        border-color: #444;
        color: #aaa;
      }
      body.dark #post hr {
        border-top-color: #444;
      }
      body.dark #post .claude {
        background: #181818;
      }
      body.dark #post .claude-label span {
        background: #111;
        border-color: #303030;
        color: #8a8a8a;
      }
      body.dark #post .claude pre,
      body.dark #post .claude code {
        background: #242424;
      }
      body.dark #post .claude pre code {
        background: none;
      }
      @media (prefers-color-scheme: dark) {
        body:not(.light) {
          --rule: #262626;
          --faint: #3a3a3a;
        }
        body:not(.light) header a,
        body:not(.light) #list-view a:not(.tag),
        body:not(.light) #post a {
          color: #fff;
        }
        body:not(.light) #post pre,
        body:not(.light) #post code {
          background: #1d1d1d;
        }
        body:not(.light) #post blockquote {
          border-color: #444;
          color: #aaa;
        }
        body:not(.light) #post hr {
          border-top-color: #444;
        }
        body:not(.light) #post .claude {
          background: #181818;
        }
        body:not(.light) #post .claude-label span {
          background: #111;
          border-color: #303030;
          color: #8a8a8a;
        }
        body:not(.light) #post .claude pre,
        body:not(.light) #post .claude code {
          background: #242424;
        }
        body:not(.light) #post .claude pre code {
          background: none;
        }
      }
    </style>
    <script src="/common.js"></script>
  </head>
  <body>
    <header>
      <h1><a href="/">Ruvan</a> / <a href="#">til</a></h1>
      <p class="subtitle" id="subtitle">Today I learned</p>
    </header>
    <div id="list-view"></div>
    <div id="post-view" hidden>
      <p class="meta" id="post-meta"></p>
      <article id="post"></article>
    </div>
    <script>
      Common.paintFavicon({ glyph: '💡', fontSize: 48, transparent: true, dy: 5 });
      Common.initDarkMode();
      Common.initSitemapShortcut();

      // Entries are loaded at runtime from tils.json, which the deploy workflow
      // (and `make til`) generate from each til/*.md file's frontmatter. The
      // markdown files are the single source of truth; this list starts empty
      // and is filled in once the fetch below resolves.
      let TILS = [];

      const REPO_BLOB = 'https://github.com/rjayasin/rjayasin.github.io/blob/main/til/';

      const listView = document.getElementById('list-view');
      const postView = document.getElementById('post-view');
      const postMeta = document.getElementById('post-meta');
      const post = document.getElementById('post');

      // --- minimal markdown renderer (headings, fenced code, inline code,
      // links, bold/italic, lists, blockquotes, hr, paragraphs) ---

      function renderInline(text) {
        // Rendered fragments are stashed behind placeholders (a NUL sentinel
        // that never appears in the source text) so later passes -- escaping
        // and emphasis -- leave them untouched, then spliced back in at the end.
        const NUL = '\u0000';
        const holds = [];
        const hold = (html) => NUL + (holds.push(html) - 1) + NUL;
        const emphasize = (s) =>
          s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\*([^*]+)\*/g, '<i>$1</i>');
        // Inline code first, so its contents are shielded from other passes.
        let s = text.replace(/`([^`]+)`/g, (m, code) =>
          hold('<code>' + Common.escHtml(code) + '</code>')
        );
        // Links. Labels may contain the code placeholders above, so link text
        // can be rendered in monospace, e.g. [`duti`](url).
        s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, label, url) => {
          if (!/^(https?:\/\/|\/|#|\.)/.test(url)) return m;
          const ext = /^https?:\/\//.test(url) ? ' target="_blank" rel="noopener"' : '';
          return hold('<a href="' + url + '"' + ext + '>' + Common.escHtml(label) + '</a>');
        });
        s = emphasize(Common.escHtml(s));
        // Restore recursively: a link's HTML may itself embed a code placeholder.
        const restore = (str) =>
          str.replace(new RegExp(NUL + '(\\d+)' + NUL, 'g'), (m, i) => restore(holds[+i]));
        return restore(s);
      }

      function renderMarkdown(src) {
        const lines = src.replace(/\r\n/g, '\n').split('\n');
        const html = [];
        let para = [];
        let list = null;
        let quote = [];
        const flushPara = () => {
          if (para.length) {
            html.push('<p>' + renderInline(para.join(' ')) + '</p>');
            para = [];
          }
        };
        const flushList = () => {
          if (list) {
            html.push(
              '<' +
                list.type +
                '>' +
                list.items.map((it) => '<li>' + renderInline(it) + '</li>').join('') +
                '</' +
                list.type +
                '>'
            );
            list = null;
          }
        };
        const flushQuote = () => {
          if (quote.length) {
            html.push('<blockquote><p>' + renderInline(quote.join(' ')) + '</p></blockquote>');
            quote = [];
          }
        };
        const flushAll = () => {
          flushPara();
          flushList();
          flushQuote();
        };
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          if (/^```/.test(line)) {
            flushAll();
            const buf = [];
            i++;
            while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
            html.push('<pre><code>' + Common.escHtml(buf.join('\n')) + '</code></pre>');
            continue;
          }
          const heading = line.match(/^(#{1,4})\s+(.*)$/);
          if (heading) {
            flushAll();
            const level = heading[1].length;
            html.push('<h' + level + '>' + renderInline(heading[2]) + '</h' + level + '>');
            continue;
          }
          if (/^(---|\*\*\*)\s*$/.test(line)) {
            flushAll();
            html.push('<hr />');
            continue;
          }
          const item = line.match(/^([-*]|\d+\.)\s+(.*)$/);
          if (item) {
            flushPara();
            flushQuote();
            const type = /^\d/.test(item[1]) ? 'ol' : 'ul';
            if (!list || list.type !== type) {
              flushList();
              list = { type, items: [] };
            }
            list.items.push(item[2]);
            continue;
          }
          const quoted = line.match(/^>\s?(.*)$/);
          if (quoted) {
            flushPara();
            flushList();
            quote.push(quoted[1]);
            continue;
          }
          if (/^\s*$/.test(line)) {
            flushAll();
            continue;
          }
          flushQuote();
          para.push(line.trim());
        }
        flushAll();
        return html.join('\n');
      }

      // A lone `<!-- claude -->` line splits a post: everything above it is my
      // own writing, everything below is claude's notes, which render inside a
      // panel. Without the marker the whole post renders as mine. The marker is
      // consumed here, so it never reaches the renderer (which would escape it
      // and print it literally) and stays invisible in GitHub's markdown view.
      const CLAUDE_MARKER = /^<!--\s*claude\s*-->[ \t]*$/m;

      function renderPost(body) {
        const marker = body.match(CLAUDE_MARKER);
        if (!marker) return renderMarkdown(body);
        return (
          renderMarkdown(body.slice(0, marker.index)) +
          '<section class="claude"><div class="claude-label"><span>claude’s notes</span></div>' +
          renderMarkdown(body.slice(marker.index + marker[0].length)) +
          '</section>'
        );
      }

      // --- views ---

      function tagLink(tag) {
        const a = document.createElement('a');
        a.className = 'tag';
        a.href = '#tag:' + tag;
        a.textContent = tag;
        return a;
      }

      // Tags are dotted apart rather than space-separated so a long run of
      // them reads as separate links instead of one grey phrase.
      function tagsSpan(tags) {
        const span = document.createElement('span');
        span.className = 'tags';
        (tags || []).forEach((tag, idx) => {
          if (idx) {
            const dot = document.createElement('span');
            dot.className = 'sep';
            dot.textContent = '·';
            span.appendChild(dot);
          }
          span.appendChild(tagLink(tag));
        });
        return span;
      }

      function buildList(tag) {
        const items = (tag ? TILS.filter((t) => (t.tags || []).includes(tag)) : TILS.slice()).sort(
          (a, b) => b.added.localeCompare(a.added)
        );
        const frag = document.createDocumentFragment();
        if (tag) {
          const p = document.createElement('p');
          p.id = 'filter-line';
          p.append('tag: ' + tag + ' · ');
          const all = document.createElement('a');
          all.href = '#';
          all.textContent = 'all';
          p.appendChild(all);
          frag.appendChild(p);
        }
        const ul = document.createElement('ul');
        for (const til of items) {
          const li = document.createElement('li');
          const entry = document.createElement('span');
          entry.className = 'entry';
          const a = document.createElement('a');
          a.href = '#' + til.slug;
          a.textContent = til.title;
          entry.appendChild(a);
          // The date follows the title in the flow and floats right, so it
          // rides the title's last line rather than claiming a line of its own.
          const when = document.createElement('span');
          when.className = 'when';
          when.textContent = til.added;
          entry.appendChild(when);
          if (til.tags && til.tags.length) {
            entry.appendChild(tagsSpan(til.tags));
          }
          li.appendChild(entry);
          ul.appendChild(li);
        }
        frag.appendChild(ul);
        listView.replaceChildren(frag);
      }

      // A wrapped title ends short of the list's right edge, which left the
      // date poking out past it. Pull the date in to line up with the end of
      // the title's longest line, so the two read as one block. Rows whose
      // title fits on one line keep the date flush right -- there is no ragged
      // edge to meet -- and so does any row where pulling the date in would
      // crowd the text it shares a line with.
      const DATE_GAP = 20; // matches .when's margin-left

      function alignDates() {
        for (const li of listView.querySelectorAll('li')) {
          const when = li.querySelector('.when');
          const title = li.querySelector('a:not(.tag)');
          if (!when || !title) continue;
          when.style.marginRight = '';
          const lines = title.getClientRects();
          if (lines.length < 2) continue;
          const edge = li.querySelector('.entry').getBoundingClientRect().right;
          let widest = 0;
          for (const line of lines) widest = Math.max(widest, line.right);
          const last = lines[lines.length - 1].right;
          if (last + DATE_GAP + when.getBoundingClientRect().width > widest) continue;
          when.style.marginRight = edge - widest + 'px';
        }
      }

      // Titles rewrap on resize, so the edge they end at moves with them.
      let alignQueued = false;
      window.addEventListener('resize', () => {
        if (alignQueued) return;
        alignQueued = true;
        requestAnimationFrame(() => {
          alignQueued = false;
          alignDates();
        });
      });

      const mdCache = new Map();
      function fetchMarkdown(slug) {
        if (!mdCache.has(slug)) {
          mdCache.set(
            slug,
            fetch(slug + '.md').then((r) => {
              if (!r.ok) throw new Error(r.status + ' fetching ' + slug + '.md');
              return r.text();
            })
          );
        }
        return mdCache.get(slug);
      }

      function showList(tag) {
        document.title = tag ? 'Ruvan / til / tag:' + tag : 'Ruvan / til';
        buildList(tag);
        postView.hidden = true;
        listView.hidden = false;
        // Measured after the list is visible; a hidden list has no geometry.
        alignDates();
      }

      async function showPost(til) {
        document.title = 'Ruvan / til / ' + til.slug;
        listView.hidden = true;
        postView.hidden = false;
        postMeta.replaceChildren();
        postMeta.append(til.added + ' · ');
        for (const tag of til.tags || []) {
          postMeta.appendChild(tagLink(tag));
          postMeta.append(' · ');
        }
        const src = document.createElement('a');
        src.href = REPO_BLOB + til.slug + '.md';
        src.target = '_blank';
        src.rel = 'noopener';
        src.textContent = 'source';
        postMeta.append(src);
        post.textContent = 'loading…';
        try {
          const md = await fetchMarkdown(til.slug);
          // Bail if the user navigated away while the fetch was in flight.
          if (location.hash.replace(/^#\/?/, '') !== til.slug) return;
          // Strip the leading frontmatter block (metadata lives in tils.json).
          const body = md.replace(/^---\n[\s\S]*?\n---\n?/, '');
          post.innerHTML = renderPost(body);
        } catch (e) {
          post.textContent = 'failed to load: ' + e.message;
        }
      }

      function route() {
        const hash = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
        if (hash.startsWith('tag:')) {
          showList(hash.slice(4));
        } else {
          const til = TILS.find((t) => t.slug === hash);
          if (til) showPost(til);
          else showList();
        }
        window.scrollTo(0, 0);
      }

      window.addEventListener('hashchange', route);

      // Load the generated index, then route. tils.json is produced by the
      // deploy workflow (and `make til` locally); if it's missing, say so
      // rather than silently showing an empty page.
      fetch('tils.json')
        .then((r) => {
          if (!r.ok) throw new Error(r.status + ' fetching tils.json');
          return r.json();
        })
        .then((data) => {
          TILS = data;
          route();
        })
        .catch((e) => {
          listView.textContent = 'failed to load index: ' + e.message;
        });
    </script>
  </body>
</html>
