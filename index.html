<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruvan</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #ffffff;
      color: #000000;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #name {
      font-size: 10vw;
      opacity: 0;
      cursor: pointer;
      user-select: none;
    }
    #sitemap {
      position: fixed;
      bottom: 12px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
      font-size: 12px;
      color: #656d76;
    }
    #sitemap a {
      color: inherit;
      text-decoration: none;
      margin: 0 6px;
    }
    #sitemap a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <span id="name">Ruvan</span>
  <footer id="sitemap">
    <a href="/!/">!</a>
    <a href="/?/">?</a>
    <a href="/*/">*</a>
    <a href="/github/">github</a>
  </footer>
  <script>
    // /?/ is routed here by the browser since ? starts a query string.
    // Detect it and render the question mark glyph page inline.
    if (window.location.search === '?/' || window.location.search === '?') {
      document.title = '?';
      document.head.insertAdjacentHTML('beforeend', `<style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body { background: #fff; color: #000; display: flex; flex-wrap: wrap; align-content: flex-start; }
        .glyph { line-height: 1; display: flex; align-items: center; justify-content: center; }
      </style>`);
      document.body.innerHTML = '';
      window.GLYPH = '?'; window.CELL_DENSITY = 1.1;
      const sf = document.createElement('script');
      sf.src = '/fonts.js';
      sf.onload = () => {
        const sg = document.createElement('script');
        sg.src = '/glyph.js';
        document.body.appendChild(sg);
      };
      document.body.appendChild(sf);
    } else {
      const nameEl = document.getElementById('name');

      function rollContent() {
        if (Math.random() < 1 / 7 && window.EMOJIS) {
          let s = '';
          for (let i = 0; i < 5; i++) s += window.EMOJIS[Math.floor(Math.random() * window.EMOJIS.length)];
          nameEl.textContent = s;
        } else {
          nameEl.textContent = 'Ruvan';
        }
      }

      async function loadFont(font) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(font)}&display=block`;
        await new Promise(resolve => {
          link.onload = resolve;
          link.onerror = resolve;
          document.head.appendChild(link);
        });
        try { await document.fonts.load(`1em '${font}'`); } catch (_) {}
        nameEl.style.fontFamily = `'${font}', serif`;
        rollContent();
        nameEl.style.opacity = '1';
      }

      let tapCooldown = false;
      let clickCount = 0;
      function handleClick() {
        if (tapCooldown || !window.googleFonts) return;
        tapCooldown = true;
        setTimeout(() => { tapCooldown = false; }, 500);
        clickCount++;
        if (clickCount % 10 === 0) {
          nameEl.style.backgroundImage = 'linear-gradient(90deg, #ff0000, #ff8800, #ffee00, #22cc22, #0088ff, #4422cc, #8800cc)';
          nameEl.style.webkitBackgroundClip = 'text';
          nameEl.style.backgroundClip = 'text';
          nameEl.style.color = 'transparent';
        } else {
          nameEl.style.backgroundImage = '';
          nameEl.style.color = '';
        }
        nameEl.style.opacity = '0';
        const chosen = window.googleFonts[Math.floor(Math.random() * window.googleFonts.length)];
        loadFont(chosen);
      }

      document.addEventListener('click', e => {
        if (e.pointerType === 'touch') return;
        handleClick();
      });
      document.addEventListener('touchend', e => {
        e.preventDefault();
        handleClick();
      }, { passive: false });

      const semojis = document.createElement('script');
      semojis.src = '/emojis.js';
      document.head.appendChild(semojis);

      const sfonts = document.createElement('script');
      sfonts.src = '/fonts.js';
      sfonts.onload = () => {
        const chosen = window.googleFonts[Math.floor(Math.random() * window.googleFonts.length)];
        loadFont(chosen);
      };
      document.head.appendChild(sfonts);
    }
  </script>
</body>
</html>
