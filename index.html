<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruvan</title>
  <link rel="icon" id="favicon">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #ffffff;
      color: #000000;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    body.dark { background: #111111; color: #ffffff; }
    #name {
      font-size: 10vw;
      opacity: 0;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.1s ease;
    }
    #sitemap {
      position: fixed;
      bottom: 12px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
      font-size: 12px;
      color: #656d76;
    }
    #sitemap a {
      color: inherit;
      text-decoration: none;
      margin: 0 6px;
    }
    #sitemap a:hover { text-decoration: underline; }
    body.glyph-mode {
      height: 100%;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      align-items: stretch;
      justify-content: flex-start;
    }
    html:has(body.glyph-mode), body.glyph-mode { width: 100%; height: 100%; overflow: hidden; }
    .glyph {
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <script>
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.body.classList.add('dark');
    }
    document.addEventListener('keydown', e => {
      if (e.key === '1' && !e.repeat && !e.metaKey && !e.ctrlKey) {
        document.body.classList.toggle('dark');
        if (typeof updateHomeFavicon === 'function') updateHomeFavicon();
      }
    });

    (function() {
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><style>text{fill:#000}@media(prefers-color-scheme:dark){text{fill:#fff}}</style><text x="50" y="86" font-size="90" font-family="Georgia,serif" text-anchor="middle">R</text></svg>';
      document.getElementById('favicon').href = 'data:image/svg+xml,' + encodeURIComponent(svg);
    })();

    function glyphFromHash() {
      const raw = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
      return [...raw][0] || '';
    }

    const hashGlyph = glyphFromHash();
    if (hashGlyph) {
      document.body.classList.add('glyph-mode');
      document.title = hashGlyph;
      window.GLYPH = hashGlyph;
      (function() {
        const c = document.createElement('canvas');
        c.width = c.height = 64;
        const ctx = c.getContext('2d');
        ctx.font = '52px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = document.body.classList.contains('dark') ? '#fff' : '#000';
        ctx.fillText(hashGlyph, 32, 32);
        document.getElementById('favicon').href = c.toDataURL();
      })();
      window.addEventListener('hashchange', () => {
        if (glyphFromHash() !== window.GLYPH) location.reload();
      });
      const sf = document.createElement('script');
      sf.src = '/fonts.js';
      sf.onload = () => {
        const sg = document.createElement('script');
        sg.src = '/glyph.js';
        document.body.appendChild(sg);
      };
      document.body.appendChild(sf);
    } else {
      document.body.insertAdjacentHTML('beforeend', `
        <span id="name">Ruvan</span>
        <footer id="sitemap">
          <a href="/#/*" target="_blank" rel="noopener">grid</a>
          <a href="/commits/" target="_blank" rel="noopener">commits</a>
          <a href="/sitemap/" target="_blank" rel="noopener">sitemap</a>
        </footer>
      `);
      const nameEl = document.getElementById('name');
      let currentHomeFont = null;

      function updateHomeFavicon() {
        if (!currentHomeFont) return;
        const c = document.createElement('canvas');
        c.width = c.height = 64;
        const ctx = c.getContext('2d');
        const isDark = document.body.classList.contains('dark');
        ctx.fillStyle = isDark ? '#000' : '#fff';
        ctx.fillRect(0, 0, 64, 64);
        ctx.font = `52px '${currentHomeFont}', serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = isDark ? '#fff' : '#000';
        ctx.fillText('R', 32, 32);
        document.getElementById('favicon').href = c.toDataURL();
      }

      function updateEmojiFavicon(emoji) {
        const c = document.createElement('canvas');
        c.width = c.height = 64;
        const ctx = c.getContext('2d');
        ctx.font = '48px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(emoji, 32, 32);
        document.getElementById('favicon').href = c.toDataURL();
      }

      async function display() {
        const fadeOut = new Promise(r => setTimeout(r, 100));
        if (Math.random() < 1 / 7 && window.EMOJIS) {
          const emojis = Array.from({ length: 5 }, () => window.EMOJIS[Math.floor(Math.random() * window.EMOJIS.length)]);
          await fadeOut;
          nameEl.style.backgroundImage = '';
          nameEl.style.color = '';
          nameEl.style.fontFamily = '';
          nameEl.textContent = emojis.join('');
          nameEl.style.opacity = '1';
          updateEmojiFavicon(emojis[0]);
        } else {
          const font = window.googleFonts[Math.floor(Math.random() * window.googleFonts.length)];
          const link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(font)}&display=block`;
          const fontLoad = new Promise(resolve => {
            link.onload = resolve;
            link.onerror = resolve;
            document.head.appendChild(link);
          }).then(() => document.fonts.load(`1em '${font}'`).catch(() => {}));
          await Promise.all([fadeOut, fontLoad]);
          currentHomeFont = font;
          nameEl.style.fontFamily = `'${font}', serif`;
          nameEl.textContent = 'Ruvan';
          nameEl.style.opacity = '1';
          updateHomeFavicon();
        }
      }

      let tapCooldown = false;
      let clickCount = 0;
      function handleClick() {
        if (tapCooldown || !window.googleFonts) return;
        tapCooldown = true;
        setTimeout(() => { tapCooldown = false; }, 500);
        clickCount++;
        if (clickCount % 10 === 0) {
          nameEl.style.backgroundImage = 'linear-gradient(90deg, #ff0000, #ff8800, #ffee00, #22cc22, #0088ff, #4422cc, #8800cc)';
          nameEl.style.webkitBackgroundClip = 'text';
          nameEl.style.backgroundClip = 'text';
          nameEl.style.color = 'transparent';
        } else {
          nameEl.style.backgroundImage = '';
          nameEl.style.color = '';
        }
        nameEl.style.opacity = '0';
        display();
      }

      document.addEventListener('keydown', e => {
        if ((e.key === 'g' || e.key === 'G') && !e.repeat && currentHomeFont) {
          window.open(`https://fonts.google.com/specimen/${currentHomeFont.replace(/ /g, '+')}`, '_blank', 'noopener');
        }
      });

      document.addEventListener('click', e => {
        if (e.pointerType === 'touch') return;
        handleClick();
      });
      document.addEventListener('touchend', e => {
        e.preventDefault();
        handleClick();
      }, { passive: false });

      const semojis = document.createElement('script');
      semojis.src = '/emojis.js';
      document.head.appendChild(semojis);

      const sfonts = document.createElement('script');
      sfonts.src = '/fonts.js';
      sfonts.onload = () => { display(); };
      document.head.appendChild(sfonts);
    }
  </script>
</body>
</html>
