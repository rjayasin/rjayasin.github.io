<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruvan</title>
    <link rel="icon" id="favicon" />
    <link rel="stylesheet" href="/common.css" />
    <style>
      body {
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #name {
        font-size: 10vw;
        opacity: 0;
        cursor: pointer;
        user-select: none;
        transition: opacity 0.1s ease;
      }
      #sitemap {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        text-align: center;
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 12px;
        color: #656d76;
        padding: 4px 0;
      }
      #sitemap a {
        color: inherit;
        text-decoration: none;
        display: inline-block;
        padding: 12px 20px;
      }
      #sitemap a:hover {
        text-decoration: underline;
      }
    </style>
    <script src="/common.js"></script>
  </head>
  <body>
    <span id="name">Ruvan</span>
    <footer id="sitemap">
      <a href="/sitemap/">sitemap</a>
    </footer>
    <script>
      Common.initDarkMode();
      Common.initCursorHide();
      Common.paintFaviconR();

      const nameEl = document.getElementById('name');
      let currentHomeFont = null;
      let currentEmoji = null;

      function updateHomeFavicon() {
        if (currentEmoji) {
          Common.paintFavicon({
            glyph: currentEmoji,
            fontSize: 48,
            transparent: true,
          });
        } else if (currentHomeFont) {
          Common.paintFavicon({ glyph: 'R', font: currentHomeFont });
        }
      }
      window.addEventListener('darkmodechange', updateHomeFavicon);

      async function display(rainbow) {
        const fadeOut = new Promise((r) => setTimeout(r, 100));
        if (Math.random() < 1 / 7 && window.EMOJIS) {
          const emojis = Array.from(
            { length: 5 },
            () => window.EMOJIS[Math.floor(Math.random() * window.EMOJIS.length)]
          );
          console.log('emojis:', emojis.join(''));
          await fadeOut;
          nameEl.style.backgroundImage = '';
          nameEl.style.color = '';
          nameEl.style.fontFamily = '';
          nameEl.textContent = emojis.join('');
          nameEl.style.opacity = '1';
          currentEmoji = emojis[0];
          currentHomeFont = null;
          updateHomeFavicon();
        } else {
          const font = Common.pickRandomGoogleFont();
          const fontLoad = Common.loadGoogleFont(font);
          await Promise.all([fadeOut, fontLoad]);
          console.log('font:', font);
          currentHomeFont = font;
          currentEmoji = null;
          nameEl.style.fontFamily = `'${font}', serif`;
          nameEl.textContent = 'Ruvan';
          if (rainbow) {
            nameEl.style.backgroundImage =
              'linear-gradient(90deg, #ff0000, #ff8800, #ffee00, #22cc22, #0088ff, #4422cc, #8800cc)';
            nameEl.style.webkitBackgroundClip = 'text';
            nameEl.style.backgroundClip = 'text';
            nameEl.style.color = 'transparent';
          } else {
            nameEl.style.backgroundImage = '';
            nameEl.style.color = '';
          }
          nameEl.style.opacity = '1';
          updateHomeFavicon();
        }
      }

      const cooldown = Common.makeCooldown(500);
      let clickCount = 0;
      function handleClick(e) {
        if (!window.googleFonts) return;
        if (e && e.target && e.target.closest && e.target.closest('#sitemap')) return;
        Common.ensureEmojis();
        cooldown(() => {
          clickCount++;
          nameEl.style.opacity = '0';
          display(clickCount % 10 === 0);
        });
      }

      document.addEventListener('keydown', (e) => {
        if ((e.key === 'g' || e.key === 'G') && !e.repeat && currentHomeFont) {
          Common.openFontSpecimen(currentHomeFont);
        }
      });
      Common.initSitemapShortcut();

      Common.onTap(handleClick);

      Common.loadScript('/fonts.js').then(() => display());
    </script>
  </body>
</html>
