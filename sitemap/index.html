<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruvan / sitemap</title>
  <link rel="icon" id="favicon">
  <link rel="stylesheet" href="/common.css">
  <style>
    body {
      font-family: monospace;
      font-size: 13px;
      line-height: 1.6;
      padding: 48px 32px;
      max-width: 720px;
    }
    a, h1 {
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }
    header { margin-bottom: 15px; }
    header a { color: #000; text-decoration: none; }
    header a:hover { text-decoration: underline; }
    h1, h2 {
      font-size: 13px;
      font-weight: normal;
      letter-spacing: 0.05em;
    }
    h2 { color: #888; margin-top: 18px; margin-bottom: 4px; }
    ul { list-style: none; }
    li { padding: 2px 0; white-space: pre; }
    li .branch { color: #888; user-select: none; }
    li a { color: #000; text-decoration: none; }
    li a:hover { text-decoration: underline; }
    @media (max-width: 640px) {
      body { font-size: 15px; padding: 32px 20px; }
      h1, h2 { font-size: 15px; }
    }
    body.dark header a,
    body.dark li a { color: #fff; }
    @media (prefers-color-scheme: dark) {
      body:not(.light) header a,
      body:not(.light) li a { color: #fff; }
    }
  </style>
  <script src="/common.js"></script>
</head>
<body>
  <header>
    <h1><a href="/">Ruvan</a> / sitemap</h1>
  </header>
  <!-- Keep every section and sublist alphabetically ordered. -->
  <h2>fun</h2>
  <ul>
    <li><span class="branch">└── </span><a href="https://rjayasin.github.io/maze-canvas/" target="_blank" rel="noopener">maze-canvas</a></li>
  </ul>
  <h2>text</h2>
  <ul>
    <li><span class="branch">├── </span><a id="box-link" href="/box/">box</a></li>
    <li><span class="branch">├── </span><a href="/clock/">clock</a></li>
    <li><span class="branch">├── </span><a id="grid-link" href="/">grid</a></li>
    <li><span class="branch">└── </span><a id="stack-link" href="/stack/">stack</a></li>
  </ul>
  <h2>tools</h2>
  <ul>
    <li><span class="branch">├── </span><a href="/commits/">commits</a></li>
    <li><span class="branch">├── </span><a href="https://rjayasin.github.io/dodgers-notifier/" target="_blank" rel="noopener">dodgers-notifier</a></li>
    <li><span class="branch">└── </span>visualizer</li>
    <li><span class="branch">    ├── </span><a href="https://rjayasin.github.io/visualizer/spotify-auth.html" target="_blank" rel="noopener">spotify-auth</a></li>
    <li><span class="branch">    └── </span><a href="https://rjayasin.github.io/visualizer/video-player.html" target="_blank" rel="noopener">video-player</a></li>
  </ul>
  <script>
    Common.paintFaviconR();
    Common.initDarkMode();

    const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!?@#&*';
    const pickChar = () => chars[Math.floor(Math.random() * chars.length)];
    function randomizeGrid() {
      document.getElementById('grid-link').href = '/#/' + encodeURIComponent(pickChar());
    }
    randomizeGrid();
    document.getElementById('grid-link').addEventListener('mousedown', randomizeGrid);
  </script>
</body>
</html>
