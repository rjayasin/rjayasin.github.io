<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruvan / box</title>
  <link rel="icon" id="favicon">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: #ffffff;
      color: #000000;
      cursor: pointer;
      user-select: none;
      position: relative;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    body.dark { background: #111111; color: #ffffff; }
    #box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      overflow: hidden;
      line-height: 1;
      font-size: 0;
    }
    #box .cell {
      display: inline-block;
      text-align: center;
      vertical-align: top;
      white-space: nowrap;
    }
    #hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 12px;
      text-align: center;
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
      font-size: 12px;
      color: #888;
      opacity: 1;
      transition: opacity 0.4s ease;
      pointer-events: none;
      user-select: none;
      z-index: 1;
    }
    #hint.hidden { opacity: 0; }
    #hint-zone {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 60px;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div id="box"></div>
  <div id="hint">+/− font size &nbsp;·&nbsp; ←/→ width &nbsp;·&nbsp; ↑/↓ height &nbsp;·&nbsp; click font &nbsp;·&nbsp; g google fonts &nbsp;·&nbsp; 1 dark</div>
  <div id="hint-zone"></div>
  <script>
    (function() {
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><style>text{fill:#000}@media(prefers-color-scheme:dark){text{fill:#fff}}</style><text x="50" y="86" font-size="90" font-family="Georgia,serif" text-anchor="middle">R</text></svg>';
      document.getElementById('favicon').href = 'data:image/svg+xml,' + encodeURIComponent(svg);
    })();

    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.body.classList.add('dark');
    }
    document.addEventListener('keydown', e => {
      if (e.key === '1' && !e.repeat && !e.metaKey && !e.ctrlKey) document.body.classList.toggle('dark');
    });

    const boxEl = document.getElementById('box');
    let fontSize = 40;
    let cols = 6;
    let rows = 6;
    let currentFont = null;
    let tapCooldown = false;

    function readItems() {
      const raw = location.search.replace(/^\?/, '');
      return raw.split('/').map(s => { try { return decodeURIComponent(s); } catch (_) { return s; } }).filter(s => s.length > 0);
    }

    const measureCanvas = document.createElement('canvas');
    const measureCtx = measureCanvas.getContext('2d');
    function measureWord(t, font) {
      measureCtx.font = `${fontSize}px '${font}', serif`;
      return measureCtx.measureText(t).width;
    }

    function render() {
      const items = readItems();
      boxEl.textContent = '';
      if (items.length === 0) return;
      const font = currentFont || 'serif';
      const cellW = Math.ceil(Math.max(...items.map(w => measureWord(w, font))) + fontSize * 0.4);
      const cellH = Math.ceil(fontSize * 1.0);
      boxEl.style.width = (cellW * cols) + 'px';
      boxEl.style.height = (cellH * rows) + 'px';
      const total = cols * rows;
      const frag = document.createDocumentFragment();
      for (let i = 0; i < total; i++) {
        const span = document.createElement('span');
        span.className = 'cell';
        span.style.width = cellW + 'px';
        span.style.height = cellH + 'px';
        span.style.fontSize = fontSize + 'px';
        span.style.lineHeight = cellH + 'px';
        span.textContent = items[i % items.length];
        frag.appendChild(span);
      }
      boxEl.appendChild(frag);
    }
    render();
    window.addEventListener('resize', render);

    async function pickFont() {
      if (!window.googleFonts) return;
      if (tapCooldown) return;
      tapCooldown = true;
      setTimeout(() => { tapCooldown = false; }, 500);

      const font = window.googleFonts[Math.floor(Math.random() * window.googleFonts.length)];
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(font)}&display=block`;
      const fontLoad = new Promise(resolve => {
        link.onload = resolve;
        link.onerror = resolve;
        document.head.appendChild(link);
      }).then(() => document.fonts.load(`1em '${font}'`).catch(() => {}));

      await fontLoad;
      currentFont = font;
      boxEl.style.fontFamily = `'${font}', serif`;
      render();
    }

    document.addEventListener('keydown', e => {
      if ((e.key === 'g' || e.key === 'G') && !e.repeat && currentFont) {
        window.open(`https://fonts.google.com/specimen/${currentFont.replace(/ /g, '+')}`, '_blank', 'noopener');
        return;
      }
      if (e.key === '+' || e.key === '=' || e.key === '-' || e.key === '_') {
        e.preventDefault();
        const delta = (e.key === '+' || e.key === '=') ? 4 : -4;
        fontSize = Math.max(8, Math.min(512, fontSize + delta));
        render();
        return;
      }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        cols = Math.max(1, Math.min(200, cols + (e.key === 'ArrowRight' ? 1 : -1)));
        render();
        return;
      }
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        rows = Math.max(1, Math.min(200, rows + (e.key === 'ArrowUp' ? 1 : -1)));
        render();
        return;
      }
    });

    const hintEl = document.getElementById('hint');
    const hintZone = document.getElementById('hint-zone');
    let hintTimer = null;
    function showHint() {
      hintEl.classList.remove('hidden');
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => hintEl.classList.add('hidden'), 2500);
    }
    showHint();
    hintZone.addEventListener('mouseenter', showHint);
    hintZone.addEventListener('mousemove', showHint);

    document.addEventListener('click', e => {
      if (e.pointerType === 'touch') return;
      pickFont();
    });
    document.addEventListener('touchend', e => {
      e.preventDefault();
      pickFont();
    }, { passive: false });

    const sfonts = document.createElement('script');
    sfonts.src = '/fonts.js';
    sfonts.onload = () => { pickFont(); };
    document.head.appendChild(sfonts);
  </script>
</body>
</html>
