<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruvan / box</title>
  <link rel="icon" id="favicon">
  <link rel="stylesheet" href="/common.css">
  <style>
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      cursor: pointer;
      user-select: none;
      position: relative;
    }
    #box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      overflow: hidden;
      line-height: 1;
      font-size: 0;
    }
    #box .cell {
      display: inline-block;
      text-align: center;
      vertical-align: top;
      white-space: nowrap;
    }
    #hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 12px;
      text-align: center;
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
      font-size: 12px;
      color: #888;
      opacity: 1;
      transition: opacity 0.4s ease;
      pointer-events: none;
      user-select: none;
      z-index: 1;
    }
    #hint.hidden { opacity: 0; }
    #hint-zone {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 60px;
      z-index: 2;
    }
  </style>
  <script src="/common.js"></script>
</head>
<body>
  <div id="box"></div>
  <div id="hint">+/− font size &nbsp;·&nbsp; ←/→ width &nbsp;·&nbsp; ↑/↓ height &nbsp;·&nbsp; click font &nbsp;·&nbsp; g google fonts &nbsp;·&nbsp; 1 dark</div>
  <div id="hint-zone"></div>
  <script>
    RJ.paintFaviconR();
    RJ.initDarkMode();
    RJ.initCursorHide();

    const boxEl = document.getElementById('box');
    let fontSize = 40;
    let cols = 6;
    let rows = 6;
    let currentFont = null;

    const measureCanvas = document.createElement('canvas');
    const measureCtx = measureCanvas.getContext('2d');
    function measureWord(t, font) {
      measureCtx.font = `${fontSize}px '${font}', serif`;
      return measureCtx.measureText(t).width;
    }

    function render() {
      const items = RJ.parseQueryItems();
      boxEl.textContent = '';
      if (items.length === 0) return;
      const font = currentFont || 'serif';
      const cellW = Math.ceil(Math.max(...items.map(w => measureWord(w, font))) + fontSize * 0.4);
      const cellH = Math.ceil(fontSize * 1.0);
      boxEl.style.width = (cellW * cols) + 'px';
      boxEl.style.height = (cellH * rows) + 'px';
      const total = cols * rows;
      const frag = document.createDocumentFragment();
      for (let i = 0; i < total; i++) {
        const span = document.createElement('span');
        span.className = 'cell';
        span.style.width = cellW + 'px';
        span.style.height = cellH + 'px';
        span.style.fontSize = fontSize + 'px';
        span.style.lineHeight = cellH + 'px';
        span.textContent = items[i % items.length];
        frag.appendChild(span);
      }
      boxEl.appendChild(frag);
    }
    render();
    window.addEventListener('resize', render);

    const cooldown = RJ.makeCooldown(500);
    async function pickFont() {
      if (!window.googleFonts) return;
      cooldown(async () => {
        const font = RJ.pickRandomGoogleFont();
        await RJ.loadGoogleFont(font);
        currentFont = font;
        boxEl.style.fontFamily = `'${font}', serif`;
        render();
      });
    }

    document.addEventListener('keydown', e => {
      if ((e.key === 'g' || e.key === 'G') && !e.repeat && currentFont) {
        RJ.openFontSpecimen(currentFont);
        return;
      }
      if (e.key === '+' || e.key === '=' || e.key === '-' || e.key === '_') {
        e.preventDefault();
        const delta = (e.key === '+' || e.key === '=') ? 4 : -4;
        fontSize = Math.max(8, Math.min(512, fontSize + delta));
        render();
        return;
      }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        cols = Math.max(1, Math.min(200, cols + (e.key === 'ArrowRight' ? 1 : -1)));
        render();
        return;
      }
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        rows = Math.max(1, Math.min(200, rows + (e.key === 'ArrowUp' ? 1 : -1)));
        render();
        return;
      }
    });

    const hintEl = document.getElementById('hint');
    const hintZone = document.getElementById('hint-zone');
    let hintTimer = null;
    function showHint() {
      hintEl.classList.remove('hidden');
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => hintEl.classList.add('hidden'), 2500);
    }
    showHint();
    hintZone.addEventListener('mouseenter', showHint);
    hintZone.addEventListener('mousemove', showHint);

    RJ.onTap(pickFont);

    RJ.loadScript('/fonts.js').then(pickFont);
  </script>
</body>
</html>
