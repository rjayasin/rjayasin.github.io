<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruvan / projects</title>
    <link rel="icon" id="favicon" />
    <link rel="stylesheet" href="/common.css" />
    <style>
      @font-face {
        font-family: 'JetBrains Mono';
        font-display: block;
        src: url('/fonts/jetbrains-mono.woff2') format('woff2');
      }
      body {
        --muted: #888;
        --rule: #e9e9e9;
        --link: #000;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        line-height: 1.6;
        padding: 48px 32px;
        max-width: 720px;
      }
      header {
        margin-bottom: 15px;
      }
      header a {
        color: var(--link);
        text-decoration: none;
      }
      header a:hover {
        text-decoration: underline;
      }
      h1 {
        font-family: 'JetBrains Mono', monospace;
        font-size: 16px;
        font-weight: normal;
      }
      h1 a,
      h1 .sep {
        opacity: 0.45;
      }
      .project {
        margin-top: 26px;
        padding-top: 22px;
        border-top: 1px solid var(--rule);
      }
      .project h2 {
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          Liberation Mono,
          monospace;
        font-size: 18px;
        font-weight: 600;
      }
      .project h2 a {
        color: var(--link);
        text-decoration: none;
      }
      .project h2 a:hover {
        text-decoration: underline;
      }
      .tagline {
        color: var(--muted);
      }
      .project p {
        margin: 10px 0;
      }
      .shot {
        display: block;
        margin: 14px 0;
      }
      .shot img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid var(--rule);
        border-radius: 6px;
      }
      .tags {
        color: var(--muted);
        font-size: 13px;
      }
      .tags span + span::before {
        content: '·';
        margin: 0 6px;
      }
      @media (max-width: 640px) {
        body {
          padding: 32px 16px;
        }
      }
      body.dark {
        --muted: #999;
        --rule: #2a2a2a;
        --link: #fff;
      }
      @media (prefers-color-scheme: dark) {
        body:not(.light) {
          --muted: #999;
          --rule: #2a2a2a;
          --link: #fff;
        }
      }
    </style>
    <script src="/common.js"></script>
  </head>
  <body>
    <header>
      <h1><a href="/">Ruvan</a><span class="sep"> / </span>projects</h1>
    </header>

    <article class="project" id="rtr">
      <h2><a href="https://github.com/rjayasin/rtr" target="_blank" rel="noopener">rtr</a></h2>
      <p class="tagline">A TUI for remote file browsing and rsync transfers</p>
      <p class="tags"><span>Go</span><span>TUI</span><span>SSH / SFTP</span><span>rsync</span></p>
      <a
        class="shot"
        href="https://github.com/rjayasin/rtr"
        target="_blank"
        rel="noopener"
        aria-label="rtr on GitHub"
      >
        <img
          src="rtr.png"
          width="1400"
          height="861"
          loading="lazy"
          alt="rtr browsing a NAS with the local pane open and transfers running"
        />
      </a>
      <p>
        Browse remote hosts over SFTP and download or upload files with <code>rsync</code>. The
        <code>rsync</code> command and its flags are configurable. Transfers run in the background,
        so you can keep browsing while they finish.
      </p>
    </article>

    <script>
      Common.paintFavicon({ glyph: '🛠️', fontSize: 44, transparent: true });
      Common.initDarkMode();
      Common.initSitemapShortcut();
    </script>
  </body>
</html>
