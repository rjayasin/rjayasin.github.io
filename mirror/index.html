<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruvan / mirror</title>
    <link rel="icon" id="favicon" />
    <link rel="stylesheet" href="/common.css" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        background: #000;
        overflow: hidden;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      /* The square of cropped face video, centered on the black page. */
      #mirror {
        display: block;
        width: min(70vmin, 520px);
        height: min(70vmin, 520px);
        background: #000;
      }
      /* The raw webcam feed is only a source for the canvas; never shown. */
      #cam {
        display: none;
      }
    </style>
    <script src="/common.js"></script>
  </head>
  <body>
    <div id="stage">
      <video id="cam" playsinline muted></video>
      <canvas id="mirror" width="512" height="512"></canvas>
    </div>
    <script type="module">
      import {
        FaceLandmarker,
        FilesetResolver,
      } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18';

      Common.paintFavicon({ glyph: '🪞', fontSize: 48, transparent: true });
      Common.initSitemapShortcut();

      const VISION_BASE = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18';
      const MODEL_URL =
        'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';

      // MediaPipe FaceMesh outer eye-corner landmarks (right, left). These are
      // rigid points: blinking and opening the mouth barely move them, so we
      // derive both the crop's center and its scale from them. That keeps the
      // zoom steady through expressions, unlike measuring eyelid-to-lip height.
      const EYE_R = 33;
      const EYE_L = 263;

      // Framing, expressed in multiples of the inter-ocular distance. SIZE_K is
      // the square's side; CENTER_DROP pushes its center below the eye line so
      // the eyes sit near the top and the mouth near the bottom.
      const SIZE_K = 1.2;
      const CENTER_DROP = 0.31;

      // Easing time constants in seconds (frame-rate independent, see render()).
      // Position tracks quickly; size eases much more slowly so transient
      // landmark jitter from a blink doesn't change the zoom, while real
      // move-closer/farther changes still come through.
      const SMOOTH_TAU = 0.1;
      const SIZE_TAU = 0.6;
      const GRACE_MS = 250; // hold the last framing briefly to ride out dropouts

      const video = document.getElementById('cam');
      const canvas = document.getElementById('mirror');
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingQuality = 'high';

      let landmarker = null;
      let target = null; // latest crop rect from detection { cx, cy, size }
      let smooth = null; // eased crop rect actually drawn
      let lastFaceAt = 0;

      async function makeLandmarker(fileset) {
        const opts = (delegate) => ({
          baseOptions: { modelAssetPath: MODEL_URL, delegate },
          runningMode: 'VIDEO',
          numFaces: 1,
        });
        try {
          return await FaceLandmarker.createFromOptions(fileset, opts('GPU'));
        } catch {
          return await FaceLandmarker.createFromOptions(fileset, opts('CPU'));
        }
      }

      async function init() {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'user',
            width: { ideal: 1280 },
            height: { ideal: 720 },
            frameRate: { ideal: 60 },
          },
          audio: false,
        });
        video.srcObject = stream;
        await video.play();

        const fileset = await FilesetResolver.forVisionTasks(VISION_BASE + '/wasm');
        landmarker = await makeLandmarker(fileset);

        // Detect once per delivered camera frame (decoupled from the 60fps draw
        // loop) so detection cost never throttles the video. Fall back to the
        // render loop where requestVideoFrameCallback is unavailable.
        if (video.requestVideoFrameCallback) {
          const onFrame = () => {
            detect();
            video.requestVideoFrameCallback(onFrame);
          };
          video.requestVideoFrameCallback(onFrame);
        }
        requestAnimationFrame(render);
      }

      let lastDetectTs = -1;
      function detect() {
        if (!landmarker || video.readyState < 2) return;
        let ts = performance.now();
        if (ts <= lastDetectTs) ts = lastDetectTs + 0.01; // must strictly rise
        lastDetectTs = ts;

        const faces = landmarker.detectForVideo(video, ts).faceLandmarks;
        if (!faces || !faces.length) return;
        target = computeCrop(faces[0]);
        lastFaceAt = ts;
      }

      // A square crop whose center and size come only from the (rigid) outer eye
      // corners, so blinking or opening the mouth leaves the zoom unchanged.
      function computeCrop(lm) {
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        const rx = lm[EYE_R].x * vw;
        const ry = lm[EYE_R].y * vh;
        const lx = lm[EYE_L].x * vw;
        const ly = lm[EYE_L].y * vh;
        const interOcular = Math.hypot(lx - rx, ly - ry);
        const size = interOcular * SIZE_K;
        return {
          cx: (rx + lx) / 2,
          cy: (ry + ly) / 2 + size * CENTER_DROP,
          size,
        };
      }

      let lastFrameTs = performance.now();
      function render() {
        requestAnimationFrame(render);

        // requestVideoFrameCallback path keeps detection fresh; without it, fold
        // detection into the draw loop.
        if (!video.requestVideoFrameCallback) detect();

        const now = performance.now();
        const dt = Math.min(0.05, (now - lastFrameTs) / 1000);
        lastFrameTs = now;

        if (!target || now - lastFaceAt > GRACE_MS) {
          if (smooth) blank(); // clear once on losing the face, then stay black
          return;
        }

        if (!smooth) {
          smooth = { ...target }; // snap on (re)acquisition
        } else {
          const a = 1 - Math.exp(-dt / SMOOTH_TAU); // frame-rate independent ease
          const sa = 1 - Math.exp(-dt / SIZE_TAU); // slower, to hold the zoom
          smooth.cx += (target.cx - smooth.cx) * a;
          smooth.cy += (target.cy - smooth.cy) * a;
          smooth.size += (target.size - smooth.size) * sa;
        }

        sizeCanvas();
        const w = canvas.width;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, w, w);
        ctx.setTransform(-1, 0, 0, 1, w, 0); // flip so it reads like a mirror
        ctx.drawImage(
          video,
          smooth.cx - smooth.size / 2,
          smooth.cy - smooth.size / 2,
          smooth.size,
          smooth.size,
          0,
          0,
          w,
          w
        );
      }

      // Match the backing store to the displayed size × DPR for a crisp image.
      function sizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const px = Math.round((canvas.clientWidth || 512) * dpr);
        if (px && canvas.width !== px) {
          canvas.width = px;
          canvas.height = px;
          ctx.imageSmoothingQuality = 'high';
        }
      }

      function blank() {
        smooth = null;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      init().catch((err) => {
        console.error(err);
        blank();
      });
    </script>
  </body>
</html>
